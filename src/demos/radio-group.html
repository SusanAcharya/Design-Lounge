<!-- Design Lounge piece: radio-group · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Radio group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5a554c;--line:#e4dfd4;--line-strong:#cfc6b8;
  --primary:#1f4d3a;--primary-soft:#e7f2ec;--focus:#1f4d3a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
.where{margin:0 0 16px;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
fieldset{width:320px;margin:0;padding:0;border:0}
legend{padding:0;margin:0 0 8px;font:500 12px/1 var(--sans);color:var(--ink-2)}
label{min-height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;border:1px solid var(--line);border-radius:2px;background:var(--surface);margin-top:8px}
label:has(input:checked){background:var(--primary-soft);border-color:transparent}
input{appearance:none;width:18px;height:18px;margin:0;border:2px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;background:#fff;flex:none}
input:checked{border-color:var(--primary)}
input:checked::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.meta{margin:12px 0 0;font-size:12px;color:var(--ink-2)}
</style>
</head>
<body>
<p class="where">People</p>
<form>
  <fieldset>
    <legend>Shift</legend>
    <label><input type="radio" name="shift" value="Morning" checked> Morning</label>
    <label><input type="radio" name="shift" value="Swing"> Swing</label>
    <label><input type="radio" name="shift" value="Night"> Night</label>
  </fieldset>
</form>
<p class="meta" id="meta" role="status">Morning is on the gate.</p>
<script>
const meta = document.getElementById('meta');
document.querySelectorAll('input').forEach(input => {
  input.addEventListener('change', () => { meta.textContent = input.value + ' is on the gate.'; });
});
</script>
</body>
</html>
