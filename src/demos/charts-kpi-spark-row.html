<!-- Design Lounge piece: charts-kpi-spark-row · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Harbor Ops — shift KPIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e8ec;--card:#f4f5f7;--ink:#16191e;--ink-2:#5a616b;--ink-3:#8b929c;
  --line:#cfd3da;--cobalt:#1f4ebf;--up:#2a7a5a;--down:#b5473a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --gutter:40px;--r:2px;
  --t-micro:160ms;--t-draw:900ms;--ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
header{height:56px;flex:none;display:flex;align-items:center;padding:0 var(--gutter);gap:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:600 14px var(--sans);letter-spacing:-.01em}
.brand i{width:10px;height:10px;background:var(--cobalt);display:block}
.shift{margin-left:auto;font:400 12px var(--mono);color:var(--ink-2)}
.shift b{color:var(--ink);font-weight:500}
.replay{margin-left:16px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);padding:7px 10px;border-radius:var(--r)}
.replay:hover{color:var(--ink);border-color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter) 48px}
.kicker{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 16px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 18px;display:flex;flex-direction:column;min-height:220px}
.lbl{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.num{font:600 40px/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:0}
.num small{font:500 16px var(--sans);letter-spacing:0;color:var(--ink-2);margin-left:4px}
.delta{margin:10px 0 14px;font:500 12px var(--mono);display:inline-flex;align-items:center;gap:6px}
.delta.up{color:var(--up)}.delta.dn{color:var(--down)}
.delta svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.spark{margin-top:auto;position:relative;height:56px}
.spark svg{display:block;width:100%;height:56px;overflow:visible}
.spark path{fill:none;stroke:var(--cobalt);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t-draw) var(--expo) forwards}
.spark .hi{fill:var(--cobalt);opacity:0;pointer-events:none}
.spark .tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--card);font:500 11px var(--mono);padding:4px 7px;border-radius:2px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity var(--t-micro) var(--ease)}
.spark.on .hi,.spark.on .tip{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .spark path{animation:none;stroke-dashoffset:0}
}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Harbor Ops</div>
  <span class="shift">Berth 12 · <b>Shift 06:00–14:00</b> · 2 Oct 2026</span>
  <button class="replay" type="button" id="replay">Replay</button>
</header>
<main>
  <p class="kicker">Live KPIs · last 12 hours</p>
  <div class="row" id="row"></div>
</main>
<script>
const KPIS=[
  {l:'Throughput',n:'148',u:'TEU',d:'+6.2%',up:1,dir:1,data:[92,98,104,101,110,118,122,128,124,136,142,148],fmt:v=>v+' TEU'},
  {l:'Berth util.',n:'86.4',u:'%',d:'+1.1 pt',up:1,dir:1,data:[78,80,79,81,82,83,84,83,85,86,85,86.4],fmt:v=>v.toFixed(1)+'%'},
  {l:'Avg. delay',n:'12',u:'min',d:'−4 min',up:1,dir:0,data:[22,20,19,18,17,16,15,16,14,13,13,12],fmt:v=>v+' min'},
  {l:'Fuel / move',n:'2.41',u:'t',d:'−0.18 t',up:1,dir:0,data:[2.8,2.74,2.7,2.66,2.62,2.58,2.55,2.52,2.5,2.47,2.44,2.41],fmt:v=>v.toFixed(2)+' t'}
];
const row=document.getElementById('row');
const up='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
const dn='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function cards(){
  row.innerHTML='';
  KPIS.forEach((k,i)=>{
    const el=document.createElement('article');
    el.className='card';
    el.innerHTML=`<p class="lbl">${k.l}</p><p class="num">${k.n}<small>${k.u}</small></p>
      <p class="delta ${k.up?'up':'dn'}">${k.dir?up:dn}${k.d} vs prior shift</p>
      <div class="spark" id="s${i}"><svg viewBox="0 0 160 56" preserveAspectRatio="none" role="img" aria-label="${k.l} trend"></svg><b class="tip"></b></div>`;
    row.appendChild(el);
    draw('s'+i,k);
  });
}
cards();
document.getElementById('replay').addEventListener('click',cards);
function draw(id,k){
  const wrap=document.getElementById(id),svg=wrap.querySelector('svg'),tip=wrap.querySelector('.tip');
  const w=160,h=56,p=4,data=k.data,min=Math.min(...data),max=Math.max(...data),sp=max-min||1;
  const pts=data.map((v,i)=>({x:p+i*(w-2*p)/(data.length-1),y:h-p-(v-min)/sp*(h-2*p),v}));
  const d=pts.map((pt,i)=>(i?'L':'M')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
  svg.innerHTML=`<path d="${d}" pathLength="1"/><circle class="hi" r="3.5" cx="${pts[pts.length-1].x}" cy="${pts[pts.length-1].y}"/>`;
  const path=svg.querySelector('path'),hi=svg.querySelector('.hi');
  const set=pt=>{hi.setAttribute('cx',pt.x);hi.setAttribute('cy',pt.y);tip.textContent=k.fmt(pt.v);tip.style.left=(pt.x/w*100)+'%';};
  svg.addEventListener('pointermove',e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*w;
    let best=pts[0],bd=1e9;
    pts.forEach(pt=>{const dx=Math.abs(pt.x-x);if(dx<bd){bd=dx;best=pt;}});
    wrap.classList.add('on');set(best);
  });
  svg.addEventListener('pointerleave',()=>{wrap.classList.remove('on');set(pts[pts.length-1]);});
  path.addEventListener('animationend',()=>set(pts[pts.length-1]));
}
</script>
</body>
</html>
