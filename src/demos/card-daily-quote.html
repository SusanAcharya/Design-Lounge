<!-- Design Lounge piece: card-daily-quote · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Today · Dayleaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --g1{syntax:"<color>";inherits:true;initial-value:#0f1a33}
@property --g2{syntax:"<color>";inherits:true;initial-value:#1e3358}
@property --g3{syntax:"<color>";inherits:true;initial-value:#3b4f7a}
@property --ink{syntax:"<color>";inherits:true;initial-value:#f2ebdd}
@property --acc{syntax:"<color>";inherits:true;initial-value:#e9c46a}
@property --sun{syntax:"<color>";inherits:true;initial-value:#e9c46a}
@property --p1{syntax:"<color>";inherits:true;initial-value:#e6e8ef}
@property --p2{syntax:"<color>";inherits:true;initial-value:#c3cadc}
:root{
  --serif:"Young Serif",Georgia,serif;--sans:"Figtree",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);--t-sky:900ms;
  transition:--g1 var(--t-sky) var(--ease),--g2 var(--t-sky) var(--ease),--g3 var(--t-sky) var(--ease),--ink var(--t-sky) var(--ease),--acc var(--t-sky) var(--ease),--p1 var(--t-sky) var(--ease),--p2 var(--t-sky) var(--ease),--sun var(--t-sky) var(--ease);
}
:root[data-t=dawn]{--g1:#f6c9a8;--g2:#e7a3a6;--g3:#a4b8d8;--ink:#3a2230;--acc:#b5413f;--p1:#fbeee4;--p2:#efd3d2;--sun:#ffe0bf}
:root[data-t=day]{--g1:#fbe7b2;--g2:#a3d5cf;--g3:#4d97b3;--ink:#12303a;--acc:#b85a1e;--p1:#fbf4df;--p2:#cfe6e0;--sun:#fff1bd}
:root[data-t=dusk]{--g1:#f4b05a;--g2:#b84a3a;--g3:#4e2a46;--ink:#fff4e6;--acc:#ffd38a;--p1:#fbe6cc;--p2:#ecc0ae;--sun:#ffd38a}
:root[data-t=night]{--g1:#0f1a33;--g2:#1e3358;--g3:#3b4f7a;--ink:#f2ebdd;--acc:#e9c46a;--p1:#e6e8ef;--p2:#c3cadc;--sun:#e9c46a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 var(--sans);color:var(--ink);overflow-x:hidden;
  background:radial-gradient(90% 70% at 50% 100%,rgba(255,255,255,.35),transparent 70%),linear-gradient(var(--p1),var(--p2));
  display:grid;place-items:center;padding:28px 20px}
.light{color:#1f1c19}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid #1f1c19;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.stage{display:grid;justify-items:center;gap:22px;width:100%;max-width:560px;color:#1f1c19}
.times{display:flex;align-items:center;gap:4px;padding:4px;border-radius:22px;background:rgba(255,255,255,.55);border:1px solid rgba(31,28,25,.1)}
.times button{height:32px;padding:0 14px;border-radius:16px;font-size:13px;font-weight:600;color:#4b443d;display:flex;align-items:center;gap:6px;transition:background 160ms var(--ease),color 160ms var(--ease)}
.times button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.times button[aria-pressed=true]{background:#1f1c19;color:#f4efe6}
.times .auto{font:500 12px/1 var(--sans);color:#5a524a;padding:0 10px 0 6px;font-variant-numeric:tabular-nums}

.deckrow{display:grid;grid-template-columns:44px minmax(0,420px) 44px;align-items:center;gap:20px;width:100%;justify-content:center}
.nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.6);border:1px solid rgba(31,28,25,.12);transition:transform 160ms var(--ease),background 160ms var(--ease)}
.nav:hover{background:#fff}.nav:active{transform:scale(.92)}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.deck{position:relative;aspect-ratio:21/26;width:100%}
.card{position:absolute;inset:0;border-radius:28px;overflow:hidden;color:var(--ink);background:linear-gradient(165deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 24px 50px -18px rgba(31,20,30,.45);transition:transform 420ms var(--expo),opacity 300ms var(--ease)}
.card.b1{transform:translateY(16px) scale(.94);opacity:.75;filter:saturate(.8)}
.card.b2{transform:translateY(32px) scale(.88);opacity:.45;filter:saturate(.6)}
.card.b1>*,.card.b2>*{visibility:hidden}
.card.top{touch-action:pan-y;cursor:grab;z-index:3}
.card.top.drag{transition:none;cursor:grabbing}
.card.b1{z-index:2}.card.b2{z-index:1}
.orb{position:absolute;width:120px;height:120px;border-radius:50%;left:var(--ox);top:var(--oy);background:radial-gradient(circle at 40% 38%,color-mix(in srgb,var(--sun) 40%,#fff),var(--sun) 62%);box-shadow:0 0 70px 10px color-mix(in srgb,var(--sun) 50%,transparent);opacity:.9;transition:left var(--t-sky) var(--expo),top var(--t-sky) var(--expo)}
:root[data-t=dawn] .orb{--ox:60%;--oy:24%}
:root[data-t=day] .orb{--ox:62%;--oy:-44px}
:root[data-t=dusk] .orb{--ox:68%;--oy:15%}
:root[data-t=night] .orb{--ox:66%;--oy:62px;box-shadow:0 0 50px 4px color-mix(in srgb,var(--sun) 30%,transparent);background:radial-gradient(circle at 64% 40%,transparent 38%,var(--sun) 39%)}
.stars{position:absolute;inset:0;opacity:0;transition:opacity var(--t-sky) var(--ease);background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 34% 8%,#fff,transparent),radial-gradient(1.4px 1.4px at 58% 22%,#fff,transparent),radial-gradient(1px 1px at 22% 40%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 46%,#fff,transparent),radial-gradient(1px 1px at 46% 12%,#fff,transparent),radial-gradient(1px 1px at 8% 60%,#fff,transparent)}
:root[data-t=night] .stars{opacity:.8}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) .6px,transparent .8px);background-size:3px 3px;mix-blend-mode:overlay}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:28px 32px 26px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.82}
.meta b{font:400 18px/1 var(--serif);letter-spacing:0;text-transform:none}
.q{margin:auto 0 0;font:400 32px/1.18 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.q::before{content:"\201C";display:block;font:400 96px/.6 var(--serif);color:var(--acc);margin-bottom:6px}
.by{margin:18px 0 0;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.by::before{content:"";width:24px;height:1.5px;background:currentColor;opacity:.7}
.by span{font-weight:400;opacity:.78}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--ink) 22%,transparent);font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:5px}.pips i{width:6px;height:6px;border-radius:3px;background:currentColor;opacity:.35;transition:width 300ms var(--expo),opacity 300ms}
.pips i.on{width:18px;opacity:1}

.actions{display:flex;gap:10px}
.act{height:44px;display:flex;align-items:center;gap:8px;padding:0 18px;border-radius:22px;background:rgba(255,255,255,.6);border:1px solid rgba(31,28,25,.12);font-weight:600;font-size:14px;transition:background 160ms var(--ease),transform 160ms var(--ease)}
.act:hover{background:#fff}.act:active{transform:scale(.96)}
.act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.act[aria-pressed=true]{background:#1f1c19;color:#f4efe6;border-color:#1f1c19}
.act[aria-pressed=true] svg{fill:currentColor}
.act[aria-pressed=true] svg.pop{animation:pop 380ms var(--expo)}
@keyframes pop{40%{transform:scale(1.35)}}
.cnt{font:500 12px/1 var(--sans);opacity:.7;font-variant-numeric:tabular-nums}
.hint{margin:0;font-size:12px;color:#4b443d}

.scrim{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(20,16,14,.48);opacity:0;visibility:hidden;transition:opacity 240ms var(--ease),visibility 0s 240ms}
.scrim.on{opacity:1;visibility:visible;transition:opacity 240ms var(--ease)}
.sheet{width:min(440px,100%);border-radius:24px;background:#f7f3ec;color:#1f1c19;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(24px) scale(.98);transition:transform 360ms var(--expo)}
.scrim.on .sheet{transform:none}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-top h2{margin:0;font:400 20px/1 var(--serif)}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}.x:hover{background:#ebe5db}
.x svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fmt{display:flex;gap:4px;margin-bottom:14px}
.fmt button{height:32px;padding:0 14px;border-radius:16px;font-size:13px;font-weight:600;border:1px solid #d9d1c4}
.fmt button[aria-pressed=true]{background:#1f1c19;color:#f7f3ec;border-color:#1f1c19}
.pv-wrap{display:grid;place-items:center;height:300px;border-radius:16px;background:repeating-conic-gradient(#ece6dc 0 25%,#f3eee6 0 50%) 0 0/16px 16px}
.pv{position:relative;height:260px;aspect-ratio:1;border-radius:6px;overflow:hidden;color:var(--ink);background:linear-gradient(165deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;transition:aspect-ratio 360ms var(--expo)}
.pv.story{aspect-ratio:9/16;padding:20px 16px}
.pv p{position:relative;margin:0;font:400 19px/1.2 var(--serif);text-wrap:balance}
.pv.story p{font-size:15px}
.pv small{position:relative;display:block;margin-top:10px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.pv .orb{left:auto;right:16px;top:14px;width:48px;height:48px;transition:none}
.pv .wm{position:absolute;top:14px;left:16px;font:400 13px/1 var(--serif);opacity:.85}
.sh-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sh-acts button{height:44px;border-radius:22px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #d9d1c4}
.sh-acts button.pri{background:#1f1c19;color:#f7f3ec;border-color:#1f1c19}
.sh-acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media (max-width:640px){
  body{padding:20px 12px}
  .deckrow{grid-template-columns:minmax(0,1fr);gap:0}.nav{display:none}
  .times button{padding:0 10px}.times .auto,.times button span{display:none}
  .q{font-size:24px}.q::before{font-size:72px}.inner{padding:22px 22px 20px}
  .orb{width:90px;height:90px}
}
@media (prefers-reduced-motion:reduce){
  :root,.card,.orb,.stars,.pips i,.scrim,.sheet,.pv,.act,.nav{transition:none!important}
  .act svg.pop{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="times" role="group" aria-label="Sky by time of day">
    <span class="auto" id="clock">Now 00:16</span>
    <button type="button" data-t="dawn" aria-pressed="false" aria-label="Dawn sky"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 6v3M5 11l2 1M19 11l-2 1"/></svg><span>Dawn</span></button>
    <button type="button" data-t="day" aria-pressed="false" aria-label="Day sky"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span>Day</span></button>
    <button type="button" data-t="dusk" aria-pressed="false" aria-label="Dusk sky"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 12V8M10 10l2 2 2-2"/></svg><span>Dusk</span></button>
    <button type="button" data-t="night" aria-pressed="false" aria-label="Night sky"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg><span>Night</span></button>
  </div>
  <div class="deckrow">
    <button class="nav" type="button" id="prev" aria-label="Previous quote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="deck" id="deck">
      <div class="card b2"></div>
      <div class="card b1"></div>
      <article class="card top" id="card" tabindex="0" aria-roledescription="quote card" aria-label="Quote of the day. Swipe or use arrow keys for the next quote">
        <div class="stars"></div><div class="orb"></div><div class="grain"></div>
        <div class="inner">
          <div class="meta"><b>Dayleaf</b><span id="date">No. 277 · Sun 4 Oct</span></div>
          <blockquote class="q" id="q"></blockquote>
          <p class="by" id="by"></p>
          <div class="foot"><span id="pos">1 of 6</span><span class="pips" id="pips" aria-hidden="true"></span></div>
        </div>
      </article>
    </div>
    <button class="nav" type="button" id="next" aria-label="Next quote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="actions">
    <button class="act" type="button" id="save" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg><span id="save-t">Save</span><span class="cnt" id="saved-n">2</span></button>
    <button class="act" type="button" id="share" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg>Share as image</button>
  </div>
  <p class="hint">Swipe the card, or use <b>←</b> <b>→</b> when it has focus</p>
</div>
<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-h">
    <div class="sh-top"><h2 id="sh-h">Share today's leaf</h2><button class="x" type="button" id="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="fmt" role="group" aria-label="Image format"><button type="button" data-f="sq" aria-pressed="true">Square 1:1</button><button type="button" data-f="story" aria-pressed="false">Story 9:16</button></div>
    <div class="pv-wrap"><div class="pv" id="pv" role="img"><div class="stars"></div><div class="orb"></div><span class="wm">Dayleaf</span><p id="pv-q"></p><small id="pv-by"></small></div></div>
    <div class="sh-acts"><button type="button" class="pri" id="copy"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg><span>Copy image</span></button><button type="button" id="dl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg><span>Save PNG</span></button></div>
  </div>
</div>
<p class="sr" id="live" aria-live="polite"></p>
<script>
const Q = [
  ['It is not that we have a short time to live, but that we waste a lot of it.', 'Seneca', 'On the Shortness of Life'],
  ['The happiness of your life depends upon the quality of your thoughts.', 'Marcus Aurelius', 'Meditations'],
  ['Forever is composed of nows.', 'Emily Dickinson', 'Poems, 1896'],
  ['A journey of a thousand miles begins beneath one\u2019s feet.', 'Lao Tzu', 'Tao Te Ching, 64'],
  ['Dwell on the beauty of life. Watch the stars, and see yourself running with them.', 'Marcus Aurelius', 'Meditations'],
  ['Rather than love, than money, than fame, give me truth.', 'Henry David Thoreau', 'Walden'],
];
const saved = new Set([3, 5]);
const $ = id => document.getElementById(id);
const root = document.documentElement, card = $('card'), live = $('live');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let i = 0, auto = true, busy = false;

const now = new Date();
const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5);
$('date').textContent = `No. ${doy} · ${now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}`;
$('pips').innerHTML = Q.map(() => '<i></i>').join('');
function period(h) { return h >= 5 && h < 10 ? 'dawn' : h >= 10 && h < 16 ? 'day' : h >= 16 && h < 20 ? 'dusk' : 'night'; }
function setTime(t, isAuto) {
  root.dataset.t = t; auto = isAuto;
  document.querySelectorAll('.times button').forEach(b => b.setAttribute('aria-pressed', !isAuto && b.dataset.t === t));
  live.textContent = isAuto ? '' : 'Sky set to ' + t;
}
function tick() {
  const d = new Date(), hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  $('clock').textContent = `${auto ? 'Now' : 'Preview'} ${hh}:${mm}`;
  if (auto) setTime(period(d.getHours()), true);
}
document.querySelectorAll('.times button').forEach(b => b.addEventListener('click', () => {
  if (b.getAttribute('aria-pressed') === 'true') { setTime(period(new Date().getHours()), true); tick(); return; }
  setTime(b.dataset.t, false); tick();
}));

function fill() {
  const [q, a, src] = Q[i];
  $('q').textContent = q; $('by').innerHTML = `${a} <span>${src}</span>`;
  $('pos').textContent = `${i + 1} of ${Q.length}`;
  document.querySelectorAll('#pips i').forEach((p, k) => p.classList.toggle('on', k === i));
  const s = saved.has(i), btn = $('save');
  btn.setAttribute('aria-pressed', s); $('save-t').textContent = s ? 'Saved' : 'Save';
  $('saved-n').textContent = saved.size;
  btn.setAttribute('aria-label', `${s ? 'Saved' : 'Save'} quote. ${saved.size} saved`);
  $('pv-q').textContent = q; $('pv-by').textContent = `${a} · Dayleaf No. ${doy}`;
  $('pv').setAttribute('aria-label', `Preview image: ${q} ${a}`);
}
function go(dir, fromX) {
  if (busy) return; busy = true;
  const out = dir > 0 ? -1 : 1;
  card.classList.remove('drag');
  const done = () => {
    i = (i + dir + Q.length) % Q.length; fill();
    card.style.transition = 'none'; card.style.opacity = '0';
    card.style.transform = 'translateY(16px) scale(.94)';
    void card.offsetWidth;
    card.style.transition = ''; card.style.opacity = ''; card.style.transform = '';
    live.textContent = `${Q[i][0]} ${Q[i][1]}. Quote ${i + 1} of ${Q.length}`;
    busy = false;
  };
  if (reduce) return done();
  card.style.transition = 'transform 280ms cubic-bezier(.4,0,1,1), opacity 280ms';
  card.style.transform = `translateX(${out * 130}%) rotate(${out * 14}deg)`;
  card.style.opacity = '0';
  setTimeout(done, 280);
}
$('next').addEventListener('click', () => go(1));
$('prev').addEventListener('click', () => go(-1));
card.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { e.preventDefault(); go(1); } if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); } });

let sx = null, dx = 0;
card.addEventListener('pointerdown', e => { if (busy) return; sx = e.clientX; dx = 0; card.classList.add('drag'); card.setPointerCapture(e.pointerId); });
card.addEventListener('pointermove', e => {
  if (sx === null) return; dx = e.clientX - sx;
  card.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
});
const release = () => {
  if (sx === null) return; sx = null;
  if (Math.abs(dx) > 100) go(dx < 0 ? 1 : -1);
  else { card.classList.remove('drag'); card.style.transform = ''; }
};
card.addEventListener('pointerup', release); card.addEventListener('pointercancel', release);

$('save').addEventListener('click', () => {
  saved.has(i) ? saved.delete(i) : saved.add(i); fill();
  const svg = $('save').querySelector('svg'); svg.classList.remove('pop'); void svg.offsetWidth; svg.classList.add('pop');
  live.textContent = saved.has(i) ? `Saved. ${saved.size} quotes saved` : `Removed from saved. ${saved.size} quotes saved`;
});

const scrim = $('scrim');
function openShare() { scrim.classList.add('on'); setTimeout(() => $('copy').focus(), 50); }
function closeShare() { scrim.classList.remove('on'); $('share').focus(); resetBtns(); }
function resetBtns() { $('copy').querySelector('span').textContent = 'Copy image'; $('dl').querySelector('span').textContent = 'Save PNG'; }
$('share').addEventListener('click', openShare);
$('close').addEventListener('click', closeShare);
scrim.addEventListener('click', e => { if (e.target === scrim) closeShare(); });
scrim.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeShare();
  if (e.key === 'Tab') {
    const f = [...scrim.querySelectorAll('button')], a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
});
document.querySelectorAll('.fmt button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.fmt button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('pv').classList.toggle('story', b.dataset.f === 'story');
}));
$('copy').addEventListener('click', () => { $('copy').querySelector('span').textContent = 'Copied'; live.textContent = 'Image copied'; });
$('dl').addEventListener('click', () => { $('dl').querySelector('span').textContent = 'Saved'; live.textContent = 'Image saved'; });

fill(); tick(); setInterval(tick, 30000);
</script>
