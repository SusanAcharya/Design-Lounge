<!-- Design Lounge piece: stat-tile-tactile · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hush — last night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#e6e3df;--ink:#2a2622;--ink-2:#56514b;--ink-3:#625c56;--edge:#7d7770;
  --light:rgba(255,255,255,.85);--shade:rgba(74,66,58,.22);
  --raise:10px 10px 24px var(--shade),-10px -10px 24px var(--light);
  --raise-sm:5px 5px 12px var(--shade),-5px -5px 12px var(--light);
  --well:inset 6px 6px 14px var(--shade),inset -6px -6px 14px var(--light);
  --well-sm:inset 3px 3px 7px var(--shade),inset -3px -3px 7px var(--light);
  --sans:"Sora",system-ui,sans-serif;--r:20px;--r-card:24px;
  --t-micro:200ms;--t-bar:600ms;--ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--surface);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;display:grid;place-items:center}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.set{width:min(1040px,100%);padding:0 40px;display:grid;gap:22px}
.head{display:flex;align-items:center;justify-content:space-between}
.head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.025em}
.seg{display:flex;padding:4px;border-radius:999px;box-shadow:var(--well-sm);border:1px solid var(--edge)}
.seg button{border:0;background:transparent;border-radius:999px;height:34px;padding:0 16px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;transition:box-shadow var(--t-micro) var(--ease),color var(--t-micro) var(--ease)}
.seg button[aria-pressed="true"]{box-shadow:var(--raise-sm);color:var(--ink);background:var(--surface)}
.tiles{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:22px;align-items:stretch}
.tile{padding:26px 28px 24px;border-radius:var(--r-card);border:1px solid var(--edge);box-shadow:var(--raise);display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.num{font-size:72px;line-height:.95;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.num small{font-size:28px;font-weight:600;letter-spacing:-.02em;color:var(--ink-2)}
.tile.sm .num{font-size:36px}.tile.sm .num small{font-size:18px}
.delta{align-self:flex-start;padding:7px 12px;border-radius:999px;box-shadow:var(--well-sm);border:1px solid var(--edge);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.delta svg{width:14px;height:14px}
.bars{margin-top:auto;height:88px;padding:10px 12px;border-radius:16px;box-shadow:var(--well);border:1px solid var(--edge);display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.bars i{display:block;border-radius:6px 6px 3px 3px;background:var(--surface);box-shadow:var(--raise-sm);border:1px solid var(--edge);height:var(--h);transform-origin:bottom;animation:grow var(--t-bar) var(--expo) both;animation-delay:var(--d)}
.bars i.now{background:var(--ink);border-color:var(--ink)}
@keyframes grow{from{transform:scaleY(.2)}to{transform:none}}
.bars-l{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:11px;font-weight:600;color:var(--ink-3);text-align:center;margin-top:-6px}
.tile.sm p{margin:auto 0 0;font-size:13px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation:none!important}}
</style>
</head>
<body>
<main class="set">
  <div class="head"><h1>Last night</h1><div class="seg" role="group" aria-label="Range"><button type="button" aria-pressed="true" data-r="night">Night</button><button type="button" aria-pressed="false" data-r="week">Week</button></div></div>
  <div class="tiles">
    <section class="tile" aria-labelledby="s1">
      <span class="label" id="s1">Asleep</span>
      <div class="num" id="n1"><span>7</span><small>h</small><span>42</span><small>min</small></div>
      <span class="delta" id="d1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>38 min more than your average</span>
      <div class="bars" aria-label="Hours asleep, the last seven nights" id="bars">
        <i style="--h:62%;--d:0ms"></i><i style="--h:70%;--d:40ms"></i><i style="--h:48%;--d:80ms"></i><i style="--h:80%;--d:120ms"></i><i style="--h:66%;--d:160ms"></i><i style="--h:58%;--d:200ms"></i><i class="now" style="--h:90%;--d:240ms"></i>
      </div>
      <div class="bars-l" aria-hidden="true"><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span></div>
    </section>
    <section class="tile sm" aria-labelledby="s2">
      <span class="label" id="s2">Deep sleep</span>
      <div class="num" id="n2"><span>1</span><small>h</small><span>51</span><small>min</small></div>
      <span class="delta" id="d2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>24%</span>
      <p id="p2">Mostly before 02:00. The rain tape ran until 23:40.</p>
    </section>
    <section class="tile sm" aria-labelledby="s3">
      <span class="label" id="s3">Resting heart</span>
      <div class="num" id="n3"><span>54</span><small>bpm</small></div>
      <span class="delta" id="d3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>2 below last week</span>
      <p id="p3">Lowest at 04:10. Back to 61 by the time you got up.</p>
    </section>
  </div>
</main>
<script>
  const D={
    night:{n1:'<span>7</span><small>h</small><span>42</span><small>min</small>',d1:'38 min more than your average',n2:'<span>1</span><small>h</small><span>51</span><small>min</small>',d2:'24%',p2:'Mostly before 02:00. The rain tape ran until 23:40.',n3:'<span>54</span><small>bpm</small>',d3:'2 below last week',p3:'Lowest at 04:10. Back to 61 by the time you got up.',h:[62,70,48,80,66,58,90]},
    week:{n1:'<span>7</span><small>h</small><span>04</span><small>min</small>',d1:'avg · 11 min more than last week',n2:'<span>1</span><small>h</small><span>38</span><small>min</small>',d2:'23%',p2:'Best on Saturday. Shortest on Friday, after the late train.',n3:'<span>56</span><small>bpm</small>',d3:'1 below the week before',p3:'Steady all week. Nothing above 60 at rest.',h:[62,70,48,80,66,58,90]}
  };
  const arrow=(up)=>up?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    const d=D[b.dataset.r];
    document.getElementById('n1').innerHTML=d.n1;document.getElementById('d1').innerHTML=arrow(true)+d.d1;
    document.getElementById('n2').innerHTML=d.n2;document.getElementById('d2').innerHTML=arrow(true)+d.d2;document.getElementById('p2').textContent=d.p2;
    document.getElementById('n3').innerHTML=d.n3;document.getElementById('d3').innerHTML=arrow(false)+d.d3;document.getElementById('p3').textContent=d.p3;
    document.querySelector('.head h1').textContent=b.dataset.r==='night'?'Last night':'This week';
  }));
</script>
</body>
</html>
