<!-- Design Lounge piece: phone-app-lock · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locked · Coffer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110e;--surface:#221c16;--ink:#f3e7d4;--ink-2:#d5c4a8;--ink-3:#c4b296;
  --line:#3d342b;--brass:#d4b06a;--brass-ink:#1a140c;--error:#f0b2a4;--focus:#d4b06a;
  --serif:"Cardo",Georgia,serif;--sans:"PT Sans",system-ui,sans-serif;
  --ease:cubic-bezier(0.2,0.7,0.2,1);--fast:160ms;--mid:280ms;--shake:420ms;--radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;min-height:100%;color:var(--ink);
  font:1rem/1.35 var(--sans);background:var(--bg);
  background-image:repeating-linear-gradient(90deg,rgba(212,176,106,.035) 0 1px,transparent 1px 8px);
  padding:0 16px max(34px,env(safe-area-inset-bottom));
  touch-action:pan-y;-webkit-font-smoothing:antialiased;
}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:44px;padding:max(54px,env(safe-area-inset-top)) 0 0;
}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:1.5rem;line-height:1}
.brand svg{width:22px;height:22px;color:var(--brass)}
.where{font-size:.75rem;font-weight:700;letter-spacing:.14em;color:var(--ink-3)}
main{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:18px}
h1{margin:0;font-family:var(--serif);font-size:2.125rem;font-weight:700;line-height:1.1;letter-spacing:-.01em}
h1:focus-visible{outline:none;box-shadow:inset 0 -3px 0 var(--brass)}
.dek{margin:8px 0 0;max-width:28ch;color:var(--ink-2);font-size:1.0625rem}
.line{margin:8px 0 0;font-family:var(--serif);font-size:1.35rem;color:var(--brass)}
.slots{display:flex;gap:10px;margin-top:20px}
.slots{flex-wrap:wrap}
.slot{
  width:3.5rem;height:3.25rem;border:1.5px solid var(--line);border-radius:8px;
  display:grid;place-items:center;font-family:var(--serif);font-size:1.75rem;color:var(--brass);background:var(--surface);
}
.slots.bad .slot{border-color:var(--error)}
.slots.shake{animation:shake var(--shake) var(--ease)}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(4px)}
}
.err{margin:10px 0 0;font-size:.9375rem;font-weight:700;color:var(--error)}
.err:empty{display:none}
.spacer{flex:1;min-height:12px}
.lock-only{flex:1;display:flex;flex-direction:column;min-height:0}
.bio{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;
  border-radius:var(--radius);background:var(--brass);color:var(--brass-ink);
  font-size:1.0625rem;font-weight:700;
  transition:transform var(--fast) var(--ease),opacity var(--fast) var(--ease);
}
.bio svg{width:22px;height:22px}
.bio:active{transform:translateY(1px)}
.bio[aria-busy="true"]{opacity:.7}
.or{margin:14px 0 10px;font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{
  min-height:64px;border-radius:8px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);font-family:var(--sans);font-size:1.625rem;font-weight:700;
}
.key:active{background:#3a3128}
.zero{grid-column:span 2}
.del{display:grid;place-items:center}
.del svg{width:26px;height:26px}
.home{margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.doc{
  display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;text-align:left;
}
.doc .ico{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--brass)}
.doc .ico svg,.doc .chev{width:22px;height:22px}
.doc b{display:block;font-size:1.0625rem;font-weight:700}
.doc small{display:block;margin-top:2px;color:var(--ink-2);font-size:.875rem}
.doc .chev{margin-left:auto;color:var(--ink-3)}
.note{margin:0;padding:0 14px 12px 62px;color:var(--ink-2);font-size:.9375rem}
.relock{display:inline-flex;align-items:center;min-height:44px;margin-top:12px;font-weight:700;color:var(--brass)}
svg{stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
@media(hover:hover){.key:hover{background:#2c261f}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
</style>
</head>
<body data-phase="locked">
<header class="nav">
  <p class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="3.2"/><path d="M11.2 12H20M16.2 12v2.6M19 12v2"/></svg>
    Coffer
  </p>
  <p class="where">DRAWER 2</p>
</header>
<main>
  <h1 id="title" tabindex="-1">Locked</h1>
  <p class="dek" id="dek">Family papers stay on this phone.</p>
  <p class="line" id="openline" hidden>Drawer open.</p>
  <div class="lock-only" id="lockonly">
    <div class="slots" id="slots" role="group" aria-label="Entered 0 of 4 digits">
      <span class="slot" id="s0"></span>
      <span class="slot" id="s1"></span>
      <span class="slot" id="s2"></span>
      <span class="slot" id="s3"></span>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="spacer"></div>
    <button class="bio" type="button" id="bio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a7 7 0 0 0-7 7V14"/><path d="M19 10.5V14a7 7 0 0 1-11 5.7"/><path d="M12 7.5a3 3 0 0 0-3 3V13a5 5 0 0 0 7.2 4.5"/><path d="M12 11v3.2"/></svg>
      <span id="bioText">Read fingerprint</span>
    </button>
    <p class="or">Or the four-digit drawer code</p>
    <div class="pad" id="pad">
      <button class="key" type="button" data-n="1" aria-label="1">1</button>
      <button class="key" type="button" data-n="2" aria-label="2">2</button>
      <button class="key" type="button" data-n="3" aria-label="3">3</button>
      <button class="key" type="button" data-n="4" aria-label="4">4</button>
      <button class="key" type="button" data-n="5" aria-label="5">5</button>
      <button class="key" type="button" data-n="6" aria-label="6">6</button>
      <button class="key" type="button" data-n="7" aria-label="7">7</button>
      <button class="key" type="button" data-n="8" aria-label="8">8</button>
      <button class="key" type="button" data-n="9" aria-label="9">9</button>
      <button class="key zero" type="button" data-n="0" aria-label="0">0</button>
      <button class="key del" type="button" id="del" aria-label="Delete digit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12v12H8l-5-6 5-6z"/><path d="m11 10 5 5M16 10l-5 5"/></svg>
      </button>
    </div>
  </div>
  <div class="home" id="home" hidden>
    <div class="card">
      <button class="doc" type="button" id="doc" aria-expanded="false" aria-controls="note">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l5 5V20.5H7z"/><path d="M14 3.5v5h5"/><path d="M9.5 13h7M9.5 16.5h5"/></svg></span>
        <span><b>House papers</b><small>Revised 12 March 2026</small></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <p class="note" id="note" hidden>Kept on this phone.</p>
    </div>
    <button class="relock" type="button" id="relock">Lock again</button>
  </div>
</main>
<p class="sr" id="status" role="status"></p>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var beat=reduce?0:800;
  var reveal=reduce?0:700;
  var phase='locked';
  var code='';
  var slots=document.getElementById('slots');
  var err=document.getElementById('err');
  var title=document.getElementById('title');
  var dek=document.getElementById('dek');
  var openline=document.getElementById('openline');
  var lockonly=document.getElementById('lockonly');
  var home=document.getElementById('home');
  var bio=document.getElementById('bio');
  var bioText=document.getElementById('bioText');
  var status=document.getElementById('status');
  var cells=[0,1,2,3].map(function(i){return document.getElementById('s'+i);});

  function render(){
    cells.forEach(function(cell,i){cell.textContent=code[i]||'';});
    slots.setAttribute('aria-label','Entered '+code.length+' of 4 digits');
  }
  function clearErr(){
    if(!err.textContent) return;
    err.textContent='';
    slots.classList.remove('bad');
  }
  function press(n){
    if(phase!=='locked'||code.length>=4) return;
    clearErr();
    code+=n;
    render();
    if(code.length===4) judge();
  }
  function back(){
    if(phase!=='locked'||!code) return;
    code=code.slice(0,-1);
    render();
  }
  function judge(){
    if(code==='2741'){openDrawer();return;}
    slots.classList.remove('shake');
    void slots.offsetWidth;
    slots.classList.add('shake','bad');
    err.textContent='That code does not open the drawer.';
    status.textContent='That code does not open the drawer.';
    setTimeout(function(){
      code='';
      render();
      slots.classList.remove('shake');
    },420);
  }
  function openDrawer(){
    phase='done';
    err.textContent='';
    slots.classList.remove('bad','shake');
    dek.hidden=true;
    openline.hidden=false;
    status.textContent='Drawer open.';
    setTimeout(function(){
      document.body.dataset.phase='home';
      lockonly.hidden=true;
      home.hidden=false;
      title.textContent='Drawer open.';
      openline.hidden=true;
      title.focus();
    },reveal);
  }
  function readPrint(){
    if(phase!=='locked') return;
    phase='reading';
    err.textContent='';
    slots.classList.remove('bad','shake');
    bio.setAttribute('aria-busy','true');
    bioText.textContent='Reading the print';
    status.textContent='Reading the print.';
    setTimeout(function(){
      bio.setAttribute('aria-busy','false');
      bioText.textContent='Read fingerprint';
      openDrawer();
    },beat);
  }
  function relock(){
    phase='locked';
    code='';
    render();
    err.textContent='';
    slots.classList.remove('bad','shake');
    dek.hidden=false;
    openline.hidden=true;
    lockonly.hidden=false;
    home.hidden=true;
    title.textContent='Locked';
    document.body.dataset.phase='locked';
    bio.setAttribute('aria-busy','false');
    bioText.textContent='Read fingerprint';
    document.getElementById('note').hidden=true;
    document.getElementById('doc').setAttribute('aria-expanded','false');
    status.textContent='Coffer is locked.';
  }
  document.getElementById('pad').addEventListener('click',function(e){
    var key=e.target.closest('.key');
    if(!key||key.id==='del') return;
    press(key.getAttribute('data-n'));
  });
  document.getElementById('del').addEventListener('click',back);
  bio.addEventListener('click',readPrint);
  document.getElementById('relock').addEventListener('click',relock);
  document.getElementById('doc').addEventListener('click',function(){
    var note=document.getElementById('note');
    var open=note.hidden;
    note.hidden=!open;
    this.setAttribute('aria-expanded',open?'true':'false');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Backspace'){back();return;}
    if(/^[0-9]$/.test(e.key)) press(e.key);
  });
  slots.addEventListener('animationend',function(){slots.classList.remove('shake');});
})();
</script>
</body>
</html>
