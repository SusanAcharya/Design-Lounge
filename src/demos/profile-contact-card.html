<!-- Design Lounge piece: profile-contact-card · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Teodora Ashgrove · Kilnworth Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Gloock&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#cdc8bd;--bg-2:#bfb9ad;--teal:#11302d;--teal-2:#1b423e;--brass:#d6a25a;--brass-2:#f0c98a;
  --bone:#f1ece2;--bone-ink:#132a27;--bone-3:#5a6662;--ink:#1d1f1c;--ink-2:#45473f;
  --serif:"Gloock",Georgia,serif;--mono:"Azeret Mono",ui-monospace,monospace;
  --u:calc(100cqw / 560);
  --flip:cubic-bezier(.32,.72,0,1);--ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:auto;min-height:100%;display:grid;place-items:center;padding:32px 16px;color:var(--ink);font:13px/1.45 var(--mono);overflow-x:hidden;
  background:radial-gradient(120% 90% at 50% 40%,var(--bg),var(--bg-2))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:28px}
.scene{width:100%;container-type:inline-size;perspective:1400px}
.tilt{transition:transform .5s var(--expo);transform-style:preserve-3d}
.card{position:relative;aspect-ratio:7/4;transform-style:preserve-3d;transition:transform .8s var(--flip)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:calc(var(--u)*14);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 calc(var(--u)*30) calc(var(--u)*50) calc(var(--u)*-24) rgba(20,24,20,.55),0 calc(var(--u)*4) calc(var(--u)*10) rgba(20,24,20,.18)}
.back{transform:rotateY(180deg)}

/* front */
.front{background:
  radial-gradient(circle at 88% -20%,rgba(214,162,90,.16),transparent 55%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),var(--teal);
  color:var(--bone);padding:calc(var(--u)*30) calc(var(--u)*32);display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto}
.front::after{content:"";position:absolute;right:calc(var(--u)*-90);bottom:calc(var(--u)*-150);width:calc(var(--u)*380);height:calc(var(--u)*380);border-radius:50% 50% 0 0;pointer-events:none;
  background:repeating-radial-gradient(circle at 50% 50%,transparent 0 calc(var(--u)*17),rgba(214,162,90,.13) calc(var(--u)*17) calc(var(--u)*18));-webkit-mask:linear-gradient(#000 50%,transparent 50%);mask:linear-gradient(#000 50%,transparent 50%)}
.front>*{position:relative;z-index:1}
.mark{width:calc(var(--u)*40);height:calc(var(--u)*40);color:var(--brass)}
.studio{text-align:right;font:500 calc(var(--u)*10)/1.5 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--brass-2)}
.who{grid-column:1/-1;align-self:end}
.name{font:400 calc(var(--u)*52)/.92 var(--serif);margin:0;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--brass) 20%,var(--brass-2) 45%,var(--brass) 60%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:foil 6s var(--ease) infinite alternate}
@keyframes foil{to{background-position:100% 0}}
.title{font:400 calc(var(--u)*11)/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#b9c8c3;margin:calc(var(--u)*10) 0 0}
.rule{grid-column:1/-1;height:1px;background:linear-gradient(90deg,var(--brass),rgba(214,162,90,.15));margin:calc(var(--u)*16) 0 calc(var(--u)*10)}
.rows{grid-column:1/-1;display:flex;justify-content:space-between;gap:calc(var(--u)*8)}
.copy{position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:calc(var(--u)*8);min-height:max(36px,calc(var(--u)*40));padding:0 calc(var(--u)*10);margin:0 calc(var(--u)*-10);border-radius:calc(var(--u)*8);font:500 calc(var(--u)*12.5) var(--mono);color:var(--bone);transition:background .16s var(--ease),color .16s var(--ease)}
.copy svg{width:calc(var(--u)*16);height:calc(var(--u)*16);color:var(--brass)}
.copy:hover{background:var(--teal-2)}
.copy .tag{position:absolute;right:calc(var(--u)*10);bottom:calc(100% + var(--u)*2);font-size:calc(var(--u)*10);letter-spacing:.1em;text-transform:uppercase;color:var(--teal);background:var(--brass-2);padding:calc(var(--u)*2) calc(var(--u)*6);border-radius:calc(var(--u)*4);opacity:0;transform:translateY(calc(var(--u)*4));transition:opacity .18s var(--ease),transform .18s var(--ease)}
.copy.done .tag{opacity:1;transform:none}

/* back */
.back{background:
  radial-gradient(rgba(19,42,39,.06) .7px,transparent .8px) 0 0/4px 4px,var(--bone);color:var(--bone-ink);
  padding:calc(var(--u)*28) calc(var(--u)*30);display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*26);align-items:center}
.qr{width:calc(var(--u)*176);height:calc(var(--u)*176);padding:calc(var(--u)*10);background:#fff;border-radius:calc(var(--u)*10);box-shadow:0 0 0 1px rgba(19,42,39,.12)}
.qr svg{display:block;width:100%;height:100%}
.bk h2{font:400 calc(var(--u)*30)/1 var(--serif);margin:0;color:var(--bone-ink)}
.bk p{margin:calc(var(--u)*8) 0 0;font-size:calc(var(--u)*11.5);line-height:1.55;color:var(--bone-3)}
.save{margin-top:calc(var(--u)*18);display:inline-flex;align-items:center;gap:calc(var(--u)*10);min-height:calc(var(--u)*44);padding:0 calc(var(--u)*18);border-radius:999px;background:var(--teal);color:var(--bone);font:600 calc(var(--u)*12.5) var(--mono);transition:background .16s var(--ease),transform .12s var(--ease)}
.save svg{width:calc(var(--u)*17);height:calc(var(--u)*17);color:var(--brass-2)}
.save:hover{background:var(--teal-2)}
.save:active{transform:scale(.97)}
.fine{font-size:calc(var(--u)*10)!important;letter-spacing:.06em}

/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctl{height:42px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font:500 13px var(--mono);background:rgba(241,236,226,.6);box-shadow:inset 0 0 0 1px rgba(29,31,28,.22);transition:background .16s var(--ease)}
.ctl:hover{background:var(--bone)}
.ctl.dark{background:var(--teal);color:var(--bone);box-shadow:none}
.ctl.dark:hover{background:var(--teal-2)}
.status{min-height:20px;font-size:12px;color:var(--ink-2);text-align:center;margin:-14px 0 0}
.status b{color:var(--ink);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
  .card,.card.flipped{transform:none}
  .face{backface-visibility:visible;transition:opacity .01ms}
  .back{transform:none;opacity:0;visibility:hidden}
  .card.flipped .back{opacity:1;visibility:visible}
  .card.flipped .front{opacity:0;visibility:hidden}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="scene" id="scene">
    <div class="tilt" id="tilt">
      <div class="card" id="card" aria-live="off">
        <section class="face front" id="front" aria-label="Card front">
          <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 38V20a16 16 0 0 1 32 0v18" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 38V22a8 8 0 0 1 16 0v16" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 38V24" stroke="currentColor" stroke-width="2"/></svg>
          <div class="studio">Kilnworth<br>Studio</div>
          <div class="who">
            <h1 class="name">Teodora<br>Ashgrove</h1>
            <p class="title">Principal · Landscape Architecture</p>
          </div>
          <div class="rule" aria-hidden="true"></div>
          <div class="rows">
            <button class="copy" type="button" data-copy="teodora@kilnworth.studio" data-what="Email" aria-label="Copy email teodora@kilnworth.studio">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <span>teodora@kilnworth.studio</span><span class="tag" aria-hidden="true">Copied</span>
            </button>
            <button class="copy" type="button" data-copy="+44 20 7946 0321" data-what="Phone number" aria-label="Copy phone +44 20 7946 0321">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
              <span>+44 20 7946 0321</span><span class="tag" aria-hidden="true">Copied</span>
            </button>
          </div>
        </section>
        <section class="face back" id="back" aria-label="Card back" inert>
          <div class="qr"><svg id="qr" viewBox="0 0 29 29" role="img" aria-label="QR code for Teodora Ashgrove's contact card" shape-rendering="crispEdges"></svg></div>
          <div class="bk">
            <h2>Scan to save</h2>
            <p>14 Ropewalk Yard<br>Bristol BS1 6QA<br>United Kingdom</p>
            <button class="save" id="save" type="button">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Save contact
            </button>
            <p class="fine">kilnworth.studio/teodora</p>
          </div>
        </section>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="ctl dark" id="flip" type="button" aria-pressed="false" aria-controls="card">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg><span>Show back</span>
    </button>
    <button class="ctl" id="save2" type="button">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download .vcf
    </button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite">Tap the email or phone to copy. Flip for the QR.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const card = $('card'), front = $('front'), back = $('back'), flipBtn = $('flip'), status = $('status');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const contact = { first: 'Teodora', last: 'Ashgrove', org: 'Kilnworth Studio', title: 'Principal, Landscape Architecture',
  tel: '+44 20 7946 0321', email: 'teodora@kilnworth.studio', street: '14 Ropewalk Yard', city: 'Bristol', zip: 'BS1 6QA', country: 'United Kingdom' };
const vcard = [
  'BEGIN:VCARD', 'VERSION:3.0',
  `N:${contact.last};${contact.first};;;`, `FN:${contact.first} ${contact.last}`,
  `ORG:${contact.org}`, `TITLE:${contact.title.replace(/,/g, '\\,')}`,
  `TEL;TYPE=WORK,VOICE:${contact.tel}`, `EMAIL;TYPE=WORK:${contact.email}`,
  `ADR;TYPE=WORK:;;${contact.street};${contact.city};;${contact.zip};${contact.country}`,
  'END:VCARD', ''
].join('\r\n');

function flip(toBack) {
  card.classList.toggle('flipped', toBack);
  flipBtn.setAttribute('aria-pressed', toBack);
  flipBtn.querySelector('span').textContent = toBack ? 'Show front' : 'Show back';
  front.inert = toBack; back.inert = !toBack;
}
flipBtn.addEventListener('click', () => flip(!card.classList.contains('flipped')));
card.addEventListener('click', e => { if (!e.target.closest('button')) flip(!card.classList.contains('flipped')); });

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}
document.querySelectorAll('.copy').forEach(b => b.addEventListener('click', async () => {
  const ok = await copyText(b.dataset.copy);
  b.classList.toggle('done', ok);
  status.innerHTML = ok ? `<b>${b.dataset.what} copied.</b> ${b.dataset.copy}` : `Copy blocked here. Select <b>${b.dataset.copy}</b> manually.`;
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('done'), 1600);
}));

function save() {
  const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'teodora-ashgrove.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  status.innerHTML = `<b>teodora-ashgrove.vcf</b> created · ${blob.size} bytes · vCard 3.0`;
}
$('save').addEventListener('click', save);
$('save2').addEventListener('click', save);

/* illustrative QR: finder, timing and alignment patterns plus data modules seeded from the vCard */
(function drawQR() {
  const N = 29, m = [...Array(N)].map(() => Array(N).fill(0)), fixed = [...Array(N)].map(() => Array(N).fill(false));
  const finder = (x, y) => { for (let i = -1; i < 8; i++) for (let j = -1; j < 8; j++) {
    const X = x + i, Y = y + j; if (X < 0 || Y < 0 || X >= N || Y >= N) continue;
    const r = Math.max(Math.abs(i - 3), Math.abs(j - 3));
    m[Y][X] = (r === 3 || r <= 1) && i >= 0 && j >= 0 && i < 7 && j < 7 ? 1 : 0; fixed[Y][X] = true; } };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  for (let i = 8; i < N - 8; i++) { m[6][i] = m[i][6] = i % 2 ? 0 : 1; fixed[6][i] = fixed[i][6] = true; }
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) { const r = Math.max(Math.abs(i), Math.abs(j)); m[22 + j][22 + i] = r !== 1 ? 1 : 0; fixed[22 + j][22 + i] = true; }
  let h = 2166136261; for (const c of vcard) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  const rnd = () => (h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909), (h >>> 0) / 4294967296);
  let d = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!fixed[y][x]) m[y][x] = rnd() < .5 ? 1 : 0;
    if (m[y][x]) d += `M${x} ${y}h1v1h-1z`;
  }
  $('qr').innerHTML = `<path d="${d}" fill="#132a27"/>`;
})();

if (!reduce) {
  const scene = $('scene'), tilt = $('tilt');
  scene.addEventListener('pointermove', e => {
    const r = scene.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    tilt.style.transform = `rotateX(${(-y * 8).toFixed(2)}deg) rotateY(${(x * 10).toFixed(2)}deg)`;
  });
  scene.addEventListener('pointerleave', () => tilt.style.transform = '');
}
</script>
</body>
</html>
