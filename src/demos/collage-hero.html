<!-- Design Lounge piece: collage-hero · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste — a scrapbook you can send</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#c9a97c;--paper:#fbf6ec;--paper-2:#efe2c8;--ink:#2b2118;--ink-2:#4a3a2a;--ink-3:#4d3d2c;--line:#b08f62;
  --red:#bf3a24;--blue:#1d4560;--yellow:#e0a300;--tape:rgba(255,250,230,.6);
  --hand:"Caveat",cursive;--sans:"Inter",system-ui,sans-serif;
  --r:4px;--shadow:0 8px 20px -10px rgba(43,33,24,.45);--t-micro:200ms;--ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(43,33,24,.08) .8px,transparent 1px);background-size:5px 5px;opacity:.6}
a,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.nav{position:relative;z-index:2;display:flex;align-items:center;gap:26px;padding:22px 40px}
.brand{font:700 30px/1 var(--hand);text-decoration:none;color:var(--ink);background:var(--paper);padding:4px 12px;transform:rotate(-2deg);box-shadow:var(--shadow)}
.links{margin-left:auto;display:flex;gap:22px;font-weight:600;font-size:14px}
.links a{text-decoration:none;color:var(--ink);background:var(--paper);padding:8px 12px;box-shadow:var(--shadow)}
.links a:hover{background:var(--paper-2)}
.hero{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:30px 40px 0;display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:40px;align-items:center}
.torn{position:relative;background:var(--paper);padding:30px 34px 28px;box-shadow:var(--shadow);clip-path:polygon(0 3%,4% 0,12% 2%,21% 0,33% 2%,44% 0,55% 3%,66% 0,78% 2%,89% 0,100% 2%,100% 97%,95% 100%,84% 98%,73% 100%,62% 97%,50% 100%,39% 98%,27% 100%,15% 97%,5% 100%,0 98%)}
.torn h1{margin:0 0 14px;font:600 clamp(40px,5.6vw,64px)/1.02 var(--sans);letter-spacing:-.035em}
.torn h1 mark{background:none;color:var(--ink);background-image:linear-gradient(transparent 55%,rgba(224,163,0,.55) 55% 92%,transparent 92%);padding:0 2px}
.torn p{margin:0 0 24px;font-size:18px;color:var(--ink-2);max-width:42ch}
.ctas{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:2px solid var(--ink);border-radius:var(--r);background:var(--paper);font-weight:600;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease)}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff8f0;border-color:var(--ink)}
.note{position:absolute;left:36px;bottom:-54px;font:700 28px/1 var(--hand);color:var(--blue);transform:rotate(-5deg);display:flex;align-items:center;gap:8px;z-index:2}
.note svg{width:64px;height:34px}
.tape{position:absolute;width:120px;height:30px;background:var(--tape);box-shadow:0 1px 2px rgba(43,33,24,.15);z-index:3}
.tape.tl{left:-30px;top:-12px;transform:rotate(-38deg)}
.tape.tr{right:-32px;top:-10px;transform:rotate(36deg)}
.tape.top{left:50%;top:-14px;transform:translateX(-50%) rotate(-3deg)}
.stage{position:relative;height:560px}
.photo{position:absolute;background:var(--paper);padding:12px 12px 44px;box-shadow:var(--shadow);transition:transform 320ms var(--expo)}
.photo .img{width:100%;aspect-ratio:4/3;display:block;overflow:hidden}
.photo .img svg{width:100%;height:100%;display:block}
.photo figcaption{position:absolute;left:14px;right:14px;bottom:10px;font:700 22px/1 var(--hand);white-space:nowrap;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline}
.photo figcaption small{font:500 12px var(--sans);color:var(--ink-3)}
.p1{width:320px;left:0;top:30px;transform:rotate(-6deg);z-index:1}
.p2{width:260px;right:0;top:70px;transform:rotate(5deg);z-index:2}
.p3{width:220px;left:150px;bottom:0;transform:rotate(2deg);z-index:3}
.stage:hover .p1{transform:rotate(-8deg) translate(-6px,-4px)}
.stage:hover .p2{transform:rotate(7deg) translate(6px,-6px)}
.stage:hover .p3{transform:rotate(0deg) translateY(-8px)}
.sticker{position:absolute;z-index:4;right:36px;top:60px;width:96px;height:96px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;text-align:center;font:700 22px/1 var(--hand);transform:rotate(12deg);box-shadow:0 3px 0 rgba(43,33,24,.25),inset 0 0 0 4px var(--paper)}
.ticket{position:absolute;z-index:4;left:0;bottom:60px;background:var(--paper-2);padding:8px 14px;font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;border:1px dashed var(--ink-3);transform:rotate(-10deg)}
@media (max-width:1279px){.hero{grid-template-columns:minmax(0,1fr) 440px;gap:32px}.p1{width:280px}.p2{width:230px;top:60px}.p3{width:200px;left:120px}.stage{height:520px}}
@media (max-width:1023px){html{overflow-x:clip}body{overflow:auto}.hero{grid-template-columns:1fr;gap:36px;padding:24px 28px 48px}.torn-wrap{margin-bottom:54px}.stage{height:420px;max-width:520px}.p1{width:240px;left:0;top:10px}.p2{width:200px;right:0;top:30px}.p3{width:180px;left:120px;bottom:0}.sticker{width:80px;height:80px;font-size:19px}.links{gap:12px}}
@media (max-width:639px){.nav{padding:16px 20px;gap:14px}.brand{font-size:24px}.links a{padding:6px 9px;font-size:13px}.hero{padding:20px 20px 40px;gap:30px}.torn{padding:24px 20px 22px}.torn h1{font-size:40px}.torn p{font-size:16px}.ctas{flex-direction:column}.btn{width:100%}.note{font-size:24px;bottom:-50px;left:16px}.stage{height:400px;max-width:100%}.p1{width:200px;left:0;top:10px}.p2{width:160px;right:0;top:215px}.p3,.ticket{display:none}.photo figcaption{font-size:18px}.photo figcaption small{display:none}.sticker{width:72px;height:72px;font-size:18px;right:8px;top:0}}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}.stage:hover .photo{transform:none}}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="#">Paste</a>
  <nav class="links" aria-label="Main"><a href="#">Books</a><a href="#">Paper</a><a href="#">Prices</a></nav>
</header>
<main class="hero">
  <div class="torn-wrap" style="position:relative">
    <span class="tape top" aria-hidden="true"></span>
    <section class="torn" aria-labelledby="h">
      <h1 id="h">A scrapbook you can <mark>send in the post.</mark></h1>
      <p>Paste turns a month of photos and notes into a 24-page book: real paper, real tape, your handwriting on the captions.</p>
      <div class="ctas"><a class="btn red" href="#">Start a book, 1,800</a><a class="btn" href="#">Flick through one</a></div>
    </section>
    <span class="note" aria-hidden="true"><svg viewBox="0 0 64 34" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 28c14 6 30-2 40-14M36 10l8 4-2 9"/></svg>this one is from May</span>
  </div>
  <div class="stage" aria-label="Three pages from a finished book">
    <figure class="photo p1">
      <span class="tape tl" aria-hidden="true"></span>
      <div class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#7fb7d4"/><circle cx="310" cy="70" r="34" fill="#fbf6ec"/><path d="M0 230 Q 100 160 200 220 T 400 200 V300 H0z" fill="#3f7a4a"/><path d="M0 260 Q 140 220 260 262 T 400 250 V300 H0z" fill="#2b5a38"/></svg></div>
      <figcaption>The lake at seven<small>12 May</small></figcaption>
    </figure>
    <figure class="photo p2">
      <span class="tape tr" aria-hidden="true"></span>
      <div class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#e0a300"/><rect x="70" y="90" width="260" height="150" rx="6" fill="#fbf6ec"/><rect x="92" y="112" width="110" height="70" fill="#d9442b"/><rect x="216" y="112" width="92" height="8" fill="#2b2118"/><rect x="216" y="132" width="70" height="8" fill="#2b2118"/><rect x="92" y="200" width="216" height="8" fill="#b08f62"/></svg></div>
      <figcaption>Tej's first ticket<small>19 May</small></figcaption>
    </figure>
    <figure class="photo p3">
      <span class="tape tl" aria-hidden="true"></span>
      <div class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#2f6f8f"/><circle cx="200" cy="150" r="90" fill="#fbf6ec"/><circle cx="200" cy="150" r="50" fill="#d9442b"/><circle cx="200" cy="150" r="14" fill="#2b2118"/></svg></div>
      <figcaption>The good plate<small>26 May</small></figcaption>
    </figure>
    <span class="sticker" aria-hidden="true">24<br>pages</span>
    <span class="ticket" aria-hidden="true">Admit one · May</span>
  </div>
</main>
</body>
</html>
