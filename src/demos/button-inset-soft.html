<!-- Design Lounge piece: button-inset-soft · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Kilnhouse · Soft controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --clay:#e3cbb8;--hi:#f7e8db;--lo:#b8957d;--ink:#3a261b;--ink-2:#6b4a38;--ember:#8f3219;--line:rgba(90,55,35,.14);
  --off-ink:#a08573;
  --serif:"Gloock",Georgia,serif;--sans:"Lexend",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--out:cubic-bezier(.16,1,.3,1);
  --raise:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);
  --raise-hi:9px 9px 20px var(--lo),-9px -9px 20px var(--hi);
  --sink:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);
  --well:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 var(--sans);color:var(--ink);background:var(--clay);display:grid;place-items:center;padding:24px 16px;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.stage{width:min(1060px,100%);border-radius:40px;padding:34px 40px 32px;box-shadow:14px 14px 34px var(--lo),-14px -14px 34px var(--hi);border:1px solid rgba(255,255,255,.35)}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
h1{margin:0;font:400 34px/1 var(--serif);letter-spacing:-.01em}
.meta{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.status{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;box-shadow:var(--well)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-2);transition:background-color 240ms var(--ease)}
.status[data-on="true"] .dot{background:var(--ember);box-shadow:0 0 0 3px rgba(143,50,25,.18)}

.live{display:grid;grid-template-columns:1.5fr 1fr;gap:32px;margin:30px 0 28px}
.cap{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.row+.row{margin-top:22px}

/* soft button */
.soft{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:18px;
  font-weight:500;font-size:15px;background:var(--clay);box-shadow:var(--raise);border:1px solid var(--line);
  transition:box-shadow 200ms var(--ease),transform 200ms var(--ease),color 200ms var(--ease)}
.soft svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.soft:hover,.soft.is-hover{box-shadow:var(--raise-hi)}
.soft:active,.soft.is-pressed{box-shadow:var(--sink);transform:scale(.985);transition-duration:90ms}
.soft[aria-pressed="true"]{box-shadow:var(--sink);color:var(--ember);font-weight:600}
.soft:focus-visible,.soft.is-focus{outline:2px solid var(--ember);outline-offset:4px}
.soft:disabled{box-shadow:none;border:1px dashed rgba(90,55,35,.28);color:var(--off-ink);cursor:not-allowed;transform:none}
.primary{color:var(--ember);font-weight:600}
.primary .ember{width:8px;height:8px;border-radius:50%;background:currentColor}
.lg{height:60px;padding:0 32px;font-size:16px;border-radius:20px}
.sm{height:42px;padding:0 18px;font-size:14px;border-radius:14px}
.ico{width:56px;height:56px;padding:0;border-radius:50%}

/* switch */
.switch{display:inline-flex;align-items:center;gap:14px;font-weight:500;min-height:44px}
.track{position:relative;width:64px;height:34px;border-radius:999px;box-shadow:var(--well);transition:background-color 240ms var(--ease)}
.knob{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--clay);
  box-shadow:3px 3px 6px var(--lo),-2px -2px 5px var(--hi);transition:transform 280ms var(--out),background-color 240ms var(--ease)}
.switch[aria-checked="true"] .track{background:rgba(143,50,25,.14)}
.switch[aria-checked="true"] .knob{transform:translateX(30px);background:var(--ember);box-shadow:2px 2px 5px rgba(90,40,20,.45),-2px -2px 5px var(--hi)}
.switch .val{font-size:12px;color:var(--ink-2);min-width:24px}
.switch:focus-visible .track,.switch.is-focus .track{outline:2px solid var(--ember);outline-offset:4px}
.switch:hover .knob,.switch.is-hover .knob{box-shadow:4px 4px 8px var(--lo),-3px -3px 6px var(--hi)}
.switch:focus-visible{outline:none}
.switch:disabled{cursor:not-allowed;color:var(--off-ink)}
.switch:disabled .track{box-shadow:none;border:1px dashed rgba(90,55,35,.28)}
.switch:disabled .knob{box-shadow:none;background:#d9bfab}

/* segmented */
.seg{position:relative;display:inline-grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:18px;box-shadow:var(--well);min-width:330px}
.seg .thumb{position:absolute;top:5px;left:5px;height:calc(100% - 10px);width:calc((100% - 10px)/3);border-radius:14px;background:var(--clay);
  box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi);transition:transform 320ms var(--out)}
.seg button{position:relative;z-index:1;height:42px;padding:0 16px;border-radius:14px;font-size:14px;font-weight:500;color:var(--ink-2);transition:color 200ms var(--ease)}
.seg button[aria-checked="true"]{color:var(--ember);font-weight:600}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]:hover{color:var(--ember)}
.seg button:focus-visible{outline:2px solid var(--ember);outline-offset:-3px}

/* sheet */
.states{border-top:1px solid var(--line);padding-top:22px}
.grid{display:grid;grid-template-columns:110px repeat(5,1fr);align-items:center;row-gap:16px;column-gap:12px}
.h{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.rl{font-size:12px;color:var(--ink-2)}
.c{display:flex;justify-content:center}
.grid .soft{height:44px;padding:0 20px;font-size:14px;border-radius:15px}
.grid .soft.ico{width:46px;height:46px;padding:0}
.grid .track{width:54px;height:30px}.grid .knob{width:22px;height:22px}
.grid .switch[aria-checked="true"] .knob{transform:translateX(24px)}

@media (max-width:860px){
  .stage{padding:26px 20px;border-radius:28px}
  .live{grid-template-columns:1fr;gap:28px}
  .seg{min-width:0;width:100%}
  .grid{grid-template-columns:repeat(5,1fr);column-gap:4px}
  .grid .rl{grid-column:1/-1;margin-top:4px}
  .grid .corner{display:none}
  .h{font-size:8px;letter-spacing:.04em}
  .grid .soft{padding:0 8px;font-size:12px;height:40px}
  .grid .soft.ico{width:40px;height:40px}
  .grid .track{width:46px;height:26px}.grid .knob{width:18px;height:18px}
  .grid .switch[aria-checked="true"] .knob{transform:translateX(20px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important}
  .soft:active{transform:none}
}
</style>
</head>
<body>
<main class="stage" aria-labelledby="t">
  <header class="top">
    <div>
      <h1 id="t">Kilnhouse</h1>
      <p class="meta">Kiln 2 · Stoneware · target 1,222°C</p>
    </div>
    <p class="status" id="status" data-on="false" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="statusText">Idle · 24°C</span></p>
  </header>

  <div class="live">
    <section aria-labelledby="c1">
      <span class="cap" id="c1">Buttons · L / M / M / S</span>
      <div class="row">
        <button class="soft primary lg" id="fire" type="button"><span class="ember" aria-hidden="true"></span><span>Start firing</span></button>
        <button class="soft" type="button" data-say="Holding at 1,040°C">Hold temp</button>
        <button class="soft" type="button" data-say="Vent opened for 30 s">Vent</button>
        <button class="soft sm" type="button" disabled>Unload</button>
      </div>
      <span class="cap" style="margin-top:26px">Icon toggles · 56px</span>
      <div class="row">
        <button class="soft ico" type="button" aria-label="Chamber light" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
        <button class="soft ico" type="button" aria-label="Exhaust fan" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7 2 0 2.5 3-4 7zM14 12c4 0 7 1 7 4 0 2-3 2.5-7-4zM12 14c0 4-1 7-4 7-2 0-2.5-3 4-7zM10 12c-4 0-7-1-7-4 0-2 3-2.5 7 4z"/></svg></button>
        <button class="soft ico" type="button" aria-label="Lock door" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      </div>
    </section>
    <section aria-labelledby="c2">
      <span class="cap" id="c2">Toggles</span>
      <div class="row">
        <button class="switch" type="button" role="switch" aria-checked="true" id="vent"><span class="track" aria-hidden="true"><span class="knob"></span></span>Auto vent <span class="val" aria-hidden="true">On</span></button>
      </div>
      <div class="row">
        <button class="switch" type="button" role="switch" aria-checked="false"><span class="track" aria-hidden="true"><span class="knob"></span></span>Slow cool <span class="val" aria-hidden="true">Off</span></button>
      </div>
      <span class="cap" id="sg" style="margin-top:26px">Programme</span>
      <div class="seg" role="radiogroup" aria-labelledby="sg">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" role="radio" aria-checked="false" tabindex="-1">Bisque</button>
        <button type="button" role="radio" aria-checked="true" tabindex="0">Glaze</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1">Raku</button>
      </div>
    </section>
  </div>

  <section class="states" aria-labelledby="st">
    <span class="cap" id="st">States</span>
    <p class="vh">Reference sheet showing each control at rest, hovered, pressed, disabled and focused.</p>
    <div class="grid" inert aria-hidden="true">
      <span class="corner"></span><span class="h">Default</span><span class="h">Hover</span><span class="h">Pressed</span><span class="h">Disabled</span><span class="h">Focus</span>
      <span class="rl">Primary</span>
      <span class="c"><button class="soft primary">Fire</button></span>
      <span class="c"><button class="soft primary is-hover">Fire</button></span>
      <span class="c"><button class="soft primary is-pressed">Fire</button></span>
      <span class="c"><button class="soft primary" disabled>Fire</button></span>
      <span class="c"><button class="soft primary is-focus">Fire</button></span>
      <span class="rl">Raised</span>
      <span class="c"><button class="soft">Vent</button></span>
      <span class="c"><button class="soft is-hover">Vent</button></span>
      <span class="c"><button class="soft is-pressed">Vent</button></span>
      <span class="c"><button class="soft" disabled>Vent</button></span>
      <span class="c"><button class="soft is-focus">Vent</button></span>
      <span class="rl">Icon toggle</span>
      <span class="c"><button class="soft ico"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></span>
      <span class="c"><button class="soft ico is-hover"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></span>
      <span class="c"><button class="soft ico" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></span>
      <span class="c"><button class="soft ico" disabled><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></span>
      <span class="c"><button class="soft ico is-focus"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></span>
      <span class="rl">Switch</span>
      <span class="c"><span class="switch" aria-checked="false"><span class="track"><span class="knob"></span></span></span></span>
      <span class="c"><span class="switch is-hover" aria-checked="false"><span class="track"><span class="knob"></span></span></span></span>
      <span class="c"><span class="switch" aria-checked="true"><span class="track"><span class="knob"></span></span></span></span>
      <span class="c"><button class="switch" disabled><span class="track"><span class="knob"></span></span></button></span>
      <span class="c"><span class="switch is-focus" aria-checked="true"><span class="track"><span class="knob"></span></span></span></span>
    </div>
  </section>
</main>
<script>
const statusEl = document.getElementById('status'), statusText = document.getElementById('statusText');
const fire = document.getElementById('fire');
let firing = false, revert;
function say(t, on){ statusText.textContent = t; statusEl.dataset.on = on ? 'true' : 'false'; }
fire.addEventListener('click', () => {
  firing = !firing;
  fire.setAttribute('aria-pressed', firing);
  fire.lastElementChild.textContent = firing ? 'Stop firing' : 'Start firing';
  say(firing ? 'Firing · ramp 150°C/h' : 'Idle · 24°C', firing);
});
document.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => {
  clearTimeout(revert); say(b.dataset.say, true);
  revert = setTimeout(() => say(firing ? 'Firing · ramp 150°C/h' : 'Idle · 24°C', firing), 2400);
}));
document.querySelectorAll('.live .ico').forEach(b => b.addEventListener('click', () =>
  b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true')));
document.querySelectorAll('.live [role="switch"]').forEach(s => s.addEventListener('click', () => {
  const on = s.getAttribute('aria-checked') !== 'true';
  s.setAttribute('aria-checked', on); s.querySelector('.val').textContent = on ? 'On' : 'Off';
}));
const seg = document.querySelector('.seg'), radios = [...seg.querySelectorAll('[role="radio"]')], thumb = seg.querySelector('.thumb');
function pick(i, focus){
  radios.forEach((r, j) => { r.setAttribute('aria-checked', j === i); r.tabIndex = j === i ? 0 : -1; });
  thumb.style.transform = 'translateX(' + (i * 100) + '%)';
  if (focus) radios[i].focus();
}
radios.forEach((r, i) => r.addEventListener('click', () => pick(i)));
seg.addEventListener('keydown', e => {
  const i = radios.indexOf(document.activeElement); if (i < 0) return;
  const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (d) { e.preventDefault(); pick((i + d + 3) % 3, true); }
});
pick(1);
</script>
</body>
</html>
