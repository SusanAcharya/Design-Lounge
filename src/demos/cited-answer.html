<!-- Design Lounge piece: cited-answer · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Answer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--surface:#fffdf8;--ink:#1a1814;--ink-2:#5c564c;--line:#e3ddd2;--primary:#1f4d3a;--soft:#e7f2ec;--serif:Fraunces,Georgia,serif;--sans:"Public Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.card{width:680px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:32px}
h1{font:560 28px/1.2 var(--serif);margin:0 0 12px}
p{margin:0}
.sources{display:flex;gap:8px;margin-top:20px}
.sources button{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font:500 13px var(--sans);cursor:pointer}
.sources button[aria-pressed="true"]{background:var(--soft);border-color:var(--primary);color:var(--primary)}
.quote{margin-top:14px;color:var(--ink-2);min-height:44px}
</style>
</head>
<body>
<article class="card">
  <h1>Twelve loads are still at Gate 4.</h1>
  <p>The night book has not signed them out. A hold older than six hours needs a person.</p>
  <div class="sources" role="group" aria-label="Sources">
    <button type="button" aria-pressed="true" data-q="Night book, 22:00 entry. Gate 4 still holds twelve.">Night book</button>
    <button type="button" aria-pressed="false" data-q="Hold rule. Older than six hours, a person must sign.">Hold rule</button>
  </div>
  <p class="quote" id="q">Night book, 22:00 entry. Gate 4 still holds twelve.</p>
</article>
<script>
const q = document.getElementById('q');
document.querySelectorAll('.sources button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.sources button').forEach((x) => x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  q.textContent = b.dataset.q;
}));
</script>
</body>
</html>
