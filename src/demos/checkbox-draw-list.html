<!-- Design Lounge piece: checkbox-draw-list · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Checkbox draw list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece6d8;--paper:#f8f4ea;--rule:#dcd3c0;--margin:#d98b7a;
  --ink:#1f2a26;--ink-2:#55605a;--ink-3:#8a8f86;--pencil:#c2412d;
  --serif:"Newsreader",Georgia,serif;--sans:"Work Sans",system-ui,sans-serif;
  --row:56px;--gutter:64px;
  --t-draw:280ms;--t-strike:360ms;--t-fast:160ms;--ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 var(--sans);color:var(--ink);background:var(--bg);display:grid;grid-template-columns:400px minmax(0,1fr);gap:0;padding:48px 64px 48px 72px;overflow:hidden;-webkit-font-smoothing:antialiased}
.side{display:flex;flex-direction:column;padding:8px 56px 8px 0}
.brand{font:600 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between}
.brand span{font-weight:400;letter-spacing:.04em;text-transform:none}
h1{font:italic 300 64px/1 var(--serif);letter-spacing:-.02em;margin:48px 0 0;font-variation-settings:"opsz" 72}
.sub{font:400 17px/1.45 var(--serif);color:var(--ink-2);margin:16px 0 0;max-width:300px}
.big{margin-top:auto;display:flex;align-items:flex-end;gap:10px;font-family:var(--serif);font-variation-settings:"opsz" 72;line-height:.8}
.num{font-size:232px;font-weight:300;letter-spacing:-.06em;display:inline-block}
.num.bump{animation:bump 420ms var(--ease-out)}
@keyframes bump{0%{transform:translateY(18px);opacity:.2}100%{transform:none;opacity:1}}
.of{font-size:48px;font-style:italic;color:var(--ink-3);padding-bottom:18px}
.ticks{display:flex;gap:4px;margin:28px 0 14px}
.ticks i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:background var(--t-strike) var(--ease)}
.ticks i.on{background:var(--pencil)}
.note{font-size:14px;color:var(--ink-2);margin:0}
.note b{font-weight:600;color:var(--ink)}
.sheet{background:var(--paper);border-radius:4px;box-shadow:0 1px 0 #d6cdb9,0 2px 0 #e9e2d2,0 3px 0 #d6cdb9,0 24px 40px -24px rgba(60,40,10,.3);position:relative;display:flex;flex-direction:column;min-width:0}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:var(--gutter);width:1px;background:var(--margin);opacity:.7}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:28px 32px 18px calc(var(--gutter) + 24px);border-bottom:1px solid var(--rule)}
.sh h2{margin:0;font:400 26px/1.1 var(--serif);letter-spacing:-.01em}
.sh small{font-size:12px;color:var(--ink-3);letter-spacing:.02em}
ul{list-style:none;margin:0;padding:0}
li{height:var(--row);display:flex;align-items:center;border-bottom:1px solid var(--rule);position:relative}
li label{display:flex;align-items:center;height:100%;flex:1;min-width:0;cursor:pointer}
li input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:var(--gutter);flex:none;display:grid;place-items:center;height:100%}
.box svg{width:24px;height:24px;fill:none;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.box .sq{stroke:var(--ink);stroke-width:1.5;transition:stroke var(--t-fast)}
.box .ck{stroke:var(--pencil);stroke-width:2.4;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset var(--t-draw) var(--ease)}
input:checked+label .ck{stroke-dashoffset:0}
input:checked+label .sq{stroke:var(--ink-3)}
input:focus-visible+label .box svg{outline:2px solid var(--pencil);outline-offset:6px;border-radius:3px}
li:hover .sq{stroke:var(--pencil)}
.t{position:relative;padding-left:24px;font:400 19px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;transition:color var(--t-strike) var(--ease)}
.t s{text-decoration:none;position:relative;display:inline-block}
.t s::after{content:"";position:absolute;left:-3px;right:-3px;top:56%;height:1.5px;background:var(--pencil);transform:scaleX(0);transform-origin:left;transition:transform var(--t-strike) var(--ease) 0ms;border-radius:1px}
input:checked+label .t{color:var(--ink-3)}
input:checked+label .t s::after{transform:scaleX(1);transition-delay:180ms}
.meta{flex:none;margin-left:auto;display:flex;gap:12px;align-items:center;padding:0 32px 0 16px;font-size:12px;color:var(--ink-3)}
.meta em{font-style:normal;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;color:var(--ink-2)}
.add{display:flex;align-items:center;height:var(--row);border-bottom:1px solid var(--rule)}
.add .box svg{stroke:var(--ink-3);stroke-width:1.5}
.add input{flex:1;border:0;background:none;font:italic 400 19px/1.2 var(--serif);color:var(--ink);padding:0 32px 0 24px;height:100%;outline:none}
.add input::placeholder{color:var(--ink-3)}
.add:focus-within{background:rgba(194,65,45,.04)}
.foot{margin-top:auto;padding:16px 32px 18px calc(var(--gutter) + 24px);display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.foot button{font:500 12px var(--sans);color:var(--ink-2);background:none;border:0;padding:4px 0;cursor:pointer;border-bottom:1px solid var(--rule)}
.foot button:hover{color:var(--pencil);border-color:var(--pencil)}
.foot button:focus-visible{outline:2px solid var(--pencil);outline-offset:3px}
li.new{animation:in 360ms var(--ease-out)}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;transition-delay:0ms!important;animation:none!important}}
@media (max-width:1000px){body{grid-template-columns:1fr;overflow:auto;padding:32px}.side{padding:0 0 32px}.num{font-size:140px}}
</style>
</head>
<body>
<aside class="side" aria-label="Progress">
  <div class="brand">Margin<span>Sat 3 Oct</span></div>
  <h1>Before Lisbon</h1>
  <p class="sub">Seven nights in Alfama, 8–15 October. Shared with Inês and Joon.</p>
  <div class="big" aria-hidden="true"><span class="num" id="num">5</span><span class="of" id="of">of 9</span></div>
  <div class="ticks" id="ticks" aria-hidden="true"></div>
  <p class="note" id="note" aria-live="polite"><b>4 left.</b> Flight TP1351 leaves Thursday at 06:40.</p>
</aside>
<main class="sheet">
  <div class="sh"><h2>Packing &amp; errands</h2><small id="sum">5 done · 4 to go</small></div>
  <ul id="list">
    <li><input type="checkbox" id="c1" checked><label for="c1"><span class="box"></span><span class="t"><s>Scan passport and send a copy to Mum</s></span><span class="meta">Docs</span></label></li>
    <li><input type="checkbox" id="c2" checked><label for="c2"><span class="box"></span><span class="t"><s>Book airport transfer for 04:50 pickup</s></span><span class="meta">Travel</span></label></li>
    <li><input type="checkbox" id="c3" checked><label for="c3"><span class="box"></span><span class="t"><s>Ask Inês where the Alfama flat keys are</s></span><span class="meta">Stay</span></label></li>
    <li><input type="checkbox" id="c4"><label for="c4"><span class="box"></span><span class="t"><s>Change €60 into coins for the 28 tram</s></span><span class="meta"><em>Wed</em>Money</span></label></li>
    <li><input type="checkbox" id="c5" checked><label for="c5"><span class="box"></span><span class="t"><s>Download offline map of Lisbon</s></span><span class="meta">Travel</span></label></li>
    <li><input type="checkbox" id="c6"><label for="c6"><span class="box"></span><span class="t"><s>Pack the 35mm and two rolls of Portra 400</s></span><span class="meta"><em>Wed</em>Kit</span></label></li>
    <li><input type="checkbox" id="c7" checked><label for="c7"><span class="box"></span><span class="t"><s>Leave plant-watering notes for Joon</s></span><span class="meta">Home</span></label></li>
    <li><input type="checkbox" id="c8"><label for="c8"><span class="box"></span><span class="t"><s>Print boarding passes</s></span><span class="meta"><em>Thu</em>Docs</span></label></li>
    <li><input type="checkbox" id="c9"><label for="c9"><span class="box"></span><span class="t"><s>Cancel Thursday’s 07:30 pilates</s></span><span class="meta">Home</span></label></li>
  </ul>
  <form class="add" id="add"><span class="box"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span><input id="newtask" maxlength="48" placeholder="Add a task and press Enter" aria-label="New task" autocomplete="off"></form>
  <div class="foot"><span>Ticks draw in red pencil. Click any line.</span><button type="button" id="reset">Untick all</button></div>
</main>
<script>
(function(){
  const list=document.getElementById('list'),num=document.getElementById('num'),of=document.getElementById('of');
  const ticks=document.getElementById('ticks'),note=document.getElementById('note'),sum=document.getElementById('sum');
  const BOX='<svg viewBox="0 0 24 24"><rect class="sq" x="3" y="3" width="18" height="18" rx="3"/><path class="ck" pathLength="1" d="M7 12.5l3.5 3.8L18.5 6"/></svg>';
  function decorate(li){const b=li.querySelector('.box');if(b&&!b.firstChild)b.innerHTML=BOX;}
  list.querySelectorAll('li').forEach(decorate);
  let last=-1;
  function update(){
    const all=[...list.querySelectorAll('input')],done=all.filter(i=>i.checked).length,left=all.length-done;
    if(done!==last&&last>=0){num.classList.remove('bump');void num.offsetWidth;num.classList.add('bump');}
    last=done;num.textContent=done;of.textContent='of '+all.length;
    sum.textContent=done+' done · '+left+' to go';
    ticks.innerHTML=all.map(i=>'<i'+(i.checked?' class="on"':'')+'></i>').join('');
    note.innerHTML=left?'<b>'+left+' left.</b> Flight TP1351 leaves Thursday at 06:40.':'<b>All set.</b> Boa viagem — see you on the 15th.';
  }
  list.addEventListener('change',update);
  let n=10;
  document.getElementById('add').addEventListener('submit',function(e){
    e.preventDefault();const f=document.getElementById('newtask'),v=f.value.trim();if(!v)return;
    const li=document.createElement('li');li.className='new';const id='c'+(n++);
    li.innerHTML='<input type="checkbox" id="'+id+'"><label for="'+id+'"><span class="box"></span><span class="t"><s></s></span><span class="meta">New</span></label>';
    li.querySelector('s').textContent=v;decorate(li);
    if(list.children.length>=10)list.removeChild(list.lastElementChild);
    list.appendChild(li);f.value='';update();
  });
  document.getElementById('reset').addEventListener('click',function(){list.querySelectorAll('input').forEach(i=>{i.checked=false;});update();});
  update();
})();
</script>
</body>
</html>
