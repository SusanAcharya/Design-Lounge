<!-- Design Lounge piece: popover-panel · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Popover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5a554c;--line:#e4dfd4;--line-strong:#cfc6b8;--focus:#1f4d3a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:80px 64px}
.wrap{position:relative;display:inline-block}
#note{height:40px;padding:0 14px;border-radius:2px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 13px/1 var(--sans);cursor:pointer}
#panel{position:absolute;left:0;top:48px;width:280px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:2px}
#panel[hidden]{display:none}
#panel p{margin:0 0 12px}
#close{height:40px;padding:0 14px;border-radius:2px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font:500 13px/1 var(--sans);cursor:pointer}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <button type="button" id="note" aria-expanded="true" aria-controls="panel">Note</button>
  <div id="panel">
    <p>Gate 2 closes at 18:00. The rice moves to Gate 4.</p>
    <button type="button" id="close">Close</button>
  </div>
</div>
<script>
const note = document.getElementById('note');
const panel = document.getElementById('panel');
function open(on){
  panel.hidden = !on;
  note.setAttribute('aria-expanded', on ? 'true' : 'false');
}
note.addEventListener('click', () => open(panel.hidden));
document.getElementById('close').addEventListener('click', () => { open(false); note.focus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') open(false); });
</script>
</body>
</html>
