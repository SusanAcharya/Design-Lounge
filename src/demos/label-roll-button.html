<!-- Design Lounge piece: label-roll-button · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Rolling label row</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3eee4;--ink:#16140f;--muted:#6d675c;--line:#16140f;
  --serif:"Bodoni Moda",Georgia,serif;--font:"Karla",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--t:420ms;--row:176px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.3 var(--font);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.head,.foot{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;flex:none;font:500 13px/1 var(--font);letter-spacing:.12em;text-transform:uppercase}
.head{border-bottom:1px solid var(--line)}
.foot{border-top:1px solid var(--line);color:var(--muted)}
.rows{flex:1;display:flex;flex-direction:column;min-height:0}
.row{flex:1;display:grid;grid-template-columns:72px 1fr 48px;align-items:center;gap:8px;padding:0 36px;border:0;border-bottom:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:left;cursor:pointer;overflow:hidden;font:inherit}
.row:last-child{border-bottom:0}
.row:focus-visible{outline:2px solid var(--paper);outline-offset:-4px}
.idx{font:500 13px/1 var(--font);letter-spacing:.08em;color:var(--muted)}
.win{height:var(--row);overflow:hidden}
.stack{display:block;transition:transform var(--t) var(--ease)}
.line{height:var(--row);display:flex;align-items:center;font:500 64px/1 var(--serif);letter-spacing:-.03em;white-space:nowrap}
.line.alt{font-style:italic;font-weight:500}
.arrow{width:22px;height:22px;justify-self:end;stroke:currentColor;fill:none;stroke-width:1.5;transition:transform var(--t) var(--ease)}
.row.on,.row:hover,.row:focus-visible{background:var(--ink);color:var(--paper)}
.row.on .stack,.row:hover .stack,.row:focus-visible .stack{transform:translateY(calc(var(--row) * -1))}
.row.on .arrow,.row:hover .arrow,.row:focus-visible .arrow{transform:rotate(45deg)}
.row.on .idx,.row:hover .idx,.row:focus-visible .idx{color:#b7b0a4}
@media (prefers-reduced-motion:reduce){
  .stack,.arrow{transition:none}
}
</style>
</head>
<body>
<header class="head"><span>Holt Press</span><span>London, letterpress</span></header>
<div class="rows">
  <button class="row" type="button" aria-pressed="false">
    <span class="idx">01</span>
    <span class="win"><span class="stack"><span class="line">See the cases</span><span class="line alt">Twelve jobs, 2019-2026</span></span></span>
    <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <button class="row on" type="button" aria-pressed="true">
    <span class="idx">02</span>
    <span class="win"><span class="stack"><span class="line">Ask for a quote</span><span class="line alt">Two weeks, one proof</span></span></span>
    <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <button class="row" type="button" aria-pressed="false">
    <span class="idx">03</span>
    <span class="win"><span class="stack"><span class="line">Visit the floor</span><span class="line alt">14 Mercer Street, weekdays</span></span></span>
    <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</div>
<footer class="foot"><span>Est. 1974</span><span>One colour, one press</span></footer>
<script>
(function(){
  var rows = [].slice.call(document.querySelectorAll('.row'));
  rows.forEach(function(row){
    row.addEventListener('click', function(){
      var on = row.classList.contains('on');
      rows.forEach(function(r){ r.classList.remove('on'); r.setAttribute('aria-pressed','false'); });
      if (!on) { row.classList.add('on'); row.setAttribute('aria-pressed','true'); }
    });
  });
})();
</script>
</body>
</html>
