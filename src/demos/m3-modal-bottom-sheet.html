<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernhollow · Filter trails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#e9c16c;--on-primary:#3f2e00;--primary-c:#5b4300;--on-primary-c:#ffdea3;
  --secondary-c:#554529;--on-secondary-c:#f5e0bb;
  --surface:#17130b;--surface-low:#1f1b13;--surface-c:#231f17;--surface-high:#2e2921;--surface-highest:#393428;
  --on-surface:#ebe1d4;--on-surface-v:#d0c5b4;--outline:#998f80;--outline-v:#4d4639;
  --scrim:#000;--scrim-a:.4;
  --f-head:"Fraunces",Georgia,serif;--f-body:"Schibsted Grotesk",system-ui,sans-serif;
  --sheet-top:64px;--r-sheet:28px;--r-card:20px;--r-chip:8px;--r-full:999px;
  --ease-std:cubic-bezier(.2,0,0,1);--ease-decel:cubic-bezier(.05,.7,.1,1);
  --t-ripple:450ms;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--surface);color:var(--on-surface);font:16px/24px var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}

.rp{position:relative;overflow:hidden;isolation:isolate}
.rp::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity 150ms linear;z-index:-1;pointer-events:none;border-radius:inherit}
.rp:hover::before,.rph:hover .rp::before{opacity:.08}
.rp:focus-visible::before,.rph:focus-visible .rp::before{opacity:.1}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:grow var(--t-ripple) var(--ease-std) forwards;pointer-events:none;z-index:-1}
.rpl.out{opacity:0;transition:opacity 300ms linear}
@keyframes grow{to{transform:scale(1)}}

.app{height:100%;display:flex;flex-direction:column}
.top{padding-top:54px;flex:none}
.top-row{height:64px;display:flex;align-items:center;padding:0 4px 0 16px}
.top h1{flex:1;margin:0;font:600 24px/32px var(--f-head);letter-spacing:-.01em}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--on-surface-v)}
.tools{display:flex;align-items:center;gap:12px;padding:0 16px 8px}
.tonal{height:48px;display:flex;align-items:center;background:none}
.tonal .v{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px 0 12px;border-radius:var(--r-full);background:var(--secondary-c);color:var(--on-secondary-c);font:600 14px/20px var(--f-body);letter-spacing:.1px}
.tonal svg{width:18px;height:18px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--primary);color:var(--on-primary);font-size:12px;line-height:20px;font-weight:700;text-align:center}
.badge:empty{display:none}
.count{font-size:14px;line-height:20px;color:var(--on-surface-v)}
.list{flex:1;overflow-y:auto;scrollbar-width:none;list-style:none;margin:0;padding:4px 16px 50px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface-c);border-radius:var(--r-card);padding:16px 18px}
.card h2{margin:0;font:600 19px/24px var(--f-head);letter-spacing:-.005em;display:flex;justify-content:space-between;gap:8px}
.card h2 small{flex:none;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--outline-v);font:600 12px/22px var(--f-body);letter-spacing:.3px;color:var(--on-surface-v)}
.card p{margin:4px 0 0;font-size:14px;line-height:20px;color:var(--on-surface-v)}
.card .ft{color:var(--primary);font-weight:500}
.empty{padding:40px 24px;text-align:center;color:var(--on-surface-v);font-size:14px}

.scrim{position:absolute;inset:0;z-index:5;background:var(--scrim);opacity:0;pointer-events:none;border:0;width:100%;padding:0;cursor:default}
.open .scrim{pointer-events:auto}
.hint{position:absolute;z-index:6;top:0;left:50%;transform:translate(-50%,-100px);height:32px;padding:0 14px;border-radius:var(--r-full);background:var(--surface-highest);color:var(--on-surface);font-size:13px;line-height:32px;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 200ms linear}
.edge{position:absolute;z-index:7;left:8px;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:var(--surface-highest);color:var(--on-surface);display:grid;place-items:center;opacity:0;pointer-events:none}
.edge svg{width:20px;height:20px}

.sheet{position:absolute;z-index:6;left:0;right:0;top:var(--sheet-top);margin:0 auto;max-width:640px;height:calc(100% - var(--sheet-top));background:var(--surface-low);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translateY(110%);transform-origin:50% 100%;visibility:hidden;touch-action:none;box-shadow:0 -1px 0 rgba(255,255,255,.04)}
.sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:inherit}
.open .sheet{visibility:visible}
.grab{height:48px;width:100%;display:flex;justify-content:center;padding-top:22px;cursor:grab;border-radius:var(--r-sheet) var(--r-sheet) 0 0}
.grab i{width:32px;height:4px;border-radius:2px;background:var(--on-surface-v);opacity:.6}
.grab:focus-visible{outline:none}
.grab:focus-visible i{opacity:1;box-shadow:0 0 0 3px var(--surface-low),0 0 0 5px var(--primary)}
.shead{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 12px 4px 24px;cursor:grab}
.shead h2{margin:0;font:600 22px/28px var(--f-head);letter-spacing:-.01em;outline:none}
.tbtn{height:48px;padding:0 12px;border-radius:var(--r-full);font:600 14px/20px var(--f-body);letter-spacing:.1px;color:var(--primary)}
.tbtn:disabled{color:var(--on-surface);opacity:.38;cursor:default}
.sbody{position:absolute;top:100px;left:0;right:0;bottom:0;overflow:hidden;padding:0 0 140px;scrollbar-width:none}
.expanded .sbody{overflow-y:auto}
.sbody h3{margin:0;padding:12px 24px 4px;font:600 13px/20px var(--f-body);letter-spacing:.6px;text-transform:uppercase;color:var(--on-surface-v)}
.chips{display:flex;gap:8px;padding:0 24px}
.chip{height:48px;display:flex;align-items:center;background:none}
.cv{height:32px;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:var(--r-chip);border:1px solid var(--outline);font:500 14px/20px var(--f-body);color:var(--on-surface-v);transition:padding 200ms var(--ease-std)}
.cv svg{width:18px;height:18px;stroke-width:2.2;display:none}
.chip[aria-pressed="true"] .cv{background:var(--secondary-c);color:var(--on-secondary-c);border-color:transparent;padding-left:8px}
.chip[aria-pressed="true"] svg{display:block}
.segs{display:flex;margin:0 24px;height:48px;align-items:center}
.seg{flex:1;height:48px;display:flex;align-items:center;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{flex:1;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--outline);margin-left:-1px;font:500 14px/20px var(--f-body);color:var(--on-surface)}
.seg:first-child span{border-radius:20px 0 0 20px;margin-left:0}.seg:last-child span{border-radius:0 20px 20px 0}
.seg input:checked+span{background:var(--secondary-c);color:var(--on-secondary-c)}
.feat{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 24px;cursor:pointer;color:var(--on-surface)}
.feat>svg{color:var(--on-surface-v)}
.feat span{flex:1}
.feat input{appearance:none;margin:0 3px;flex:none;width:18px;height:18px;border-radius:2px;border:2px solid var(--on-surface-v);display:grid;place-items:center;cursor:pointer;transition:background-color 150ms var(--ease-std),border-color 150ms var(--ease-std)}
.feat input::after{content:"";width:9px;height:5px;border:solid var(--on-primary);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform 150ms var(--ease-std)}
.feat input:checked{background:var(--primary);border-color:var(--primary)}
.feat input:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.feat input:focus-visible,.seg input:focus-visible{outline:none}
.feat:has(input:focus-visible),.seg:has(input:focus-visible) span,.chip:focus-visible .cv,.tonal:focus-visible .v{outline:2px solid var(--primary);outline-offset:2px}
.feat:has(input:focus-visible){outline-offset:-2px}
.chip:focus-visible,.tonal:focus-visible{outline:none}
.tbtn:focus-visible,.icon-btn:focus-visible,.fill:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sfoot{position:absolute;left:0;right:0;bottom:0;padding:12px 24px 42px;background:var(--surface-low);border-top:1px solid var(--outline-v)}
.sfoot p{margin:0 0 8px;font-size:13px;line-height:18px;color:var(--on-surface-v);text-align:center;min-height:18px}
.fill{width:100%;height:56px;border-radius:28px;background:var(--primary);color:var(--on-primary);font:700 16px/24px var(--f-body);letter-spacing:.1px;display:flex;align-items:center;justify-content:center;gap:8px}
.fill:disabled{background:rgba(235,225,212,.12);color:rgba(235,225,212,.38);cursor:default}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}
  .rpl{animation:none;transform:scale(1);opacity:.1}
}
</style>
</head>
<body class="open">
<div class="app" id="app" inert>
  <header class="top">
    <div class="top-row"><h1>Mossgate trails</h1><button class="icon-btn rp" aria-label="Map view"><svg viewBox="0 0 24 24"><path d="M9 4L3 6.5v13L9 17l6 3 6-2.5v-13L15 7zM9 4v13M15 7v13"/></svg></button></div>
    <div class="tools">
      <button class="tonal rph" id="openBtn" aria-haspopup="dialog" aria-controls="sheet"><span class="v rp"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Filters<span class="badge" id="badge"></span></span></button>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </header>
  <ul class="list" id="list"></ul>
</div>

<button class="scrim" id="scrim" tabindex="-1" aria-label="Close filters"></button>
<p class="hint" id="hint" aria-hidden="true">Hold Esc or swipe from the left edge</p>
<div class="edge" id="edge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle">
  <button class="grab" id="grab" aria-label="Expand filters"><i></i></button>
  <div class="shead" id="shead"><h2 id="stitle" tabindex="-1">Filter trails</h2><button class="tbtn rp" id="reset">Reset</button></div>
  <div class="sbody" id="sbody">
    <h3 id="h-diff">Difficulty</h3>
    <div class="chips" role="group" aria-labelledby="h-diff" id="diff">
      <button class="chip rph" aria-pressed="true" data-d="Easy"><span class="cv rp"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Easy</span></button>
      <button class="chip rph" aria-pressed="true" data-d="Moderate"><span class="cv rp"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Moderate</span></button>
      <button class="chip rph" aria-pressed="false" data-d="Hard"><span class="cv rp"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Hard</span></button>
    </div>
    <h3 id="h-len">Length in km</h3>
    <div class="segs" role="radiogroup" aria-labelledby="h-len">
      <label class="seg rph"><input type="radio" name="len" value="any" checked><span class="rp">Any</span></label>
      <label class="seg rph"><input type="radio" name="len" value="s"><span class="rp">Under 5</span></label>
      <label class="seg rph"><input type="radio" name="len" value="m"><span class="rp">5 to 10</span></label>
      <label class="seg rph"><input type="radio" name="len" value="l"><span class="rp">Over 10</span></label>
    </div>
    <h3>Features</h3>
    <div id="feats">
      <label class="feat rp"><svg viewBox="0 0 24 24"><circle cx="6.5" cy="10.5" r="1.7"/><circle cx="10" cy="6.5" r="1.7"/><circle cx="14" cy="6.5" r="1.7"/><circle cx="17.5" cy="10.5" r="1.7"/><path d="M12 12c-2.6 0-5 3.4-5 5.6 0 1.4 1.1 2 2.4 2 1.1 0 1.6-.6 2.6-.6s1.5.6 2.6.6c1.3 0 2.4-.6 2.4-2 0-2.2-2.4-5.6-5-5.6z"/></svg><span>Dog friendly</span><input type="checkbox" value="dog" checked></label>
      <label class="feat rp"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2M20 4v4h-4"/></svg><span>Loop trail</span><input type="checkbox" value="loop"></label>
      <label class="feat rp"><svg viewBox="0 0 24 24"><path d="M3 15c2 0 2-1.5 4.5-1.5S10 15 12 15s2-1.5 4.5-1.5S19 15 21 15M3 19c2 0 2-1.5 4.5-1.5S10 19 12 19s2-1.5 4.5-1.5S19 19 21 19M12 4v7"/></svg><span>Waterfall or river</span><input type="checkbox" value="water"></label>
      <label class="feat rp"><svg viewBox="0 0 24 24"><path d="M12 3l6 9h-3l4 6H5l4-6H6zM12 18v3"/></svg><span>Mostly shaded</span><input type="checkbox" value="shade"></label>
      <label class="feat rp"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><path d="M12 8v6h5l2 5M12 11h4M9.5 11.5a5 5 0 105.8 7.3"/></svg><span>Step-free sections</span><input type="checkbox" value="step"></label>
      <label class="feat rp"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="3"/><path d="M5 11h14M8 21v-3.5M16 21v-3.5M8.5 14.5h.01M15.5 14.5h.01"/></svg><span>Reachable by bus</span><input type="checkbox" value="bus"></label>
    </div>
  </div>
  <div class="sfoot" id="sfoot"><p id="help" aria-live="polite"></p><button class="fill" id="apply">Show trails</button></div>
</section>

<script>
const T=[
  ['Otter Pool loop',4.2,120,'Easy',['dog','loop','water']],
  ['Mossgate woods walk',2.6,60,'Easy',['shade','dog','step','loop']],
  ['Old quarry line',3.1,40,'Easy',['step','bus','loop']],
  ['Heron Reach',4.8,90,'Easy',['water','loop','dog']],
  ['Saltmarsh boardwalk',5.4,10,'Easy',['step','bus']],
  ['Bellwether falls path',6.5,280,'Moderate',['water','dog','shade']],
  ['Tanner\u2019s Beck',7.2,300,'Moderate',['water','shade']],
  ['Gorse Hill circuit',8.4,390,'Moderate',['loop','dog']],
  ['Ravenscar scramble',9.7,810,'Hard',['water']],
  ['Cobbler\u2019s Edge',10.4,520,'Moderate',['loop','shade']],
  ['Harrow Beacon ridge',11.8,640,'Hard',['bus']],
  ['Long Mynde traverse',14.6,720,'Hard',['bus','dog']]
];
const FN={dog:'Dog friendly',loop:'Loop',water:'River',shade:'Shaded',step:'Step-free',bus:'Bus'};
const $=s=>document.getElementById(s);
const hint=$('hint'),body=document.body,app=$('app'),sheet=$('sheet'),sfoot=$('sfoot'),sbody=$('sbody'),scrim=$('scrim'),edge=$('edge'),grab=$('grab'),applyBtn=$('apply');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
let applied={d:[],len:'any',f:[]};

function current(){return{d:[...document.querySelectorAll('#diff [aria-pressed="true"]')].map(b=>b.dataset.d),len:document.querySelector('[name=len]:checked').value,f:[...document.querySelectorAll('#feats input:checked')].map(i=>i.value)}}
function match(t,q){
  const k=t[1];
  return(!q.d.length||q.d.includes(t[3]))&&(q.len==='any'||(q.len==='s'&&k<5)||(q.len==='m'&&k>=5&&k<=10)||(q.len==='l'&&k>10))&&q.f.every(f=>t[4].includes(f));
}
function dur(t){const h=t[1]/4.5+t[2]/600,m=Math.round(h*60/5)*5;return m>=60?`${Math.floor(m/60)} h ${m%60?m%60+' min':''}`.trim():m+' min'}
function renderList(){
  const r=T.filter(t=>match(t,applied));
  $('list').innerHTML=r.length?r.map(t=>`<li class="card"><h2>${t[0]}<small>${t[3]}</small></h2><p>${t[1].toFixed(1)} km · ${t[2]} m up · ${dur(t)}</p><p class="ft">${t[4].map(f=>FN[f]).join(' · ')}</p></li>`).join(''):'<li class="empty">No trails match these filters.</li>';
  $('count').textContent=`${r.length} of ${T.length} trails · nearest first`;
  const n=applied.d.length+(applied.len!=='any')+applied.f.length;$('badge').textContent=n||'';
}
function update(){
  const n=T.filter(t=>match(t,current())).length;
  applyBtn.disabled=!n;
  applyBtn.textContent=n?`Show ${n} trail${n>1?'s':''}`:'No trails match';
  $('help').textContent=n?'':'Try removing a feature or widening the length.';
}
$('diff').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b||dragged)return;b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));update()});
sbody.addEventListener('change',update);
$('reset').addEventListener('click',()=>{document.querySelectorAll('#diff .chip').forEach(b=>b.setAttribute('aria-pressed','false'));document.querySelector('[name=len][value=any]').checked=true;document.querySelectorAll('#feats input').forEach(i=>i.checked=false);update()});
applyBtn.addEventListener('click',()=>{applied=current();renderList();dismiss(0)});

/* geometry + render */
const TOP=64;let H,sheetH,yP,yH,y,pb=0,isOpen=true,anim=0,pbAnim=0;
function geo(){H=innerHeight;sheetH=H-TOP;yP=sheetH-Math.round(Math.min(H*.62,sheetH));yH=sheetH+24}
function render(){
  sheet.style.transform=`translateY(${y}px) scale(${1-.1*pb},${1-.04*pb})`;
  sfoot.style.transform=`translateY(${-Math.min(y,yP)}px)`;
  const f=Math.max(0,Math.min(1,(yH-y)/(yH-yP)));
  scrim.style.opacity=(f*.4*(1-.35*pb)).toFixed(3);
  hint.style.transform=`translate(-50%,${TOP+y-48}px)`;hint.style.opacity=isOpen&&y>yP-60&&!pb?1:0;
  edge.style.opacity=pb.toFixed(3);edge.style.transform=`translateX(${pb*12}px) scale(${.6+.4*pb})`;
}
function setState(s){
  sheet.classList.toggle('expanded',s==='expanded');
  grab.setAttribute('aria-label',s==='expanded'?'Collapse filters to half height':'Expand filters');
}
function springTo(target,v0,k,z,done){
  cancelAnimationFrame(anim);
  if(reduce.matches){y=target;render();done&&done();return}
  let v=v0*1000,t0=performance.now();const c=2*z*Math.sqrt(k);
  const step=now=>{
    const dt=Math.min(.064,(now-t0)/1000);t0=now;const n=Math.max(1,Math.ceil(dt/.004)),h=dt/n;
    for(let i=0;i<n;i++){v+=(-k*(y-target)-c*v)*h;y+=v*h}
    render();
    if(Math.abs(y-target)<.5&&Math.abs(v)<12){y=target;render();anim=0;done&&done();return}
    anim=requestAnimationFrame(step);
  };
  anim=requestAnimationFrame(step);
}
function settle(target,v){
  if(target>=yH){dismiss(v);return}
  setState(target===0?'expanded':'partial');
  springTo(target,v,380,.78);
}
function openSheet(){
  geo();isOpen=true;body.classList.add('open');app.inert=true;pb=0;
  if(y===undefined||y>=yH)y=yH;
  setState('partial');springTo(yP,0,380,.82);
  $('stitle').focus({preventScroll:true});
}
function dismiss(v){
  isOpen=false;app.inert=false;
  springTo(yH,Math.max(v||0,0),520,1,()=>{body.classList.remove('open');pb=0;render();$('openBtn').focus({preventScroll:true})});
}
$('openBtn').addEventListener('click',openSheet);
scrim.addEventListener('click',()=>{if(isOpen)dismiss(0)});
grab.addEventListener('click',()=>{if(dragged)return;settle(sheet.classList.contains('expanded')?yP:0,0)});

/* drag */
let drag=null,dragged=false;
function startDrag(e){drag={y0:e.clientY,s0:y,pts:[[e.timeStamp,e.clientY]],id:e.pointerId,live:false,el:e.currentTarget}}
function onDown(e){if(!isOpen||back||e.button>0)return;if(e.currentTarget===sbody&&sheet.classList.contains('expanded')&&sbody.scrollTop>0)return;dragged=false;startDrag(e)}
[grab,$('shead'),sbody].forEach(el=>el.addEventListener('pointerdown',onDown));
addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dy=e.clientY-drag.y0;
  if(!drag.live){
    if(Math.abs(dy)<6)return;
    if(drag.el===sbody&&sheet.classList.contains('expanded')&&dy<0){drag=null;return}
    drag.live=true;dragged=true;cancelAnimationFrame(anim);
  }
  let ny=drag.s0+dy;if(ny<0)ny=-Math.sqrt(-ny)*4;
  y=ny;render();
  drag.pts.push([e.timeStamp,e.clientY]);if(drag.pts.length>6)drag.pts.shift();
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;if(!d.live)return;
  const a=d.pts[0],b=d.pts[d.pts.length-1],v=b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0]):0;
  const proj=y+v*180;
  const tgt=[0,yP,yH].reduce((p,c)=>Math.abs(c-proj)<Math.abs(p-proj)?c:p);
  settle(tgt,v);
  setTimeout(()=>{dragged=false},0);
}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
sheet.addEventListener('click',e=>{if(dragged){e.stopPropagation();e.preventDefault()}},true);
sbody.addEventListener('wheel',e=>{if(!sheet.classList.contains('expanded')&&e.deltaY>0){e.preventDefault();settle(0,0)}},{passive:false});

/* predictive back */
let back=null;
function tweenPb(to,ms,done){
  cancelAnimationFrame(pbAnim);
  if(reduce.matches){pb=to;render();done&&done();return}
  const from=pb,t0=performance.now();
  const step=now=>{const t=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-t,3);pb=from+(to-from)*e;render();if(t<1)pbAnim=requestAnimationFrame(step);else done&&done()};
  pbAnim=requestAnimationFrame(step);
}
function commitBack(){back=null;dismiss(.4)}
addEventListener('keydown',e=>{
  if(e.key!=='Escape'||!isOpen)return;e.preventDefault();
  if(e.repeat||back)return;back='key';tweenPb(1,260);
});
addEventListener('keyup',e=>{if(e.key==='Escape'&&back==='key'){cancelAnimationFrame(pbAnim);commitBack()}});
addEventListener('pointerdown',e=>{
  if(!isOpen||e.clientX>24||e.button>0)return;
  e.stopPropagation();e.preventDefault();back={x0:e.clientX,id:e.pointerId};
},true);
addEventListener('pointermove',e=>{if(!back||back.id!==e.pointerId)return;pb=Math.max(0,Math.min(1,(e.clientX-back.x0)/(innerWidth*.45)));render()},true);
addEventListener('pointerup',e=>{if(!back||back.id!==e.pointerId)return;if(pb>.4)commitBack();else{back=null;tweenPb(0,200)}},true);
addEventListener('resize',()=>{geo();if(isOpen){y=sheet.classList.contains('expanded')?0:yP;render()}});

/* ripple */
function pick(t){const h=t.closest('.rph');return h?h.querySelector('.rp'):t.closest('.rp')}
function ripple(el,x,yy){
  const r=el.getBoundingClientRect();
  if(x==null){x=r.left+r.width/2;yy=r.top+r.height/2}
  const s=2*Math.hypot(Math.max(x-r.left,r.right-x),Math.max(yy-r.top,r.bottom-yy));
  const d=document.createElement('span');d.className='rpl';
  d.style.cssText=`width:${s}px;height:${s}px;left:${x-r.left-s/2}px;top:${yy-r.top-s/2}px`;
  el.appendChild(d);
  return()=>{d.classList.add('out');setTimeout(()=>d.remove(),320)};
}
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;const el=pick(e.target);if(!el)return;
  const end=ripple(el,e.clientX,e.clientY);
  const up=()=>{end();removeEventListener('pointerup',up);removeEventListener('pointercancel',up);removeEventListener('pointermove',mv)};
  const mv=()=>{if(dragged)up()};
  addEventListener('pointerup',up);addEventListener('pointercancel',up);addEventListener('pointermove',mv);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&!e.repeat){const el=pick(e.target);if(el){const end=ripple(el);setTimeout(end,160)}}
});

renderList();update();geo();y=yP;setState('partial');render();
</script>
