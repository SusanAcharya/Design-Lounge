<!-- Design Lounge piece: widget-world-clocks · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Tandem · Meeting planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ecebe5;--card:#f7f6f1;--ink:#141414;--ink-2:#5f5e58;--rule:#cfcdc4;
  --night:#1b1c21;--night-ink:#9c9b94;--shoulder:#c9c7bd;--day:#f7f6f1;
  --accent:#2441d6;--accent-soft:#dfe3fa;
  --sans:"Familjen Grotesk",system-ui,sans-serif;--mono:"Martian Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --cols:208px 168px 1fr;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 var(--sans);color:var(--ink);background:var(--paper);display:grid;place-items:center;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.planner{width:min(1100px,100% - 48px);background:var(--card);border:1px solid var(--rule)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:28px 32px 24px;border-bottom:1px solid var(--ink)}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.mark i{width:14px;height:14px;background:var(--accent);display:block}
h1{margin:14px 0 0;font-size:44px;line-height:1;font-weight:700;letter-spacing:-.035em}
.when{text-align:right}
.when-big{font:500 28px/1 var(--mono);letter-spacing:-.04em}
.when-sub{margin-top:8px;font-size:13px;color:var(--ink-2);display:flex;gap:12px;justify-content:flex-end;align-items:center}
.reset{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:0 12px;min-height:32px;border:1px solid var(--ink);transition:background-color 160ms var(--ease),color 160ms var(--ease)}
.reset:hover{background:var(--ink);color:var(--card)}
.reset[aria-disabled="true"]{opacity:.35;pointer-events:none}

.list{position:relative;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:var(--cols);align-items:center;gap:0 24px;padding:12px 32px;border-bottom:1px solid var(--rule);transition:background-color 200ms var(--ease)}
.row.work{background:linear-gradient(90deg,var(--accent-soft),transparent 40%)}
.city{font-size:21px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.meta{margin-top:4px;font:400 10.5px var(--mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.time{font:500 30px/1 var(--mono);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.day{margin-top:6px;font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tag{font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 5px;border:1px solid currentColor}
.state{color:var(--ink-2)}
.row.work .state{color:var(--accent)}
.band{display:grid;grid-template-columns:repeat(24,1fr);height:40px;cursor:ew-resize;touch-action:none;user-select:none}
.band span{display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 4px 3px;font:400 9px var(--mono);border-right:1px solid rgba(20,20,20,.08);background:var(--day);color:var(--ink-2)}
.band span.n{background:var(--night);color:var(--night-ink);border-color:rgba(255,255,255,.05)}
.band span.s{background:var(--shoulder);color:#3f3e39}
.band span.w{box-shadow:inset 0 -3px 0 var(--accent);color:var(--ink)}
.band span.d{font-weight:500;color:inherit}
.band span.n.d{color:#e6e5de}
.band{position:relative}
.bc{display:none;position:absolute;top:-4px;bottom:-4px;left:var(--x);width:2px;margin-left:-1px;background:var(--accent)}

.overlay{position:absolute;top:0;bottom:0;pointer-events:none}
.cursor{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);transition:left 120ms var(--ease)}
.cursor::before{content:"";position:absolute;top:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--accent)}
.now{position:absolute;top:0;bottom:0;border-left:1px dashed var(--ink);opacity:.45}
.dragging .cursor{transition:none}

.scrub{display:grid;grid-template-columns:var(--cols);gap:0 24px;align-items:center;padding:20px 32px 24px}
.scrub label{grid-column:1/3;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.summary{margin:0;padding:16px 32px;border-top:1px solid var(--ink);font-size:14px;display:flex;justify-content:space-between;gap:16px}
.summary b{font-weight:700}
.legend{display:flex;gap:14px;font:400 10.5px var(--mono);color:var(--ink-2);text-transform:uppercase}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border:1px solid var(--rule)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px calc(100%/24)),var(--rule);background-size:100% 10px,100% 2px;background-repeat:no-repeat;background-position:0 50%,0 50%}
input[type=range]::-moz-range-track{height:2px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-10px;background:var(--accent);border:3px solid var(--card);box-shadow:0 0 0 1px var(--accent);transition:transform 160ms var(--ease)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--accent);border:3px solid var(--card);border-radius:0}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:focus-visible{outline-offset:-2px}

@media (max-width:760px){
  :root{--cols:1fr auto}
  .head{flex-direction:column;align-items:flex-start;padding:20px}
  .when{text-align:left}.when-sub{justify-content:flex-start}
  h1{font-size:34px}
  .row{padding:12px 20px;gap:8px 12px}
  .band{grid-column:1/-1;height:32px}
  .overlay{display:none}.bc{display:block}
  .band span{font-size:0;padding:0}
  .band span.d{font-size:8px}
  .time{font-size:24px;text-align:right}.day{justify-content:flex-end}
  .scrub{padding:16px 20px;gap:8px}.scrub label{grid-column:1/-1}.scrub input{grid-column:1/-1}
  .summary{flex-direction:column;padding:14px 20px}.legend{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="planner" aria-labelledby="title">
  <header class="head">
    <div>
      <div class="mark"><i aria-hidden="true"></i>Tandem</div>
      <h1 id="title">Find a time</h1>
    </div>
    <div class="when">
      <div class="when-big" id="whenBig">Now</div>
      <div class="when-sub"><span id="whenSub">Live, ticking</span><button class="reset" id="reset" type="button" aria-disabled="true">Back to now</button></div>
    </div>
  </header>
  <ul class="list" id="list"></ul>
  <div class="scrub">
    <label for="slider">Drag to scrub · 15 min steps</label>
    <input type="range" id="slider" min="0" max="96" step="1" aria-describedby="summaryText">
  </div>
  <p class="summary">
    <span id="summaryText" aria-live="polite"></span>
    <span class="legend" aria-hidden="true"><span><i style="background:var(--day);box-shadow:inset 0 -3px 0 var(--accent)"></i>Work 9–18</span><span><i style="background:var(--shoulder)"></i>Edge</span><span><i style="background:var(--night)"></i>Night</span></span>
  </p>
</section>
<script>
const CITIES = [
  ['San Francisco','America/Los_Angeles'],
  ['New York','America/New_York'],
  ['Lisbon','Europe/Lisbon'],
  ['Berlin','Europe/Berlin'],
  ['Kathmandu','Asia/Kathmandu'],
  ['Tokyo','Asia/Tokyo']
];
const H = 3600e3, STEP = 15 * 60e3;
const $ = s => document.querySelector(s);
const list = $('#list'), slider = $('#slider');
const pad = n => String(n).padStart(2, '0');
const fmts = {};
function parts(tz, t) {
  const f = fmts[tz] ||= new Intl.DateTimeFormat('en-GB', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'short', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', timeZoneName: 'shortOffset' });
  const o = {}; for (const p of f.formatToParts(t)) o[p.type] = p.value;
  return { h: +o.hour, m: +o.minute, wd: o.weekday, day: +o.day, mon: o.month, off: o.timeZoneName.replace('GMT', 'UTC') || 'UTC', key: o.year + o.month + o.day };
}
const kind = h => (h < 6 || h >= 22) ? 'n' : (h < 8 || h >= 19) ? 's' : '';
const working = h => h >= 9 && h < 18;

const start = Math.floor(Date.now() / H) * H - 6 * H;
let offsetSteps = null;

const rows = CITIES.map(([name, tz]) => {
  const li = document.createElement('li');
  li.className = 'row';
  li.innerHTML = `<div><div class="city">${name}</div><div class="meta"></div></div>
    <div><div class="time"></div><div class="day"></div></div>
    <div class="band" aria-hidden="true">${'<span></span>'.repeat(24)}<i class="bc"></i></div>`;
  list.append(li);
  const cells = [...li.querySelectorAll('.band span')];
  cells.forEach((c, i) => {
    const p = parts(tz, start + i * H + 1);
    const cls = [kind(p.h)];
    if (working(p.h)) cls.push('w');
    if (p.h === 0) { cls.push('d'); c.textContent = p.wd; } else c.textContent = p.h;
    c.className = cls.filter(Boolean).join(' ');
  });
  return { li, tz, name, meta: li.querySelector('.meta'), time: li.querySelector('.time'), day: li.querySelector('.day') };
});
const overlay = document.createElement('div');
overlay.className = 'overlay';
overlay.innerHTML = '<div class="now"></div><div class="cursor"></div>';
list.append(overlay);
const cursorEl = overlay.querySelector('.cursor'), nowEl = overlay.querySelector('.now');

function layout() {
  const band = rows[0].li.querySelector('.band').getBoundingClientRect();
  const box = list.getBoundingClientRect();
  overlay.style.left = (band.left - box.left) + 'px';
  overlay.style.width = band.width + 'px';
}
const pct = t => Math.min(100, Math.max(0, (t - start) / (24 * H) * 100));
const nowSteps = () => Math.round((Date.now() - start) / STEP);

let lastSummary = '';
function render() {
  const live = offsetSteps === null;
  const steps = live ? nowSteps() : offsetSteps;
  const t = live ? Date.now() : start + steps * STEP;
  slider.value = Math.min(96, steps);
  cursorEl.style.left = pct(t) + '%';
  nowEl.style.left = pct(Date.now()) + '%';
  const base = parts('UTC', t);
  let inWork = [];
  const homeKey = parts(Intl.DateTimeFormat().resolvedOptions().timeZone, t).key;
  list.style.setProperty('--x', pct(t) + '%');
  for (const r of rows) {
    const p = parts(r.tz, t);
    r.meta.textContent = p.off;
    r.time.textContent = pad(p.h) + ':' + pad(p.m);
    const st = working(p.h) ? 'Working' : kind(p.h) === 'n' ? 'Asleep' : p.h < 9 ? 'Morning' : 'Evening';
    const dayDiff = p.key !== homeKey ? `<span class="tag">${p.key > homeKey ? '+1 day' : '−1 day'}</span>` : '';
    r.day.innerHTML = `${p.wd} ${p.day} ${p.mon} · <span class="state">${st}</span>${dayDiff}`;
    r.li.classList.toggle('work', working(p.h));
    if (working(p.h)) inWork.push(r.name);
  }
  const diff = Math.round((t - Date.now()) / 60e3);
  const ah = Math.floor(Math.abs(diff) / 60), am = Math.abs(diff) % 60;
  $('#whenBig').textContent = `${pad(base.h)}:${pad(base.m)} UTC`;
  $('#whenSub').textContent = live || Math.abs(diff) < 1 ? 'Live, now' : `${diff > 0 ? '+' : '−'}${ah ? ah + ' h ' : ''}${am ? am + ' min' : ''}`.trim() + (diff > 0 ? ' from now' : ' ago');
  $('#reset').setAttribute('aria-disabled', String(live));
  slider.setAttribute('aria-valuetext', `${pad(base.h)}:${pad(base.m)} UTC, ${inWork.length} of ${rows.length} cities working`);
  const s = inWork.length === rows.length ? `<b>Everyone is in working hours.</b>`
    : inWork.length ? `<span><b>${inWork.length} of ${rows.length}</b> in working hours: ${inWork.join(', ')}.</span>`
    : `<b>No one is in working hours.</b> Try another slot.`;
  if (s !== lastSummary) { $('#summaryText').innerHTML = s; lastSummary = s; }
}

function setFromX(x) {
  const r = rows[0].li.querySelector('.band').getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (x - r.left) / r.width));
  offsetSteps = Math.round(f * 96);
  render();
}
list.addEventListener('pointerdown', e => {
  if (!e.target.closest('.band')) return;
  e.preventDefault();
  list.setPointerCapture(e.pointerId);
  list.classList.add('dragging');
  setFromX(e.clientX);
  const move = ev => setFromX(ev.clientX);
  const up = () => { list.classList.remove('dragging'); list.removeEventListener('pointermove', move); list.removeEventListener('pointerup', up); list.removeEventListener('pointercancel', up); };
  list.addEventListener('pointermove', move);
  list.addEventListener('pointerup', up);
  list.addEventListener('pointercancel', up);
});
slider.addEventListener('input', () => { offsetSteps = +slider.value; render(); });
$('#reset').addEventListener('click', () => { offsetSteps = null; render(); slider.focus(); });
addEventListener('resize', layout);
layout(); render();
document.fonts && document.fonts.ready.then(layout);
setInterval(render, 1000);
</script>
</body>
</html>
