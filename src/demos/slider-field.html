<!-- Design Lounge piece: slider-field · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Slider field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--ink:#161513;--ink-2:#5a554c;--ink-3:#5c564e;--line-strong:#cfc6b8;
  --primary:#1f4d3a;--focus:#1f4d3a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
.where{margin:0 0 16px;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
.field{width:320px;display:flex;flex-direction:column;gap:6px}
.head{display:flex;justify-content:space-between;align-items:baseline}
label{font:500 12px/1 var(--sans);color:var(--ink-2)}
output{font:500 14px/1 var(--sans);font-variant-numeric:tabular-nums}
input{appearance:none;-webkit-appearance:none;width:320px;height:40px;margin:0;background:transparent}
input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input::-webkit-slider-runnable-track{height:4px;background:var(--line-strong);border-radius:2px}
input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border:0;border-radius:50%;background:var(--primary)}
input::-moz-range-track{height:4px;background:var(--line-strong);border-radius:2px;border:0}
input::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--primary)}
.hint{margin:0;font-size:12px;color:var(--ink-3)}
</style>
</head>
<body>
<p class="where">Dock</p>
<div class="field">
  <div class="head">
    <label for="hour">Arrival</label>
    <output id="out" for="hour">16:00</output>
  </div>
  <input id="hour" type="range" min="8" max="18" step="1" value="16" aria-valuemin="8" aria-valuemax="18" aria-valuenow="16" aria-valuetext="16:00">
  <p class="hint">Between 08:00 and 18:00. The dock closes after.</p>
</div>
<script>
const hour = document.getElementById('hour');
const out = document.getElementById('out');
function paint(){
  const n = String(hour.value).padStart(2, '0');
  const text = n + ':00';
  out.textContent = text;
  hour.setAttribute('aria-valuenow', hour.value);
  hour.setAttribute('aria-valuetext', text);
}
hour.addEventListener('input', paint);
</script>
</body>
</html>
