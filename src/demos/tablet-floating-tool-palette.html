<!-- Design Lounge piece: tablet-floating-tool-palette · platform: tablet · 1180x820 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plotter — Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eaee;--dot:#cfd2d9;--panel:#1f2126;--panel-2:#2a2d34;--line:#3a3e47;--ink:#f3f4f6;--ink-2:#9ea3ad;--ink-3:#6b7079;--canvas-ink:#1f2126;
  --accent:#0ea5e9;--accent-ink:#ffffff;
  --c1:#1f2126;--c2:#0ea5e9;--c3:#ef4444;--c4:#f59e0b;--c5:#22c55e;--c6:#a855f7;
  --sans:"Space Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --w-pal:56px;--btn:44px;--r:14px;--r-btn:10px;--r-pill:999px;
  --shadow-pal:0 12px 32px rgba(31,33,38,.28),0 1px 2px rgba(31,33,38,.3);--shadow-pop:0 10px 30px rgba(31,33,38,.22);
  --t-fast:140ms;--t-layout:260ms;--ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--sans);color:var(--canvas-ink);background:var(--bg);overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;touch-action:none}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;cursor:pointer;background:transparent;border:0;padding:0}
#c{position:absolute;inset:0;width:100%;height:100%;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px;cursor:crosshair;display:block}
.chip{position:absolute;left:20px;top:20px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;background:var(--panel);color:var(--ink);border-radius:var(--r-pill);font:600 13px var(--sans);box-shadow:var(--shadow-pal)}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--accent)}
.chip span{font:400 12px var(--mono);color:var(--ink-2)}
.status{position:absolute;right:20px;bottom:20px;font:400 12px var(--mono);color:var(--ink-3);display:flex;gap:16px}
.status b{font-weight:500;color:var(--canvas-ink)}
.pal{position:absolute;left:28px;top:150px;width:var(--w-pal);background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow-pal);padding:6px;display:flex;flex-direction:column;gap:2px;color:var(--ink-2);user-select:none;-webkit-user-select:none;touch-action:none;z-index:5;transition:box-shadow var(--t-fast)}
.pal.drag{box-shadow:0 22px 48px rgba(31,33,38,.36),0 1px 2px rgba(31,33,38,.3);cursor:grabbing}
.grip{height:22px;display:grid;place-items:center;cursor:grab;color:var(--ink-3);border-radius:6px}
.grip:hover{color:var(--ink-2)}
.grip:focus-visible,.tool:focus-visible,.sw:focus-visible,.swatch:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grip svg{width:16px;height:16px}
.tools{position:relative;display:flex;flex-direction:column;gap:2px}
.ind{position:absolute;left:0;top:0;width:var(--btn);height:var(--btn);border-radius:var(--r-btn);background:var(--accent);transition:transform var(--t-layout) var(--ease-out);z-index:0}
.tool{position:relative;z-index:1;width:var(--btn);height:var(--btn);border-radius:var(--r-btn);display:grid;place-items:center;color:var(--ink-2);transition:color var(--t-fast)}
.tool:hover{color:var(--ink);background:var(--panel-2)}
.tool[aria-pressed="true"]{color:var(--accent-ink);background:transparent}
.tool .kbd{position:absolute;right:4px;bottom:3px;font:500 8px var(--mono);opacity:.7}
.sep{height:1px;background:var(--line);margin:4px 6px}
.sw{width:var(--btn);height:var(--btn);border-radius:var(--r-btn);display:grid;place-items:center;position:relative}
.sw:hover{background:var(--panel-2)}
.sw i{width:22px;height:22px;border-radius:50%;background:var(--cur,var(--c1));box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line);transition:transform var(--t-fast) var(--ease-out)}
.sw[aria-expanded="true"] i{transform:scale(1.1)}
.act{width:var(--btn);height:var(--btn);border-radius:var(--r-btn);display:grid;place-items:center;color:var(--ink-2)}
.act:hover{color:var(--ink);background:var(--panel-2)}
.pop{position:absolute;left:calc(100% + 12px);top:0;width:200px;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow-pop);padding:12px;opacity:0;transform:translateX(-6px) scale(.98);transform-origin:left center;pointer-events:none;transition:opacity var(--t-fast),transform var(--t-layout) var(--ease-out);z-index:6;visibility:hidden}
.pop.on{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.pop::before{content:"";position:absolute;left:-5px;top:18px;width:10px;height:10px;background:var(--panel);transform:rotate(45deg);border-radius:2px}
.pop h6{margin:0 0 8px;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.swatch{width:24px;height:24px;border-radius:50%;background:var(--v);position:relative;transition:transform var(--t-fast) var(--ease-out)}
.swatch:hover{transform:scale(1.12)}
.swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border:2px solid var(--ink);border-radius:50%}
.pop label{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--ink-2);margin-bottom:6px}
.pop input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:20px}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="Drawing canvas: draw with the pointer" role="img"></canvas>
<div class="chip"><i></i>Plotter<span>untitled-03.plot</span></div>
<div class="status" aria-live="polite"><span>tool <b id="st">Pen</b></span><span>size <b id="ss">3</b></span><span>zoom <b>100%</b></span></div>
<div class="pal" id="pal" role="toolbar" aria-label="Tools" aria-orientation="vertical">
  <div class="grip" id="grip" tabindex="0" aria-label="Move palette (arrow keys)"><svg viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></svg></div>
  <div class="tools" id="tools"><div class="ind" id="ind"></div>
    <button class="tool" data-t="select" aria-pressed="false" aria-label="Select (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><span class="kbd">V</span></button>
    <button class="tool" data-t="pen" aria-pressed="true" aria-label="Pen (P)"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3"/></svg><span class="kbd">P</span></button>
    <button class="tool" data-t="marker" aria-pressed="false" aria-label="Marker (M)"><svg viewBox="0 0 24 24"><path d="M6 20h12M8 16l7-11 3 2-7 11H8z"/></svg><span class="kbd">M</span></button>
    <button class="tool" data-t="eraser" aria-pressed="false" aria-label="Eraser (E)"><svg viewBox="0 0 24 24"><path d="M4 16l9-9 6 6-6 6H8zM6 20h14"/></svg><span class="kbd">E</span></button>
    <button class="tool" data-t="line" aria-pressed="false" aria-label="Line (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg><span class="kbd">L</span></button>
  </div>
  <div class="sep"></div>
  <button class="sw" id="sw" aria-expanded="false" aria-haspopup="dialog" aria-label="Colour and size"><i id="swi"></i></button>
  <div class="sep"></div>
  <button class="act" id="undo" aria-label="Undo (Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h9a7 7 0 010 14h-2"/></svg></button>
  <button class="act" id="clear" aria-label="Clear canvas"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  <div class="pop" id="pop" role="dialog" aria-label="Colour and size">
    <h6>Colour</h6><div class="swatches" id="swatches"></div>
    <label for="size">Stroke <span id="sv">3 px</span></label><input type="range" id="size" min="1" max="24" value="3">
  </div>
</div>
<script>
  const cv=document.getElementById('c'),ctx=cv.getContext('2d'),pal=document.getElementById('pal'),ind=document.getElementById('ind'),tools=[...document.querySelectorAll('.tool')],pop=document.getElementById('pop'),sw=document.getElementById('sw'),size=document.getElementById('size');
  const COLS=['#1f2126','#0ea5e9','#ef4444','#f59e0b','#22c55e','#a855f7'];let tool='pen',col=COLS[0],w=3,hist=[];
  let ready=false;function fit(){const d=devicePixelRatio||1,snap=ready?ctx.getImageData(0,0,cv.width,cv.height):null;ready=true;cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);if(snap)ctx.putImageData(snap,0,0);}
  fit();addEventListener('resize',fit);
  function seed(){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0ea5e9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(420,300);ctx.bezierCurveTo(520,180,640,420,760,300);ctx.stroke();
    ctx.strokeStyle='#1f2126';ctx.lineWidth=10;ctx.globalAlpha=.4;ctx.beginPath();ctx.moveTo(440,470);ctx.lineTo(720,470);ctx.stroke();ctx.restore();}
  seed();
  function setTool(t){tool=t;tools.forEach((b,i)=>{const on=b.dataset.t===t;b.setAttribute('aria-pressed',String(on));if(on)ind.style.transform=`translateY(${i*46}px)`;});document.getElementById('st').textContent=t[0].toUpperCase()+t.slice(1);cv.style.cursor=t==='select'?'default':'crosshair';}
  tools.forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.t)));setTool('pen');
  const swatches=document.getElementById('swatches');COLS.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.setProperty('--v',c);b.setAttribute('aria-pressed',String(c===col));b.setAttribute('aria-label','Colour '+c);b.addEventListener('click',()=>{col=c;[...swatches.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('swi').style.setProperty('--cur',c);});swatches.appendChild(b);});
  size.addEventListener('input',()=>{w=+size.value;document.getElementById('sv').textContent=w+' px';document.getElementById('ss').textContent=w;});
  function openPop(o){pop.classList.toggle('on',o);sw.setAttribute('aria-expanded',String(o));if(o)swatches.querySelector('[aria-pressed="true"]').focus();}
  sw.addEventListener('click',()=>openPop(!pop.classList.contains('on')));
  addEventListener('pointerdown',e=>{if(pop.classList.contains('on')&&!pop.contains(e.target)&&e.target!==sw&&!sw.contains(e.target))openPop(false);});
  let drawing=false,x0=0,y0=0,snap=null;
  cv.addEventListener('pointerdown',e=>{if(tool==='select')return;cv.setPointerCapture(e.pointerId);drawing=true;hist.push(ctx.getImageData(0,0,cv.width,cv.height));if(hist.length>20)hist.shift();x0=e.clientX;y0=e.clientY;
    ctx.lineCap='round';ctx.lineJoin='round';ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.globalAlpha=tool==='marker'?.4:1;ctx.strokeStyle=col;ctx.lineWidth=tool==='marker'?w*3:tool==='eraser'?w*4:w;
    if(tool==='line')snap=ctx.getImageData(0,0,cv.width,cv.height);else{ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+.01,y0);ctx.stroke();}});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;if(tool==='line'){ctx.putImageData(snap,0,0);ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(e.clientX,e.clientY);ctx.stroke();return;}
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(e.clientX,e.clientY);ctx.stroke();x0=e.clientX;y0=e.clientY;});
  const stop=()=>{drawing=false;snap=null;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';};cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
  document.getElementById('undo').addEventListener('click',()=>{const s=hist.pop();if(s)ctx.putImageData(s,0,0);});
  document.getElementById('clear').addEventListener('click',()=>{hist.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.clearRect(0,0,cv.width,cv.height);});
  const grip=document.getElementById('grip');let gx=0,gy=0,px=0,py=0;
  const place=(x,y)=>{pal.style.left=Math.max(8,Math.min(innerWidth-pal.offsetWidth-8,x))+'px';pal.style.top=Math.max(8,Math.min(innerHeight-pal.offsetHeight-8,y))+'px';};
  grip.addEventListener('pointerdown',e=>{grip.setPointerCapture(e.pointerId);pal.classList.add('drag');gx=e.clientX;gy=e.clientY;px=pal.offsetLeft;py=pal.offsetTop;});
  grip.addEventListener('pointermove',e=>{if(!pal.classList.contains('drag'))return;place(px+e.clientX-gx,py+e.clientY-gy);});
  grip.addEventListener('pointerup',()=>pal.classList.remove('drag'));grip.addEventListener('pointercancel',()=>pal.classList.remove('drag'));
  grip.addEventListener('keydown',e=>{const d={ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]}[e.key];if(d){e.preventDefault();place(pal.offsetLeft+d[0],pal.offsetTop+d[1]);}});
  addEventListener('keydown',e=>{if(e.target.matches('input'))return;const k=e.key.toLowerCase();const m={v:'select',p:'pen',m:'marker',e:'eraser',l:'line'};if(m[k]&&!e.metaKey&&!e.ctrlKey)setTool(m[k]);if(k==='z')document.getElementById('undo').click();if(k==='escape')openPop(false);});
</script>
</body>
</html>
