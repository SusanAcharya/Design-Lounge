<!-- Design Lounge piece: loader-spinner-set · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Whirl — Spinner specimen, vol. 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13120f;--tile:#1a1814;--tile-2:#211f1a;--line:#2d2a24;--line-2:#433f37;
  --ink:#ece6d8;--ink-2:#b3ab9b;--ink-3:#8a8374;--accent:#ff5b2e;--focus:#ff5b2e;
  --display:"Unbounded",system-ui,sans-serif;--mono:"Azeret Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --size:48px;--color:var(--accent);--speed:1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono);display:flex;flex-direction:column;min-height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header{display:flex;align-items:flex-end;gap:24px;padding:28px 40px 20px;border-bottom:1px solid var(--line)}
.mark{font:700 13px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.mark i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;display:inline-block}
h1{margin:10px 0 0;font:500 40px/1 var(--display);letter-spacing:-.03em}
h1 em{font-style:normal;color:var(--accent)}
.meta{margin-left:auto;text-align:right;color:var(--ink-3);font-size:12px;line-height:1.7}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px;padding:14px 40px;border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:12px}
.ctl label,.ctl .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.ctl output{min-width:44px;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:140px;height:24px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(var(--ink-2),var(--ink-2)) 0/var(--p,50%) 100% no-repeat,var(--line-2)}
input[type=range]::-moz-range-track{height:2px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:2px;background:var(--ink-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink-2)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}
input[type=range]:focus-visible{outline-offset:4px}
.sw{display:flex;gap:6px}
.sw button{width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);position:relative}
.sw button[aria-checked=true]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--ink)}
.pause{margin-left:auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;font-size:12px;transition:border-color .16s var(--ease)}
.pause:hover{border-color:var(--ink-2)}
.pause svg{width:14px;height:14px;fill:currentColor}

.grid{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(220px,1fr);border-left:1px solid var(--line)}
.tile{position:relative;display:flex;flex-direction:column;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--tile);transition:background .2s var(--ease)}
.tile:hover{background:var(--tile-2)}
.tile .no{position:absolute;top:16px;left:18px;font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.tile .name{position:absolute;top:13px;right:18px;font:500 13px/1 var(--display);letter-spacing:-.01em}
.stage{flex:1;display:grid;place-items:center;min-height:120px}
.copy{display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;padding:0 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);text-align:left;width:100%;transition:color .16s var(--ease),background .16s var(--ease)}
.copy:hover{color:var(--ink);background:rgba(236,230,216,.03)}
.copy svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.copy .ok{display:none;color:var(--accent)}
.copy.done .ok{display:inline}
.copy.done .cls,.copy.done .ic{display:none}

/* ---------- spinners ---------- */
.sp{--s:var(--size);--c:var(--color);--k:var(--speed);width:var(--s);height:var(--s);position:relative;color:var(--c);flex:none}
.sp,.sp *{animation-play-state:var(--play,running)}
body.paused{--play:paused}

/* 01 arc */
.sp-arc svg{width:100%;height:100%;animation:spin calc(1.4s / var(--k)) linear infinite}
.sp-arc circle{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 150;animation:arc calc(1.4s / var(--k)) var(--ease) infinite}
.sp-arc .tr{stroke:currentColor;opacity:.16;stroke-dasharray:none;animation:none}
@keyframes arc{0%{stroke-dasharray:1 150;stroke-dashoffset:0}50%{stroke-dasharray:90 150;stroke-dashoffset:-35}100%{stroke-dasharray:90 150;stroke-dashoffset:-124}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 02 dots */
.sp-dots{display:flex;align-items:center;justify-content:space-between}
.sp-dots i{width:22%;height:22%;border-radius:50%;background:currentColor;animation:dot calc(1s / var(--k)) var(--ease) infinite;animation-delay:calc(var(--i) * .14s / var(--k))}
@keyframes dot{0%,80%,100%{transform:translateY(0) scale(.7);opacity:.35}35%{transform:translateY(-70%) scale(1);opacity:1}}

/* 03 bars */
.sp-bars{display:flex;align-items:center;justify-content:space-between}
.sp-bars i{width:12%;height:100%;border-radius:2px;background:currentColor;transform-origin:center;animation:bar calc(1.1s / var(--k)) var(--ease) infinite;animation-delay:calc(var(--i) * .1s / var(--k))}
@keyframes bar{0%,60%,100%{transform:scaleY(.3);opacity:.4}25%{transform:scaleY(1);opacity:1}}

/* 04 pulse */
.sp-pulse i{position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;animation:pulse calc(1.8s / var(--k)) var(--ease-out) infinite;animation-delay:calc(var(--i) * .6s / var(--k))}
.sp-pulse b{position:absolute;inset:38%;border-radius:50%;background:currentColor}
@keyframes pulse{0%{transform:scale(.3);opacity:1}100%{transform:scale(1);opacity:0}}

/* 05 square morph */
.sp-morph i{position:absolute;inset:18%;background:currentColor;animation:morph calc(1.6s / var(--k)) cubic-bezier(.76,0,.24,1) infinite}
@keyframes morph{0%{transform:rotate(0) scale(1);border-radius:8%}25%{transform:rotate(90deg) scale(.6);border-radius:50%}50%{transform:rotate(180deg) scale(1);border-radius:8%}75%{transform:rotate(270deg) scale(.6);border-radius:50%}100%{transform:rotate(360deg) scale(1);border-radius:8%}}

/* 06 ring segments */
.sp-seg i{position:absolute;left:46%;top:0;width:8%;height:28%;border-radius:999px;background:currentColor;transform-origin:50% 178.5%;transform:rotate(calc(var(--i) * 45deg));opacity:.15;animation:seg calc(.96s / var(--k)) linear infinite;animation-delay:calc((var(--i) - 8) * .12s / var(--k))}
@keyframes seg{0%{opacity:1}100%{opacity:.15}}

/* 07 clock */
.sp-clock{border-radius:50%;border:2px solid currentColor}
.sp-clock i{position:absolute;left:calc(50% - 1px);bottom:50%;width:2px;border-radius:2px;background:currentColor;transform-origin:50% 100%}
.sp-clock .h{height:26%;animation:spin calc(6s / var(--k)) linear infinite}
.sp-clock .m{height:38%;animation:spin calc(.75s / var(--k)) linear infinite}
.sp-clock b{position:absolute;inset:calc(50% - 2px);border-radius:50%;background:currentColor}

/* 08 infinity */
.sp-inf{width:calc(var(--s) * 1.8)}
.sp-inf svg{width:100%;height:100%;overflow:visible}
.sp-inf path{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round}
.sp-inf .tr{opacity:.16}
.sp-inf .run{stroke-dasharray:42 158;animation:inf calc(1.6s / var(--k)) linear infinite}
@keyframes inf{to{stroke-dashoffset:-200}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .sp *, .sp svg, .sp circle, .sp path{animation:fade 2.4s ease-in-out infinite !important;animation-delay:0s !important}
  .sp-arc circle{stroke-dasharray:70 150}
  .sp-seg i{opacity:.5}
  @keyframes fade{0%,100%{opacity:1}50%{opacity:.45}}
  .tile,.copy{transition:none}
}
@media (max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:32px}}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:200px}.meta{display:none}}
@media (max-width:640px){
  header{padding:20px 16px 16px}h1{font-size:24px}
  .controls{padding:12px 16px;gap:10px 20px}
  input[type=range]{width:96px}
  .pause{margin-left:0}
  .grid{grid-auto-rows:176px}
  .copy{padding:0 12px;font-size:11px}
  .tile .no{left:12px}.tile .name{right:12px;font-size:12px}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="mark"><i aria-hidden="true"></i>Whirl</div>
    <h1>Spinner specimen, <em>vol.&nbsp;1</em></h1>
  </div>
  <p class="meta">8 spinners · pure CSS<br>one colour · one speed dial</p>
</header>

<section class="controls" aria-label="Spinner controls">
  <div class="ctl">
    <label for="size">Size</label>
    <input id="size" type="range" min="16" max="72" step="4" value="48">
    <output id="sizeOut" for="size">48px</output>
  </div>
  <div class="ctl">
    <span class="lab" id="colLab">Colour</span>
    <div class="sw" role="radiogroup" aria-labelledby="colLab">
      <button type="button" role="radio" aria-checked="true" style="--c:#ff5b2e" data-c="#FF5B2E" aria-label="Signal orange"></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" style="--c:#ece6d8" data-c="#ECE6D8" aria-label="Chalk"></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" style="--c:#c9e265" data-c="#C9E265" aria-label="Pear"></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" style="--c:#7cb7ff" data-c="#7CB7FF" aria-label="Sky"></button>
    </div>
  </div>
  <div class="ctl">
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1">
    <output id="speedOut" for="speed">1.00×</output>
  </div>
  <button class="pause" id="pause" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><span>Pause all</span>
  </button>
</section>

<main class="grid" id="grid" aria-label="Spinners"></main>
<p class="sr" id="live" aria-live="polite"></p>

<script>
const SPIN = [
  ['arc','<svg viewBox="0 0 50 50"><circle class="tr" cx="25" cy="25" r="20"/><circle cx="25" cy="25" r="20"/></svg>'],
  ['dots','<i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>'],
  ['bars',[0,1,2,3,4].map(i=>`<i style="--i:${i}"></i>`).join('')],
  ['pulse','<i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><b></b>'],
  ['morph','<i></i>'],
  ['segments',[0,1,2,3,4,5,6,7].map(i=>`<i style="--i:${i}"></i>`).join('')],
  ['clock','<i class="h"></i><i class="m"></i><b></b>'],
  ['infinity','<svg viewBox="0 0 90 50"><path class="tr" d="M45 25c-8-10-14-15-22-15a15 15 0 0 0 0 30c8 0 14-5 22-15s14-15 22-15a15 15 0 0 1 0 30c-8 0-14-5-22-15z"/><path class="run" pathLength="200" d="M45 25c-8-10-14-15-22-15a15 15 0 0 0 0 30c8 0 14-5 22-15s14-15 22-15a15 15 0 0 1 0 30c-8 0-14-5-22-15z"/></svg>']
];
const cls = n => n === 'segments' ? 'seg' : n === 'infinity' ? 'inf' : n;
const grid = document.getElementById('grid'), live = document.getElementById('live');
const root = document.documentElement.style;
const state = { size: 48, color: '#FF5B2E', speed: 1 };

grid.innerHTML = SPIN.map(([n, inner], i) => `
  <article class="tile">
    <span class="no">${String(i + 1).padStart(2, '0')}</span>
    <h2 class="name" style="margin:0">${n}</h2>
    <div class="stage"><span class="sp sp-${cls(n)}" role="img" aria-label="${n} spinner">${inner}</span></div>
    <button class="copy" type="button" data-n="${n}" aria-label="Copy CSS for spin-${n}">
      <span class="cls">.spin-${n}</span><span class="ok">Copied</span>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/></svg>
    </button>
  </article>`).join('');

function fill(el) { el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%'); }
const size = document.getElementById('size'), speed = document.getElementById('speed');
size.addEventListener('input', () => { state.size = +size.value; root.setProperty('--size', size.value + 'px'); document.getElementById('sizeOut').value = size.value + 'px'; fill(size); });
speed.addEventListener('input', () => { state.speed = +speed.value; root.setProperty('--speed', speed.value); document.getElementById('speedOut').value = (+speed.value).toFixed(2) + '×'; fill(speed); });
fill(size); fill(speed);

const sw = [...document.querySelectorAll('.sw button')];
function pick(b, focus) {
  sw.forEach(x => { x.setAttribute('aria-checked', x === b); x.tabIndex = x === b ? 0 : -1; });
  state.color = b.dataset.c; root.setProperty('--color', b.dataset.c);
  if (focus) b.focus();
}
sw.forEach((b, i) => {
  b.addEventListener('click', () => pick(b));
  b.addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (d) { e.preventDefault(); pick(sw[(i + d + sw.length) % sw.length], true); }
  });
});

const pause = document.getElementById('pause');
pause.addEventListener('click', () => {
  const on = document.body.classList.toggle('paused');
  pause.setAttribute('aria-pressed', on);
  pause.querySelector('span').textContent = on ? 'Play all' : 'Pause all';
  pause.querySelector('path').setAttribute('d', on ? 'M8 5v14l11-7z' : 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z');
});

function writeClip(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(() => legacy(text));
  return Promise.resolve(legacy(text));
}
function legacy(text) {
  const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', '');
  t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); } catch (e) {} t.remove();
}
grid.addEventListener('click', e => {
  const b = e.target.closest('.copy'); if (!b) return;
  const n = b.dataset.n;
  const css = `.spin-${n} { --size: ${state.size}px; --color: ${state.color}; --speed: ${state.speed}; }`;
  writeClip(css).then(() => {
    b.classList.add('done'); live.textContent = `Copied .spin-${n} at ${state.size}px, ${state.speed}× speed`;
    clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('done'), 1400);
  });
});
</script>
</body>
</html>
