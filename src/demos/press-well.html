<!-- Design Lounge piece: press-well · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Press</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--ink:#161513;--ink-2:#5a554c;--primary:#1f4d3a;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px var(--sans);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--primary);outline-offset:4px}
.well{background:#e7e1d6;border-radius:10px;padding:6px 6px 10px;box-shadow:inset 0 2px 0 #fff, inset 0 -4px 0 #cfc6b8}
button{height:52px;min-width:180px;padding:0 22px;border:0;border-radius:6px;background:#1f4d3a;color:#fffdf8;font:600 15px var(--sans);cursor:pointer;transition:transform 120ms cubic-bezier(0.2,0.7,0.2,1)}
button:active{transform:translateY(4px)}
.out{margin:16px 0 0;min-height:22px;text-align:center;color:var(--ink-2);font-size:14px}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div>
  <div class="well"><button type="button" id="go">Open the gate</button></div>
  <p class="out" id="out" aria-live="polite"></p>
</div>
<script>
document.getElementById('go').addEventListener('click', () => {
  document.getElementById('out').textContent = 'Gate 4 opened on this page.';
});
</script>
</body>
</html>
