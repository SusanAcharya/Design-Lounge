<!-- Design Lounge piece: date-range-picker · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Date range picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--hover:#eef0f3;--line:#e4e7ec;--line-2:#cbd0d8;
  --ink:#14171c;--ink-2:#4e5561;--ink-3:#8a919d;--accent:#0f766e;--accent-ink:#f0fdfa;--range:#e3f3f0;--range-2:#c9e8e2;
  --font:"Schibsted Grotesk",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;
  --cell:36px;--presets-w:150px;--r:8px;--r-pop:12px;
  --t-fast:120ms;--t-open:180ms;--ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --shadow:0 1px 2px rgba(20,23,28,.05),0 20px 48px -16px rgba(20,23,28,.22),0 0 0 1px var(--line);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--font);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{height:56px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:20px;padding:0 28px}
.top b{font-weight:600}
.top nav{display:flex;gap:18px;color:var(--ink-3);font-size:13px}.top nav span:first-child{color:var(--ink)}
main{padding:36px 28px}
h1{margin:0 0 4px;font:400 36px/1.1 var(--serif);letter-spacing:-.01em}
.sub{margin:0 0 24px;color:var(--ink-3)}
.bar{display:flex;gap:10px;align-items:center;position:relative}
.trig{height:38px;padding:0 12px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r);font:500 13px var(--font);color:var(--ink);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.trig:hover{border-color:var(--ink-3)}
.trig:focus-visible,.pre:focus-visible,.nav:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.trig .v{font-variant-numeric:tabular-nums}
.ghost{height:38px;padding:0 12px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--ink-3);display:inline-flex;align-items:center;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,180px);gap:12px;margin-top:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.stat b{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* popover */
.pop{position:absolute;top:46px;left:0;background:var(--panel);border-radius:var(--r-pop);box-shadow:var(--shadow);display:flex;z-index:5;transform-origin:top left;opacity:0;transform:scale(.97) translateY(-4px);visibility:hidden;transition:opacity var(--t-open) var(--ease),transform var(--t-open) var(--ease-out),visibility 0s var(--t-open)}
.pop.open{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.presets{width:var(--presets-w);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.pre{all:unset;display:block;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.pre:hover{background:var(--hover);color:var(--ink)}
.pre[aria-pressed="true"]{background:var(--range);color:var(--accent);font-weight:500}
.cal{padding:16px 16px 12px}
.pills{display:flex;gap:8px;margin-bottom:14px}
.pill{flex:1;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);font-size:13px;font-variant-numeric:tabular-nums}
.pill span{color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pill.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--range)}
.pill i{font-style:normal;color:var(--ink-3)}
.months{display:flex;gap:24px}
.month{width:calc(var(--cell)*7)}
.mh{display:flex;align-items:center;justify-content:space-between;height:32px;margin-bottom:6px}
.mh b{font-weight:600;font-size:14px}
.nav{all:unset;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.nav:hover{background:var(--hover)}
.nav[hidden]{visibility:hidden;display:grid}
.dow{display:grid;grid-template-columns:repeat(7,var(--cell));font-size:11px;font-weight:600;color:var(--ink-3);text-align:center;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,var(--cell));grid-auto-rows:var(--cell)}
.d{all:unset;display:grid;place-items:center;font-size:13px;color:var(--ink);cursor:pointer;position:relative;font-variant-numeric:tabular-nums;border-radius:0}
.d::before{content:"";position:absolute;inset:2px;border-radius:50%;z-index:-1}
.d{isolation:isolate}
.d:hover::before{background:var(--hover)}
.d.in{background:var(--range)}
.d.start{border-radius:18px 0 0 18px}.d.end{border-radius:0 18px 18px 0}
.d.start.end{border-radius:18px}
.d.start::before,.d.end::before{background:var(--accent)}
.d.start,.d.end{color:var(--accent-ink);font-weight:600}
.d.start:hover::before,.d.end:hover::before{background:#0c5f59}
.d.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.d.out{color:var(--ink-3)}
.d:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:50%}
.pop .foot{display:flex;align-items:center;gap:8px;padding-top:12px;margin-top:8px;border-top:1px solid var(--line)}
.pop .foot .hint{font-size:12px;color:var(--ink-3);margin-right:auto}
.btn{height:34px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel);font:500 13px var(--font);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#0c5f59}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<header class="top"><b>Kestrel</b><nav><span>Sessions</span><span>Funnels</span><span>Retention</span><span>Exports</span></nav></header>
<main>
  <h1>Sessions report</h1>
  <p class="sub">Compare traffic across a custom window. Times are Europe/Oslo.</p>
  <div class="bar">
    <button class="trig" id="trig" aria-haspopup="dialog" aria-expanded="true" aria-controls="pop"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="v" id="label">12 Sep 2026 – 25 Sep 2026</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <span class="ghost">Compare to: previous period</span>
    <div class="pop open" id="pop" role="dialog" aria-label="Choose a date range" aria-modal="false">
      <div class="presets" id="presets">
        <button class="pre" data-p="today">Today</button><button class="pre" data-p="yesterday">Yesterday</button><button class="pre" data-p="7">Last 7 days</button><button class="pre" data-p="30">Last 30 days</button><button class="pre" data-p="month">This month</button><button class="pre" data-p="lastmonth">Last month</button><button class="pre" data-p="custom" aria-pressed="true">Custom</button>
      </div>
      <div class="cal">
        <div class="pills"><div class="pill" id="pS"><span>Start</span><i id="sTxt">—</i></div><div class="pill" id="pE"><span>End</span><i id="eTxt">—</i></div></div>
        <div class="months" id="months"></div>
        <div class="foot"><span class="hint">Arrow keys move · PgUp/PgDn change month</span><button class="btn" id="cancel" type="button">Cancel</button><button class="btn primary" id="apply" type="button">Apply</button></div>
      </div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><small>Sessions</small><b>184,220</b></div><div class="stat"><small>Unique visitors</small><b>92,314</b></div><div class="stat"><small>Avg. duration</small><b>4m 12s</b></div><div class="stat"><small>Bounce rate</small><b>38.4 %</b></div>
  </div>
</main>
<script>
const TODAY=new Date(2026,8,29),DAY=864e5,MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const D=(y,m,d)=>new Date(y,m,d),ts=d=>+D(d.getFullYear(),d.getMonth(),d.getDate());
const fmt=d=>d?d.getDate()+' '+MON[d.getMonth()].slice(0,3)+' '+d.getFullYear():'—';
let base=D(2026,8,1),start=D(2026,8,12),end=D(2026,8,25),hover=null,applied=[start,end],focusT=ts(start);
const pop=document.getElementById('pop'),trig=document.getElementById('trig'),months=document.getElementById('months');
function render(){
  months.innerHTML='';
  const lo=start?ts(start):null,hi=end?ts(end):(hover&&start&&hover>ts(start)?hover:null);
  for(let k=0;k<2;k++){
    const m=D(base.getFullYear(),base.getMonth()+k,1),first=(m.getDay()+6)%7,days=D(m.getFullYear(),m.getMonth()+1,0).getDate();
    const el=document.createElement('div');el.className='month';el.setAttribute('role','group');el.setAttribute('aria-label',MON[m.getMonth()]+' '+m.getFullYear());
    el.innerHTML=`<div class="mh"><button class="nav" data-n="-1" aria-label="Previous month" ${k?'hidden':''}><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b>${MON[m.getMonth()]} ${m.getFullYear()}</b><button class="nav" data-n="1" aria-label="Next month" ${k?'':'hidden'}><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div><div class="dow"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div class="grid"></div>`;
    const g=el.querySelector('.grid');
    for(let i=0;i<first;i++)g.appendChild(document.createElement('span'));
    for(let d=1;d<=days;d++){const t=+D(m.getFullYear(),m.getMonth(),d),b=document.createElement('button');b.type='button';b.className='d';b.textContent=d;b.dataset.t=t;b.tabIndex=t===focusT?0:-1;
      b.setAttribute('aria-label',fmt(new Date(t)));
      if(t===ts(TODAY))b.classList.add('today');if(t>ts(TODAY))b.classList.add('out');
      if(lo!==null&&t===lo)b.classList.add('start');if(hi!==null&&t===hi)b.classList.add('end');
      if(lo!==null&&hi!==null&&t>lo&&t<hi)b.classList.add('in');
      if(b.classList.contains('start')||b.classList.contains('end'))b.setAttribute('aria-pressed','true');
      g.appendChild(b);}
    months.appendChild(el);
  }
  document.getElementById('sTxt').textContent=fmt(start);document.getElementById('eTxt').textContent=fmt(end);
  document.getElementById('pS').classList.toggle('active',!start);document.getElementById('pE').classList.toggle('active',!!start&&!end);
}
function pick(t){const d=new Date(t);if(!start||end){start=d;end=null;}else if(t<ts(start)){end=start;start=d;}else end=d;hover=null;preset('custom');focusT=t;render();}
function preset(p){document.querySelectorAll('.pre').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===p)));}
function focusDate(t){const d=new Date(t),m0=base.getMonth()+base.getFullYear()*12,m=d.getMonth()+d.getFullYear()*12;if(m<m0)base=D(d.getFullYear(),d.getMonth(),1);else if(m>m0+1)base=D(d.getFullYear(),d.getMonth()-1,1);focusT=t;render();const b=months.querySelector(`[data-t="${t}"]`);if(b)b.focus();}
months.addEventListener('click',e=>{const n=e.target.closest('.nav');if(n){base=D(base.getFullYear(),base.getMonth()+ +n.dataset.n,1);render();months.querySelector(`[data-n="${n.dataset.n}"]`).focus();return;}const d=e.target.closest('.d');if(d)pick(+d.dataset.t);});
months.addEventListener('mouseover',e=>{const d=e.target.closest('.d');if(d&&start&&!end){hover=+d.dataset.t;render();}});
months.addEventListener('mouseleave',()=>{if(hover){hover=null;render();}});
months.addEventListener('keydown',e=>{const d=e.target.closest('.d');if(!d)return;const t=+d.dataset.t,dt=new Date(t),wd=(dt.getDay()+6)%7;let nt=null;
  if(e.key==='ArrowLeft')nt=t-DAY;else if(e.key==='ArrowRight')nt=t+DAY;else if(e.key==='ArrowUp')nt=t-7*DAY;else if(e.key==='ArrowDown')nt=t+7*DAY;
  else if(e.key==='Home')nt=t-wd*DAY;else if(e.key==='End')nt=t+(6-wd)*DAY;
  else if(e.key==='PageUp'||e.key==='PageDown')nt=+D(dt.getFullYear(),dt.getMonth()+(e.key==='PageUp'?-1:1),Math.min(dt.getDate(),28));
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(t);return;}
  if(nt===null)return;e.preventDefault();if(start&&!end)hover=nt;focusDate(nt);
});
document.getElementById('presets').addEventListener('click',e=>{const b=e.target.closest('.pre');if(!b)return;const p=b.dataset.p,T=ts(TODAY);preset(p);
  if(p==='today')[start,end]=[TODAY,TODAY];else if(p==='yesterday')[start,end]=[new Date(T-DAY),new Date(T-DAY)];else if(p==='7'||p==='30')[start,end]=[new Date(T-(p-1)*DAY),TODAY];
  else if(p==='month')[start,end]=[D(2026,8,1),D(2026,8,30)];else if(p==='lastmonth')[start,end]=[D(2026,7,1),D(2026,7,31)];else return;
  base=D(start.getFullYear(),start.getMonth(),1);focusT=ts(start);render();});
function open(){pop.classList.add('open');trig.setAttribute('aria-expanded','true');render();const f=months.querySelector('[tabindex="0"]');if(f)f.focus();}
function close(){pop.classList.remove('open');trig.setAttribute('aria-expanded','false');trig.focus();}
document.getElementById('apply').addEventListener('click',()=>{if(start&&end){applied=[start,end];document.getElementById('label').textContent=fmt(start)+' – '+fmt(end);close();}});
document.getElementById('cancel').addEventListener('click',()=>{[start,end]=applied;close();});
trig.addEventListener('click',()=>pop.classList.contains('open')?close():open());
pop.addEventListener('keydown',e=>{if(e.key==='Escape'){[start,end]=applied;close();}});
render();
</script>
</body>
</html>
