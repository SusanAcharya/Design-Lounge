<!-- Design Lounge piece: widget-compass · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Tarnline — Field compass widget</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece4cf;--contour:#cdbf9b;--contour-2:#b5a47a;--ink:#1d3428;--ink-2:#2b4a39;
  --cream:#f4eedd;--cream-2:#b8c3ad;--orange:#e5562a;--line:rgba(244,238,221,.14);
  --display:"Saira Condensed","Arial Narrow",sans-serif;--mono:"Martian Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);--r-widget:34px
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 12px/1.5 var(--mono);display:grid;place-items:center;overflow:hidden}
.topo{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.topo path{fill:none;stroke:var(--contour);stroke-width:1}
.topo path.idx{stroke:var(--contour-2);stroke-width:1.6}
.topo text{font:400 9px var(--mono);fill:var(--contour-2);letter-spacing:.08em}
main{position:relative;display:grid;justify-items:center;gap:20px;padding:16px}
.widget{width:min(380px,calc(100vw - 32px));background:var(--ink);color:var(--cream);border-radius:var(--r-widget);padding:20px 22px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 #142419,0 34px 60px -28px rgba(29,52,40,.6)}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-2)}
.top b{font-weight:500;color:var(--cream)}
.dialwrap{position:relative;margin:14px auto 6px;width:100%;max-width:300px;aspect-ratio:1;touch-action:none;cursor:grab;border-radius:50%;user-select:none;-webkit-user-select:none}
.dialwrap.dragging{cursor:grabbing}
.dialwrap:focus-visible{outline:2px solid var(--orange);outline-offset:6px}
.dialwrap svg{display:block;width:100%;height:100%;overflow:visible}
.bezel{fill:var(--cream)}
.tick{stroke:var(--ink);stroke-width:1}
.tick.maj{stroke-width:2}
.num{font:500 11px var(--mono);fill:var(--ink-2);text-anchor:middle;dominant-baseline:central}
.car{font:700 24px var(--display);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.car.n{fill:var(--orange)}
.ring{fill:none;stroke:var(--ink);stroke-opacity:.18}
.vial{fill:#e3dcc7;stroke:var(--ink);stroke-opacity:.35}
.cross{stroke:var(--ink);stroke-opacity:.3}
.bubble{fill:var(--ink)}
.bubble.level{fill:#2f7a4f}
.lubber{fill:var(--orange)}
.target{fill:var(--orange)}
.read{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4px 14px;margin-top:6px}
.deg{font:600 68px/0.9 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.deg sup{font-size:.42em;vertical-align:.95em;margin-left:2px;color:var(--orange)}
.card{font:600 26px/1 var(--display);letter-spacing:.04em}
.card small{display:block;font:400 10px/1.4 var(--mono);letter-spacing:.06em;color:var(--cream-2);margin-top:6px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:16px;border-top:1px solid var(--line)}
.stats div{padding:10px 0 0;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-2)}
.stats div+div{padding-left:12px;border-left:1px solid var(--line)}
.stats strong{display:block;font:600 17px/1.2 var(--display);letter-spacing:.02em;color:var(--cream);margin-top:2px;font-variant-numeric:tabular-nums}
.stats .on strong{color:var(--orange)}
.mode{display:flex;background:rgba(29,52,40,.08);border:1px solid rgba(29,52,40,.22);border-radius:999px;padding:3px}
.mode button{appearance:none;border:0;background:transparent;color:var(--ink);font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;height:36px;padding:0 16px;border-radius:999px;cursor:pointer;transition:background 160ms var(--ease),color 160ms var(--ease)}
.mode button[aria-checked="true"]{background:var(--ink);color:var(--cream)}
.mode button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.hint{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:-8px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.mode button{transition:none}}
</style>
</head>
<body>
<svg class="topo" id="topo" aria-hidden="true"></svg>
<main>
  <section class="widget" aria-label="Tarnline field compass">
    <div class="top"><b>Tarnline</b><span id="status">Level</span></div>
    <div class="dialwrap" id="dial" tabindex="0" role="slider" aria-label="Heading" aria-valuemin="0" aria-valuemax="359" aria-valuenow="247" aria-valuetext="247 degrees, west-southwest">
      <svg viewBox="-150 -150 300 300" aria-hidden="true">
        <circle class="bezel" r="148"/>
        <g id="rot"></g>
        <path class="lubber" d="M0 -146 L-7 -160 L7 -160 Z"/>
        <rect class="lubber" x="-1" y="-146" width="2" height="22"/>
        <circle class="vial" r="36"/>
        <path class="cross" d="M-36 0H36M0 -36V36"/>
        <circle class="ring" r="11" style="stroke-opacity:.45"/>
        <circle class="bubble level" id="bubble" r="8"/>
      </svg>
    </div>
    <div class="read">
      <div class="deg"><span id="deg">247</span><sup>°</sup></div>
      <div class="card"><span id="card">WSW</span><small id="cardLong">West-southwest</small></div>
    </div>
    <div class="stats">
      <div class="on">To Corrie hut<strong>252° · 1.8 km</strong></div>
      <div>Off course<strong id="delta">5° R</strong></div>
      <div>Elevation<strong>2,148 m</strong></div>
    </div>
  </section>
  <div class="mode" role="radiogroup" aria-label="Heading source">
    <button type="button" role="radio" aria-checked="true" data-mode="drag">Drag dial</button>
    <button type="button" role="radio" aria-checked="false" data-mode="follow">Follow pointer</button>
  </div>
  <p class="hint" id="hint">Drag the dial or use arrow keys</p>
</main>
<p class="sr" id="live" aria-live="polite"></p>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const rot = $('rot'), dial = $('dial'), bubble = $('bubble');
const TARGET = 252;
const SHORT = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const LONG = ['North','North-northeast','Northeast','East-northeast','East','East-southeast','Southeast','South-southeast','South','South-southwest','Southwest','West-southwest','West','West-northwest','Northwest','North-northwest'];
const norm = (a) => ((a % 360) + 360) % 360;
const diff = (a, b) => ((a - b + 540) % 360) - 180;
const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

/* card face */
for (let a = 0; a < 360; a += 5) {
  const maj = a % 30 === 0, mid = a % 10 === 0;
  const r1 = 140, r2 = maj ? 124 : mid ? 130 : 134;
  const s = Math.sin(a * Math.PI / 180), c = -Math.cos(a * Math.PI / 180);
  rot.appendChild(el('line', { class: 'tick' + (maj ? ' maj' : ''), x1: s * r1, y1: c * r1, x2: s * r2, y2: c * r2 }));
  if (maj) {
    const card = a % 90 === 0;
    const t = el('text', { class: card ? 'car' + (a === 0 ? ' n' : '') : 'num', x: s * (card ? 104 : 110), y: c * (card ? 104 : 110), transform: `rotate(${a} ${s * (card ? 104 : 110)} ${c * (card ? 104 : 110)})` });
    t.textContent = card ? 'NESW'[a / 90] : a;
    rot.appendChild(t);
  }
}
rot.appendChild(el('circle', { class: 'ring', r: 88 }));
rot.appendChild(el('circle', { class: 'ring', r: 60 }));
const tri = el('path', { class: 'target', d: 'M0 -120 L-6 -110 L6 -110 Z', transform: `rotate(${TARGET})` });
rot.appendChild(tri);

/* topographic paper */
(function topo() {
  const svg = $('topo'), w = innerWidth, h = innerHeight;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const peaks = [[0.16, 0.24, 1.3, 2148], [0.86, 0.78, 1.1, 1920], [0.74, 0.08, 0.8, 1760], [0.06, 0.92, 0.7, 1610]];
  peaks.forEach(([px, py, sc, top], pi) => {
    for (let k = 1; k <= 16; k++) {
      const r = k * 30 * sc;
      let d = '';
      for (let i = 0; i <= 72; i++) {
        const t = i / 72 * Math.PI * 2;
        const rr = r * (1 + 0.09 * Math.sin(3 * t + k * 0.35 + pi) + 0.05 * Math.sin(5 * t - k * 0.2) + 0.03 * Math.sin(9 * t + pi * 2));
        d += (i ? 'L' : 'M') + (px * w + Math.cos(t) * rr * 1.25).toFixed(1) + ' ' + (py * h + Math.sin(t) * rr).toFixed(1);
      }
      svg.appendChild(el('path', { d: d + 'Z', class: k % 5 === 0 ? 'idx' : '' }));
      if (k % 5 === 0) {
        const t = el('text', { x: px * w + r * 1.25 * 0.7, y: py * h - r * 0.66 });
        t.textContent = (top - k * 20).toLocaleString('en-GB') + ' m';
        svg.appendChild(t);
      }
    }
  });
})();

/* state */
let heading = 247, target = 247, vel = 0, mode = 'drag', drag = null, raf = 0;
let bx = 0, by = 0, tbx = 0, tby = 0, lastSpoken = '';

function render() {
  const h = norm(heading), r = Math.round(h) % 360, i = Math.round(h / 22.5) % 16;
  rot.setAttribute('transform', `rotate(${-heading})`);
  $('deg').textContent = String(r).padStart(3, '0');
  $('card').textContent = SHORT[i];
  $('cardLong').textContent = LONG[i];
  const d = Math.round(diff(TARGET, h));
  $('delta').textContent = d === 0 ? 'On line' : Math.abs(d) + '° ' + (d > 0 ? 'R' : 'L');
  dial.setAttribute('aria-valuenow', r);
  dial.setAttribute('aria-valuetext', `${r} degrees, ${LONG[i].toLowerCase()}`);
  bubble.setAttribute('cx', bx.toFixed(2));
  bubble.setAttribute('cy', by.toFixed(2));
  const tilt = Math.hypot(bx, by) / 25 * 6;
  const level = tilt < 0.8;
  bubble.classList.toggle('level', level);
  $('status').textContent = level ? 'Level' : 'Tilt ' + tilt.toFixed(1) + '°';
}

function tick() {
  raf = 0;
  let moving = false;
  if (reduce) { heading = target; bx = tbx; by = tby; }
  else {
    vel = (vel + diff(target, heading) * 0.11) * 0.74;
    heading += vel;
    bx += (tbx - bx) * 0.14; by += (tby - by) * 0.14;
    moving = Math.abs(vel) > 0.01 || Math.abs(diff(target, heading)) > 0.05 || Math.abs(tbx - bx) > 0.05 || Math.abs(tby - by) > 0.05;
  }
  render();
  if (moving) raf = requestAnimationFrame(tick);
}
const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };

function speak() {
  const r = Math.round(norm(target)) % 360;
  const t = `${r} degrees ${SHORT[Math.round(norm(target) / 22.5) % 16]}`;
  if (t !== lastSpoken) { lastSpoken = t; $('live').textContent = t; }
}

function centre() { const b = dial.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; }
function angleAt(x, y) { const [cx, cy] = centre(); return Math.atan2(x - cx, cy - y) * 180 / Math.PI; }

dial.addEventListener('pointerdown', (e) => {
  if (mode !== 'drag') return;
  dial.setPointerCapture(e.pointerId);
  dial.classList.add('dragging');
  drag = { a: angleAt(e.clientX, e.clientY), h: target, v: 0, t: performance.now() };
});
dial.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const a = angleAt(e.clientX, e.clientY), now = performance.now();
  const step = diff(a, drag.a);
  drag.a = a;
  const next = target - step;
  drag.v = Math.max(-6, Math.min(6, -step / Math.max(8, now - drag.t) * 16));
  drag.t = now;
  target = next;
  kick();
});
function endDrag() {
  if (!drag) return;
  dial.classList.remove('dragging');
  if (!reduce && Math.abs(drag.v) > 0.6) target += drag.v * 9;
  drag = null; kick(); speak();
}
dial.addEventListener('pointerup', endDrag);
dial.addEventListener('pointercancel', endDrag);

dial.addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 10 : 1;
  const map = { ArrowRight: step, ArrowUp: step, ArrowLeft: -step, ArrowDown: -step, PageUp: 15, PageDown: -15 };
  if (e.key in map) target = Math.round(target) + map[e.key];
  else if (e.key === 'Home') target = target + diff(0, norm(target));
  else if (e.key === 'End') target = target + diff(TARGET, norm(target));
  else return;
  e.preventDefault(); kick(); speak();
});

document.addEventListener('pointermove', (e) => {
  const [cx, cy] = centre();
  const dx = e.clientX - cx, dy = e.clientY - cy;
  const m = Math.min(1, Math.hypot(dx, dy) / Math.max(innerWidth, innerHeight) * 1.6);
  const ang = Math.atan2(dy, dx);
  tbx = drag ? tbx : Math.cos(ang) * m * 24;
  tby = drag ? tby : Math.sin(ang) * m * 24;
  if (mode === 'follow') target = target + diff(Math.atan2(dx, -dy) * 180 / Math.PI, norm(target));
  kick();
});
document.documentElement.addEventListener('pointerleave', () => { tbx = 0; tby = 0; kick(); });

document.querySelectorAll('.mode button').forEach((b) => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.mode button').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
  $('hint').textContent = mode === 'drag' ? 'Drag the dial or use arrow keys' : 'Move the pointer; the widget faces it';
  dial.style.cursor = mode === 'drag' ? '' : 'default';
}));
document.querySelector('.mode').addEventListener('keydown', (e) => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const bs = [...document.querySelectorAll('.mode button')];
  const i = bs.findIndex((x) => x.getAttribute('aria-checked') === 'true');
  const n = bs[(i + (e.key === 'ArrowRight' ? 1 : bs.length - 1)) % bs.length];
  n.click(); n.focus(); e.preventDefault();
});

if (!reduce) setInterval(() => { if (!drag && mode === 'drag' && document.activeElement !== dial) { target += (Math.random() - 0.5) * 1.4; kick(); } }, 1600);
render();
</script>
</body>
</html>
