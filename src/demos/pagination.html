<!-- Design Lounge piece: pagination · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Pagination</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5a554c;--line:#e4dfd4;--line-strong:#cfc6b8;
  --primary-soft:#e7f2ec;--focus:#1f4d3a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
.count{margin:0 0 16px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
nav{display:flex;gap:4px;align-items:center}
button{min-width:40px;height:40px;padding:0 12px;border-radius:2px;border:1px solid transparent;background:transparent;color:var(--ink);font:500 13px/1 var(--sans);cursor:pointer}
button:hover{background:var(--surface)}
button[aria-current="page"]{background:var(--primary-soft);border-color:transparent}
button:disabled{color:var(--ink-2);opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<p class="count" id="count">11–20 of 48</p>
<nav aria-label="Pages">
  <button type="button" id="prev">Previous</button>
  <button type="button" data-page="1">1</button>
  <button type="button" data-page="2" aria-current="page">2</button>
  <button type="button" data-page="3">3</button>
  <button type="button" data-page="4">4</button>
  <button type="button" data-page="5">5</button>
  <button type="button" id="next">Next</button>
</nav>
<script>
const pages = [...document.querySelectorAll('[data-page]')];
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const count = document.getElementById('count');
let page = 2;
const last = 5;
const total = 48;
function paint(){
  pages.forEach(b => {
    const n = Number(b.dataset.page);
    if (n === page) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  prev.disabled = page === 1;
  next.disabled = page === last;
  const start = (page - 1) * 10 + 1;
  const end = Math.min(page * 10, total);
  count.textContent = start + '–' + end + ' of ' + total;
}
pages.forEach(b => b.addEventListener('click', () => { page = Number(b.dataset.page); paint(); }));
prev.addEventListener('click', () => { if (page > 1) { page -= 1; paint(); } });
next.addEventListener('click', () => { if (page < last) { page += 1; paint(); } });
</script>
</body>
</html>
