<!-- Design Lounge piece: folder-reveal · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Folder</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--surface:#fffdf8;--ink:#1a1814;--ink-2:#5c564c;--line:#e3ddd2;--folder:#e7d7b6;--tab:#f3e6c8;--primary:#1f4d3a;--serif:"Fraunces",Georgia,serif;--sans:"Public Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.stage{width:560px;height:420px;position:relative}
.fan{position:absolute;left:70px;right:70px;top:36px;height:240px}
.card{position:absolute;left:0;right:0;top:40px;height:180px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:16px 18px;transition:transform 420ms cubic-bezier(0.16,1,0.3,1)}
.card h2{font:560 22px/1.15 var(--serif);margin:0 0 6px}
.card p{margin:0;color:var(--ink-2);font-size:14px}
.stage[data-open="true"] .c0{transform:translate(-36px,-8px) rotate(-7deg)}
.stage[data-open="true"] .c1{transform:translate(0,-28px)}
.stage[data-open="true"] .c2{transform:translate(36px,-8px) rotate(7deg)}
.folder{position:absolute;left:40px;right:40px;bottom:36px;height:150px;border:0;background:var(--folder);border-radius:2px 8px 2px 2px;cursor:pointer;text-align:left;padding:28px 20px 16px;font:500 14px var(--sans);color:var(--ink)}
.folder::before{content:"";position:absolute;left:0;top:-22px;width:140px;height:24px;background:var(--tab);border-radius:6px 8px 0 0}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage" data-open="true">
  <div class="fan">
    <article class="card c0"><h2>Hold list</h2><p>Twelve loads still at Gate 4.</p></article>
    <article class="card c1"><h2>Night book</h2><p>Closes at 22:00. Kathmandu.</p></article>
    <article class="card c2"><h2>Month close</h2><p>Rupee totals keep their face.</p></article>
  </div>
  <button class="folder" id="folder" type="button" aria-expanded="true">Yard notes · 3 cards</button>
</div>
<script>
const stage = document.getElementById('stage');
const folder = document.getElementById('folder');
folder.addEventListener('click', () => {
  const on = stage.dataset.open !== 'true';
  stage.dataset.open = String(on);
  folder.setAttribute('aria-expanded', String(on));
});
</script>
</body>
</html>
