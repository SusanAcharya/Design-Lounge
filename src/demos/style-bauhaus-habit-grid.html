<!-- Design Lounge piece: style-bauhaus-habit-grid · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werk Bauhaus habit grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1EADB;--card:#F8F3E8;--ink:#161616;--ink-2:#45413A;--rule:#CFC6B4;
  --red:#D2382B;--yellow:#F2B705;--blue:#1F4E9C;
  --font:"Josefin Sans",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 15px/1.3 var(--font);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.app{max-width:430px;height:100%;margin:0 auto;padding:56px 16px 34px;display:flex;flex-direction:column}
header{display:flex;align-items:flex-end;justify-content:space-between;height:44px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:26px;letter-spacing:.18em;line-height:1;padding-top:4px}
.logo svg{width:30px;height:30px}
.date{font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding-bottom:3px}
/* poster */
.poster{position:relative;margin-top:12px;background:var(--card);border:2px solid var(--ink);padding:12px 14px 12px 40px;overflow:hidden}
.band{position:absolute;left:0;top:0;bottom:0;width:26px;background:var(--red)}
.band span{position:absolute;left:0;right:0;bottom:12px;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;font-weight:700;font-size:20px;letter-spacing:.2em;line-height:26px;color:var(--ink);white-space:nowrap}
.ptop{display:flex;justify-content:space-between;align-items:center;height:32px}
.ptop b{font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase}
.seg{display:flex;border:2px solid var(--ink);height:32px}
.seg button{padding:2px 10px 0;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;min-width:58px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.cols,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--gap,6px);transition:gap 420ms var(--expo)}
.cols{margin:10px 0 6px;transition:opacity 240ms var(--ease)}
.cols span{text-align:center;font-weight:700;font-size:12px;letter-spacing:.06em;height:20px;line-height:22px}
.cols span.today{background:var(--yellow)}
.cell{aspect-ratio:1;position:relative}
.cell svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cell .o{fill:none;stroke:var(--ink);stroke-width:1.5;transition:opacity 300ms var(--ease)}
.cell.future .o{stroke-dasharray:2 3;stroke:#8A8476}
.cell .f{transition:transform 520ms var(--expo)}
.cell.pop svg{animation:pop 460ms var(--expo)}
@keyframes pop{0%{transform:scale(.4) rotate(-30deg)}60%{transform:scale(1.12)}100%{transform:none}}
.pbot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px;border-top:2px solid var(--ink);padding-top:10px}
.big{font-weight:700;font-size:46px;line-height:.8;letter-spacing:-.02em;padding-top:6px}
.big small{font-size:20px;letter-spacing:0;color:var(--ink-2);font-weight:600}
.pbot p{margin:0;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:right;line-height:1.5;color:var(--ink-2)}
.poster.art{--gap:0px}
.poster.art .cols{opacity:0}
.poster.art .o{opacity:0}
.poster.art .big{font-size:60px}
.deco{position:absolute;right:-66px;top:92px;width:190px;height:200px;pointer-events:none;opacity:0;transform:translateX(40px) rotate(20deg);transition:opacity 420ms var(--ease),transform 620ms var(--expo)}
.poster.art .deco{opacity:1;transform:none}
.grid{position:relative}
.big{transition:font-size 420ms var(--expo)}
/* habits */
.list{list-style:none;margin:12px 0 0;padding:0;flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.list li{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;height:61px;border-top:1.5px solid var(--rule)}
.list li:last-child{border-bottom:1.5px solid var(--rule)}
.shape{width:52px;height:52px;display:grid;place-items:center;border-radius:4px;transition:transform 160ms var(--ease)}
.shape:active{transform:scale(.92)}
.shape svg{width:46px;height:46px;overflow:visible}
.shape .o{fill:none;stroke:var(--ink);stroke-width:2}
.shape .f{transition:transform 420ms var(--expo)}
.shape.full svg{animation:pop 460ms var(--expo)}
.nm{font-weight:700;font-size:17px;letter-spacing:.02em;padding-top:3px;white-space:nowrap}
.dt{font-size:13px;color:var(--ink-2);margin-top:3px;letter-spacing:.02em;white-space:nowrap}
.wk{display:flex;gap:4px;align-items:center}
.wk i{width:8px;height:8px;border:1.5px solid var(--ink)}
.wk i.on{background:var(--ink)}
.wk i.t{outline:2px solid var(--yellow);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="#D2382B"/><rect x="16" y="1" width="13" height="13" fill="#1F4E9C"/><path d="M1 29L9 16l8 13z" fill="#F2B705"/><path d="M17 29V17a12 12 0 0 1 12 12z" fill="#161616"/></svg>WERK</div>
    <div class="date">Fri 6 Nov</div>
  </header>
  <section class="poster" id="poster" aria-label="Week 45 composition">
    <div class="band" aria-hidden="true"><span>WOCHE 45</span></div>
    <div class="ptop"><b>Week 45</b><div class="seg" role="group" aria-label="View"><button aria-pressed="true" data-v="grid">Grid</button><button aria-pressed="false" data-v="art">Poster</button></div></div>
    <div class="cols" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span class="today">F</span><span>S</span><span>S</span></div>
    <svg class="deco" viewBox="0 0 190 200" aria-hidden="true"><circle cx="110" cy="96" r="84" fill="#F2B705"/><rect x="-10" y="138" width="230" height="14" fill="#161616" transform="rotate(-24 95 145)"/></svg>
    <div class="grid" id="grid" aria-hidden="true"></div>
    <div class="pbot"><div class="big" id="big">0<small>/35</small></div><p>Check-ins<br>2 – 8 November</p></div>
  </section>
  <ul class="list" id="list" aria-label="Today's habits"></ul>
  <p class="sr" id="say" aria-live="polite"></p>
</div>
<script>
(() => {
  const S = {
    circle: '<circle cx="26" cy="26" r="22"/>',
    square: '<rect x="5" y="5" width="42" height="42"/>',
    tri: '<path d="M26 4L48 46H4z"/>',
    dome: '<path d="M4 40A22 22 0 0 1 48 40z"/>',
    quarter: '<path d="M6 46V6a40 40 0 0 1 40 40z"/>'
  };
  const H = [
    { n: 'Run 5 km', s: 'circle', c: '#D2382B', of: 1, u: ['Not yet', 'Done'], d: [1, 0, 1, 0, 0] },
    { n: 'Read', s: 'square', c: '#1F4E9C', of: 3, u: n => n * 10 + ' of 30 min', d: [1, 1, 2 / 3, 1, 1 / 3] },
    { n: 'Water', s: 'tri', c: '#F2B705', of: 8, u: n => n + ' of 8 glasses', d: [1, .75, 1, 1, .5] },
    { n: 'Lights out 23:00', s: 'dome', c: '#161616', of: 1, u: ['Tonight', 'Done'], d: [1, 1, 0, 1, 0] },
    { n: 'Stretch', s: 'quarter', c: '#1F4E9C', of: 1, u: ['Not yet', 'Done'], d: [0, 1, 1, 0, 0] }
  ];
  const T = 4, $ = (id) => document.getElementById(id);
  const grid = $('grid'), list = $('list'), poster = $('poster');
  let uid = 0;
  const shape = (h, frac, box) => { const id = 'c' + uid++;
    return `<svg viewBox="0 0 52 52"><defs><clipPath id="${id}">${S[h.s]}</clipPath></defs><g clip-path="url(#${id})"><rect class="f" x="0" y="0" width="52" height="52" fill="${h.c}" style="transform:translateY(${(1 - frac) * 52}px)"/></g><g class="o">${S[h.s]}</g></svg>`; };
  const setFill = (svg, frac) => { svg.querySelector('.f').style.transform = `translateY(${(1 - frac) * 52}px)`; };
  // poster: rows are habits, columns are days
  grid.innerHTML = H.map((h, r) => [0, 1, 2, 3, 4, 5, 6].map(c => {
    const f = c < 5 ? h.d[c] : 0;
    return `<div class="cell${c > T ? ' future' : ''}${f === 1 ? ' done' : ''}" data-r="${r}" data-c="${c}">${shape(h, f)}</div>`; }).join('')).join('');
  const label = (h, n) => typeof h.u === 'function' ? h.u(n) : h.u[n];
  list.innerHTML = H.map((h, r) => { const n = Math.round(h.d[T] * h.of);
    return `<li><button class="shape${n === h.of ? ' full' : ''}" data-r="${r}" aria-label="${h.n}: ${label(h, n)}. Tap to check in">${shape(h, n / h.of)}</button>
      <div><div class="nm">${h.n}</div><div class="dt" id="dt${r}">${label(h, n)}</div></div>
      <div class="wk" aria-label="${h.d.filter(v => v === 1).length} of 5 days so far" id="wk${r}">${[0, 1, 2, 3, 4, 5, 6].map(c => `<i class="${c < 5 && h.d[c] === 1 ? 'on' : ''}${c === T ? ' t' : ''}"></i>`).join('')}</div></li>`; }).join('');
  function count() {
    const n = H.reduce((a, h) => a + h.d.filter(v => v === 1).length, 0);
    $('big').innerHTML = n + '<small>/35</small>'; return n;
  }
  list.addEventListener('click', (e) => {
    const b = e.target.closest('.shape'); if (!b) return;
    const r = +b.dataset.r, h = H[r];
    let n = Math.round(h.d[T] * h.of); n = n >= h.of ? 0 : n + 1;
    h.d[T] = n / h.of;
    setFill(b.querySelector('svg'), h.d[T]);
    const cell = grid.querySelector(`[data-r="${r}"][data-c="${T}"]`);
    setFill(cell.querySelector('svg'), h.d[T]);
    const full = n === h.of;
    b.classList.remove('full'); cell.classList.remove('pop');
    if (full) { void b.offsetWidth; b.classList.add('full'); cell.classList.add('pop'); }
    cell.classList.toggle('done', full);
    $('dt' + r).textContent = label(h, n);
    b.setAttribute('aria-label', `${h.n}: ${label(h, n)}. Tap to check in`);
    $('wk' + r).children[T].classList.toggle('on', full);
    const total = count();
    $('say').textContent = `${h.n}, ${label(h, n)}. ${total} of 35 this week.`;
  });
  poster.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    poster.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    poster.classList.toggle('art', b.dataset.v === 'art');
  });
  count();
})();
</script>
</body>
</html>
