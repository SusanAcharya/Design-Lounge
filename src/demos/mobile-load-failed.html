<!-- Design Lounge piece: mobile-load-failed · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Could not load runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--surface:#fffdf8;--ink:#1b1814;--ink-2:#5e574e;
  --line:#e3dbcf;--danger:#9b2c2c;--danger-soft:#f8e8e6;--focus:#8a4b12;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:54px 0 34px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.where{margin:8px 20px 16px;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
.banner{margin:0 20px;background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:16px}
.banner p{margin:0 0 12px;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.banner button,.again{height:44px;border-radius:10px;border:1px solid currentColor;background:transparent;color:inherit;font-weight:600}
.banner button{width:100%}
.list{display:none;margin:16px 20px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list.show{display:block}
.list div{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-top:1px solid var(--line)}
.list div:first-child{border-top:0}
.list b{font-weight:600}
.list span{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.again{display:none;margin:16px 20px 0;padding:0 16px;border-color:var(--line);color:var(--ink-2)}
.again.show{display:inline-flex;align-items:center}
</style>
</head>
<body>
<p class="where">Runs</p>
<div class="banner" id="banner" role="alert">
  <p>Could not load runs. The yard desk did not answer.</p>
  <button id="retry" type="button">Retry</button>
</div>
<div class="list" id="list">
  <div><b>Bay 14</b><span>2,400 kg · 06:40</span></div>
  <div><b>Bay 3</b><span>860 kg · 07:10</span></div>
  <div><b>Bay 9</b><span>1,120 kg · 07:40</span></div>
</div>
<button class="again" id="again" type="button">Show the failure</button>
<script>
const banner = document.getElementById('banner');
const list = document.getElementById('list');
const again = document.getElementById('again');
document.getElementById('retry').addEventListener('click', () => {
  banner.hidden = true;
  list.classList.add('show');
  again.classList.add('show');
});
again.addEventListener('click', () => {
  banner.hidden = false;
  list.classList.remove('show');
  again.classList.remove('show');
});
</script>
</body>
</html>
