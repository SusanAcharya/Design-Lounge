<!-- Design Lounge piece: background-halftone-pop · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Halftone pop background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffe14a;--dot:#e8302a;--ink:#141010;--card:#fffaf0;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--mono:"Courier Prime",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);--t:160ms;--shadow:4px 4px 0 var(--ink);
}
[data-palette="cobalt"]{--paper:#ffc9d2;--dot:#1f3fbf}
[data-palette="mint"]{--paper:#8ff0c8;--dot:#141010;--pop:#fffaf0}
[data-palette="mint"] h1 em{background:var(--paper);padding:0 6px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.page{position:relative;height:100%;display:flex;flex-direction:column;pointer-events:none}
.page a,.page button{pointer-events:auto}
nav{display:flex;align-items:center;gap:28px;padding:24px 48px}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 22px/1 var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none;background:var(--card);border:2px solid var(--ink);padding:8px 12px;box-shadow:var(--shadow)}
.brand svg{width:22px;height:22px}
.links{margin-left:auto;display:flex;gap:8px}
.links a{font:700 14px var(--mono);color:var(--ink);text-decoration:none;background:var(--card);border:2px solid var(--ink);padding:6px 12px;transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.links a:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 48px 96px}
.tag{align-self:flex-start;font:700 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:6px 10px;margin:0 0 20px;transform:rotate(-2deg)}
h1{font:800 128px/.9 var(--display);letter-spacing:-.045em;margin:0 0 24px;max-width:900px}
h1 span{background:var(--card);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 14px;border:3px solid var(--ink);line-height:1.04}
h1 em{font-style:normal;color:var(--dot)}
.sub{align-self:flex-start;max-width:560px;margin:0 0 28px;background:var(--card);border:2px solid var(--ink);padding:12px 16px;font-size:16px;line-height:1.5;box-shadow:var(--shadow)}
.btn{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 24px;background:var(--ink);color:var(--card);border:2px solid var(--ink);font:800 18px var(--display);letter-spacing:-.01em;text-decoration:none;box-shadow:6px 6px 0 var(--pop,var(--dot));transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--pop,var(--dot))}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--pop,var(--dot))}
.btn small{font:700 14px var(--mono);color:var(--paper)}
.ctl{position:fixed;right:24px;bottom:24px;width:256px;background:var(--card);border:2px solid var(--ink);box-shadow:var(--shadow);padding:14px;font-size:13px}
.ctl-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ctl-h b{font:800 16px var(--display);letter-spacing:-.01em}
.icon{width:36px;height:36px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform var(--t) var(--ease)}
.icon:active{transform:translate(1px,1px)}
.icon svg{width:14px;height:14px;fill:currentColor}
.row{display:grid;grid-template-columns:60px 1fr 42px;align-items:center;gap:8px;margin-top:6px}
.row output{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;background:var(--dot);border:2px solid var(--ink);border-radius:50%}
input[type=range]::-moz-range-track{height:4px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--dot);border:2px solid var(--ink);border-radius:50%}
fieldset{border:0;margin:10px 0 0;padding:0;display:flex;align-items:center;gap:8px}
legend{float:left;width:60px;margin-right:8px;padding:0}
.sw{position:relative;width:40px;height:40px;cursor:pointer}
.sw input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.sw span{display:block;width:100%;height:100%;border:2px solid var(--ink);background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.sw input:checked+span{box-shadow:3px 3px 0 var(--ink);transform:translate(-2px,-2px)}
.sw input:focus-visible+span{outline:3px solid var(--ink);outline-offset:3px}
.hint{margin:10px 0 0;font-size:12px;color:#3a3330}
@media (max-width:760px){
  nav{padding:16px 16px}.links{display:none}
  .hero{padding:0 16px 250px}h1{font-size:62px}h1 span{padding:0 8px;border-width:2px}.sub{font-size:14px}
  .ctl{left:12px;right:12px;bottom:12px;width:auto}.hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body data-palette="cherry">
<canvas id="c" aria-hidden="true"></canvas>
<div class="page">
  <nav aria-label="Main">
    <a class="brand" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-2 6H9z"/><path d="M9 9c-3 2-4 5-4 8a4 4 0 0 0 4 4h6a4 4 0 0 0 4-4c0-3-1-6-4-8"/></svg>Inkpot Fest</a>
    <div class="links"><a href="#">Exhibitors</a><a href="#">Workshops</a><a href="#">Map</a></div>
  </nav>
  <main class="hero">
    <p class="tag">Sat 14 – Sun 15 Nov · Old Tram Depot</p>
    <h1><span>Print is <em>loud</em> again.</span></h1>
    <p class="sub">Two days, 140 tables of zines, riso posters and comics, every one printed by the person selling it.</p>
    <a class="btn" href="#">Get a weekend pass <small>£18</small></a>
  </main>
</div>
<form class="ctl" aria-label="Halftone controls" onsubmit="return false">
  <div class="ctl-h"><b>Screen</b><button type="button" class="icon" id="pause" aria-pressed="false" aria-label="Pause background"><svg viewBox="0 0 24 24" id="ico"></svg></button></div>
  <div class="row"><label for="pitch">Pitch</label><input id="pitch" type="range" min="10" max="24" step="1" value="14"><output id="pitchOut" for="pitch">14px</output></div>
  <div class="row"><label for="speed">Speed</label><input id="speed" type="range" min="0" max="2" step=".1" value="1"><output id="speedOut" for="speed">1.0×</output></div>
  <fieldset><legend>Inks</legend>
    <label class="sw"><input type="radio" name="pal" value="cherry" checked aria-label="Cherry on lemon"><span style="--a:#ffe14a;--b:#e8302a"></span></label>
    <label class="sw"><input type="radio" name="pal" value="cobalt" aria-label="Cobalt on blush"><span style="--a:#ffc9d2;--b:#1f3fbf"></span></label>
    <label class="sw"><input type="radio" name="pal" value="mint" aria-label="Black on mint"><span style="--a:#8ff0c8;--b:#141010"></span></label>
  </fieldset>
  <p class="hint">Move the pointer to swell the dots.</p>
</form>
<script>
(()=>{
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $=id=>document.getElementById(id);
  const cv=$('c'),ctx=cv.getContext('2d');
  let W=0,H=0,P=14,t=4,speed=1,last=0,raf=0,playing=!reduce,dot='#e8302a';
  const ptr={x:0,y:0,tx:0,ty:0,s:0,ts:0};
  function resize(){
    const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    ptr.x=ptr.tx=W*.72;ptr.y=ptr.ty=H*.45;draw();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);ctx.fillStyle=dot;ctx.beginPath();
    const a=.6+.35*Math.sin(t*.07),ca=Math.cos(a),sa=Math.sin(a);
    const bx=W*(.7+.18*Math.sin(t*.13)),by=H*(.5+.3*Math.cos(t*.11));
    const R=Math.max(W,H)*.55,pr=170+P*4,maxR=P*.5*1.02;
    const c=Math.SQRT1_2,ext=Math.hypot(W,H);
    for(let v=-ext;v<ext;v+=P){
      for(let u=-ext;u<ext;u+=P){
        const x=W/2+(u-v)*c,y=H/2+(u+v)*c;
        if(x<-P||x>W+P||y<-P||y>H+P)continue;
        let g=.5+.5*Math.sin((x*ca+y*sa)*.004-t*.5);
        const dx=x-bx,dy=y-by;g=g*.55+.6*Math.exp(-(dx*dx+dy*dy)/(R*R));
        const px=x-ptr.x,py=y-ptr.y;g+=ptr.s*.9*Math.exp(-(px*px+py*py)/(2*pr*pr));
        g=g*(.25+.75*Math.min(1,x/(W*.55)));
        if(g<.04)continue;
        const r=maxR*Math.sqrt(Math.min(1,g));
        ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,6.2832);
      }
    }
    ctx.fill();
  }
  function frame(now){
    raf=requestAnimationFrame(frame);
    const dt=now-last;if(dt<1000/60-1)return;
    last=now;t+=Math.min(dt,50)/1000*speed;
    const k=1-Math.pow(.001,Math.min(dt,50)/1000);
    ptr.x+=(ptr.tx-ptr.x)*k*1.6;ptr.y+=(ptr.ty-ptr.y)*k*1.6;ptr.s+=(ptr.ts-ptr.s)*k;
    draw();
  }
  function start(){if(!raf&&playing&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
  addEventListener('resize',resize);
  addEventListener('pointermove',e=>{ptr.tx=e.clientX;ptr.ty=e.clientY;ptr.ts=1;if(!raf){ptr.x=ptr.tx;ptr.y=ptr.ty;ptr.s=1;draw();}});
  document.documentElement.addEventListener('pointerleave',()=>{ptr.ts=0;if(!raf){ptr.s=0;draw();}});
  const btn=$('pause'),ico=$('ico');
  function sync(){btn.setAttribute('aria-pressed',String(!playing));btn.setAttribute('aria-label',playing?'Pause background':'Play background');
    ico.innerHTML=playing?'<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>':'<path d="M7 5l12 7-12 7z"/>';}
  btn.addEventListener('click',()=>{playing=!playing;sync();playing?start():stop();});
  $('pitch').addEventListener('input',e=>{P=+e.target.value;$('pitchOut').textContent=P+'px';if(!raf)draw();});
  $('speed').addEventListener('input',e=>{speed=+e.target.value;$('speedOut').textContent=speed.toFixed(1)+'×';});
  document.querySelectorAll('input[name=pal]').forEach(r=>r.addEventListener('change',()=>{
    document.body.dataset.palette=r.value;dot=getComputedStyle(document.body).getPropertyValue('--dot').trim();if(!raf)draw();}));
  sync();resize();start();
})();
</script>
</body>
</html>
