<!-- Design Lounge piece: slider-range-histogram · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Larchway · Cabins in Kettle Valley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Kumbh+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#efebe2;--panel:#fbfaf6;--ink:#1b2620;--ink-2:#535d57;--line:#ddd7cb;--edge:#857c6e;
  --bar:#d9d2c3;--fill:#2e5e47;--fill-2:#24503b;--ember:#b0491f;--chip:#f1eee6;
  --serif:"Bitter",Georgia,serif;--sans:"Kumbh Sans",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 var(--sans);color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2.5px solid var(--ember);outline-offset:3px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{height:64px;display:flex;align-items:center;gap:24px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font:700 21px var(--serif);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo svg{width:22px;height:22px;fill:var(--fill)}
.query{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;border:1px solid var(--edge);border-radius:20px;font-size:14px;white-space:nowrap}
.query span+span{padding-left:10px;border-left:1px solid var(--line)}
.top .me{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#d8e3d9;display:grid;place-items:center;font:600 13px var(--sans)}

.wrap{display:grid;grid-template-columns:440px 1fr;gap:32px;padding:24px 32px;max-width:1280px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font:600 18px var(--serif)}
.link{font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.sec{padding:20px 24px 22px}
.sec+.sec{border-top:1px solid var(--line)}
.sec h3{margin:0;font:600 15px var(--sans)}
.sub{margin:2px 0 0;font-size:13px;color:var(--ink-2)}

/* the range */
.rail{position:relative;margin:18px 0 0;padding:0 14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.hist{position:relative;height:112px;display:flex;align-items:flex-end;gap:2px}
.hist i{flex:1;min-width:0;border-radius:2px 2px 0 0;background:var(--bar);transition:height 260ms var(--ease)}
.med{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--ember);pointer-events:none}
.med b{position:absolute;top:-2px;left:6px;font:600 12px var(--sans);color:var(--ember);white-space:nowrap;background:var(--panel);padding:0 4px;border-radius:3px}
.track{position:relative;height:28px;margin-top:-11px}
.track::before,.sel{content:"";position:absolute;top:12px;height:4px;border-radius:2px}
.track::before{left:0;right:0;background:var(--bar)}
.sel{background:var(--fill)}
.th{--s:1;--sq:1;position:absolute;top:0;width:28px;height:28px;transform:scale(calc(var(--s) * var(--sq)),var(--s));margin-left:-14px;border-radius:50%;background:#fff;border:2px solid var(--fill);box-shadow:0 1px 3px rgba(27,38,32,.25);cursor:grab;touch-action:none;transition:transform 240ms var(--pop),box-shadow 200ms var(--ease)}
.th::after{content:"";position:absolute;inset:-8px;border-radius:50%}
.th:hover{box-shadow:0 0 0 7px rgba(46,94,71,.14),0 1px 3px rgba(27,38,32,.25)}
.th.on{--s:1.18;z-index:2;cursor:grabbing;box-shadow:0 0 0 9px rgba(46,94,71,.16),0 3px 8px rgba(27,38,32,.25)}
.th:focus-visible{outline:2.5px solid var(--ember);outline-offset:3px;border-radius:50%}
.th.on:focus-visible{outline-color:transparent}
.tip{position:absolute;bottom:40px;left:0;transform:translateX(-50%) translateY(4px);padding:4px 8px;border-radius:6px;background:var(--ink);color:#fbfaf6;font:600 13px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 140ms var(--ease),transform 200ms var(--ease)}
.tip.on{opacity:1;transform:translateX(-50%)}
.ends{display:flex;justify-content:space-between;margin:2px 0 0;padding:0 2px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.boxes{display:grid;grid-template-columns:1fr 20px 1fr;align-items:end;gap:8px;margin-top:14px}
.boxes .dash{height:44px;display:grid;place-items:center;color:var(--ink-2)}
.box label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field{position:relative}
.field span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.field input{display:block;width:100%;min-width:0;height:44px;padding:0 12px 0 25px;border:1.5px solid var(--edge);border-radius:10px;background:var(--panel);outline:0;font:600 16px var(--sans);font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--fill);box-shadow:0 0 0 3px rgba(46,94,71,.18)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--edge);font-size:14px;font-weight:500;background:var(--panel);transition:background 160ms var(--ease),color 160ms var(--ease)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fbfaf6}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;display:none}
.chip[aria-pressed=true] svg{display:block}

.pf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-top:1px solid var(--line)}
.cta{height:48px;padding:0 22px;border-radius:12px;background:var(--fill);color:#fbfaf6;font:600 16px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;transition:background 160ms var(--ease)}
.cta:hover{background:var(--fill-2)}
.cta b{font-weight:700;display:inline-block}
.bump{animation:bump 260ms var(--pop)}
@keyframes bump{40%{transform:translateY(-2px) scale(1.06)}}

.res h1{margin:6px 0 2px;font:700 30px/1.15 var(--serif);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.res .sub{font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.card{display:block;color:inherit;text-decoration:none;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform 200ms var(--ease)}
.card:hover{transform:translateY(-2px)}
.card svg{display:block;width:100%;height:172px}
.card .t{padding:12px 16px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.card b{font:600 16px var(--serif)}
.card .r{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.card .r svg{width:13px;height:13px;fill:var(--ember)}
.card small{font-size:13px;color:var(--ink-2)}
.card em{font-style:normal;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.card em strong{font-weight:700}
.none{grid-column:1/-1;padding:40px;border:1.5px dashed var(--edge);border-radius:14px;color:var(--ink-2);text-align:center}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:16px}
  .top{padding:0 16px;gap:12px}.query span:nth-child(n+2){display:none}
  .grid{grid-template-columns:1fr}
}
@media (max-width:420px){.ph,.sec,.pf{padding-left:18px;padding-right:18px}.rail{padding:0 12px}.res h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 11h-4l5 7H4l5-7H5z"/></svg>Larchway</span>
  <div class="query"><span>Kettle Valley</span><span>14 to 17 Nov</span><span>2 guests</span></div>
  <span class="me" aria-label="Your account">IA</span>
</header>
<div class="wrap">
  <aside class="panel" aria-labelledby="fh">
    <div class="ph"><h2 id="fh">Filters</h2><button class="link" type="button" id="clear">Clear all</button></div>
    <section class="sec" aria-labelledby="ph">
      <h3 id="ph">Price per night</h3>
      <p class="sub" id="pd">Before fees and taxes. Most cabins here sit around the dashed line.</p>
      <div class="rail" id="rail">
        <div class="hist" id="hist" aria-hidden="true"><span class="med" id="med"><b id="medl">Median $170</b></span></div>
        <div class="track">
          <span class="sel" id="sel"></span>
          <span class="th" id="t0" role="slider" tabindex="0" aria-label="Minimum price" aria-describedby="pd"></span>
          <span class="th" id="t1" role="slider" tabindex="0" aria-label="Maximum price" aria-describedby="pd"></span>
          <span class="tip" id="tip0" aria-hidden="true"></span><span class="tip" id="tip1" aria-hidden="true"></span>
        </div>
      </div>
      <div class="ends" aria-hidden="true"><span>$60</span><span>$460+</span></div>
      <div class="boxes">
        <div class="box"><label for="in0">Minimum</label><div class="field"><span>$</span><input id="in0" inputmode="numeric" autocomplete="off"></div></div>
        <span class="dash" aria-hidden="true">to</span>
        <div class="box"><label for="in1">Maximum</label><div class="field"><span>$</span><input id="in1" inputmode="numeric" autocomplete="off"></div></div>
      </div>
    </section>
    <section class="sec" aria-labelledby="kh">
      <h3 id="kh">Type of stay</h3>
      <div class="chips" id="chips"></div>
    </section>
    <div class="pf"><button class="link" type="button" id="reset">Reset price</button><button class="cta" type="button" id="cta">Show <b id="n1">0</b> cabins</button></div>
  </aside>
  <main class="res">
    <p class="sub">Kettle Valley, 14 to 17 Nov, 2 guests</p>
    <h1 id="n2">0 cabins</h1>
    <p class="sub" id="rng"></p>
    <div class="grid" id="grid"></div>
  </main>
</div>
<p class="vh" aria-live="polite" id="sr"></p>
<script>
(() => {
const $ = id => document.getElementById(id);
const MIN = 60, MAX = 460, STEP = 5, GAP = 20, BIN = 10, NB = (MAX - MIN) / BIN;
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(6.2832 * rnd());
const TYPES = ['A-frame', 'Log cabin', 'Treehouse', 'Yurt'];
const B = ['Bothy', 'Lodge', 'Hut', 'Den', 'Rest', 'Nook', 'Shieling', 'Loft', 'Croft', 'Steading', 'Hide'];
const A = ['Ferncliff', 'Hollin', 'Otter Run', 'Quarry Pond', 'Bracken', 'Low Larch', 'Stillwater', 'Hartsfell', 'Ember Hill', 'Corrie', 'Wren Hollow', 'Beck Side'];
const cabins = Array.from({ length: 124 }, (_, i) => {
  const lux = rnd() < .14, t = Math.floor(rnd() * 4);
  const p = lux ? 300 + gauss() * 45 : Math.exp(5.12 + gauss() * .3) + (t === 2 ? 40 : t === 3 ? -30 : 0);
  return { p: Math.round(Math.max(64, Math.min(520, p))), t, r: (4.3 + rnd() * .69).toFixed(2), n: A[i % 12] + ' ' + B[(i / 12 | 0) % 11], km: 3 + Math.floor(rnd() * 28), h: Math.floor(rnd() * 5) };
});
const hist = $('hist'), bars = Array.from({ length: NB }, () => hist.appendChild(document.createElement('i')));
const th = [$('t0'), $('t1')], tips = [$('tip0'), $('tip1')], ins = [$('in0'), $('in1')];
const on = new Set();
let val = [120, 200], disp = val.slice(), vel = [0, 0], raf = 0, drag = -1;
const fmt = (v, k) => '$' + v + (k === 1 && v >= MAX ? '+' : '');
const frac = v => (v - MIN) / (MAX - MIN);
const pool = () => cabins.filter(c => !on.size || on.has(c.t));
function paintBars(){
  const n = new Array(NB).fill(0), list = pool();
  list.forEach(c => n[Math.min(NB - 1, Math.floor((Math.min(c.p, MAX - 1) - MIN) / BIN))]++);
  const top = Math.max(...n, 1);
  bars.forEach((b, i) => b.style.height = (n[i] ? 6 + 94 * n[i] / top : 2) + '%');
  const ps = list.map(c => c.p).sort((a, b) => a - b), med = ps[ps.length >> 1] || 170;
  $('med').style.left = frac(Math.min(med, MAX)) * 100 + '%'; $('medl').textContent = 'Median $' + med;
}
function draw(){
  const [a, b] = disp.map(frac);
  th[0].style.left = a * 100 + '%'; th[1].style.left = b * 100 + '%'; tips[0].style.left = th[0].style.left; tips[1].style.left = th[1].style.left;
  $('sel').style.left = a * 100 + '%'; $('sel').style.width = (b - a) * 100 + '%';
  const lo = MIN + a * (MAX - MIN), hi = MIN + b * (MAX - MIN);
  bars.forEach((el, i) => {
    const x0 = MIN + i * BIN, p = Math.max(0, Math.min(1, (lo - x0) / BIN)) * 100, q = Math.max(0, Math.min(1, (hi - x0) / BIN)) * 100;
    el.style.background = q <= 0 || p >= 100 ? 'var(--bar)' : `linear-gradient(90deg,var(--bar) ${p}%,var(--fill) ${p}%,var(--fill) ${q}%,var(--bar) ${q}%)`;
  });
}
let lastN = -1, srT = 0, live = false;
function commit(fromInput){
  th.forEach((t, k) => { t.setAttribute('aria-valuemin', k ? val[0] + GAP : MIN); t.setAttribute('aria-valuemax', k ? MAX : val[1] - GAP);
    t.setAttribute('aria-valuenow', val[k]); t.setAttribute('aria-valuetext', (k && val[k] >= MAX ? val[k] + ' dollars or more' : val[k] + ' dollars') + ' a night'); tips[k].textContent = fmt(val[k], k); });
  ins.forEach((el, k) => { if (el !== fromInput) el.value = val[k] + (k && val[k] >= MAX ? '+' : ''); });
  const hit = pool().filter(c => c.p >= val[0] && (val[1] >= MAX || c.p <= val[1]));
  const n = hit.length, w = n === 1 ? 'cabin' : 'cabins';
  $('n1').textContent = n; $('n2').textContent = n + ' ' + w; $('cta').lastChild.nodeValue = ' ' + w;
  $('rng').textContent = 'From ' + fmt(val[0]) + ' to ' + fmt(val[1], 1) + ' a night, sorted by guest rating';
  if (n !== lastN && lastN >= 0 && !reduce.matches){ const b = $('n1'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  lastN = n;
  if (live) { clearTimeout(srT); srT = setTimeout(() => $('sr').textContent = n + ' ' + w + ' between ' + fmt(val[0]) + ' and ' + fmt(val[1], 1), 600); }
  const top = hit.sort((x, y) => y.r - x.r || x.p - y.p).slice(0, 4);
  $('grid').innerHTML = top.length ? top.map(card).join('') : '<p class="none">No cabins in this range. Try widening the price.</p>';
}
const SK = [['#e9b98a', '#f5dcc0', '#59705e', '#2f4a3b'], ['#9fb7c9', '#dbe6ea', '#4f6b62', '#2b3f39'], ['#d9a7a0', '#f1d6c8', '#6b6a55', '#3e4234'], ['#b9c4a6', '#eef0dc', '#5b7a5a', '#2e4a35'], ['#c7b4d1', '#efe6ea', '#5f6b70', '#33403f']];
function card(c){
  const k = SK[c.h], peak = 40 + (c.p % 30);
  return `<a class="card" href="#" onclick="return false"><svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><linearGradient id="g${c.p}${c.h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${k[0]}"/><stop offset="1" stop-color="${k[1]}"/></linearGradient></defs>
<rect width="320" height="150" fill="url(#g${c.p}${c.h})"/><circle cx="${230 - c.km * 3}" cy="44" r="14" fill="#fff8ea" opacity=".85"/>
<path d="M0 110 L70 ${peak} L130 95 L200 ${peak + 14} L320 100 V150 H0z" fill="${k[2]}"/>
<path d="M0 130 Q80 112 160 124 T320 118 V150 H0z" fill="${k[3]}"/>
${c.t === 3 ? '<path d="M128 132 Q160 96 192 132z" fill="#3a2c22"/><rect x="154" y="118" width="12" height="14" fill="#f5c46b"/>' : c.t === 2 ? '<path d="M150 70 v62" stroke="#3a2c22" stroke-width="5"/><path d="M134 98 L160 80 L186 98 V112 H134z" fill="#3a2c22"/><rect x="154" y="98" width="10" height="9" fill="#f5c46b"/>' : c.t === 0 ? '<path d="M160 82 L196 134 H124z" fill="#3a2c22"/><path d="M160 106 L172 124 H148z" fill="#f5c46b"/>' : '<path d="M126 108 L160 88 L194 108z" fill="#3a2c22"/><rect x="130" y="106" width="60" height="28" fill="#4a3628"/><rect x="152" y="114" width="14" height="12" fill="#f5c46b"/>'}
</svg><span class="t"><b>${c.n}</b><span class="r"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.2l1.5-7L2 9.4l7-.8z"/></svg>${c.r}</span>
<small>${TYPES[c.t]} · ${c.km} km from Ashby</small><em><strong>$${c.p}</strong> night</em></span></a>`;
}
function spring(){
  cancelAnimationFrame(raf);
  if (reduce.matches){ disp = val.slice(); draw(); return; }
  let last = performance.now();
  const tick = now => {
    const dt = Math.min(.032, (now - last) / 1000) / 4; last = now; let busy = false;
    for (let k = 0; k < 2; k++){
      if (k === drag){ disp[k] = val[k]; vel[k] = 0; continue; }
      for (let j = 0; j < 4; j++){ vel[k] += (700 * (val[k] - disp[k]) - 38 * vel[k]) * dt; disp[k] += vel[k] * dt; }
      if (Math.abs(val[k] - disp[k]) > .2 || Math.abs(vel[k]) > 2) busy = true; else { disp[k] = val[k]; vel[k] = 0; }
    }
    if (disp[0] > disp[1] - 4) disp[0] = disp[1] - 4;
    draw(); if (busy) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function set(k, v, fromInput){
  v = Math.round(v / STEP) * STEP;
  v = k ? Math.max(val[0] + GAP, Math.min(MAX, v)) : Math.max(MIN, Math.min(val[1] - GAP, v));
  if (v === val[k]) return;
  val[k] = v; commit(fromInput); spring();
}
// pointer
const rail = $('rail');
const toVal = x => { const r = rail.getBoundingClientRect(), pad = parseFloat(getComputedStyle(rail).paddingLeft); return MIN + (x - r.left - pad) / (r.width - 2 * pad) * (MAX - MIN); };
rail.addEventListener('pointerdown', e => {
  if (e.button) return;
  const v = toVal(e.clientX);
  drag = th.indexOf(e.target);
  if (drag < 0) drag = Math.abs(v - val[0]) < Math.abs(v - val[1]) || (v < val[0]) ? 0 : 1;
  const jump = !th.includes(e.target);
  rail.setPointerCapture(e.pointerId); th[drag].classList.add('on'); tips[drag].classList.add('on');
  if (jump){ const k = drag; drag = -1; set(k, v); drag = k; } th[drag].focus({ preventScroll: true });
  e.preventDefault();
});
rail.addEventListener('pointermove', e => {
  if (drag < 0 || !rail.hasPointerCapture(e.pointerId)) return;
  const raw = toVal(e.clientX), over = drag ? val[0] + GAP - raw : raw - (val[1] - GAP);
  set(drag, raw); th[drag].style.setProperty('--sq', over > 0 ? 1 - Math.min(.24, over / 110) : 1);
});
const up = () => { if (drag < 0) return; th[drag].style.setProperty('--sq', 1); th[drag].classList.remove('on'); tips[drag].classList.remove('on'); drag = -1; spring(); };
rail.addEventListener('pointerup', up); rail.addEventListener('pointercancel', up);
// keyboard
th.forEach((t, k) => {
  t.addEventListener('keydown', e => {
    const big = STEP * 10, m = { ArrowRight: STEP, ArrowUp: STEP, ArrowLeft: -STEP, ArrowDown: -STEP, PageUp: big, PageDown: -big }[e.key];
    if (m !== undefined){ e.preventDefault(); set(k, val[k] + (e.shiftKey && Math.abs(m) === STEP ? m * 10 : m)); }
    else if (e.key === 'Home'){ e.preventDefault(); set(k, k ? val[0] + GAP : MIN); }
    else if (e.key === 'End'){ e.preventDefault(); set(k, k ? MAX : val[1] - GAP); }
  });
  t.addEventListener('focus', () => { if (t.matches(':focus-visible')) tips[k].classList.add('on'); });
  t.addEventListener('blur', () => tips[k].classList.remove('on'));
});
// boxes
ins.forEach((el, k) => {
  const read = () => parseInt(el.value.replace(/\D/g, ''), 10);
  el.addEventListener('input', () => { const v = read(); if (v >= MIN && v <= MAX && (k ? v >= val[0] + GAP : v <= val[1] - GAP)) set(k, v, el); });
  const fix = () => { const v = read(); if (!isNaN(v)) set(k, v, el); ins[k].value = ''; commit(); };
  el.addEventListener('change', fix);
  el.addEventListener('keydown', e => { if (e.key === 'Enter') fix(); if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); set(k, val[k] + (e.key === 'ArrowUp' ? 1 : -1) * STEP * (e.shiftKey ? 10 : 1)); } });
});
// chips
