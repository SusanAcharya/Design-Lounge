<!-- Design Lounge piece: kids-story-shelf · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en" data-night>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanternlight story shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@500;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0E6;--surf:#FBF8F1;--well:#DCE5D6;--text:#1F2A3D;--text-2:#46536A;--hl:#FFE08A;--hl-text:#1F2A3D;--accent:#2F6F6A;--accent-text:#FFFFFF;--edge:rgba(31,42,61,.10);
  --serif:"Lora",Georgia,serif;--sans:"Karla",system-ui,sans-serif;
  --r-cover:24px;--r-scene:28px;--r-pill:999px;--hit:64px;
  --lift:0 10px 26px rgba(20,28,51,.16);
  --ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);--sheet:cubic-bezier(.32,.72,0,1);
  --t-micro:160ms;--t-layout:320ms;--t-page:480ms;--t-theme:600ms;
}
:root[data-night]{--bg:#141C33;--surf:#1E2946;--well:#28355A;--text:#F3EBDD;--text-2:#C9C3D6;--hl:#F6D27A;--hl-text:#141C33;--accent:#F6D27A;--accent-text:#141C33;--edge:rgba(243,235,221,.10);--lift:0 10px 26px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:500 17px/1.35 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background var(--t-theme) var(--ease),color var(--t-theme) var(--ease)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--accent);outline-offset:4px}
.view{position:fixed;inset:0;max-width:390px;margin:0 auto;padding:54px 16px 34px;display:flex;flex-direction:column;background:var(--bg);transition:opacity var(--t-layout) var(--ease),transform var(--t-page) var(--sheet),background var(--t-theme) var(--ease),visibility 0s}
.view.off{opacity:0;visibility:hidden;transform:scale(.97);transition:opacity var(--t-layout) var(--ease),transform var(--t-page) var(--sheet),visibility 0s var(--t-layout)}
.bar{display:flex;align-items:center;gap:10px;height:64px}
.bar h1{flex:1;margin:0;font:600 30px/1 var(--serif);letter-spacing:-.01em}
.bar .mini{flex:1;min-width:0;text-align:center;font:700 15px/1.2 var(--sans);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:var(--hit);height:var(--hit);flex:none;border-radius:50%;background:var(--surf);box-shadow:0 0 0 1px var(--edge);display:grid;place-items:center;transition:background var(--t-theme)}
.round svg{width:28px;height:28px}
.nightBtn[aria-pressed="true"] path{fill:currentColor}
.grid{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cover{position:relative;height:284px;border-radius:var(--r-cover);overflow:hidden;box-shadow:var(--lift);text-align:left;transition:transform var(--t-micro) var(--ease)}
.cover:active{transform:scale(.97)}
.cover svg{position:absolute;left:0;top:0;width:100%;height:212px}
.cover .t{position:absolute;left:0;right:0;bottom:0;height:72px;padding:10px 14px;background:var(--surf);font:600 17px/1.2 var(--serif);color:var(--text);display:flex;align-items:center;transition:background var(--t-theme)}
.ribbon{position:absolute;right:16px;top:0;width:26px;height:40px;background:#E2574C;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.mode{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;height:76px}
.mode button{border-radius:var(--r-pill);border:2px solid var(--text-2);display:flex;align-items:center;justify-content:center;gap:10px;font:800 18px/1 var(--sans);color:var(--text-2);white-space:nowrap}
.mode button svg{width:28px;height:28px}
.mode button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.scene{position:relative;height:262px;margin-top:12px;border-radius:var(--r-scene);overflow:hidden;box-shadow:var(--lift);touch-action:pan-y}
.scene svg{width:100%;height:100%;display:block}
.words{margin:22px 4px 0;min-height:220px;font:500 30px/1.45 var(--serif);letter-spacing:-.005em;color:var(--text);touch-action:pan-y}
.words span{border-radius:10px;padding:0 3px;margin:0 -3px;transition:background var(--t-micro) var(--ease),color var(--t-micro)}
.words span.on{background:var(--hl);color:var(--hl-text)}
.words.myself span{cursor:pointer}
.turn-in{animation:turn var(--t-page) var(--expo)}
.turn-back{animation:turnb var(--t-page) var(--expo)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:auto;height:20px;align-items:center}
.dots i{width:10px;height:10px;border-radius:5px;background:var(--well);transition:width var(--t-layout) var(--ease),background var(--t-layout)}
.dots i.on{width:28px;background:var(--accent)}
.ctrl{display:flex;align-items:center;justify-content:space-between;height:96px;padding:0 8px}
.arrow{width:76px;height:76px;border-radius:50%;background:var(--surf);box-shadow:0 0 0 1px var(--edge);display:grid;place-items:center}
.arrow svg{width:34px;height:34px}
.arrow:disabled{opacity:1;color:var(--text-2);cursor:default}
.play{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;box-shadow:var(--lift)}
.play svg{width:38px;height:38px}
.next.nudge{animation:nudge 1.4s var(--ease) infinite}
.end{align-items:center;text-align:center}
.end .moon{width:220px;height:220px;margin-top:70px}
.end h2{margin:18px 0 0;font:italic 500 60px/1 var(--serif);letter-spacing:-.02em}
.end p{margin:14px 0 0;font:500 22px/1.35 var(--serif);color:var(--text-2)}
.end .acts{margin-top:auto;width:100%;display:grid;gap:12px}
.big{height:72px;border-radius:var(--r-pill);font:800 20px/1 var(--sans);display:flex;align-items:center;justify-content:center;gap:10px}
.big svg{width:26px;height:26px}
.big.pri{background:var(--accent);color:var(--accent-text)}
.big.sec{background:var(--surf);box-shadow:0 0 0 1px var(--edge)}
.beam{transform-origin:150px 74px;animation:sweep 6s var(--ease) infinite alternate}
.wave{animation:bob 4s var(--ease) infinite alternate}
.twk{animation:twk 3s var(--ease) infinite alternate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes turn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes turnb{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(6px)}}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(4px)}}
@keyframes twk{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .beam,.wave,.twk,.next.nudge{animation:none}
  .turn-in,.turn-back{animation:fade 200ms linear}
  .view,.view.off{transform:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>

<script>
(()=>{
const $=id=>document.getElementById(id);
const BOOKS=[
 {t:'The Sleepy Lighthouse',p:['Lumo the lighthouse stood by the sea. Every night, he sent out his warm, round light.','One foggy night, a little boat was lost. "Over here!" called Lumo, and he shone extra bright.','The boat came home, slow and safe. The fish blew bubbles. The gulls tucked in their heads.','Lumo gave a big, salty yawn. The sun came up, so he closed his eye. Good night, Lumo.']},
 {t:'Otto Counts the Stars',p:['Otto the owl could not sleep. "I will count the stars," he said.','One, two, three. Four, five, six. His eyes grew heavy.','Seven, eight, nine. Otto tucked his head under his wing. Good night, Otto.']},
 {t:'A Hat for Hedgehog',p:['Hedgehog wanted a hat. But every hat got stuck on his spikes.','Then Mole knitted him a red hat with holes, one for every spike.','It fit just right. Hedgehog wore it all the way to bed.']},
 {t:"The Moon's Lost Sock",p:['The moon had lost a sock. She looked behind every cloud.','A little girl found it on her washing line. It was pink and soft.','She sent it up on a kite. The moon was warm again. Good night, moon.']}
];
let book=0,page=1,mode='me',reading=false,timer=0,token=0,idx=-1,night=true;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function live(t){$('live').textContent=t}
$('grid').innerHTML=BOOKS.map((b,i)=>`<button class="cover" type="button" data-b="${i}" aria-label="${b.t}${i===0?', page 2 of 4':''}"><svg viewBox="0 0 300 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#s${i}"/></svg>${i===0?'<span class="ribbon"></span>':''}<span class="t">${b.t}</span></button>`).join('');
function show(v){['shelf','story','end'].forEach(id=>{const e=$(id);e.classList.toggle('off',id!==v);e.inert=id!==v})}
function words(){return [...$('words').children]}
function render(dir){
  stop();const B=BOOKS[book];$('mini').textContent=B.t;$('sceneUse').setAttribute('href','#s'+book);
  const w=$('words');w.innerHTML=B.p[page].split(' ').map(x=>`<span>${x}</span>`).join(' ');w.classList.toggle('myself',mode==='self');
  w.classList.remove('turn-in','turn-back');void w.offsetWidth;if(dir)w.classList.add(dir>0?'turn-in':'turn-back');
  $('dots').innerHTML=B.p.map((_,i)=>`<i class="${i===page?'on':''}"></i>`).join('');
  $('prev').disabled=page===0;$('next').classList.remove('nudge');
  $('next').setAttribute('aria-label',page===B.p.length-1?'Finish story':'Next page');
  live('Page '+(page+1)+' of '+B.p.length+'. '+B.p[page]);
}
function hl(i){idx=i;words().forEach((s,k)=>s.classList.toggle('on',k===i))}
function setPlay(on){reading=on;$('playIco').innerHTML=on?'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>':'<path d="M8 5.5v13l10.5-6.5z"/>';$('play').setAttribute('aria-label',on?'Pause reading':'Read this page')}
function stop(){token++;clearTimeout(timer);try{speechSynthesis.cancel()}catch(e){}setPlay(false)}
function pageDone(t){if(t!==token)return;setPlay(false);hl(-1);if(mode==='me'){$('next').classList.add('nudge');timer=setTimeout(()=>{if(t===token)turn(1)},1500)}}
function timed(t,from){const ws=words();let i=from;const step=()=>{if(t!==token)return;if(i>=ws.length){pageDone(t);return}hl(i);const d=280+ws[i].textContent.length*55;i++;timer=setTimeout(step,d)};step()}
function read(){
  const t=++token;clearTimeout(timer);setPlay(true);const ws=words();const text=ws.map(s=>s.textContent).join(' ');
  const starts=[];let c=0;ws.forEach(s=>{starts.push(c);c+=s.textContent.length+1});
  let got=false;
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)throw 0;
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.82;u.pitch=1.05;
    u.onboundary=e=>{if(t!==token||e.name==='sentence')return;got=true;let k=0;while(k+1<starts.length&&starts[k+1]<=e.charIndex)k++;hl(k)};
    u.onend=()=>{if(got)pageDone(t)};
    speechSynthesis.speak(u);
    timer=setTimeout(()=>{if(!got&&t===token)timed(t,0)},700);
  }catch(e){timed(t,0)}
}
function turn(d){
  const B=BOOKS[book],n=page+d;
  if(n<0)return;if(n>=B.p.length){stop();$('endLine').textContent=book===0?'Sleep tight, Juno. Lumo is sleeping too.':'Sleep tight, Juno.';show('end');setTimeout(()=>$('again').focus({preventScroll:true}),RM?0:340);live('The end.');return}
  page=n;render(d);if(mode==='me')read();
}
function open(b,p){book=b;page=p;show('story');render(1);setTimeout(()=>$('play').focus({preventScroll:true}),RM?0:340);if(mode==='me')read()}
$('grid').onclick=e=>{const c=e.target.closest('.cover');if(c)open(+c.dataset.b,+c.dataset.b===0?1:0)};
document.querySelector('.mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;document.querySelectorAll('.mode button').forEach(x=>x.setAttribute('aria-checked',x===b))};
document.querySelector('.mode').onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const bs=[...document.querySelectorAll('.mode button')],o=bs.find(b=>b.getAttribute('aria-checked')!=='true');o.click();o.focus()}};
$('play').onclick=()=>{if(reading){stop();hl(-1)}else read()};
$('prev').onclick=()=>turn(-1);$('next').onclick=()=>turn(1);
$('back').onclick=()=>{stop();show('shelf');document.querySelector('.cover').focus({preventScroll:true})};
$('again').onclick=()=>open(book,0);
$('toShelf').onclick=()=>{show('shelf');document.querySelector('.cover').focus({preventScroll:true})};
$('words').onclick=e=>{if(mode!=='self'||e.target.tagName!=='SPAN')return;stop();const k=words().indexOf(e.target);hl(k);try{const u=new SpeechSynthesisUtterance(e.target.textContent.replace(/[^\w']/g,''));u.rate=.8;speechSynthesis.speak(u)}catch(x){}timer=setTimeout(()=>hl(-1),900)};
document.querySelectorAll('.nightBtn').forEach(b=>b.onclick=()=>{night=!night;document.documentElement.toggleAttribute('data-night',night);document.querySelectorAll('.nightBtn').forEach(x=>{x.setAttribute('aria-pressed',night)});live(night?'Night mode on':'Night mode off')});
let sx=null;const sw=$('story');
sw.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sx=e.clientX});
sw.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60)turn(dx<0?1:-1)});
document.addEventListener('keydown',e=>{if($('story').classList.contains('off'))return;if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);if(e.key==='Escape')$('back').click()});
document.documentElement.setAttribute('data-night','');show('shelf');
})();
</script>
</body>
</html>
