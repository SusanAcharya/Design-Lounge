<!-- Design Lounge piece: gallery-contact-sheet · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Contact sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6;--surface:#fff;--ink:#1a1814;--ink-2:#5c5348;--line:#ddd4c6;--focus:#1a1814;
  --serif:"Fraunces",Georgia,serif;--sans:"Public Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
.kicker{margin:0;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--ink-2)}
h1{margin:8px 0 20px;font:500 40px/1 var(--serif)}
.sheet{display:grid;grid-template-columns:repeat(4,120px);gap:8px}
button{width:120px;height:120px;padding:0;border:2px solid transparent;border-radius:2px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.cap{margin:16px 0 0;font:500 28px/1.1 var(--serif)}
.meta{margin:4px 0 0;color:var(--ink-2)}
</style>
</head>
<body>
<p class="kicker">NORTH PLATES</p>
<h1>Contact sheet</h1>
<div class="sheet" id="sheet">
  <button type="button" data-name="North wall" data-meta="Plate 01 · morning" style="background:#c4b49a" aria-pressed="true" aria-label="North wall"></button>
  <button type="button" data-name="Gate light" data-meta="Plate 02 · morning" style="background:#d7c4a3" aria-pressed="false" aria-label="Gate light"></button>
  <button type="button" data-name="Salt" data-meta="Plate 03 · noon" style="background:#e6e0d4" aria-pressed="false" aria-label="Salt"></button>
  <button type="button" data-name="River" data-meta="Plate 04 · noon" style="background:#b7c4c0" aria-pressed="false" aria-label="River"></button>
  <button type="button" data-name="Wool" data-meta="Plate 05 · afternoon" style="background:#c9b8a8" aria-pressed="false" aria-label="Wool"></button>
  <button type="button" data-name="Noon" data-meta="Plate 06 · afternoon" style="background:#e2c7a4" aria-pressed="false" aria-label="Noon"></button>
  <button type="button" data-name="Ink" data-meta="Plate 07 · evening" style="background:#2c2825" aria-pressed="false" aria-label="Ink"></button>
  <button type="button" data-name="Yard" data-meta="Plate 08 · evening" style="background:#b9c3a8" aria-pressed="false" aria-label="Yard"></button>
</div>
<p class="cap" id="cap">North wall</p>
<p class="meta" id="meta">Plate 01 · morning</p>
<script>
const buttons = [...document.querySelectorAll('#sheet button')];
const cap = document.getElementById('cap');
const meta = document.getElementById('meta');
buttons.forEach(b => b.addEventListener('click', () => {
  buttons.forEach(n => n.setAttribute('aria-pressed', n === b ? 'true' : 'false'));
  cap.textContent = b.dataset.name;
  meta.textContent = b.dataset.meta;
}));
</script>
</body>
</html>
