<!-- Design Lounge piece: load-failed-retry · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Could not load runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5a554c;--ink-3:#8a847a;
  --line:#e4dfd4;--primary:#1f4d3a;--primary-ink:#f6f4ef;--danger:#9b2c2c;--danger-soft:#f8e8e6;--focus:#1f4d3a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{height:64px;display:flex;align-items:center;padding:0 32px;border-bottom:1px solid var(--line);background:var(--surface)}
h1{margin:0;font-size:20px;font-weight:500}
main{padding:24px 32px;max-width:880px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--danger-soft);color:var(--danger);border-radius:2px;padding:12px 14px}
.banner p{margin:0;font-weight:500}
.banner button,.again{height:36px;padding:0 14px;border-radius:2px;border:1px solid currentColor;background:transparent;color:inherit;font-weight:500}
.list{display:none;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:2px}
.list.show{display:block}
.list div{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 16px;border-top:1px solid var(--line)}
.list div:first-child{border-top:0}
.list b{font-weight:600}
.list span{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.again{display:none;margin-top:12px;border-color:var(--line);color:var(--ink-2)}
.again.show{display:inline-flex;align-items:center}
</style>
</head>
<body>
<header><h1>Runs</h1></header>
<main>
  <div class="banner" id="banner" role="alert">
    <p>Could not load runs. The yard desk did not answer.</p>
    <button id="retry" type="button">Retry</button>
  </div>
  <div class="list" id="list">
    <div><b>Bay 14</b><span>2,400 kg · 06:40</span></div>
    <div><b>Bay 3</b><span>860 kg · 07:10</span></div>
    <div><b>Bay 9</b><span>1,120 kg · 07:40</span></div>
  </div>
  <button class="again" id="again" type="button">Show the failure</button>
</main>
<script>
const banner = document.getElementById('banner');
const list = document.getElementById('list');
const again = document.getElementById('again');
document.getElementById('retry').addEventListener('click', () => {
  banner.hidden = true;
  list.classList.add('show');
  again.classList.add('show');
});
again.addEventListener('click', () => {
  banner.hidden = false;
  list.classList.remove('show');
  again.classList.remove('show');
});
</script>
</body>
</html>
