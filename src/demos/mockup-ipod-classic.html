<!-- Design Lounge piece: mockup-ipod-classic · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Aubade click-wheel player mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#d6f03b;--ink:#0f0f0e;--ink-2:#2c3010;--hl:#ff4fa3;
  --sans:"Familjen Grotesk",system-ui,sans-serif;--pix:"Pixelify Sans",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
  /* finish: White */
  --front:#f6f6f3;--front-2:#e4e4df;--wheel:#fbfbf9;--wheel-2:#e9e9e4;--glyph:#a4a4a0;--btn:#efefeb;--rim-1:#f4f5f6;--rim-2:#9ea2a7;
}
body[data-finish="black"]{--front:#1d1d1f;--front-2:#0d0d0e;--wheel:#2b2b2e;--wheel-2:#1f1f22;--glyph:#8a8a8f;--btn:#1a1a1c;--rim-1:#7a7d82;--rim-2:#2a2b2e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 var(--sans);color:var(--ink);background:var(--stage);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.page{min-height:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:40px;padding:40px clamp(24px,7vw,110px);position:relative;overflow:hidden}
.poster{display:flex;flex-direction:column;gap:24px}
h1{margin:0;font:700 clamp(64px,10.5vw,148px)/.86 var(--sans);letter-spacing:-.045em}
h1 span{display:block;-webkit-text-stroke:2px var(--ink);color:transparent}
.sub{margin:0;max-width:34ch;font-size:17px;font-weight:500;color:var(--ink-2)}
.ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ctrl small{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;padding:3px}
.seg button{height:36px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;transition:background-color .16s var(--ease),color .16s var(--ease)}
.seg button i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--stage)}
.seg button[aria-pressed="true"] i{box-shadow:0 0 0 1.5px var(--stage)}
.rig{position:relative;width:min(330px,calc(100vw - 72px),calc((100vh - 110px)*.6));container-type:inline-size}
.shell{position:relative;aspect-ratio:.6;border-radius:9cqw;padding:1cqw;background:linear-gradient(135deg,var(--rim-1),var(--rim-2) 40%,var(--rim-1) 60%,var(--rim-2));box-shadow:0 6cqw 10cqw -4cqw rgba(30,40,0,.55),0 2cqw 3cqw rgba(30,40,0,.25);transition:background .3s var(--ease)}
.hold{position:absolute;top:-1.6cqw;left:13cqw;width:13cqw;height:2.2cqw;border-radius:1cqw 1cqw 0 0;background:linear-gradient(var(--rim-1),var(--rim-2))}
.hold::after{content:"";position:absolute;left:2cqw;top:.6cqw;width:4cqw;height:1.2cqw;border-radius:.4cqw;background:#6d6f73}
.jack{position:absolute;top:-1cqw;right:16cqw;width:6cqw;height:1.4cqw;border-radius:50% 50% 0 0;background:#111}
.front{position:relative;height:100%;border-radius:8.2cqw;background:radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.35),transparent 60%),linear-gradient(var(--front),var(--front-2));display:flex;flex-direction:column;align-items:center;padding-top:7cqw;transition:background .3s var(--ease)}
.lcd{position:relative;width:84cqw;height:64cqw;border-radius:2cqw;background:#0c0c0c;padding:1.6cqw;box-shadow:inset 0 .4cqw .8cqw rgba(0,0,0,.4),0 0 0 .4cqw rgba(0,0,0,.08)}
.disp{position:relative;height:100%;border-radius:.6cqw;overflow:hidden;background:#f7f8f6;color:#141414;font:400 5.1cqw/1 var(--pix)}
.disp::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.45) 0 22%,transparent 22.5%),repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 1px,transparent 1px 2px)}
.hdr{height:9cqw;display:flex;align-items:center;justify-content:space-between;padding:0 2.4cqw;background:linear-gradient(#fdfdfd,#d9dbd8);border-bottom:1px solid #a9aca8;font-weight:600}
.hdr svg{width:4.6cqw;height:4.6cqw}
.hdr .bat{width:7cqw;height:3.4cqw;border:.5cqw solid #333;border-radius:.6cqw;padding:.3cqw;position:relative}
.hdr .bat::after{content:"";position:absolute;right:-1.3cqw;top:.6cqw;width:.6cqw;height:1.2cqw;background:#333}
.hdr .bat i{display:block;height:100%;width:70%;background:#3c9a3c}
.view{position:absolute;top:9cqw;left:0;right:0;bottom:0;display:none}
.view.on{display:flex}
.list{margin:0;padding:0;list-style:none;flex:1;min-width:0}
.list li{height:7.6cqw;display:flex;align-items:center;justify-content:space-between;padding:0 2.4cqw;white-space:nowrap;overflow:hidden}
.list li span{opacity:.75}
.list li::after{content:"›";font-size:6cqw;line-height:1}
.list li.np::after,.list li.nochev::after{content:""}
.list li[aria-selected="true"]{background:linear-gradient(#ff7cbc,var(--hl));color:#fff}
.split .list{flex:0 0 52%}
.peek{flex:1;position:relative;overflow:hidden;border-left:1px solid #c9ccc8}
.art{position:absolute;inset:0;background:var(--art)}
.a0{--art:radial-gradient(circle at 60% 38%,#ffd36b 0 18%,transparent 18.5%),linear-gradient(#0f4f5a 0 58%,#0b3640 58%)}
.a1{--art:repeating-linear-gradient(90deg,#e8412c 0 12%,#f3e3cc 12% 18%),#e8412c}
.a2{--art:radial-gradient(circle at 30% 70%,#f2c230 0 22%,transparent 22.5%),linear-gradient(135deg,#151515,#2c2c2c)}
.peek .art{transition:opacity .5s var(--ease)}
.np-v{flex-direction:column;padding:2.6cqw 3cqw 2.4cqw;gap:2cqw}
.np-top{display:flex;gap:3cqw;flex:1;min-height:0}
.np-art{position:relative;flex:0 0 27cqw;height:27cqw;box-shadow:0 1cqw 1.6cqw rgba(0,0,0,.25)}
.np-meta{display:flex;flex-direction:column;gap:1.6cqw;min-width:0;padding-top:1cqw}
.np-meta b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta span{font-size:4.4cqw;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta em{font-style:normal;font-size:4cqw;color:#777}
.meter{height:3.4cqw;border:1px solid #888;border-radius:.4cqw;background:linear-gradient(#fff,#e8e8e6);overflow:hidden}
.meter i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(#ff8cc5,var(--hl))}
.times{display:flex;justify-content:space-between;font-size:4cqw;color:#444}
.vol{display:none;align-items:center;gap:2cqw}
.vol .meter{flex:1}
.vol svg{width:4.6cqw;height:4.6cqw}
.np-v.vshow .vol{display:flex}.np-v.vshow .prog{display:none}
.wheel{position:relative;margin-top:auto;margin-bottom:12cqw;width:72cqw;height:72cqw;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--wheel),var(--wheel-2));box-shadow:inset 0 .6cqw 1cqw rgba(255,255,255,.4),inset 0 -.8cqw 1.4cqw rgba(0,0,0,.08),0 0 0 .3cqw rgba(0,0,0,.05);touch-action:none;cursor:grab;transition:background .3s var(--ease)}
.wheel.drag{cursor:grabbing}
.wheel::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from calc(var(--a,0)*1deg - 45deg),transparent,rgba(0,0,0,.1) 45deg,transparent 90deg 360deg);opacity:0;transition:opacity .2s var(--ease)}
.wheel.drag::before{opacity:1}
.ring{position:absolute;inset:0;border-radius:50%}
.ring:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.wb{position:absolute;display:grid;place-items:center;color:var(--glyph);width:16cqw;height:12cqw;border-radius:3cqw;transition:color .12s var(--ease)}
.wb:active{color:var(--hl)}
.wb svg{width:6cqw;height:6cqw}
.wb.m{top:3cqw;left:50%;margin-left:-8cqw;font:700 4.4cqw/1 var(--sans);letter-spacing:.06em}
.wb.p{bottom:3cqw;left:50%;margin-left:-8cqw}
.wb.l{left:2cqw;top:50%;margin-top:-6cqw;width:12cqw;height:16cqw;margin-top:-8cqw}
.wb.r{right:2cqw;top:50%;width:12cqw;height:16cqw;margin-top:-8cqw}
.center{position:absolute;left:50%;top:50%;width:27cqw;height:27cqw;margin:-13.5cqw;border-radius:50%;background:linear-gradient(var(--front),var(--front-2));box-shadow:inset 0 .4cqw .6cqw rgba(255,255,255,.35),0 0 0 .4cqw rgba(0,0,0,.06),0 .4cqw .8cqw rgba(0,0,0,.12);transition:transform .1s var(--ease)}
.center:active{transform:scale(.97)}
.hint{margin:0;font-size:13px;font-weight:500;color:var(--ink-2);display:flex;gap:16px;flex-wrap:wrap}
.hint b{font-weight:700;color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:820px){
  .page{grid-template-columns:1fr;justify-items:center;padding:32px 24px 48px}
  .poster{order:2;align-items:flex-start}
  h1{font-size:64px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important}
}
</style>
</head>
<body data-finish="white">
<main class="page">
  <section class="poster">
    <h1>Spin<span>to scroll.</span></h1>
    <p class="sub">Aubade 160, a click-wheel player mockup. Trace a circle on the wheel to move through the menu, press the centre to choose.</p>
    <div class="ctrl">
      <small>Finish</small>
      <div class="seg" role="group" aria-label="Finish">
        <button type="button" aria-pressed="true" data-f="white" style="--c:#f6f6f3"><i></i>White</button>
        <button type="button" aria-pressed="false" data-f="black" style="--c:#1d1d1f"><i></i>Black</button>
      </div>
    </div>
    <p class="hint"><span><b>Drag</b> around the wheel</span><span><b>↑ ↓</b> scroll · <b>Enter</b> select · <b>Esc</b> menu</span></p>
  </section>

  <div class="rig">
    <div class="shell">
      <i class="hold" aria-hidden="true"></i><i class="jack" aria-hidden="true"></i>
      <div class="front">
        <div class="lcd"><div class="disp" id="disp">
          <div class="hdr" aria-hidden="true">
            <svg id="pstate" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span id="title">Aubade</span>
            <span class="bat"><i></i></span>
          </div>
          <div class="view split on" id="v-list"><ul class="list" id="list" role="listbox" aria-label="Menu"></ul><div class="peek" aria-hidden="true"><div class="art a0" id="peek"></div></div></div>
          <div class="view np-v" id="v-np">
            <div class="np-top"><div class="np-art art a0" id="npArt"></div>
              <div class="np-meta"><em id="npIdx">1 of 7</em><b id="npT">Salt Lines</b><span id="npA">Marit Sand</span><span id="npL">Low Tide Hymnal</span></div></div>
            <div class="prog"><div class="meter"><i id="bar"></i></div><div class="times"><span id="el">0:00</span><span id="rem">-3:42</span></div></div>
            <div class="vol"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg><div class="meter"><i id="vbar"></i></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></div>
          </div>
        </div></div>
        <div class="wheel" id="wheel">
          <div class="ring" id="ring" tabindex="0" role="slider" aria-label="Click wheel. Up and down arrows scroll, Enter selects, Escape goes back" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1" aria-valuetext="Music"></div>
          <button class="wb m" type="button" data-act="menu" aria-label="Menu, go back">MENU</button>
          <button class="wb l" type="button" data-act="prev" aria-label="Previous track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12l-10-6z"/></svg></button>
          <button class="wb r" type="button" data-act="next" aria-label="Next track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l10-6z"/></svg></button>
          <button class="wb p" type="button" data-act="play" aria-label="Play or pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6v12l9-6zM14 6h2.5v12H14zM18.5 6H21v12h-2.5z"/></svg></button>
          <button class="center" type="button" data-act="select" aria-label="Select"></button>
        </div>
      </div>
    </div>
  </div>
  <p class="sr" aria-live="polite" id="live"></p>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const songs = [
    ['Salt Lines', 'Marit Sand', 'Low Tide Hymnal', 222, 0], ['Harbour Bells', 'Marit Sand', 'Low Tide Hymnal', 245, 0],
    ['Paper Engines', 'The Velours', 'Paper Engines', 198, 1], ['Ribbon Road', 'The Velours', 'Paper Engines', 176, 1],
    ['Night Bus to Vale', 'Odun', 'Sodium Hours', 311, 2], ['Sodium Glow', 'Odun', 'Sodium Hours', 217, 2],
    ['Last Ferry', 'Marit Sand', 'Low Tide Hymnal', 268, 0]
  ];
  const set = { Shuffle: ['Off', 'Songs'], Repeat: ['Off', 'One', 'All'], Backlight: ['10 s', '30 s', 'Always'] };
  const st = { Shuffle: 0, Repeat: 2, Backlight: 0 };
  const menus = {
    main: { t: 'Aubade', items: [['Music', 'songs'], ['Playlists', 'lists'], ['Artists', 'artists'], ['Settings', 'settings'], ['Shuffle Songs', 'shuffle'], ['Now Playing', 'np']] },
    songs: { t: 'Songs', items: songs.map((s, i) => [s[0], 'play:' + i]) },
    lists: { t: 'Playlists', items: [['Sunday Slow', 'play:1'], ['Night Drive', 'play:4'], ['Kitchen Radio', 'play:2'], ['Recently Added', 'play:6']] },
    artists: { t: 'Artists', items: [['Marit Sand', 'play:0'], ['Odun', 'play:4'], ['The Velours', 'play:2']] },
    settings: { t: 'Settings', items: Object.keys(set).map(k => [k, 'tog:' + k]) }
  };
  const disp = $('disp'), list = $('list'), title = $('title'), live = $('live'), ring = $('ring'), wheel = $('wheel');
  const vList = $('v-list'), vNp = $('v-np');
  let stack = [], menu = 'main', sel = 0, view = 'list';
  let track = 0, pos = 0, playing = false, vol = 62, volT;
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const label = (it) => it[1].startsWith('tog:') ? `${it[0]}<span>${set[it[0]][st[it[0]]]}</span>` : it[0];

  function render() {
    const m = menus[menu];
    title.textContent = view === 'np' ? 'Now Playing' : m.t;
    vList.classList.toggle('on', view === 'list'); vNp.classList.toggle('on', view === 'np');
    vList.classList.toggle('split', menu === 'main');
    if (view === 'list') {
      const rows = 6, top = Math.max(0, Math.min(sel - rows + 1, m.items.length - rows));
      list.innerHTML = m.items.slice(top, top + rows).map((it, k) => {
        const i = top + k, cls = it[1] === 'np' ? 'np' : it[1].startsWith('tog:') || it[1].startsWith('play:') ? 'nochev' : '';
        return `<li role="option" class="${cls}" aria-selected="${i === sel}" id="o${i}">${label(it)}</li>`;
      }).join('');
      list.setAttribute('aria-activedescendant', 'o' + sel);
      ring.setAttribute('aria-valuemax', m.items.length); ring.setAttribute('aria-valuenow', sel + 1);
      ring.setAttribute('aria-valuetext', m.items[sel][0]);
      const tgt = m.items[sel][1], idx = tgt.startsWith('play:') ? songs[+tgt.slice(5)][4] : tgt === 'np' ? songs[track][4] : sel % 3;
      $('peek').className = 'art a' + idx;
    } else {
      ring.setAttribute('aria-valuetext', `Volume ${vol} percent`);
      ring.setAttribute('aria-valuemax', 100); ring.setAttribute('aria-valuenow', vol);
    }
    renderNp();
  }
  function renderNp() {
    const s = songs[track];
    $('npT').textContent = s[0]; $('npA').textContent = s[1]; $('npL').textContent = s[2];
    $('npIdx').textContent = `${track + 1} of ${songs.length}`; $('npArt').className = 'np-art art a' + s[4];
    $('bar').style.setProperty('--p', (pos / s[3] * 100) + '%');
    $('el').textContent = fmt(pos); $('rem').textContent = '-' + fmt(s[3] - pos);
    $('vbar').style.setProperty('--p', vol + '%');
    $('pstate').innerHTML = playing ? '<path d="M8 5v14l11-7z"/>' : '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';
  }
  const say = t => { live.textContent = t; };
  function scroll(d) {
    if (view === 'np') {
      vol = Math.max(0, Math.min(100, vol + d * 4));
      vNp.classList.add('vshow'); clearTimeout(volT); volT = setTimeout(() => vNp.classList.remove('vshow'), 1400);
      render(); return;
    }
    const n = menus[menu].items.length, ns = Math.max(0, Math.min(n - 1, sel + d));
    if (ns === sel) return;
    sel = ns; render(); say(menus[menu].items[sel][0]);
  }
  function play(i) { track = i; pos = 0; playing = true; view = 'np'; render(); say(`Now playing ${songs[i][0]} by ${songs[i][1]}`); }
  function act(a) {
    if (a === 'select') {
      if (view === 'np') { playing = !playing; renderNp(); say(playing ? 'Playing' : 'Paused'); return; }
      const tgt = menus[menu].items[sel][1];
      if (menus[tgt]) { stack.push([menu, sel]); menu = tgt; sel = 0; render(); say(menus[tgt].t + ', ' + menus[tgt].items[0][0]); }
      else if (tgt.startsWith('play:')) { stack.push([menu, sel]); play(+tgt.slice(5)); }
      else if (tgt === 'shuffle') { stack.push([menu, sel]); play(Math.floor(Math.random() * songs.length)); }
      else if (tgt === 'np') { stack.push([menu, sel]); view = 'np'; render(); say('Now playing ' + songs[track][0]); }
      else if (tgt.startsWith('tog:')) { const k = tgt.slice(4); st[k] = (st[k] + 1) % set[k].length; render(); say(`${k} ${set[k][st[k]]}`); }
    } else if (a === 'menu') {
      if (!stack.length) return;
      [menu, sel] = stack.pop(); view = 'list'; render(); say(menus[menu].t);
    } else if (a === 'play') { playing = !playing; renderNp(); say(playing ? 'Playing' : 'Paused'); }
    else if (a === 'next') { track = (track + 1) % songs.length; pos = 0; render(); say(songs[track][0]); }
    else if (a === 'prev') { if (pos > 3) pos = 0; else track = (track + songs.length - 1) % songs.length, pos = 0; render(); say(songs[track][0]); }
  }

  const STEP = 22;
  let active = false, dragging = false, prevA = 0, acc = 0, total = 0, swallow = false;
  const ang = e => { const r = wheel.getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI; };
  wheel.addEventListener('pointerdown', e => {
    if (e.target.closest('.center')) return;
    active = true; dragging = false; prevA = ang(e); acc = 0; total = 0;
  });
  wheel.addEventListener('pointermove', e => {
    if (!active) return;
    const a = ang(e); let d = a - prevA; if (d > 180) d -= 360; if (d < -180) d += 360; prevA = a;
    acc += d; total += Math.abs(d);
    if (!dragging && total > 12) { dragging = true; wheel.setPointerCapture(e.pointerId); wheel.classList.add('drag'); }
    if (dragging) {
      wheel.style.setProperty('--a', (a + 90).toFixed(1));
      while (acc >= STEP) { acc -= STEP; scroll(1); }
      while (acc <= -STEP) { acc += STEP; scroll(-1); }
    }
  });
  const end = () => { if (dragging) swallow = true; active = false; dragging = false; wheel.classList.remove('drag'); setTimeout(() => { swallow = false; }, 0); };
  wheel.addEventListener('pointerup', end); wheel.addEventListener('pointercancel', end);
  wheel.addEventListener('click', e => {
    if (swallow) { e.stopPropagation(); e.preventDefault(); swallow = false; return; }
    const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act);
  }, true);
  ring.addEventListener('keydown', e => {
    const m = { ArrowDown: () => scroll(1), ArrowRight: () => scroll(1), ArrowUp: () => scroll(-1), ArrowLeft: () => scroll(-1), Enter: () => act('select'), Escape: () => act('menu'), Backspace: () => act('menu'), ' ': () => act('play') }[e.key];
    if (m) { e.preventDefault(); m(); }
  });
  document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    document.body.dataset.finish = b.dataset.f;
    document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b));
    say(b.textContent.trim() + ' finish');
  }));
  setInterval(() => {
    if (!playing || document.hidden) return;
    pos++;
    if (pos >= songs[track][3]) { track = (track + 1) % songs.length; pos = 0; render(); } else renderNp();
  }, 1000);
  pos = 64; render();
})();
</script>
