<!-- Design Lounge piece: portfolio-architect-index · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>N. Rimal — Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e2d8;--ink:#161412;--ink-2:#6a655c;--ink-3:#9a9488;--line:#c8c2b4;--red:#c8102e;
  --sans:"Schibsted Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:40px;--g:16px;--nav:48px;--row:52px;
  --t:180ms;--t-swap:320ms;--ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--g);padding:0 var(--pad)}
nav{height:var(--nav);align-items:center;border-bottom:1px solid var(--line);font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
nav .mk{grid-column:1/4}
nav .loc{grid-column:4/8;color:var(--ink-2)}
nav ul{grid-column:8/13;display:flex;justify-content:flex-end;gap:22px;list-style:none;margin:0;padding:0}
nav a[aria-current]::after{content:"";display:block;height:1px;background:var(--red);margin-top:4px}
nav a:hover{color:var(--red)}
.hero{padding:28px var(--pad) 18px;align-items:end}
.hero h1{grid-column:1/9;margin:0;font:700 120px/.78 var(--sans);letter-spacing:-.055em}
.hero h1 b{font-weight:700;color:var(--red)}
.hero .meta{grid-column:9/13;padding-bottom:10px;display:flex;flex-direction:column;gap:10px}
.hero .meta p{margin:0;font:400 15px/1.35 var(--sans);max-width:22ch}
.hero .meta small{font:400 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.board{min-height:calc(100vh - 260px);padding-bottom:48px}
.list{grid-column:1/8}
.plan{grid-column:8/13;position:sticky;top:64px;height:456px;border:1px solid var(--ink);background:#efece4;overflow:hidden}
.thead,.row{display:grid;grid-template-columns:48px 1fr 110px 48px;align-items:center;height:var(--row);padding:0 4px 0 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.thead{height:28px;font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--ink)}
.row{color:var(--ink);transition:color var(--t) var(--ease),background var(--t) var(--ease)}
.row .no{font:500 12px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.row .nm{font:500 20px/1 var(--sans);letter-spacing:-.02em}
.row .ty,.row .yr{font:400 11px/1 var(--mono);color:var(--ink-2);letter-spacing:.04em}
.row .yr{text-align:right}
.list.dim .row{opacity:.34}
.list.dim .row.on{opacity:1}
.row.on{background:transparent;box-shadow:inset 2px 0 0 var(--red)}
.row.on .no{color:var(--red)}
.row.on .nm{color:var(--ink)}
.row:hover .nm,.row:focus-visible .nm{transform:translateX(6px)}
.row .nm{transition:transform var(--t-swap) var(--expo)}
.stage{position:absolute;inset:0}
.stage svg{position:absolute;inset:28px 24px 56px;width:calc(100% - 48px);height:calc(100% - 84px);opacity:0;transition:opacity var(--t-swap) var(--ease)}
.stage svg.on{opacity:1}
.stage svg{stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:square;stroke-linejoin:miter}
.stage .hl{stroke:var(--red);stroke-width:2.2}
.cap{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-top:1px solid var(--ink);font:400 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.cap b{color:var(--red);font-weight:500}
.n-arrow{position:absolute;top:12px;right:14px;font:500 10px var(--mono);letter-spacing:.14em}
.n-arrow i{display:block;width:1px;height:18px;background:var(--ink);margin:0 auto 3px;position:relative}
.n-arrow i::before{content:"";position:absolute;top:0;left:-3px;border:4px solid transparent;border-bottom:6px solid var(--ink);border-top:0}
@media (max-width:1024px){.hero h1{font-size:88px}.plan{height:380px}}
@media (max-width:768px){.hero h1{grid-column:1/-1;font-size:72px}.hero .meta,.plan{grid-column:1/-1}.plan{position:relative;top:0;height:320px;margin-top:20px}.list{grid-column:1/-1}nav .loc{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}.row .nm{transform:none!important}}
</style>
</head>
<body>
<nav class="g" aria-label="Primary">
  <a class="mk" href="#">N. Rimal / Practice</a>
  <span class="loc">Kathmandu · 27.7172° N</span>
  <ul>
    <li><a href="#" aria-current="page">Index</a></li>
    <li><a href="#">Drawings</a></li>
    <li><a href="#">Office</a></li>
    <li><a href="#">Write</a></li>
  </ul>
</nav>
<header class="hero g">
  <h1>N.<b>RIMAL</b></h1>
  <div class="meta">
    <p>Rooms, courts and the air between them. Eight built works, 2017–2024.</p>
    <small>Index 08 · Civic / Culture / Health</small>
  </div>
</header>
<section class="board g" aria-label="Selected works">
  <div class="list" id="list">
    <div class="thead"><span>No</span><span>Project</span><span>Type</span><span>Year</span></div>
    <button class="row on" data-i="0" aria-pressed="true"><span class="no">01</span><span class="nm">Court House</span><span class="ty">Civic</span><span class="yr">24</span></button>
    <button class="row" data-i="1" aria-pressed="false"><span class="no">02</span><span class="nm">Ridge Library</span><span class="ty">Culture</span><span class="yr">23</span></button>
    <button class="row" data-i="2" aria-pressed="false"><span class="no">03</span><span class="nm">Grain Silo Hall</span><span class="ty">Adaptive</span><span class="yr">22</span></button>
    <button class="row" data-i="3" aria-pressed="false"><span class="no">04</span><span class="nm">Tea Pavilion</span><span class="ty">Garden</span><span class="yr">21</span></button>
    <button class="row" data-i="4" aria-pressed="false"><span class="no">05</span><span class="nm">River Steps</span><span class="ty">Public</span><span class="yr">20</span></button>
    <button class="row" data-i="5" aria-pressed="false"><span class="no">06</span><span class="nm">Night Market</span><span class="ty">Market</span><span class="yr">19</span></button>
    <button class="row" data-i="6" aria-pressed="false"><span class="no">07</span><span class="nm">Hill Clinic</span><span class="ty">Health</span><span class="yr">18</span></button>
    <button class="row" data-i="7" aria-pressed="false"><span class="no">08</span><span class="nm">Courtyard School</span><span class="ty">School</span><span class="yr">17</span></button>
  </div>
  <aside class="plan" id="plan" aria-live="polite">
    <div class="n-arrow" aria-hidden="true"><i></i>N</div>
    <div class="stage">
      <svg class="on" viewBox="0 0 200 160" aria-hidden="true"><rect x="18" y="14" width="164" height="132"/><rect class="hl" x="62" y="50" width="76" height="60"/><path d="M18 80h44M138 80h44M100 14v36M100 110v36"/><circle cx="62" cy="50" r="2.2" fill="var(--ink)" stroke="none"/><circle cx="138" cy="50" r="2.2" fill="var(--ink)" stroke="none"/><circle cx="62" cy="110" r="2.2" fill="var(--ink)" stroke="none"/><circle cx="138" cy="110" r="2.2" fill="var(--ink)" stroke="none"/></svg>
      <svg viewBox="0 0 200 160" aria-hidden="true"><rect x="12" y="36" width="176" height="88"/><path d="M48 36v88M80 36v88M112 36v88M144 36v88"/><rect class="hl" x="12" y="36" width="36" height="88"/><path d="M20 28h20M170 124v20"/></svg>
      <svg viewBox="0 0 200 160" aria-hidden="true"><circle cx="72" cy="80" r="42"/><circle class="hl" cx="72" cy="80" r="18"/><rect x="114" y="48" width="70" height="64"/><path d="M114 80h-22M148 48v-16h20"/></svg>
      <svg viewBox="0 0 200 160" aria-hidden="true"><rect x="50" y="30" width="100" height="100"/><path d="M50 80h100M100 30v100"/><rect class="hl" x="78" y="58" width="44" height="44"/><path d="M100 30L78 58M100 30l22 28M78 102l22 28 22-28"/></svg>
      <svg viewBox="0 0 200 160" aria-hidden="true"><path d="M16 40h168M16 56h168M16 72h168M16 88h148M16 104h128M16 120h108"/><path class="hl" d="M16 40v80"/><path d="M16 120h40v20"/></svg>
      <svg viewBox="0 0 200 160" aria-hidden="true"><rect x="16" y="24" width="168" height="112"/><path d="M16 52h168M16 80h168M16 108h168M58 24v112M100 24v112M142 24v112"/><rect class="hl" x="58" y="52" width="42" height="28"/></svg>
      <svg viewBox="0 0 200 160" aria-hidden="true"><path d="M28 28h90v104H28z"/><path d="M118 76h54v56H28"/><rect class="hl" x="28" y="76" width="90" height="56"/><path d="M52 28v48M88 28v48M28 52h90"/></svg>
      <svg viewBox="0 0 200 160" aria-hidden="true"><rect x="20" y="16" width="72" height="56"/><rect x="108" y="16" width="72" height="56"/><rect x="20" y="88" width="72" height="56"/><rect x="108" y="88" width="72" height="56"/><rect class="hl" x="72" y="56" width="56" height="48"/><path d="M56 44h16M128 44H112M56 116h16M128 116H112"/></svg>
    </div>
    <div class="cap"><span id="cap">01 · Court House · Patan Durbar square edge</span><b>1 : 200</b></div>
  </aside>
</section>
<script>
const caps=["01 · Court House · Patan Durbar square edge","02 · Ridge Library · Sarangkot ridge, Pokhara","03 · Grain Silo Hall · Biratnagar mill yard","04 · Tea Pavilion · Ilam estate garden","05 · River Steps · Bagmati ghat, Kathmandu","06 · Night Market · Pulchowk shed, Lalitpur","07 · Hill Clinic · Dhulikhel saddle","08 · Courtyard School · Bhaktapur tole"];
const list=document.getElementById('list'),rows=[...list.querySelectorAll('.row')],svgs=[...document.querySelectorAll('.stage svg')],cap=document.getElementById('cap');
function set(i){rows.forEach((r,n)=>{const on=n===i;r.classList.toggle('on',on);r.setAttribute('aria-pressed',String(on));});svgs.forEach((s,n)=>s.classList.toggle('on',n===i));cap.textContent=caps[i];list.classList.add('dim');}
rows.forEach((r,i)=>{r.addEventListener('pointerenter',()=>set(i));r.addEventListener('focus',()=>set(i));r.addEventListener('click',()=>set(i));});
list.addEventListener('pointerleave',()=>{if(!list.contains(document.activeElement))list.classList.remove('dim');rows[0]&&set(0);});
addEventListener('keydown',e=>{if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;const i=rows.findIndex(r=>r.classList.contains('on'));const n=e.key==='ArrowDown'?Math.min(rows.length-1,i+1):Math.max(0,i-1);e.preventDefault();rows[n].focus();set(n);});
set(0);
</script>
</body>
</html>
