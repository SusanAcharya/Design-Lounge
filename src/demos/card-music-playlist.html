<!-- Design Lounge piece: card-music-playlist · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Slow Lanes — playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Rethink+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d8ddcb;--card:#f7f4ea;--row:#efebdd;--ink:#1b201b;--ink-2:#565c52;--line:#ddd8c6;
  --cobalt:#2b44e0;--ochre:#e3a23a;--coral:#e8674a;--pine:#2f4a3a;--cream:#f3ecd9;
  --serif:"Gloock",Georgia,serif;--sans:"Rethink Sans",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);color:var(--ink);background:var(--bg);display:grid;place-items:center;padding:32px;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px;width:min(960px,100%);background:var(--card);border-radius:20px;padding:28px;box-shadow:0 1px 0 rgba(27,32,27,.06),0 40px 80px -40px rgba(27,32,27,.35)}
/* left */
.collage{display:grid;grid-template-columns:1fr 1fr;gap:4px;aspect-ratio:1;border-radius:12px;overflow:hidden}
.art{position:relative;overflow:hidden}
.a0{background:var(--cobalt)}
.a0::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:var(--ochre);left:-12%;bottom:-24%}
.a0::after{content:"";position:absolute;left:0;right:0;top:22%;height:2px;background:var(--cream);box-shadow:0 8px 0 var(--cream),0 16px 0 var(--cream)}
.a1{background:repeating-linear-gradient(-45deg,var(--coral) 0 14px,var(--cream) 14px 18px)}
.a2{background:radial-gradient(circle at 100% 100%,var(--cream) 0 14%,var(--pine) 14% 26%,var(--cream) 26% 30%,var(--pine) 30% 44%,var(--cream) 44% 48%,var(--pine) 48%)}
.a3{background:var(--ochre)}
.a3::before{content:"";position:absolute;left:12%;right:12%;top:30%;bottom:-40%;border-radius:50% 50% 0 0;background:var(--cobalt)}
.a3::after{content:"";position:absolute;width:16%;aspect-ratio:1;border-radius:50%;background:var(--coral);right:16%;top:14%}
.kicker{margin:22px 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:0;font:400 46px/1 var(--serif);letter-spacing:-.01em}
.desc{margin:10px 0 0;color:var(--ink-2);font-size:14px;max-width:34ch}
.by{margin:12px 0 0;font-size:12px;color:var(--ink-2)}
.by b{color:var(--ink);font-weight:600}
.ctrls{display:flex;align-items:center;gap:8px;margin-top:20px}
.play{width:56px;height:56px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center;transition:transform .16s var(--ease)}
.play:hover{transform:scale(1.05)}.play:active{transform:scale(.95)}
.play svg{width:22px;height:22px;fill:currentColor;stroke:none}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:background .16s var(--ease),color .16s var(--ease)}
.ib:hover{background:var(--row);color:var(--ink)}
.ib[aria-pressed=true]{color:var(--cobalt)}
#shuffle[aria-pressed=true]{background:#e2e5f8}
#like[aria-pressed=true] svg{fill:var(--coral);stroke:var(--coral)}
#like.pop svg{animation:pop .42s var(--expo)}
@keyframes pop{30%{transform:scale(1.35)}}
.total{margin-left:auto;font-size:12px;color:var(--ink-2);text-align:right;line-height:1.3}
.total b{display:block;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
/* right */
.list-wrap{display:flex;flex-direction:column;min-width:0}
.thead{display:grid;grid-template-columns:40px minmax(0,1fr) 60px;gap:12px;padding:0 12px 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.thead span:last-child{text-align:right}
ol{list-style:none;margin:6px 0 0;padding:0;position:relative}
.track{position:relative}
.tp{display:grid;grid-template-columns:40px minmax(0,1fr) 60px;gap:12px;align-items:center;width:100%;min-height:44px;padding:4px 12px;border-radius:8px;text-align:left;transition:background .16s var(--ease)}
.tp:hover,.tp:focus-visible{background:var(--row)}
.tp:focus-visible{outline-offset:-2px}
.idx{position:relative;height:20px;display:grid;place-items:center;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.idx svg{position:absolute;width:16px;height:16px;fill:currentColor;stroke:none;opacity:0;color:var(--ink)}
.tp:hover .idx .n,.tp:focus-visible .idx .n{opacity:0}
.tp:hover .idx svg,.tp:focus-visible .idx svg{opacity:1}
.ti{min-width:0;display:flex;flex-direction:column}
.ti b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.track[aria-current=true] .ti b{color:var(--cobalt)}
.track[aria-current=true] .idx .n{opacity:0}
.track[aria-current=true] .tp:hover .idx svg{opacity:0}
.bars{display:none;align-items:flex-end;gap:2px;height:14px;color:var(--cobalt)}
.track[aria-current=true] .idx .bars{display:flex;position:absolute}
.bars i{width:3px;height:100%;background:currentColor;border-radius:1px;transform-origin:bottom;animation:eq 1s var(--ease) infinite alternate}
.bars i:nth-child(2){animation-duration:.7s;animation-delay:-.3s}
.bars i:nth-child(3){animation-duration:1.2s;animation-delay:-.6s}
.bars i:nth-child(4){animation-duration:.85s;animation-delay:-.1s}
@keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.paused .bars i{animation-play-state:paused}
/* now playing */
.now{margin-top:auto;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--card)}
.now .art{width:44px;height:44px;border-radius:6px}
.now .ti b{font-size:14px}
.now .ti span{color:#b9bfb2}
.now .row{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:11px;font-variant-numeric:tabular-nums;color:#b9bfb2}
.bar{flex:1;height:4px;border-radius:2px;background:#3b423a;position:relative;cursor:pointer}
.bar i{position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:var(--card);border-radius:2px}
.bar i::after{content:"";position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--card)}
.now .bars{display:flex;color:var(--ochre);height:16px}
.now .ib{color:var(--card)}
.now .ib:hover{background:#2e352d}
.now .ib svg{fill:currentColor;stroke:none}
.np-ctrls{display:flex;align-items:center;gap:2px}
.flipping{transition:transform .42s var(--expo)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:900px){.card{grid-template-columns:minmax(0,1fr)}.collage{max-width:300px}}
@media (max-width:480px){
  body{padding:12px}.card{padding:18px;gap:24px}
  h1{font-size:38px}
  .now{grid-template-columns:44px minmax(0,1fr)}.np-ctrls{grid-column:1/-1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<article class="card" aria-labelledby="pl">
  <section>
    <div class="collage" aria-hidden="true"><i class="art a0"></i><i class="art a1"></i><i class="art a2"></i><i class="art a3"></i></div>
    <p class="kicker">Playlist · Updated Thursday</p>
    <h1 id="pl">Slow Lanes</h1>
    <p class="desc">Night-drive records for the ring road after midnight. Warm tape, low beams, nobody in a hurry.</p>
    <p class="by">Compiled by <b>Nisha Gurung</b> · <span id="saves">1,204</span> saves</p>
    <div class="ctrls">
      <button class="play" id="play" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="playIco"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <button class="ib" id="shuffle" type="button" aria-pressed="false" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3c4 0 6 10 10 10h3M4 17h3c1.6 0 2.8-1.6 3.8-3.5M13.2 9.5C14.2 8 15.4 7 17 7h3M17.5 4l2.5 3-2.5 3M17.5 14l2.5 3-2.5 3"/></svg>
      </button>
      <button class="ib" id="like" type="button" aria-pressed="false" aria-label="Save playlist">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      </button>
      <p class="total"><b id="total"></b><span id="count"></span></p>
    </div>
  </section>
  <section class="list-wrap" aria-label="Tracks">
    <div class="thead" aria-hidden="true"><span>#</span><span>Title</span><span>Time</span></div>
    <ol id="list"></ol>
    <div class="now" id="now" aria-label="Now playing" role="region">
      <i class="art" id="npArt" aria-hidden="true"></i>
      <div class="ti">
        <b id="npT"></b><span id="npA"></span>
        <div class="row"><span id="el">0:00</span><span class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0"><i></i></span><span id="du">0:00</span></div>
      </div>
      <div class="np-ctrls">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <button class="ib" id="prev" type="button" aria-label="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg></button>
        <button class="ib" id="next" type="button" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg></button>
      </div>
    </div>
  </section>
  <p class="sr" role="status" id="live"></p>
</article>
<script>
const T = [
  ['Sodium Lights', 'Parade of Small Hours', 222], ['Ring Road, 2am', 'Tara Vale', 258], ['Kerosene Blue', 'The Lantern Set', 185],
  ['Underpass', 'Juno Marr', 311], ['Slow Indicator', 'Okra Dusk', 236], ['Petrol Rain', 'Mekh Ensemble', 242],
  ['Last Bus Home', 'Sabin and the Quiet', 208], ['Overpass Choir', 'Tara Vale', 284], ['Low Beams', 'Parade of Small Hours', 217],
  ['Toll Booth Lullaby', 'Juno Marr', 304]
].map((t, i) => ({ id: i, title: t[0], artist: t[1], len: t[2] }));
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const list = $('list'), card = document.querySelector('.card'), live = $('live');
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
let order = T.map(t => t.id), cur = 1, el = 72, playing = true, saves = 1204;

const sum = T.reduce((a, t) => a + t.len, 0);
$('total').textContent = `${Math.floor(sum / 60)} min ${String(sum % 60).padStart(2, '0')} s`;
$('count').textContent = `${T.length} tracks`;

T.forEach(t => {
  const li = document.createElement('li');
  li.className = 'track'; li.dataset.id = t.id;
  li.innerHTML = `<button class="tp" type="button" aria-label="Play ${t.title} by ${t.artist}, ${mmss(t.len)}"><span class="idx"><span class="n"></span><svg viewBox="0 0 24 24" aria-hidden="true">${PLAY}</svg><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span><span class="ti"><b>${t.title}</b><span>${t.artist}</span></span><span class="dur">${mmss(t.len)}</span></button>`;
  li.querySelector('.tp').addEventListener('click', () => { if (cur === t.id) toggle(); else start(t.id); });
  t.li = li; list.appendChild(li);
});
function numbers() { order.forEach((id, i) => { T[id].li.querySelector('.n').textContent = i + 1; }); }

function paint() {
  const t = T[cur];
  T.forEach(x => x.li.toggleAttribute('aria-current', false));
  t.li.setAttribute('aria-current', 'true');
  $('npArt').className = 'art a' + (cur % 4);
  $('npT').textContent = t.title; $('npA').textContent = t.artist;
  $('du').textContent = mmss(t.len);
  $('bar').setAttribute('aria-valuemax', t.len);
  progress();
  card.classList.toggle('paused', !playing);
  $('playIco').innerHTML = playing ? PAUSE : PLAY;
  $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  T.forEach(x => x.li.querySelector('.tp').setAttribute('aria-label', (x.id === cur && playing ? 'Pause ' : 'Play ') + `${x.title} by ${x.artist}, ${mmss(x.len)}`));
}
function progress() {
  const t = T[cur];
  $('el').textContent = mmss(el);
  $('bar').style.setProperty('--p', (el / t.len * 100) + '%');
  $('bar').setAttribute('aria-valuenow', el);
  $('bar').setAttribute('aria-valuetext', `${mmss(el)} of ${mmss(t.len)}`);
}
function start(id) { cur = id; el = 0; playing = true; paint(); live.textContent = `Playing ${T[id].title} by ${T[id].artist}`; }
function toggle() { playing = !playing; paint(); live.textContent = playing ? 'Playing' : 'Paused'; }
function step(d) { const i = order.indexOf(cur); start(order[(i + d + order.length) % order.length]); }
$('play').onclick = toggle;
$('next').onclick = () => step(1);
$('prev').onclick = () => (el > 3 ? (el = 0, progress()) : step(-1));
setInterval(() => { if (!playing) return; el++; if (el >= T[cur].len) step(1); else progress(); }, 1000);
$('bar').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); el = Math.round((e.clientX - r.left) / r.width * T[cur].len); progress(); });
$('bar').addEventListener('keydown', e => {
  const d = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
  if (d) { e.preventDefault(); el = Math.min(T[cur].len - 1, Math.max(0, el + d)); progress(); }
});

/* shuffle with FLIP */
$('shuffle').onclick = e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', on);
  const first = new Map(T.map(t => [t.id, t.li.getBoundingClientRect().top]));
  if (on) {
    const rest = order.filter(id => id !== cur);
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    order = [cur, ...rest];
  } else order = T.map(t => t.id);
  order.forEach(id => list.appendChild(T[id].li));
  numbers();
  live.textContent = on ? 'Shuffle on. Queue reordered.' : 'Shuffle off. Original order.';
  if (reduce) return;
  T.forEach((t, i) => {
    const dy = first.get(t.id) - t.li.getBoundingClientRect().top;
    if (!dy) return;
    t.li.classList.remove('flipping'); t.li.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      t.li.classList.add('flipping'); t.li.style.transitionDelay = (i * 18) + 'ms'; t.li.style.transform = '';
    }));
  });
};
$('like').onclick = e => {
  const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on);
  b.setAttribute('aria-label', on ? 'Remove from saved' : 'Save playlist');
  saves += on ? 1 : -1; $('saves').textContent = saves.toLocaleString('en-US');
  b.classList.remove('pop'); if (on) { void b.offsetWidth; b.classList.add('pop'); }
  live.textContent = on ? 'Playlist saved.' : 'Removed from saved.';
};
numbers(); paint();
</script>
</body>
</html>
