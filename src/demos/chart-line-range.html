<!-- Design Lounge piece: chart-line-range · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>186 t</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5a554c;--ink-3:#8a847a;
  --line:#e4dfd4;--primary:#1f4d3a;--focus:#1f4d3a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kicker{margin:0 0 8px;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
h1{margin:0;font-family:var(--mono);font-size:56px;font-weight:500;letter-spacing:-.04em;line-height:1}
.sub{margin:8px 0 28px;color:var(--ink-2);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:20px 16px 12px;max-width:880px}
.plot{display:grid;grid-template-columns:40px 1fr;gap:8px}
.axis{height:220px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;color:var(--ink-3);font-family:var(--mono);font-size:11px}
.stage{position:relative;height:220px;margin:0 12px}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.line{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;pathLength:1;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 700ms cubic-bezier(0.2,0.7,0.2,1) forwards}
.stage button{position:absolute;width:32px;height:32px;transform:translate(-50%,-50%);border:0;background:transparent;padding:0}
.dot{display:block;width:8px;height:8px;margin:auto;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1.5px var(--primary)}
button[aria-pressed="true"] .dot{width:11px;height:11px;background:var(--primary)}
.labs{display:flex;margin:8px 12px 0}
.labs span{flex:1;text-align:center;font-size:11px;color:var(--ink-3)}
.labs span[data-on="true"]{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.line{animation:none;stroke-dashoffset:0}}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<p class="kicker">Tonnage this quarter</p>
<h1 id="num">186 t</h1>
<p class="sub" id="sub">Week of 28 Sep · 13 Jul – 28 Sep</p>
<div class="card">
  <div class="plot">
    <div class="axis" aria-hidden="true"><span>240</span><span>120</span><span>0</span></div>
    <div>
      <div class="stage">
        <svg viewBox="0 0 1100 220" preserveAspectRatio="none" aria-hidden="true">
          <polyline class="line" pathLength="1" points="0,92 100,80.6 200,86.3 300,70.8 400,65.9 500,76.5 600,54.5 700,64.3 800,51.2 900,57.7 1000,43.9 1100,56.1"/>
        </svg>
        <div role="group" aria-label="Weekly tonnage">
          <button type="button" style="left:0%;top:41.8%" data-i="0" data-week="13 Jul" data-n="142" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:9.09%;top:36.6%" data-i="1" data-week="20 Jul" data-n="156" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:18.18%;top:39.2%" data-i="2" data-week="27 Jul" data-n="149" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:27.27%;top:32.2%" data-i="3" data-week="3 Aug" data-n="168" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:36.36%;top:30%" data-i="4" data-week="10 Aug" data-n="174" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:45.45%;top:34.8%" data-i="5" data-week="17 Aug" data-n="161" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:54.55%;top:24.8%" data-i="6" data-week="24 Aug" data-n="188" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:63.64%;top:29.2%" data-i="7" data-week="31 Aug" data-n="176" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:72.73%;top:23.3%" data-i="8" data-week="7 Sep" data-n="192" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:81.82%;top:26.2%" data-i="9" data-week="14 Sep" data-n="184" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:90.91%;top:20%" data-i="10" data-week="21 Sep" data-n="201" aria-pressed="false"><i class="dot"></i></button>
          <button type="button" style="left:100%;top:25.5%" data-i="11" data-week="28 Sep" data-n="186" aria-pressed="true"><i class="dot"></i></button>
        </div>
      </div>
      <div class="labs" aria-hidden="true">
        <span>13 Jul</span><span>20 Jul</span><span>27 Jul</span><span>3 Aug</span><span>10 Aug</span><span>17 Aug</span><span>24 Aug</span><span>31 Aug</span><span>7 Sep</span><span>14 Sep</span><span>21 Sep</span><span data-on="true">28 Sep</span>
      </div>
    </div>
  </div>
</div>
<script>
const buttons = [...document.querySelectorAll('.stage button')];
const labs = [...document.querySelectorAll('.labs span')];
const num = document.getElementById('num');
const sub = document.getElementById('sub');
function select(b){
  buttons.forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  labs.forEach((lab, i) => lab.dataset.on = String(i === Number(b.dataset.i)));
  num.textContent = b.dataset.n + ' t';
  sub.textContent = 'Week of ' + b.dataset.week + ' · 13 Jul – 28 Sep';
}
buttons.forEach(b => {
  b.setAttribute('aria-label', 'Week of ' + b.dataset.week + ', ' + b.dataset.n + ' tonnes');
  b.addEventListener('click', () => select(b));
  b.addEventListener('mouseenter', () => select(b));
});
</script>
</body>
</html>
