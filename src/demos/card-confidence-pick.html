<!-- Design Lounge piece: card-confidence-pick · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Late — A pick</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5c564e;--line:#e4dfd4;
  --bar:#1f4d3a;--track:#e4dfd4;--soft:#e7f2ec;
  --serif:"Fraunces",Georgia,serif;--sans:"Public Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);display:grid;place-items:center;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--bar);outline-offset:3px}
.card{width:560px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:28px}
.kicker{margin:0;font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--bar)}
h1{margin:14px 0 0;font:560 28px/1.15 var(--serif);letter-spacing:-.02em}
.meter{margin-top:16px}
.meter-top{display:flex;justify-content:space-between;font:500 13px var(--sans);color:var(--ink-2)}
.track{margin-top:8px;height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.fill{height:100%;width:72%;background:var(--bar)}
.line{height:1px;background:var(--line);margin:22px 0}
.other{display:block;width:100%;text-align:left;padding:0;border:0;background:transparent;cursor:pointer;font:inherit;color:inherit}
.other small{display:block;margin-bottom:4px;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.other b{font:500 18px/1.3 var(--serif);font-weight:560}
.acts{display:flex;gap:8px;margin-top:22px}
.use{height:44px;padding:0 16px;border:0;border-radius:2px;background:var(--bar);color:#f6f4ef;font:600 14px var(--sans);cursor:pointer}
.other[aria-pressed="true"] b{color:var(--bar)}
.other[aria-pressed="true"]{background:var(--soft);margin:0 -8px;padding:8px;width:calc(100% + 16px)}
.status{margin:14px 0 0;min-height:22px;font-size:14px;color:var(--bar)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<article class="card">
  <p class="kicker">A pick for the late edition</p>
  <h1 id="short">Rain holds the south bed.</h1>
  <div class="meter">
    <div class="meter-top"><span>Confidence</span><span>72%</span></div>
    <div class="track" aria-hidden="true"><div class="fill"></div></div>
  </div>
  <div class="line"></div>
  <button class="other" type="button" id="long" aria-pressed="false">
    <small>The other option</small>
    <b>The south bed still holds Tuesday's rain, so leave the soil.</b>
  </button>
  <div class="acts">
    <button class="use" type="button" id="use" aria-pressed="false">Use the short headline</button>
  </div>
  <p class="status" id="status" role="status"></p>
</article>
<script>
const use = document.getElementById('use');
const long = document.getElementById('long');
const status = document.getElementById('status');
function pick(which){
  const shortOn = which === 'short';
  use.setAttribute('aria-pressed', shortOn ? 'true' : 'false');
  long.setAttribute('aria-pressed', shortOn ? 'false' : 'true');
  status.textContent = shortOn ? 'The short headline is in the edition.' : 'The long headline is in the edition.';
}
use.addEventListener('click', () => pick('short'));
long.addEventListener('click', () => pick('long'));
</script>
</body>
</html>
