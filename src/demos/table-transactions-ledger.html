<!-- Design Lounge piece: table-transactions-ledger · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Ordwell Bank ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e3d8;--surface:#f7f5ef;--sunk:#efece3;--band:#12332a;--band-ink:#f1ede2;--band-2:#a9bdb3;
  --ink:#13201c;--ink-2:#3d4a45;--ink-3:#5b6762;--line:#d8d3c6;--line-2:#c4bdac;
  --accent:#1d4a3c;--credit:#1c6a44;--credit-bg:#e1ece4;--brass:#8a6a2f;--focus:#8a6a2f;
  --serif:"Spectral",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:4px;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--serif);padding:28px;display:flex;justify-content:center;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.book{width:100%;max-width:1080px;height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 30px 60px -40px rgba(18,51,42,.5);min-width:0}
.band{background:var(--band);color:var(--band-ink);padding:22px 28px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap;border-radius:var(--r) var(--r) 0 0}
.acct{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--band-2);margin:0 0 10px;display:flex;gap:10px;align-items:center}
.acct svg{width:16px;height:16px}
h1{font:500 28px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.bal{text-align:right}
.bal small{display:block;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--band-2);margin-bottom:8px}
.bal output{font:500 34px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal output span{color:var(--band-2);font-size:22px}
.tools{display:flex;gap:12px;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;min-width:0}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,74,60,.14)}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:15px}
.search input::placeholder{color:var(--ink-3)}
kbd{font:500 11px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:1px 6px;color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;flex:none}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:0 14px;line-height:38px;font:500 12px/38px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);border-left:1px solid var(--line-2);transition:background .15s,color .15s}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--accent);color:var(--band-ink)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-4px}
.count{font:400 12px var(--mono);color:var(--ink-3);margin-left:auto;white-space:nowrap}
.scroll{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:720px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface);font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;height:40px;padding:0 16px;border-bottom:1px solid var(--ink)}
th.num,td.num{text-align:right}
.sort{background:none;border:0;padding:6px 0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.sort:hover{color:var(--ink)}
.sort i{font-style:normal;width:10px;color:var(--brass)}
th[aria-sort="ascending"] .sort,th[aria-sort="descending"] .sort{color:var(--ink)}
th[aria-sort="ascending"] .sort i::after{content:"\25B2"}
th[aria-sort="descending"] .sort i::after{content:"\25BC"}
th[aria-sort] .sort i::after{font-size:8px}
tr.day th{text-align:left;padding:18px 16px 8px;border-bottom:1px solid var(--line);font-weight:400}
.day-in{display:flex;justify-content:space-between;align-items:baseline;gap:16px;position:sticky;left:16px;max-width:calc(100vw - 80px)}
.day-in b{font:600 15px var(--serif)}
.day-in span{font:400 12px var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
td{height:54px;padding:0 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.tx{transition:background .15s}
tbody tr.tx:hover{background:var(--sunk)}
.m{display:flex;align-items:center;gap:12px;min-width:0}
.ico{width:34px;height:34px;flex:none;border-radius:var(--r);display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);color:var(--accent)}
.ico svg{width:18px;height:18px}
.ico.in{background:var(--credit-bg);border-color:transparent;color:var(--credit)}
.m b{font-weight:500;display:block;white-space:nowrap}
.m small{display:block;font:400 11px/1.3 var(--mono);color:var(--ink-3);letter-spacing:.02em}
.cat{font:400 12px var(--mono);color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.cat::before{content:"";width:7px;height:7px;border-radius:1px;background:var(--c,var(--line-2))}
.when{font:400 12px var(--mono);color:var(--ink-3);white-space:nowrap}
.amt,.run{font:500 15px var(--mono);font-variant-numeric:tabular-nums;white-space:pre}
.amt.in{color:var(--credit)}
.run{color:var(--ink-3);font-weight:400;font-size:14px}
th.c-m{width:34%}
td.c-m{position:sticky;left:0;background:inherit}
tbody tr.tx td.c-m{background:var(--surface)}
tbody tr.tx:hover td.c-m{background:var(--sunk)}
thead th.c-m{left:0;z-index:3}
mark{background:#f0dfae;color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:64px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font:500 20px var(--serif);color:var(--ink);margin-bottom:6px}
.empty button{margin-top:14px;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:720px){
  body{padding:10px}
  .band{padding:18px 16px}
  .bal{text-align:left}
  .bal output{font-size:28px}
  .tools{padding:12px 16px}
  .search{flex-basis:100%}
  .seg{flex:1 1 100%}.seg label{flex:1;text-align:center}.seg span{padding:0 6px}
  .day-in{flex-direction:column;gap:2px;max-width:calc(100vw - 72px)}
  .day-in b{white-space:nowrap}
  .count{margin-left:0}
  td,thead th{padding:0 12px}
  table{min-width:440px}
  th.c-m{width:auto}
  td,thead th{padding:0 8px}
  td.c-m,thead th.c-m{padding-left:12px}
  .c-cat{display:none}
  .when .d{display:none}
  .m b{max-width:130px;overflow:hidden;text-overflow:ellipsis}
  .ico{width:30px;height:30px}
  .m{gap:10px}
  .scroll{box-shadow:inset -14px 0 12px -12px rgba(19,32,28,.25)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<main class="book" aria-labelledby="t">
  <header class="band">
    <div>
      <p class="acct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>Ordwell Bank · Everyday ··4417</p>
      <h1 id="t">Account ledger</h1>
    </div>
    <div class="bal"><small>Available balance</small><output id="avail" aria-live="off"></output></div>
  </header>
  <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span class="sr">Search transactions</span><input id="q" type="search" placeholder="Search merchant, category or reference" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
    <div class="seg" role="radiogroup" aria-label="Direction">
      <label><input type="radio" name="dir" value="all" checked><span>All</span></label>
      <label><input type="radio" name="dir" value="in"><span>Money in</span></label>
      <label><input type="radio" name="dir" value="out"><span>Money out</span></label>
    </div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="scroll" tabindex="0" role="region" aria-labelledby="t">
    <table>
      <caption class="sr">Transactions, newest first, grouped by day. Column headers sort the table.</caption>
      <thead><tr>
        <th scope="col" class="c-m" data-k="merchant" aria-sort="none"><button class="sort" type="button">Merchant<i aria-hidden="true"></i></button></th>
        <th scope="col" class="c-cat" data-k="cat" aria-sort="none"><button class="sort" type="button">Category<i aria-hidden="true"></i></button></th>
        <th scope="col" data-k="t" aria-sort="descending"><button class="sort" type="button">Date<i aria-hidden="true"></i></button></th>
        <th scope="col" class="num" data-k="amt" aria-sort="none"><button class="sort" type="button">Amount<i aria-hidden="true"></i></button></th>
        <th scope="col" class="num">Balance</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</main>
<script>
const I={
 cart:'<path d="M3 4h2.5l2.2 10.5h10.6L20.5 8H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>',
 cup:'<path d="M5 9h11v5a5 5 0 01-5 5h-1a5 5 0 01-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 010 5H16M9 3v3M12 3v3"/>',
 pay:'<rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M3 10h18M7 15h4"/>',
 bus:'<rect x="5" y="3" width="14" height="14" rx="2"/><path d="M5 11h14M8 20v-3M16 20v-3"/><circle cx="8.5" cy="14" r=".6"/><circle cx="15.5" cy="14" r=".6"/>',
 home:'<path d="M4 11l8-7 8 7M6 9.5V20h12V9.5M10 20v-5h4v5"/>',
 bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
 plus:'<path d="M12 5v14M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="3"/>',
 book:'<path d="M5 4h9a4 4 0 014 4v12H9a4 4 0 01-4-4z"/><path d="M5 16a3 3 0 013-3h10"/>',
 swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>'
};
const C={Groceries:"#6f8f5a",Dining:"#b07a3a",Income:"#1c6a44",Transit:"#3d6b86",Housing:"#7a5c48",Utilities:"#c09a2c",Health:"#9a4a4a",Books:"#5a5a80",Transfer:"#7d8580"};
const opening=2318.42;
const raw=[
 ["2026-09-29T08:12","Fernway Transit","Monthly pass","Transit","bus",-96.00],
 ["2026-09-29T12:40","Pike Street Roasters","Card ··4417","Dining","cup",-6.75],
 ["2026-09-29T18:05","Greenleaf Grocers","Card ··4417","Groceries","cart",-84.19],
 ["2026-09-30T09:00","Meridian Payroll","Salary · Sep","Income","pay",3450.00],
 ["2026-09-30T09:14","Oakhurst Lettings","Rent · Oct","Housing","home",-1650.00],
 ["2026-09-30T19:22","Vela Pharmacy","Card ··4417","Health","plus",-23.40],
 ["2026-10-01T07:48","Pike Street Roasters","Card ··4417","Dining","cup",-4.50],
 ["2026-10-01T10:30","Copperline Energy","Direct debit","Utilities","bolt",-118.62],
 ["2026-10-01T16:02","Savings ··2290","To savings","Transfer","swap",-400.00],
 ["2026-10-02T13:15","Quire Books","Card ··4417","Books","book",-31.98],
 ["2026-10-02T17:44","Greenleaf Grocers","Card ··4417","Groceries","cart",-56.07],
 ["2026-10-03T11:09","Dana Kessler","Refund · dinner","Transfer","swap",42.50],
 ["2026-10-03T20:31","Lantern Noodle Bar","Card ··4417","Dining","cup",-38.20]
];
let bal=opening;
const tx=raw.map(([d,merchant,ref,cat,ico,amt],i)=>{bal=Math.round((bal+amt)*100)/100;return{id:i,t:d,merchant,ref,cat,ico,amt,bal}});
const fmt=n=>Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn=n=>(n<0?"\u2212":"+")+fmt(n);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayLabel=d=>new Date(d+"T12:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const when=t=>`<span class="d">${new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"})} · </span>${t.slice(11)}`;
const avail=document.getElementById("avail");
const [w,c]=fmt(tx[tx.length-1].bal).split(".");avail.innerHTML=`${w}<span>.${c}</span>`;
let sortK="t",sortD=-1,dir="all";
const tb=document.getElementById("tb"),q=document.getElementById("q"),count=document.getElementById("count");
function hl(s,term){if(!term)return esc(s);const i=s.toLowerCase().indexOf(term);return i<0?esc(s):esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+term.length))+"</mark>"+esc(s.slice(i+term.length))}
function row(x,term){
  const inn=x.amt>0;
  return `<tr class="tx"><td class="c-m"><div class="m"><span class="ico${inn?" in":""}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${I[x.ico]}</svg></span><span><b>${hl(x.merchant,term)}</b><small>${hl(x.ref,term)}</small></span></div></td>
<td class="c-cat"><span class="cat" style="--c:${C[x.cat]}">${hl(x.cat,term)}</span></td>
<td class="when">${when(x.t)}</td>
<td class="num"><span class="amt${inn?" in":""}" aria-label="${inn?"Credit":"Debit"} ${fmt(x.amt)}">${sgn(x.amt)}</span></td>
<td class="num"><span class="run">${fmt(x.bal)}</span></td></tr>`;
}
function render(){
  const term=q.value.trim().toLowerCase();
  let list=tx.filter(x=>(dir==="all"||(dir==="in"?x.amt>0:x.amt<0))&&(!term||(x.merchant+" "+x.ref+" "+x.cat).toLowerCase().includes(term)));
  list.sort((a,b)=>{const A=a[sortK],B=b[sortK];return (typeof A==="string"?A.localeCompare(B):A-B)*sortD||(b.t.localeCompare(a.t))});
  document.querySelectorAll("th[data-k]").forEach(th=>th.setAttribute("aria-sort",th.dataset.k===sortK?(sortD>0?"ascending":"descending"):"none"));
  const net=list.reduce((s,x)=>s+x.amt,0);
  count.textContent=`${list.length} of ${tx.length} · net ${sgn(net)}`;
  if(!list.length){tb.innerHTML=`<tr><td colspan="5" class="empty"><b>No transactions match \u201c${esc(q.value.trim())}\u201d</b>Try a merchant name, a category such as Dining, or a reference.<br><button type="button" id="reset">Clear search</button></td></tr>`;return}
  if(sortK!=="t"){tb.innerHTML=list.map(x=>row(x,term)).join("");return}
  let html="",cur="";
  const days={};list.forEach(x=>{const d=x.t.slice(0,10);(days[d]=days[d]||[]).push(x)});
  for(const d of Object.keys(days)){
    const n=days[d].reduce((s,x)=>s+x.amt,0);
    html+=`<tr class="day"><th colspan="5" scope="colgroup"><div class="day-in"><b>${dayLabel(d)}</b><span>${days[d].length} item${days[d].length>1?"s":""} · day net ${sgn(n)}</span></div></th></tr>`+days[d].map(x=>row(x,term)).join("");
  }
  tb.innerHTML=html;
}
document.querySelectorAll("th[data-k] .sort").forEach(b=>b.addEventListener("click",()=>{
  const k=b.closest("th").dataset.k;
  if(sortK===k)sortD*=-1;else{sortK=k;sortD=k==="t"||k==="amt"?-1:1}
  render();
}));
q.addEventListener("input",render);
document.querySelectorAll('input[name="dir"]').forEach(r=>r.addEventListener("change",()=>{dir=r.value;render()}));
tb.addEventListener("click",e=>{if(e.target.id==="reset"){q.value="";render();q.focus()}});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus()}
  else if(e.key==="Escape"&&document.activeElement===q&&q.value){q.value="";render()}
});
render();
</script>
</body>
</html>
