<!-- Design Lounge piece: combobox · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Combobox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--surface-2:#f0ebe3;--ink:#161513;--ink-2:#5a554c;--line:#e4dfd4;--line-strong:#cfc6b8;
  --primary-soft:#e7f2ec;--danger:#9b2c2c;--focus:#1f4d3a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
.where{margin:0 0 16px;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
.field{position:relative;width:320px;display:flex;flex-direction:column;gap:6px}
label{font:500 12px/1 var(--sans);color:var(--ink-2)}
input{height:40px;padding:0 12px;border-radius:2px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:400 14px/1.4 var(--sans)}
input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
ul{position:absolute;z-index:2;top:68px;left:0;right:0;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:2px}
ul[hidden]{display:none}
li{min-height:40px;display:flex;align-items:center;padding:0 12px;border-radius:2px}
li[data-on="true"]{background:var(--surface-2)}
li[aria-selected="true"]{background:var(--primary-soft)}
.empty{margin:0;font-size:12px;color:var(--danger)}
</style>
</head>
<body>
<p class="where">Dock</p>
<div class="field">
  <label id="lab" for="q">Bay</label>
  <input id="q" role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list" aria-activedescendant="o0" value="Ba" autocomplete="off">
  <ul id="list" role="listbox" aria-labelledby="lab"></ul>
  <p class="empty" id="empty" hidden>No bay matches.</p>
</div>
<script>
const bays = ['Bay 2','Bay 4','Bay 14','Cold store','Dock A','Dock B','Gate 4','Salt room'];
const q = document.getElementById('q');
const list = document.getElementById('list');
const empty = document.getElementById('empty');
let active = 0;
let value = '';
function matches(){
  const query = q.value.trim().toLowerCase();
  return bays.filter(b => b.toLowerCase().includes(query));
}
function paint(){
  const rows = matches();
  list.replaceChildren();
  empty.hidden = rows.length !== 0;
  list.hidden = rows.length === 0;
  q.setAttribute('aria-expanded', rows.length ? 'true' : 'false');
  if (!rows.length) return;
  if (active >= rows.length) active = 0;
  rows.forEach((name, i) => {
    const li = document.createElement('li');
    li.id = 'o' + i;
    li.setAttribute('role', 'option');
    li.textContent = name;
    li.setAttribute('aria-selected', name === value ? 'true' : 'false');
    li.dataset.on = String(i === active);
    li.addEventListener('mouseenter', () => { active = i; paint(); });
    li.addEventListener('click', () => commit(name));
    list.append(li);
  });
  q.setAttribute('aria-activedescendant', 'o' + active);
}
function commit(name){
  value = name;
  q.value = name;
  list.hidden = true;
  q.setAttribute('aria-expanded', 'false');
  empty.hidden = true;
}
q.addEventListener('input', () => { active = 0; value = ''; paint(); });
q.addEventListener('keydown', e => {
  const rows = matches();
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!rows.length) return;
    if (list.hidden) { list.hidden = false; q.setAttribute('aria-expanded', 'true'); }
    active = (active + (e.key === 'ArrowDown' ? 1 : rows.length - 1)) % rows.length;
    paint();
  } else if (e.key === 'Enter' && rows.length && !list.hidden) {
    e.preventDefault();
    commit(rows[active]);
  } else if (e.key === 'Escape') {
    list.hidden = true;
    q.setAttribute('aria-expanded', 'false');
  }
});
paint();
</script>
</body>
</html>
