<!-- Design Lounge piece: gallery-photo-album · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Photo album with page turns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#26332b;--bg-2:#1e2922;--cover:#5a2f24;--page:#1c1c1a;--page-2:#232320;--ink:#efe8d8;--ink-2:#b9b19f;--ink-3:#8a8578;
  --corner:#d3c8b0;--print:#f2ecdf;--ribbon:#c8962f;
  --hand:"Caveat",cursive;--serif:"Lora",Georgia,serif;
  --turn:900ms;--sheet:cubic-bezier(.32,.72,0,1);--ease:cubic-bezier(.2,.7,.2,1);
  --s:1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(90% 70% at 50% 45%,#2e3d33,var(--bg) 55%,var(--bg-2));color:var(--ink);font:15px/1.5 var(--serif);display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ribbon);outline-offset:3px}
header{width:100%;max-width:1040px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:26px 24px 0;flex-wrap:wrap}
.kicker{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:2px 0 0;font:italic 500 30px/1.1 var(--serif)}
.count{margin:0;color:var(--ink-2);font-size:14px}
.stage{flex:1;display:grid;place-items:center;width:100%;padding:18px 0 0;min-height:0}
.fit{width:calc(960px * var(--s));height:calc(600px * var(--s))}
.book{position:relative;width:960px;height:600px;transform:scale(var(--s));transform-origin:0 0;perspective:2400px}
.book::before{content:"";position:absolute;inset:-12px -14px;border-radius:6px;background:linear-gradient(90deg,#4c271e,var(--cover) 8%,var(--cover) 46%,#3a1d16 50%,var(--cover) 54%,var(--cover) 92%,#4c271e);box-shadow:0 30px 60px -20px #000c,0 4px 10px #0006}
.ribbon{position:absolute;left:calc(50% + 30px);bottom:-52px;width:16px;height:70px;background:linear-gradient(90deg,#a87a22,var(--ribbon) 40%,#d9a94a);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:0}
.page,.face{position:absolute;top:0;width:480px;height:600px;background:var(--page);overflow:hidden}
.page.l,.face.back{border-radius:3px 0 0 3px}
.page.r,.face.front{border-radius:0 3px 3px 0}
.page.l{left:0}.page.r{left:480px}
.page::before,.face::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(#ffffff06 1px,transparent 1.5px) 0 0/5px 5px,radial-gradient(#00000030 1px,transparent 1.5px) 2px 3px/7px 7px}
.page.l::after,.face.back::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,#000a,#0000 40px)}
.page.r::after,.face.front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#000a,#0000 40px)}
.leaf{position:absolute;left:480px;top:0;width:480px;height:600px;transform-style:preserve-3d;transform-origin:0 50%;transition:transform var(--turn) var(--sheet)}
.leaf.turned{transform:rotateY(-180deg)}
.face{left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,#0000,#0008)}
.flipping .shade{animation:shade var(--turn) var(--sheet)}
@keyframes shade{50%{opacity:1}}
.pn{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:.1em}
.ph{position:absolute;margin:0;transform:rotate(var(--r,0deg))}
.print{position:relative;background:var(--print);padding:7px;box-shadow:0 2px 3px #0009,0 8px 16px -6px #0008}
.print svg{display:block;width:100%;height:auto;filter:sepia(.22) saturate(.86) contrast(.96)}
.print::after{content:"";position:absolute;inset:-6px;pointer-events:none;--c:var(--corner);
  background:linear-gradient(135deg,var(--c) 0 50%,#0000 50%) top left/26px 26px no-repeat,linear-gradient(225deg,var(--c) 0 50%,#0000 50%) top right/26px 26px no-repeat,linear-gradient(45deg,var(--c) 0 50%,#0000 50%) bottom left/26px 26px no-repeat,linear-gradient(315deg,var(--c) 0 50%,#0000 50%) bottom right/26px 26px no-repeat;
  filter:drop-shadow(0 1px 1px #0007)}
.ph figcaption{font:500 25px/1.05 var(--hand);color:var(--ink);margin-top:12px;transform:rotate(calc(var(--r,0deg) * -1.4))}
.ph figcaption small{display:block;font-size:19px;color:var(--ink-2)}
.title-page{display:grid;place-content:center;text-align:center;height:100%;gap:10px;padding:40px}
.title-page p{margin:0}
.title-page .big{font:600 58px/1 var(--hand)}
.title-page .sub{font:italic 16px var(--serif);color:var(--ink-2)}
.title-page .rule{width:120px;height:1px;background:var(--ink-3);margin:8px auto}
.note{position:absolute;font:500 22px/1.1 var(--hand);color:var(--ink-2)}
.note svg{display:block;color:var(--ink-2)}
.controls{display:flex;align-items:center;gap:16px;padding:34px 0 20px}
.controls button{width:44px;height:44px;border-radius:50%;border:1px solid #efe8d833;background:#00000026;display:grid;place-items:center;cursor:pointer;transition:background .16s var(--ease),border-color .16s var(--ease)}
.controls button:hover:not(:disabled){background:#efe8d814;border-color:#efe8d866}
.controls button:disabled{opacity:.35;cursor:default}
.controls .hint{font-size:13px;color:var(--ink-3);min-width:150px;text-align:center}
.hit{position:absolute;top:0;width:480px;height:600px;cursor:pointer;z-index:200;background:none;border:0;padding:0}
.hit.l{left:0}.hit.r{left:480px}
.hit:disabled{cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){:root{--turn:1ms}.flipping .shade{animation:none}.controls button{transition:none}}
</style>
</head>

    <p class="kicker">Album no. 3 · Summer 1986</p>

</header>

<nav class="controls" aria-label="Album pages">
  <button type="button" id="prev" aria-label="Previous pages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span class="hint">← → turn the page</span>
  <button type="button" id="next" aria-label="Next pages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</nav>

<script>
const leaves=[...document.querySelectorAll('.leaf')],N=leaves.length;
const $=id=>document.getElementById(id);
const fit=document.querySelector('.fit');
let spread=1,busy=0;
function z(){leaves.forEach((l,i)=>{if(!l.classList.contains('flipping'))l.style.zIndex=i<spread?i+1:N*2-i})}
function label(){
  const L=spread*2,R=spread*2+1;
  $('count').textContent=spread===0?'Title page and page 1 of 8':spread===N?'Page 8 and the end page':`Pages ${L}–${R} of 8`;
  $('prev').disabled=$('hitL').disabled=spread===0;$('next').disabled=$('hitR').disabled=spread===N;
  leaves.forEach((l,i)=>{l.querySelector('.front').setAttribute('aria-hidden',i!==spread);l.querySelector('.back').setAttribute('aria-hidden',i!==spread-1)});
}
function go(d){
  const t=spread+d;if(t<0||t>N)return;
  const leaf=leaves[d>0?spread:spread-1];
  spread=t;leaf.classList.add('flipping');leaf.style.zIndex=100+(++busy);
  leaf.classList.toggle('turned',d>0);
  const done=()=>{leaf.classList.remove('flipping');busy=Math.max(0,busy-1);z()};
  const ms=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--turn'))||900;
  setTimeout(done,ms+20);label();
}
$('prev').onclick=$('hitL').onclick=()=>go(-1);
$('next').onclick=$('hitR').onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
function scale(){const s=Math.min(1,(innerWidth-48)/988,(innerHeight-214)/624);document.documentElement.style.setProperty('--s',Math.max(.3,s).toFixed(3))}
addEventListener('resize',scale);scale();
leaves.forEach((l,i)=>l.classList.toggle('turned',i<spread));z();label();
</script>
</body>
</html>
