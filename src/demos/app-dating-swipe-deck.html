<!-- Design Lounge piece: app-dating-swipe-deck · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tandem · Discover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f4ede3;--ink:#231a15;--ink-2:#5e5048;--plate:#fffaf3;--line:#e3d7c8;
  --like:#1d7149;--pass:#b0301f;--super:#9a5b00;--super-fill:#f2b43c;--brand:#c2410c;
  --sans:"Space Grotesk",system-ui,sans-serif;
  --out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.7,.2,1);
  --r-card:26px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 var(--sans);color:var(--ink);background:var(--ground);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;padding:54px 16px 34px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;letter-spacing:-.03em}
.logo svg{width:26px;height:26px}
.top nav{display:flex;gap:6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--plate);border:1px solid var(--line)}
.ib svg,.act svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.deck{position:relative;flex:1;margin:10px 0 22px}
.card{position:absolute;inset:0;border-radius:var(--r-card);overflow:hidden;background:#d9c6b0;box-shadow:0 1px 0 rgba(35,26,21,.06),0 18px 34px -18px rgba(35,26,21,.45);touch-action:none;user-select:none;-webkit-user-select:none;transform-origin:50% 90%;will-change:transform}
.card.back{transition:transform 320ms var(--out)}
.card.spring{transition:transform 420ms var(--spring)}
.ph{position:absolute;inset:0;transition:transform 380ms var(--out)}
.ph svg{width:100%;height:100%;display:block}
.card[data-p="1"] .ph{transform:scale(1.55);transform-origin:50% 36%}
.card[data-p="2"] .ph{transform:scale(-1.12,1.12)}
.bars{position:absolute;left:14px;right:14px;top:12px;display:flex;gap:5px}
.bars i{flex:1;height:4px;border-radius:2px;background:rgba(255,250,243,.45)}
.bars i.on{background:#fffaf3}
.stamp{position:absolute;top:44px;padding:6px 14px 4px;border:4px solid currentColor;border-radius:10px;font-weight:700;font-size:38px;letter-spacing:.06em;background:var(--plate);opacity:0;pointer-events:none}
.stamp.l{left:20px;color:var(--like);transform:rotate(-14deg)}
.stamp.p{right:20px;color:var(--pass);transform:rotate(14deg)}
.stamp.s{left:50%;top:auto;bottom:230px;margin-left:-96px;color:var(--super);transform:rotate(-6deg);font-size:30px;white-space:nowrap}
.plate{position:absolute;left:10px;right:10px;bottom:10px;background:var(--plate);border-radius:18px;padding:14px 16px 14px}
.plate h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.plate h2 span{font-weight:400;color:var(--ink-2)}
.meta{display:flex;gap:12px;margin-top:6px;font-size:14px;color:var(--ink-2);font-weight:500}
.meta span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.meta svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.pr{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.pr small{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.pr p{margin:4px 0 0;font-size:17px;line-height:1.35;font-weight:500;letter-spacing:-.01em}

.acts{flex:none;display:flex;justify-content:center;align-items:center;gap:22px;height:92px;padding-top:12px}
.act{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--plate);border:1.5px solid var(--line);box-shadow:0 8px 18px -10px rgba(35,26,21,.45);transition:transform 160ms var(--spring)}
.act:active{transform:scale(.9)}
.act svg{width:28px;height:28px;stroke-width:2.4}
.act.p{color:var(--pass)}
.act.s{width:52px;height:52px;color:var(--super)}
.act.s svg{width:22px;height:22px}
.act.l{color:#fffaf3;background:var(--like);border-color:var(--like)}
.act.l svg{fill:currentColor;stroke:none}

.end{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 28px;border-radius:var(--r-card);border:1.5px dashed #b9a896}
.end b{display:block;font-size:24px;letter-spacing:-.02em}
.end p{margin:8px 0 18px;color:var(--ink-2)}
.pill{height:48px;padding:0 22px;border-radius:24px;background:var(--ink);color:var(--plate);font-weight:600}

.match{position:absolute;inset:0;z-index:10;background:#2a1d17;color:#fffaf3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:54px 28px 34px;text-align:center;visibility:hidden;opacity:0;transition:opacity 260ms var(--ease),visibility 0s 260ms}
.match.open{visibility:visible;opacity:1;transition:opacity 260ms var(--ease)}
.pair{position:relative;width:228px;height:132px;margin-bottom:26px}
.av{position:absolute;top:0;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:700;border:4px solid #2a1d17;color:var(--ink)}
.av.a{left:0;font-size:30px;background:#f2b43c;transform:rotate(-6deg)}
.av.b{right:0;background:#f0a48a;transform:rotate(6deg)}
.match.open .av.a{animation:inL 620ms var(--out)}
.match.open .av.b{animation:inR 620ms var(--out)}
@keyframes inL{from{transform:translateX(-90px) rotate(-20deg);opacity:0}}
@keyframes inR{from{transform:translateX(90px) rotate(20deg);opacity:0}}
.heart{position:absolute;left:50%;bottom:-8px;margin-left:-24px;width:48px;height:48px;border-radius:50%;background:var(--like);display:grid;place-items:center;border:4px solid #2a1d17}
.heart svg{width:22px;height:22px;fill:#fffaf3}
.match.open .heart{animation:pop 520ms 300ms var(--spring) both}
@keyframes pop{from{transform:scale(0)}}
.match h2{margin:0;font-size:44px;line-height:1;letter-spacing:-.04em}
.match p{margin:12px 0 30px;font-size:16px;color:#e6d6c6;max-width:290px}
.match .pill{width:100%;max-width:320px;height:54px;border-radius:27px;background:#fffaf3;color:var(--ink);font-size:16px}
.match .ghost{margin-top:10px;height:48px;width:100%;max-width:320px;border-radius:24px;border:1.5px solid #8a776a;color:#fffaf3;font-weight:600}

@media (prefers-reduced-motion:reduce){
  .card.back,.card.spring,.ph,.act{transition:none}
  .match.open .av.a,.match.open .av.b,.match.open .heart{animation:none}
}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="9" cy="13" r="7" fill="none" stroke="#c2410c" stroke-width="2.6"/><circle cx="17" cy="13" r="7" fill="none" stroke="#231a15" stroke-width="2.6"/></svg>tandem</div>
    <nav>
      <button class="ib" aria-label="Filters: within 10 km, ages 27 to 38"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <button class="ib" aria-label="Messages"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    </nav>
  </header>
  <section class="deck" id="deck" aria-label="People nearby" aria-roledescription="card stack"></section>
  <div class="acts">
    <button class="act p" id="bp" aria-label="Pass"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="act s" id="bs" aria-label="Super like"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.9 6.4 20l1.3-6.2L3 9.5l6.3-.7z"/></svg></button>
    <button class="act l" id="bl" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11.2C4 6.6 6.4 4.5 9 4.5c1.4 0 2.4.7 3 1.7.6-1 1.6-1.7 3-1.7 2.6 0 5 2.1 5 5.3 0 6-8 11.2-8 11.2z"/></svg></button>
  </div>
  <section class="match" id="match" role="dialog" aria-modal="true" aria-labelledby="mh">
    <div class="pair" aria-hidden="true"><span class="av a">You</span><span class="av b">LR</span><span class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11.2C4 6.6 6.4 4.5 9 4.5c1.4 0 2.4.7 3 1.7.6-1 1.6-1.7 3-1.7 2.6 0 5 2.1 5 5.3 0 6-8 11.2-8 11.2z"/></svg></span></div>
    <h2 id="mh">It's mutual</h2>
    <p>You and Leila liked each other. Say hello whenever you're ready; this match stays here.</p>
    <button class="pill" id="msg">Send Leila a message</button>
    <button class="ghost" id="keep">Keep browsing</button>
  </section>
  <p class="vh" aria-live="polite" id="live"></p>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const deck = $('#deck'), live = $('#live'), match = $('#match');
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P = [
    { n: 'Amara', a: 31, j: 'Ceramicist', d: 2, q: 'A perfect Sunday', t: 'Flea market at nine, a long lunch, then throwing bowls until the light goes.', c: ['#f6c58a', '#e88a5a', '#7b3b2a', '#c96a3f', '#3c2219'] },
    { n: 'Jonas', a: 33, j: 'Paediatric nurse', d: 4, q: "I'm weirdly good at", t: "Parallel parking a cargo bike, and remembering every dog's name in the park.", c: ['#bfe0dc', '#6aa9a6', '#1f4d55', '#3f7f84', '#14262b'] },
    { n: 'Leila', a: 29, j: 'Urban planner', d: 6, q: "Let's argue about", t: 'Whether trams beat the metro. They do, and I have a slideshow.', c: ['#f3d4c2', '#d98b7a', '#5a2f3a', '#a85a5c', '#2b1820'], match: 1 },
    { n: 'Tomás', a: 34, j: 'Line cook', d: 1, q: 'My most irrational fear', t: 'Running out of olive oil halfway through a recipe. I keep three bottles.', c: ['#e7dca6', '#a9a65c', '#3b4423', '#77803d', '#1e2412'] }
  ];
  const scene = (c, i) => `<svg viewBox="0 0 358 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="s${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset=".62" stop-color="${c[1]}"/></linearGradient><radialGradient id="g${i}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="358" height="560" fill="url(#s${i})"/><circle cx="${i % 2 ? 90 : 268}" cy="150" r="120" fill="url(#g${i})"/><path d="M0 300 C80 270 140 290 200 272 S320 262 358 282 V560 H0z" fill="${c[3]}"/><path d="M0 350 C90 330 200 360 358 330 V560 H0z" fill="${c[2]}" opacity=".7"/><path d="M58 560 C62 352 100 280 179 272 C258 280 296 352 300 560z" fill="${c[4]}"/><path d="M158 226 h42 v56 h-42z" fill="${c[4]}"/><ellipse cx="179" cy="196" rx="47" ry="57" fill="${c[4]}"/><ellipse cx="179" cy="196" rx="46" ry="56" fill="none" stroke="${c[0]}" stroke-width="2.5" opacity=".6" stroke-dasharray="0 ${i % 2 ? 158 : 236} 86 400"/><path d="M${i % 2 ? 64 : 294} 560 C${i % 2 ? 70 : 290} 380 ${i % 2 ? 100 : 258} 288 ${i % 2 ? 160 : 198} 276" stroke="${c[0]}" stroke-width="2.5" fill="none" opacity=".45"/><path d="M130 188 C128 124 230 124 228 188 C222 150 140 148 130 188z" fill="${c[2]}"/><path d="M112 300 C140 288 160 288 179 296 C198 288 218 288 246 300" stroke="${c[3]}" stroke-width="3" fill="none" opacity=".55"/></svg>`;
  const pin = '<svg viewBox="0 0 24 24"><path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>';
  const bag = '<svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2"/></svg>';
  let idx = 0, cards = [];
  const make = (p, i) => {
    const el = document.createElement('article');
    el.className = 'card'; el.dataset.p = '0'; el.tabIndex = -1;
    el.setAttribute('aria-label', `${p.n}, ${p.a}, ${p.j}, ${p.d} km away. ${p.q}: ${p.t}`);
    el.innerHTML = `<div class="ph">${scene(p.c, i)}</div><div class="bars" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
      <span class="stamp l" aria-hidden="true">LIKE</span><span class="stamp p" aria-hidden="true">PASS</span><span class="stamp s" aria-hidden="true">SUPER LIKE</span>
      <div class="plate"><h2>${p.n} <span>${p.a}</span></h2><div class="meta"><span>${bag}${p.j}</span><span>${pin}${p.d} km away</span></div>
      <div class="pr"><small>${p.q}</small><p>${p.t}</p></div></div>`;
    return el;
  };
  const layout = (prog = 0) => {
    cards.forEach((c, k) => {
      if (k === 0) return;
      const s = k === 1 ? .95 + .05 * prog : .9 + .05 * prog, y = k === 1 ? 12 - 12 * prog : 24 - 12 * prog;
      c.style.transform = k > 2 ? 'translateY(24px) scale(.9)' : `translateY(${y}px) scale(${s})`;
      c.style.visibility = k > 2 ? 'hidden' : 'visible';
    });
  };
  const build = () => {
    deck.innerHTML = ''; cards = [];
    P.slice(idx).forEach((p, k) => { const el = make(p, idx + k); cards.push(el); });
    if (!cards.length) { deck.innerHTML = `<div class="end"><b>That's everyone nearby today</b><p>New people show up as they join. You can also widen your distance in Filters.</p><button class="pill" id="again">Start over</button></div>`; $('#again').onclick = () => { idx = 0; build(); }; return; }
    cards.slice().reverse().forEach((c) => deck.appendChild(c));
    cards.forEach((c, k) => c.setAttribute('aria-hidden', k ? 'true' : 'false'));
    layout(0);
  };
  const stamps = (el, dx, dy) => {
    el.querySelector('.l').style.opacity = Math.max(0, Math.min(1, dx / 90));
    el.querySelector('.p').style.opacity = Math.max(0, Math.min(1, -dx / 90));
    el.querySelector('.s').style.opacity = Math.max(0, Math.min(1, -dy / 110 - Math.abs(dx) / 200));
  };
  const decide = (dir, v = 1.2) => {
    const el = cards[0]; if (!el || match.classList.contains('open')) return;
    const p = P[idx], W = 520;
    const tx = dir === 'up' ? 0 : dir === 'right' ? W : -W, ty = dir === 'up' ? -900 : 40;
    const ms = rm ? 0 : Math.max(220, Math.min(420, 520 / Math.max(.6, v)));
    stamps(el, dir === 'right' ? 90 : dir === 'left' ? -90 : 0, dir === 'up' ? -200 : 0);
    el.style.transition = `transform ${ms}ms cubic-bezier(.2,.7,.2,1)`;
    el.style.transform = `translate(${tx}px,${ty}px) rotate(${dir === 'up' ? 0 : tx / 26}deg)`;
    cards.slice(1).forEach((c) => c.classList.add('back'));
    cards.shift(); layout(0); idx++;
    live.textContent = (dir === 'left' ? 'Passed on ' : dir === 'up' ? 'Super liked ' : 'Liked ') + p.n + '.';
    setTimeout(() => {
      el.remove(); cards.forEach((c) => c.classList.remove('back'));
      if (cards[0]) cards[0].setAttribute('aria-hidden', 'false');
      if (!cards.length) build();
      if (p.match && dir !== 'left') { match.classList.add('open'); $('#msg').focus(); live.textContent = "It's mutual. You and Leila liked each other."; }
    }, ms + 20);
  };
  let g = null;
  deck.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.card'); if (!el || el !== cards[0]) return;
    el.setPointerCapture(e.pointerId); el.classList.remove('spring'); el.style.transition = 'none';
    g = { el, x: e.clientX, y: e.clientY, dx: 0, dy: 0, s: [[e.timeStamp, e.clientX, e.clientY]] };
  });
  deck.addEventListener('pointermove', (e) => {
    if (!g) return;
    g.dx = e.clientX - g.x; g.dy = e.clientY - g.y;
    g.s.push([e.timeStamp, e.clientX, e.clientY]); if (g.s.length > 6) g.s.shift();
    g.el.style.transform = `translate(${g.dx}px,${g.dy}px) rotate(${Math.max(-16, Math.min(16, g.dx * .07))}deg)`;
    stamps(g.el, g.dx, g.dy);
    layout(Math.min(1, Math.hypot(g.dx, g.dy) / 160));
  });
  const up = (e) => {
    if (!g) return;
    const { el, dx, dy, s } = g; g = null;
    const a = s[0], b = s[s.length - 1], dt = Math.max(1, b[0] - a[0]);
    const vx = (b[1] - a[1]) / dt, vy = (b[2] - a[2]) / dt;
    if (Math.hypot(dx, dy) < 6) { // tap: next or previous photo
      const r = el.getBoundingClientRect(), n = (+el.dataset.p + (e.clientX > r.left + r.width / 2 ? 1 : 2)) % 3;
      el.dataset.p = n; el.querySelectorAll('.bars i').forEach((i, k) => i.classList.toggle('on', k === n));
      el.style.transition = ''; el.style.transform = ''; return;
    }
    if (dy < -120 && Math.abs(dx) < 80 || vy < -.9 && Math.abs(vx) < .5) return decide('up', -vy);
    if (dx > 110 || vx > .55) return decide('right', vx);
    if (dx < -110 || vx < -.55) return decide('left', -vx);
    el.style.transition = ''; el.classList.add('spring'); el.style.transform = ''; stamps(el, 0, 0);
    cards.slice(1).forEach((c) => c.classList.add('back')); layout(0);
  };
  deck.addEventListener('pointerup', up); deck.addEventListener('pointercancel', up);
  $('#bp').onclick = () => decide('left'); $('#bl').onclick = () => decide('right'); $('#bs').onclick = () => decide('up');
  addEventListener('keydown', (e) => {
    if (match.classList.contains('open')) { if (e.key === 'Escape') close(); return; }
    if (e.key === 'ArrowLeft') decide('left'); if (e.key === 'ArrowRight') decide('right'); if (e.key === 'ArrowUp') { e.preventDefault(); decide('up'); }
  });
  const close = () => { match.classList.remove('open'); $('#bl').focus(); };
  $('#keep').onclick = close; $('#msg').onclick = close;
  build();
})();
</script>
</body>
</html>
