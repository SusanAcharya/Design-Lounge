<!-- Design Lounge piece: shop-cart · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Rs 5,600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3e6d4;--surface:#faefe0;--ink:#2a1b14;--ink-2:#6a4e3e;
  --line:#d8c0a4;--primary:#c45c2a;--primary-ink:#fffdf8;--focus:#c45c2a;
  --sans:"Hanken Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.where{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink-2)}
h1{margin:0 0 20px;font-size:56px;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;max-width:640px;min-height:64px;border-top:1px solid var(--line)}
.row b{font-weight:600}
.row span{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.pay{margin-top:20px;height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--primary);color:var(--primary-ink);font-weight:600}
.pay:disabled{opacity:.55}
.why{display:none;margin:0 0 16px;max-width:360px;color:var(--ink-2);font-size:16px}
.why.show{display:block}
h1.empty{font-size:40px;font-weight:500;letter-spacing:-.03em}
</style>
</head>
<body>
<p class="where">Bag</p>
<h1 id="total">Rs 5,600</h1>
<p class="why" id="why">Nothing in the bag. The firing is still on the table.</p>
<div id="rows"></div>
<button class="pay" id="pay" type="button">Check out</button>
<script>
let rows = [
  { name:'Ash bowl', price:2400, qty:1 },
  { name:'Night plate', price:3200, qty:1 }
];
const total = document.getElementById('total');
const why = document.getElementById('why');
const box = document.getElementById('rows');
const pay = document.getElementById('pay');
function money(n){ return 'Rs ' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function paint(){
  const sum = rows.reduce((s, r) => s + r.price * r.qty, 0);
  const none = rows.length === 0;
  total.textContent = none ? 'The bag is empty.' : money(sum);
  total.classList.toggle('empty', none);
  why.classList.toggle('show', none);
  pay.hidden = none;
  box.innerHTML = rows.map((r, i) => `<div class="row"><b>${r.name}</b><span class="step"><button type="button" data-i="${i}" data-d="-1" aria-label="Fewer ${r.name}">−</button><span>${r.qty}</span><button type="button" data-i="${i}" data-d="1" aria-label="More ${r.name}">+</button></span><span>${money(r.price * r.qty)}</span></div>`).join('');
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const row = rows[Number(b.dataset.i)];
    row.qty += Number(b.dataset.d);
    if (row.qty < 1) rows.splice(Number(b.dataset.i), 1);
    pay.disabled = false;
    pay.textContent = 'Check out';
    paint();
  }));
}
pay.addEventListener('click', () => {
  pay.textContent = 'Checkout opened';
  pay.disabled = true;
});
paint();
</script>
</body>
</html>
