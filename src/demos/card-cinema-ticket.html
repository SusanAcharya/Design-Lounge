<!-- Design Lounge piece: card-cinema-ticket · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Marlowe Picture House · Admit one</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#3b1418;--stage-2:#24090c;--paper:#f2e4c4;--paper-2:#e8d5ab;
  --ink:#2b1b14;--ink-2:#5a4334;--print:#9c2a22;--gold:#b8862f;--chalk:#f6ead0;
  --display:"Limelight",Georgia,serif;--text:"Spectral",Georgia,serif;
  --expo:cubic-bezier(0.16,1,0.3,1);--std:cubic-bezier(0.2,0.7,0.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:16px/1.45 var(--text);color:var(--chalk);overflow:hidden;
  display:grid;place-items:center;align-content:center;gap:28px;padding:24px 16px;
  background:
    radial-gradient(ellipse 60% 55% at 50% 42%,rgba(255,196,120,.16),transparent 70%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 46px,rgba(255,255,255,.025) 46px 48px,transparent 48px 92px),
    linear-gradient(var(--stage),var(--stage-2));
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#d9b97a;text-align:center}
.fit{position:relative;width:min(854px,100%)}
.ticket{position:absolute;left:0;top:0;width:700px;height:340px;transform-origin:0 0;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45)) drop-shadow(0 2px 2px rgba(0,0,0,.3))}

.main,.stub{
  position:absolute;top:0;height:340px;color:var(--ink);
  background:
    radial-gradient(circle at 20% 30%,rgba(120,80,30,.07),transparent 40%),
    radial-gradient(circle at 80% 90%,rgba(120,80,30,.08),transparent 45%),
    var(--paper);
}
.main{
  left:0;width:520px;padding:22px 30px 22px 28px;display:grid;grid-template-rows:auto 1fr auto;
  -webkit-mask:radial-gradient(circle at 100% 0,#0000 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,#0000 14px,#000 14.5px) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle at 100% 0,#0000 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,#0000 14px,#000 14.5px) bottom/100% 51% no-repeat;
}
.main::after{
  content:"";position:absolute;right:0;top:20px;bottom:20px;width:8px;
  background:radial-gradient(circle,rgba(43,15,18,.78) 2.6px,transparent 3px) center top/8px 13px repeat-y;
}
.house{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--print);border-bottom:1px solid rgba(156,42,34,.45);padding-bottom:8px}
.poster{position:relative;display:grid;place-content:center;text-align:center;overflow:hidden;margin:10px 0 12px;border:1px solid rgba(156,42,34,.5);outline:1px solid rgba(156,42,34,.5);outline-offset:3px}
.poster::before{
  content:"";position:absolute;inset:-60%;
  background:repeating-conic-gradient(from 0deg at 50% 100%,rgba(184,134,47,.22) 0 4deg,transparent 4deg 9deg);
  -webkit-mask:radial-gradient(circle at 50% 100%,#000 30%,transparent 62%);mask:radial-gradient(circle at 50% 100%,#000 30%,transparent 62%);
}
.poster > *{position:relative}
.reels{margin:0;font-style:italic;font-size:13px;color:var(--ink-2)}
.film{margin:2px 0 0;font:400 42px/0.95 var(--display);letter-spacing:.02em;color:var(--print);text-transform:uppercase}
.film span{display:block;font-size:20px;letter-spacing:.3em;color:var(--ink);margin:4px 0}
.cast{margin:6px 0 0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:1.15fr .9fr .65fr 1.2fr;border-top:1px solid rgba(43,27,20,.25)}
.facts div{padding:8px 10px 0;border-left:1px solid rgba(43,27,20,.18)}
.facts div:first-child{border-left:0;padding-left:0}
.facts dt{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2)}
.facts dd{margin:0;font:600 19px/1.2 var(--text);font-variant-numeric:lining-nums}

.stamp{
  position:absolute;right:40px;top:206px;text-transform:uppercase;padding:6px 14px;border:3px double var(--print);color:var(--print);
  font:400 24px/1 var(--display);letter-spacing:.12em;transform:rotate(-11deg) scale(1.6);opacity:0;pointer-events:none;
  mix-blend-mode:multiply;transition:opacity 160ms var(--std),transform 320ms var(--expo)
}
.stamp small{display:block;font:600 10px/1.4 var(--text);letter-spacing:.2em;text-align:center}
.is-torn .stamp{opacity:.85;transform:rotate(-11deg) scale(1);transition-delay:260ms}

.stub{
  left:520px;width:180px;padding:22px 20px 22px 26px;display:flex;flex-direction:column;justify-content:space-between;
  transform-origin:0 100%;cursor:grab;touch-action:none;text-align:left;
  -webkit-mask:radial-gradient(circle at 0 0,#0000 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,#0000 14px,#000 14.5px) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle at 0 0,#0000 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,#0000 14px,#000 14.5px) bottom/100% 51% no-repeat;
  transition:transform 420ms var(--expo);
}
.stub:active{cursor:grabbing}
.stub.dragging{transition:none}
.stub:focus-visible{outline:none}
.ticket:has(.stub:focus-visible) .stub-ring{opacity:1}
.stub-ring{position:absolute;left:526px;top:-6px;width:180px;height:352px;border:2px solid var(--gold);border-radius:4px;opacity:0;pointer-events:none}
.admit{font:400 26px/1 var(--display);color:var(--print);letter-spacing:.06em;text-transform:uppercase}
.admit small{display:block;font:600 10px/1.6 var(--text);letter-spacing:.28em;color:var(--ink-2)}
.seat{display:flex;gap:18px}
.seat dt{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2)}
.seat dd{margin:0;font:400 40px/1 var(--display);color:var(--ink)}
.serial{font-size:11px;letter-spacing:.2em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.serial b{display:block;font:600 15px/1.2 var(--text);letter-spacing:.14em;color:var(--print)}
.is-torn .stub{transform:translate(48px,34px) rotate(7deg);cursor:default;transition:transform 640ms var(--expo)}
.is-torn .stub-ring{display:none}

.caption{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0;font-size:14px;color:#e2cfa8;min-height:44px}
kbd{font:600 12px/1 var(--text);border:1px solid rgba(226,207,168,.5);border-radius:3px;padding:3px 6px}
.reprint{min-height:40px;padding:0 18px;border:1px solid var(--gold);color:var(--chalk);letter-spacing:.2em;text-transform:uppercase;font-size:12px;border-radius:2px}
.reprint:hover{background:rgba(184,134,47,.18)}
.reprint[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .stub,.is-torn .stub,.stamp{transition:none}
}
</style>
</head>
<body>
<p class="eyebrow">Tonight in the Gilt Room</p>
<div class="fit" id="fit">
  <div class="ticket" id="ticket">
    <article class="main" id="main" aria-label="Cinema ticket, The Lantern at Low Tide">
      <div class="house"><span>Marlowe Picture House</span><span>Est. 1931</span></div>
      <div class="poster">
        <p class="reels">A picture in eleven reels</p>
        <h1 class="film">The Lantern<span>at</span>Low Tide</h1>
        <p class="cast">Vera Halloran · Teodor Wynn</p>
      </div>
      <dl class="facts">
        <div><dt>Date</dt><dd>Sat 17 Oct</dd></div>
        <div><dt>Doors</dt><dd>7:40 pm</dd></div>
        <div><dt>Screen</dt><dd>Two</dd></div>
        <div><dt>Fare</dt><dd>£9.50 · Stalls</dd></div>
      </dl>
      <div class="stamp" aria-hidden="true">Admitted<small>Usher 07 · 7:32 pm</small></div>
    </article>
    <button class="stub" id="stub" type="button" aria-label="Ticket stub, row F seat 14. Drag or press Enter to tear" aria-describedby="hint">
      <span class="admit"><small>Retain this</small>Admit one</span>
      <dl class="seat"><div><dt>Row</dt><dd>F</dd></div><div><dt>Seat</dt><dd>14</dd></div></dl>
      <span class="serial">Nº<b>031742</b>Screen Two</span>
    </button>
    <span class="stub-ring" aria-hidden="true"></span>
  </div>
</div>
<p class="caption">
  <span id="hint">Pull the stub away to tear it · <kbd>→</kbd> nudges · <kbd>Enter</kbd> tears</span>
  <button class="reprint" id="reprint" type="button" hidden>Reprint ticket</button>
</p>
<p class="sr" aria-live="polite" id="live"></p>
<script>
const fit=document.getElementById('fit'),ticket=document.getElementById('ticket'),stub=document.getElementById('stub'),
      main=document.getElementById('main'),reprint=document.getElementById('reprint'),live=document.getElementById('live'),
      hint=document.getElementById('hint');
let k=1,p=0,torn=false,start=null;
function size(){k=Math.min(innerWidth>1000?1.22:1,fit.clientWidth/700);ticket.style.transform=`scale(${k})`;fit.style.height=340*k+'px'}
addEventListener('resize',size);size();

function jag(side){
  const pts=[];let s=7;
  for(let y=0;y<=340;y+=10){s=(s*9301+49297)%233280;pts.push(3+(s/233280)*7,y)}
  return side==='main'
    ?'polygon(0 0,'+pts.reduce((a,v,i)=>i%2?a:a+`${520-pts[i]}px ${pts[i+1]}px,`,'')+'0 340px)'
    :'polygon('+pts.reduce((a,v,i)=>i%2?a:a+`${pts[i]-3}px ${pts[i+1]}px,`,'')+'180px 340px,180px 0)';
}
function show(v){p=Math.max(0,Math.min(1,v));stub.style.transform=p?`translateX(${p*6}px) rotate(${p*12}deg)`:''}
function tear(){
  if(torn)return;torn=true;stub.style.transform='';
  main.style.clipPath=jag('main');stub.style.clipPath=jag('stub');
  ticket.classList.add('is-torn');stub.setAttribute('aria-label','Stub torn and kept, row F seat 14');stub.disabled=true;
  hint.textContent='Stub kept. Enjoy the picture.';reprint.hidden=false;live.textContent='Ticket torn. Admitted.';reprint.focus({preventScroll:true});
}
stub.addEventListener('pointerdown',e=>{if(torn)return;start={x:e.clientX,y:e.clientY};stub.setPointerCapture(e.pointerId);stub.classList.add('dragging')});
stub.addEventListener('pointermove',e=>{if(!start)return;const dx=(e.clientX-start.x)/k,dy=(e.clientY-start.y)/k;show((Math.max(0,dx)+Math.max(0,dy)*.5)/150)});
function release(){if(!start)return;start=null;stub.classList.remove('dragging');if(p>=1)tear();else show(0)}
stub.addEventListener('pointerup',release);stub.addEventListener('pointercancel',release);
stub.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();show(p+.25);live.textContent=p>=1?'':`Tear ${Math.round(p*100)} percent`;if(p>=1)tear()}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='Escape'){e.preventDefault();show(0)}
});
stub.addEventListener('click',e=>{if(e.detail===0)tear()});
reprint.addEventListener('click',()=>{
  torn=false;ticket.classList.remove('is-torn');main.style.clipPath=stub.style.clipPath='';show(0);stub.disabled=false;
  stub.setAttribute('aria-label','Ticket stub, row F seat 14. Drag or press Enter to tear');
  hint.innerHTML='Pull the stub away to tear it · <kbd>→</kbd> nudges · <kbd>Enter</kbd> tears';reprint.hidden=true;live.textContent='Fresh ticket printed.';stub.focus();
});
</script>
</body>
</html>
