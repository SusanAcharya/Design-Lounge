<!-- Design Lounge piece: tablet-cook-mode · platform: tablet · 1180x820 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chickpea shakshuka — Cook mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5ecd7;--cream-2:#ece0c2;--card:#fbf5e6;--line:#ddcda8;
  --olive:#2e3820;--olive-2:#545e3e;--olive-3:#6b7452;--on-olive:#f5ecd7;--on-olive-2:#c9c7a6;
  --tomato:#c4381f;--tomato-dk:#a92e18;--tomato-soft:#f4d2c3;--on-tomato:#fff8ef;
  --font:"Rubik",system-ui,sans-serif;
  --r:20px;--r-lg:28px;--tap:72px;
  --t-fast:150ms;--t-step:320ms;--ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:18px/1.4 var(--font);color:var(--olive);background:var(--cream);padding-top:24px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--tomato);outline-offset:3px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:0 28px 24px;gap:20px}

/* top */
.top{display:flex;align-items:center;gap:12px;min-width:0}
.x{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--cream-2)}
.x:hover{background:var(--line)}
.rt{min-width:0;margin-right:auto}
.rt b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{font-size:14px;color:var(--olive-2);font-weight:500}
.chip{position:relative;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 18px 0 8px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.chip .pp{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--olive);color:var(--on-olive)}
.chip .pp svg{width:18px;height:18px;fill:currentColor;stroke:none}
.chip .nm{font-weight:500;font-size:15px;color:var(--olive-2)}
.chip .tm{font-size:20px;min-width:52px}
.chip[data-s="paused"] .tm{color:var(--olive-3)}
.chip[data-s="done"]{background:var(--tomato);border-color:var(--tomato);color:var(--on-tomato);animation:ring 1.8s var(--ease-out) infinite}
.chip[data-s="done"] .nm{color:var(--on-tomato)}
.chip[data-s="done"] .pp{background:var(--on-tomato);color:var(--tomato)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(196,56,31,.45)}70%,100%{box-shadow:0 0 0 14px rgba(196,56,31,0)}}
.wake{min-height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--olive-2)}
.wake i{width:10px;height:10px;border-radius:50%;background:#5b7a2e;box-shadow:0 0 0 4px rgba(91,122,46,.18)}
.wake[aria-pressed="false"] i{background:var(--olive-3);box-shadow:none}
.wake:hover{background:var(--cream-2)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;min-height:0}
.stage{position:relative;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:8px 8px 8px 4px;touch-action:pan-y;user-select:none;overflow:hidden}
.no{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tomato-dk);margin:0 0 18px}
.no b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--tomato);color:var(--on-tomato);font-size:20px;letter-spacing:0}
.say{margin:0;font-size:54px;line-height:1.1;font-weight:800;letter-spacing:-.02em;max-width:16ch;text-wrap:balance}
.say em{font-style:normal;color:var(--tomato-dk);white-space:nowrap}
.tip{margin:24px 0 0;display:flex;gap:10px;align-items:flex-start;font-size:19px;color:var(--olive-2);max-width:42ch}
.tip svg{margin-top:1px;color:var(--tomato)}
.go{margin-top:24px;align-self:flex-start;min-height:56px;padding:0 22px 0 16px;border-radius:999px;border:2px solid var(--olive);font-weight:700;display:flex;align-items:center;gap:10px}
.go:hover{background:var(--olive);color:var(--on-olive)}
.go[hidden]{display:none}
.slide{will-change:transform}
.slide.in-l{animation:inL var(--t-step) var(--ease-out)}
.slide.in-r{animation:inR var(--t-step) var(--ease-out)}
@keyframes inL{from{opacity:0;transform:translateX(64px)}}
@keyframes inR{from{opacity:0;transform:translateX(-64px)}}

.ing{background:var(--olive);color:var(--on-olive);border-radius:var(--r-lg);padding:24px 20px 20px;display:flex;flex-direction:column;min-height:0}
.ing h2{margin:0 4px 4px;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-olive-2)}
.ing p.sub{margin:0 4px 14px;font-size:14px;color:var(--on-olive-2)}
.ing ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.ing li+li{border-top:1px solid rgba(245,236,215,.14)}
.it{width:100%;min-height:72px;display:flex;align-items:center;gap:14px;padding:8px 4px;text-align:left}
.it .bx{width:32px;height:32px;border-radius:10px;border:2.5px solid var(--on-olive-2);display:grid;place-items:center;flex:none;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.it .bx svg{width:20px;height:20px;stroke:var(--olive);stroke-width:3;opacity:0;transform:scale(.6);transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease-out)}
.it b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.it span{font-size:15px;color:var(--on-olive-2)}
.it[aria-checked="true"] .bx{background:var(--on-olive);border-color:var(--on-olive)}
.it[aria-checked="true"] .bx svg{opacity:1;transform:none}
.it[aria-checked="true"] b{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.it:focus-visible{outline-color:var(--on-olive);outline-offset:-2px;border-radius:12px}
.ing .none{padding:20px 4px;font-size:17px;color:var(--on-olive-2)}
.left{margin-top:12px;padding:12px 4px 0;border-top:1px solid rgba(245,236,215,.14);font-size:14px;color:var(--on-olive-2)}

/* nav */
.nav{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:28px;align-items:center}
.btn{min-height:var(--tap);border-radius:var(--r);display:flex;align-items:center;justify-content:center;gap:12px;font-size:21px;font-weight:700;transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.btn:active{transform:scale(.98)}
.prev{border:2.5px solid var(--olive)}
.prev:hover{background:var(--cream-2)}
.next{background:var(--tomato);color:var(--on-tomato);padding:0 20px}
.next:hover{background:var(--tomato-dk)}
.next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.dots{display:flex;justify-content:center;gap:4px}
.dot{width:40px;height:48px;display:grid;place-items:center}
.dot i{width:12px;height:12px;border-radius:6px;background:var(--line);transition:width var(--t-step) var(--ease-out),background var(--t-fast) var(--ease)}
.dot.past i{background:var(--olive-3)}
.dot[aria-current="step"] i{width:36px;background:var(--tomato)}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .ing{max-height:none}
  .ing ul{overflow:visible}
  .say{font-size:50px}
  .nav{grid-template-columns:132px minmax(0,1fr) 280px;gap:12px}
  .dot{width:32px}
  .wake span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .rt b{font-size:20px}
  .chip{padding-right:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .chip[data-s="done"]{box-shadow:0 0 0 4px var(--tomato-soft)}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="x" type="button" aria-label="Leave cook mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="rt"><b>Chickpea shakshuka</b><span>Pantry Press · Serves 4 · 35 min</span></div>
    <div id="timers" style="display:flex;gap:10px" role="group" aria-label="Timers"></div>
    <button class="wake" type="button" id="wake" aria-pressed="true"><i></i><span>Screen stays on</span></button>
  </header>

  <main class="main">
    <section class="stage" id="stage" aria-roledescription="carousel" aria-label="Recipe steps">
      <div class="slide" id="slide" aria-live="polite">
        <p class="no"><b id="n">4</b><span id="of">Step 4 of 7</span></p>
        <h1 class="say" id="say"></h1>
        <p class="tip" id="tip"></p>
        <button class="go" type="button" id="go"></button>
      </div>
    </section>
    <aside class="ing" aria-labelledby="ingH">
      <h2 id="ingH">For this step</h2>
      <p class="sub" id="ingSub">Tick as you add</p>
      <ul id="ing"></ul>
      <div class="left" id="left"></div>
    </aside>
  </main>

  <nav class="nav" aria-label="Step navigation">
    <button class="btn prev" type="button" id="prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
    <div class="dots" id="dots"></div>
    <button class="btn next" type="button" id="next"><span id="nextL">Next</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</div>

<script>
const $=s=>document.querySelector(s);
const STEPS=[
 {say:'Warm 3 tbsp olive oil in a wide 28 cm pan over <em>medium heat.</em>',tip:'The oil is ready when it shimmers and moves like water.',short:'Warm the oil',ing:[['Olive oil','3 tbsp']]},
 {say:'Add the onion and peppers with a pinch of salt. Cook until soft, <em>8 minutes.</em>',tip:'Stir every couple of minutes. You want sweet, not brown.',short:'Soften onions',t:['Onions',8],ing:[['Onion','1 large, sliced'],['Red peppers','2, sliced'],['Salt','a pinch']]},
 {say:'Stir in the garlic, cumin and paprika. Cook until it smells toasty, <em>1 minute.</em>',tip:'If the spices catch, splash in a spoon of water.',short:'Toast spices',ing:[['Garlic','3 cloves, sliced'],['Ground cumin','1 tsp'],['Smoked paprika','2 tsp']]},
 {say:'Tip in the tomatoes and chickpeas. Simmer until thick and glossy, <em>10 minutes.</em>',tip:'Squash a few chickpeas with the spoon. It thickens the sauce.',short:'Simmer sauce',t:['Sauce',10],ing:[['Chopped tomatoes','2 × 400 g tins'],['Chickpeas','1 × 400 g tin, drained'],['Sugar','1 tsp'],['Salt','½ tsp']]},
 {say:'Make 6 wells with the back of a spoon. Crack an egg into <em>each one.</em>',tip:'Crack each egg into a cup first, then slide it in.',short:'Add the eggs',ing:[['Eggs','6, at room temperature']]},
 {say:'Cover the pan. Cook until the whites set and the yolks wobble, <em>6 to 7 minutes.</em>',tip:'No lid? A baking tray works.',short:'Set the eggs',t:['Eggs',7],ing:[]},
 {say:'Scatter the feta and coriander. Serve from the pan with <em>warm bread.</em>',tip:'Put the pan on a board in the middle of the table.',short:'Serve',ing:[['Feta','100 g, crumbled'],['Coriander','a small bunch'],['Flatbreads','4, warmed']]}
];
const done=STEPS.map(s=>s.ing.map(()=>false));
done[3][0]=true;done[3][1]=true;
let cur=3;

/* timers */
const now=()=>performance.now();
let timers=[
 {name:'Bread',total:300,end:now()+18000,left:18,s:'run'},
 {name:'Sauce',total:600,end:now()+588000,left:588,s:'run'}
];
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',BELL='<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2.4"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4"/></svg>';
function drawTimers(){
  $('#timers').innerHTML=timers.map((t,i)=>{
    const label=t.s==='done'?`${t.name} timer done. Tap to clear`:`${t.name} timer, ${fmt(t.left)} left, ${t.s==='run'?'running. Tap to pause':'paused. Tap to start'}`;
    return `<button class="chip" type="button" data-i="${i}" data-s="${t.s}" aria-label="${label}"><span class="pp">${t.s==='done'?BELL:t.s==='run'?PAUSE:PLAY}</span><span class="nm">${t.name}</span><span class="tm">${t.s==='done'?'Done':fmt(t.left)}</span></button>`}).join('');
}
function tick(){
  let change=false;
  timers.forEach(t=>{
    if(t.s!=='run')return;
    const l=(t.end-now())/1000;
    if(Math.ceil(l)!==Math.ceil(t.left))change=true;
    t.left=l;if(l<=0){t.s='done';t.left=0;change=true;$('#ann').textContent=t.name+' timer is done'}
  });
  if(!change)return;
  const chips=[...document.querySelectorAll('.chip')];
  if(chips.some((c,i)=>c.dataset.s!==timers[i].s))drawTimers();
  else chips.forEach((c,i)=>{if(timers[i].s!=='done')c.querySelector('.tm').textContent=fmt(timers[i].left)});
}
setInterval(tick,250);
$('#timers').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;const t=timers[+c.dataset.i];
  if(t.s==='run'){t.s='paused';t.left=(t.end-now())/1000}
  else if(t.s==='paused'){t.s='run';t.end=now()+t.left*1000}
  else{t.s='paused';t.left=t.total}
  drawTimers();document.querySelector(`.chip[data-i="${c.dataset.i}"]`).focus();
});
function startTimer(name,min){
  let i=timers.findIndex(t=>t.name===name);
  if(i<0){i=timers.findIndex(t=>t.s==='done');if(i<0)i=timers.findIndex(t=>t.s==='paused');if(i<0)i=0}
  timers[i]={name,total:min*60,left:min*60,end:now()+min*60000,s:'run'};drawTimers();
}

/* steps */
function draw(dir){
  const s=STEPS[cur];
  $('#n').textContent=cur+1;$('#of').textContent=`Step ${cur+1} of ${STEPS.length}`;
  $('#say').innerHTML=s.say;$('#tip').innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>${s.tip}</span>`;
  const go=$('#go');go.hidden=!s.t;
  if(s.t)go.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>Start ${s.t[1]} min ${s.t[0].toLowerCase()} timer`;
  $('#ing').innerHTML=s.ing.length?s.ing.map(([a,b],i)=>`<li><button class="it" type="button" role="checkbox" aria-checked="${done[cur][i]}" data-i="${i}"><span class="bx"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span><b>${a}</b><span>${b}</span></span></button></li>`).join(''):'<li class="none">Nothing new to add. Keep the lid close.</li>';
  left();
  $('#dots').innerHTML=STEPS.map((x,i)=>`<button class="dot${i<cur?' past':''}" type="button" data-i="${i}" aria-label="Step ${i+1}: ${x.short}"${i===cur?' aria-current="step"':''}><i></i></button>`).join('');
  $('#prev').disabled=cur===0;
  $('#nextL').textContent=cur<STEPS.length-1?'Next: '+STEPS[cur+1].short:'Finish';
  const sl=$('#slide');sl.classList.remove('in-l','in-r');
  if(dir){void sl.offsetWidth;sl.classList.add(dir>0?'in-l':'in-r')}
}
function left(){
  const n=done[cur].filter(x=>!x).length;
  const nx=STEPS[cur+1];
  $('#left').innerHTML=(STEPS[cur].ing.length?(n?`${n} of ${STEPS[cur].ing.length} still to add`:'All in. On to the next step.'):'Nothing to tick here.')+(nx?`<br>Next step needs: ${nx.ing.length?nx.ing.map(x=>x[0]).join(', '):'nothing new'}`:'<br>Last step.');
}
function go(to){if(to<0||to>=STEPS.length||to===cur)return;const d=to>cur?1:-1;cur=to;draw(d)}
$('#prev').onclick=()=>go(cur-1);
$('#next').onclick=()=>{if(cur<STEPS.length-1)go(cur+1)};
$('#dots').addEventListener('click',e=>{const d=e.target.closest('.dot');if(d)go(+d.dataset.i)});
$('#go').onclick=()=>{const t=STEPS[cur].t;startTimer(t[0],t[1])};
$('#ing').addEventListener('click',e=>{
  const b=e.target.closest('.it');if(!b)return;const i=+b.dataset.i;
  done[cur][i]=!done[cur][i];b.setAttribute('aria-checked',done[cur][i]);left();
});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);
});

/* swipe */
const stage=$('#stage'),slide=$('#slide');let x0=null,dx=0;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;x0=e.clientX;dx=0;slide.style.transition='none';stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(x0==null)return;dx=e.clientX-x0;
  const edge=(dx>0&&cur===0)||(dx<0&&cur===STEPS.length-1);slide.style.transform=`translateX(${edge?dx/4:dx}px)`;slide.style.opacity=1-Math.min(Math.abs(dx)/600,.4)});
function release(){if(x0==null)return;x0=null;slide.style.transition='transform 240ms cubic-bezier(.16,1,.3,1),opacity 240ms';slide.style.transform='';slide.style.opacity='';
  if(dx<-80)go(cur+1);else if(dx>80)go(cur-1)}
stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);

/* wake */
let lock=null;
async function wake(on){
  $('#wake').setAttribute('aria-pressed',on);$('#wake span').textContent=on?'Screen stays on':'Screen may sleep';
  const allowed=(document.permissionsPolicy||document.featurePolicy)?.allowsFeature?.('screen-wake-lock')!==false;
  try{if(on&&navigator.wakeLock&&allowed)lock=await navigator.wakeLock.request('screen');else if(lock){lock.release();lock=null}}catch(_){}
}
$('#wake').onclick=()=>wake($('#wake').getAttribute('aria-pressed')!=='true');
const ann=document.createElement('div');ann.id='ann';ann.setAttribute('aria-live','assertive');ann.style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)';document.body.append(ann);
drawTimers();draw();wake(true);
</script>
</body>
</html>
