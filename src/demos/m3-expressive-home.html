<!-- Design Lounge piece: m3-expressive-home · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira — home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#fff8f3;--surface-low:#fdf1e8;--surface-c:#f7e9dd;--surface-high:#f1e2d3;--surface-highest:#ebdac9;
  --on-surface:#211b16;--on-surface-v:#564840;--outline:#89766a;--outline-v:#dcc9ba;
  --primary:#8a4a1d;--on-primary:#ffffff;--primary-c:#ffdbc8;--on-primary-c:#341100;
  --secondary-c:#f5dfc9;--on-secondary-c:#4a2e17;
  --tertiary:#4c6339;--tertiary-c:#dfe9c8;--on-tertiary-c:#152005;
  --font:"Rubik",system-ui,sans-serif;
  --r-card:28px;--r-pill:999px;--r-seg:16px;
  --shadow-fab:0 6px 18px rgba(52,17,0,.18),0 1px 3px rgba(52,17,0,.12);
  --shadow-bar:0 8px 24px rgba(52,17,0,.14);
  --t-micro:160ms;--t-big:500ms;--ease-emph:cubic-bezier(.2,0,0,1);--ease-exit:cubic-bezier(.3,0,.8,.15);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 var(--font);background:var(--surface);color:var(--on-surface);-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{height:100%;overflow-y:auto;padding:54px 16px 150px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 4px 0}
h1{margin:0;font-size:36px;line-height:1.05;font-weight:500;letter-spacing:-.02em}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--on-surface-v);letter-spacing:0;margin-bottom:6px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:500;font-size:16px;flex:none;border:0;font-family:inherit}
.avatar:focus-visible,.seg button:focus-visible,.card button:focus-visible,.bar button:focus-visible,.fab:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.seg{display:flex;gap:4px;margin:16px 0 12px;background:var(--surface-c);padding:4px;border-radius:var(--r-pill)}
.seg button{flex:1;height:48px;border:0;background:transparent;color:var(--on-surface-v);font:500 14px var(--font);border-radius:var(--r-seg);cursor:pointer;transition:flex var(--t-big) var(--ease-emph),border-radius var(--t-big) var(--ease-emph),background var(--t-micro),color var(--t-micro)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{flex:1.7;background:var(--primary);color:var(--on-primary);border-radius:var(--r-pill)}
.loader{height:0;overflow:hidden;display:grid;place-items:center;transition:height var(--t-big) var(--ease-emph)}
.loader.on{height:44px}
.blob{width:22px;height:22px;background:var(--primary);animation:morph 1.2s var(--ease-emph) infinite}
@keyframes morph{0%{border-radius:50%;transform:rotate(0)}33%{border-radius:30% 70% 60% 40%/50% 40% 60% 50%}66%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}100%{border-radius:50%;transform:rotate(180deg)}}
.stack{display:flex;flex-direction:column;gap:12px}
.card{border-radius:var(--r-card);padding:22px 22px 20px;position:relative;transition:transform var(--t-big) var(--ease-emph),opacity var(--t-big) var(--ease-emph)}
.stack.swap .card{opacity:0;transform:translateY(14px) scale(.98)}
.card.hero{background:var(--primary-c);color:var(--on-primary-c)}
.card.tonal{background:var(--surface-high)}
.card.leaf{background:var(--tertiary-c);color:var(--on-tertiary-c)}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin:0 0 8px}
.card h2{margin:0;font-size:24px;line-height:1.15;font-weight:500;letter-spacing:-.01em}
.card p{margin:8px 0 0;font-size:14px;line-height:1.45;opacity:.85}
.pill{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border:0;border-radius:var(--r-pill);background:var(--primary);color:var(--on-primary);font:500 15px var(--font);cursor:pointer;margin-top:16px;transition:transform var(--t-micro) var(--ease-emph),border-radius var(--t-micro)}
.pill:active{transform:scale(.96);border-radius:14px}
.pill svg{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{background:var(--surface);border-radius:20px;padding:14px 12px 12px}
.tile b{display:block;font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.tile span{font-size:12px;color:var(--on-surface-v)}
.habits{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.habits button{width:100%;display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 6px;border:0;background:transparent;color:inherit;font:400 15px var(--font);text-align:left;border-radius:14px;cursor:pointer}
.habits button:active{background:rgba(21,32,5,.08)}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--tertiary);display:grid;place-items:center;flex:none;transition:background var(--t-micro),border-radius var(--t-micro) var(--ease-emph)}
.chk svg{width:16px;height:16px;stroke-width:2.6;color:var(--tertiary-c);opacity:0;transform:scale(.5);transition:opacity var(--t-micro),transform var(--t-micro) var(--ease-emph)}
button[aria-checked="true"] .chk{background:var(--tertiary);border-radius:50%}
button[aria-checked="true"] .chk svg{opacity:1;transform:scale(1)}
button[aria-checked="true"] span{text-decoration:line-through;opacity:.6}
.fab{position:absolute;right:16px;bottom:118px;height:56px;padding:0 20px 0 16px;border:0;border-radius:18px;background:var(--primary-c);color:var(--on-primary-c);font:500 15px var(--font);display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-fab);cursor:pointer;transition:transform var(--t-micro) var(--ease-emph),border-radius var(--t-micro)}
.fab:active{transform:scale(.95);border-radius:28px}
.bar{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);height:64px;padding:8px;border-radius:var(--r-pill);background:var(--surface-highest);box-shadow:var(--shadow-bar);display:flex;gap:4px}
.bar button{width:56px;height:48px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--on-surface-v);display:grid;place-items:center;cursor:pointer;position:relative;transition:background var(--t-micro),color var(--t-micro),border-radius var(--t-big) var(--ease-emph)}
.bar button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-radius:16px}
.bar button:active{transform:scale(.94)}
.bar .dot{position:absolute;top:9px;right:12px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--tertiary);color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}.stack.swap .card{opacity:1;transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1><small>Tuesday, 29 September</small>Morning, Noor.</h1>
    <button class="avatar" aria-label="Account, Noor Haddad">NH</button>
  </header>
  <div class="seg" role="group" aria-label="Range" id="seg">
    <button aria-pressed="true">Today</button><button aria-pressed="false">Week</button><button aria-pressed="false">Month</button>
  </div>
  <div class="loader" id="loader" aria-hidden="true"><div class="blob"></div></div>
  <section class="stack" id="stack" aria-live="polite">
    <article class="card hero">
      <p class="eyebrow">Next up · 10:30</p>
      <h2 id="c1">Design sync with Priya</h2>
      <p>Room 4B · 3 joined · agenda: onboarding v3.</p>
      <button class="pill"><svg viewBox="0 0 24 24"><path d="M15 10l5-3v10l-5-3M3 7h12v10H3z"/></svg>Join call</button>
    </article>
    <article class="card tonal">
      <p class="eyebrow">Body</p>
      <h2 id="c2">You slept 7h 12m</h2>
      <div class="tiles">
        <div class="tile"><b>6,420</b><span>steps</span></div>
        <div class="tile"><b>5 / 8</b><span>glasses</span></div>
        <div class="tile"><b>61</b><span>resting bpm</span></div>
      </div>
    </article>
    <article class="card leaf">
      <p class="eyebrow">Habits · 1 of 3</p>
      <h2>14-day streak</h2>
      <ul class="habits" id="habits">
        <li><button role="checkbox" aria-checked="true"><i class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></i><span>10 minutes of reading</span></button></li>
        <li><button role="checkbox" aria-checked="false"><i class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></i><span>Walk after lunch</span></button></li>
        <li><button role="checkbox" aria-checked="false"><i class="chk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></i><span>Lights out by 23:00</span></button></li>
      </ul>
    </article>
  </section>
</main>
<button class="fab" id="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New task</button>
<nav class="bar" aria-label="Primary">
  <button aria-pressed="true" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg></button>
  <button aria-pressed="false" aria-label="Calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
  <button aria-pressed="false" aria-label="Inbox, 3 unread"><svg viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6H3v-6z"/></svg><span class="dot">3</span></button>
  <button aria-pressed="false" aria-label="Stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
  <button aria-pressed="false" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></button>
</nav>
<script>
  const seg=document.getElementById('seg'),loader=document.getElementById('loader'),stack=document.getElementById('stack');
  const copy={Today:['Design sync with Priya','You slept 7h 12m'],Week:['4 meetings, 2 free afternoons','Avg. sleep 6h 48m'],Month:['September: 11 focus days','Avg. sleep 7h 02m']};
  let timer=null;
  seg.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.getAttribute('aria-pressed')==='true')return;
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    loader.classList.add('on');stack.classList.add('swap');clearTimeout(timer);
    timer=setTimeout(()=>{const c=copy[b.textContent.trim()];document.getElementById('c1').textContent=c[0];document.getElementById('c2').textContent=c[1];loader.classList.remove('on');stack.classList.remove('swap');},700);
  });
  document.getElementById('habits').addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true');});
  document.querySelector('.bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.bar button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
</script>
</body>
</html>
