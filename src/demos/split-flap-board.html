<!-- Design Lounge piece: split-flap-board · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Board</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#141311;--flap:#1c1b19;--ink:#f4f1ea;--ink-2:#a39b90;--line:#2c2a26;--primary:#d7b15e;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px var(--sans);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.board{width:860px}
h1{font:500 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 16px}
.row{display:flex;gap:8px;margin-bottom:10px}
.cell{width:36px;height:52px;background:var(--flap);border-radius:2px;display:grid;place-items:center;font:500 28px/1 var(--mono);position:relative;overflow:hidden}
.cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45)}
.cell.flip{animation:flip 160ms cubic-bezier(0.2,0.7,0.2,1)}
@keyframes flip{from{transform:rotateX(-80deg)}to{transform:rotateX(0)}}
.gap{width:16px}
.replay{margin-top:18px;height:36px;padding:0 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:2px;font:500 13px var(--sans);cursor:pointer}
@media (prefers-reduced-motion:reduce){.cell.flip{animation:none}}
</style>
</head>
<body>
<div class="board">
  <h1>Departures · 3 Oct</h1>
  <div id="rows"></div>
  <button class="replay" id="replay" type="button">Replay</button>
</div>
<script>
const lines = ['KTM  GATE 4  06:40', 'BIR  HELD    07:15', 'PKR  CLEAR   08:05'];
const root = document.getElementById('rows');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cells = [];
lines.forEach((line) => {
  const row = document.createElement('div');
  row.className = 'row';
  [...line].forEach((ch) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.dataset.ch = ch === ' ' ? '' : ch;
    c.textContent = reduce ? (ch === ' ' ? '' : ch) : '·';
    if (ch === ' ') { c.style.visibility = 'hidden'; c.style.width = '12px'; }
    row.appendChild(c);
    cells.push(c);
  });
  root.appendChild(row);
});
let timers = [];
function play(){
  timers.forEach(clearTimeout);
  timers = [];
  cells.forEach((c, i) => {
    if (c.style.visibility === 'hidden') return;
    c.textContent = '·';
    c.classList.remove('flip');
    if (reduce) { c.textContent = c.dataset.ch; return; }
    timers.push(setTimeout(() => {
      c.textContent = c.dataset.ch || ' ';
      c.classList.add('flip');
    }, 40 + i * 28));
  });
}
document.getElementById('replay').addEventListener('click', play);
if (!reduce) play();
</script>
</body>
</html>
