<!-- Design Lounge piece: dropdown-kebab-actions · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Row actions menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0eb;--surface:#fff;--sunk:#f7f5f1;--ink:#16181d;--ink-2:#5b5f68;--ink-3:#71757e;
  --line:#e2ded5;--line-2:#ece9e2;--accent:#0e6e63;--accent-soft:#e3f0ee;--danger:#c0341b;--danger-soft:#fbeae6;
  --warn:#9a5b00;--warn-soft:#fbf0dc;--focus:#0e6e63;
  --sans:"Schibsted Grotesk",system-ui,sans-serif;--mono:"Spline Sans Mono",ui-monospace,monospace;
  --r-menu:10px;--r-item:6px;
  --shadow:0 1px 2px rgba(22,24,29,.06),0 12px 32px -6px rgba(22,24,29,.18);
  --ease:cubic-bezier(.2,.7,.2,1);--t-in:140ms;--t-out:100ms;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:28px 32px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em}
.brand i{width:22px;height:22px;border-radius:5px;background:var(--ink);display:grid;place-items:center}
.brand i::after{content:"";width:8px;height:8px;border:2px solid var(--bg);border-radius:50%}
.top nav{display:flex;gap:4px;margin-left:24px}
.top nav a{color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:6px;font-weight:500}
.top nav a[aria-current]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.top .who{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#d9d3c6;display:grid;place-items:center;font-size:12px;font-weight:600}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
h1{font-size:32px;line-height:1.1;letter-spacing:-.025em;margin:0;font-weight:700}
.head p{margin:6px 0 0;color:var(--ink-2)}
.head .new{margin-left:auto;height:38px;padding:0 16px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 96px 96px 120px 96px 44px;align-items:center;gap:12px;padding:0 12px 0 20px;min-height:58px;border-top:1px solid var(--line-2)}
.row.th{min-height:40px;border-top:0;background:var(--sunk);font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.02em}
.row:not(.th):hover{background:#fbfaf7}
.row.is-open{background:#f6f9f8}
.num{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.client b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{color:var(--ink-2);font-size:13px}
.amt{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.pill{justify-self:start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.sent{background:var(--accent-soft);color:var(--accent)}
.pill.draft{background:var(--line-2);color:var(--ink-2)}
.pill.overdue{background:var(--warn-soft);color:var(--warn)}
.pill.paid{background:#e9efe2;color:#3d6320}
.kebab{width:36px;height:36px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:background var(--t-in) var(--ease)}
.kebab:hover,.kebab[aria-expanded="true"]{background:var(--line-2);color:var(--ink)}
.kebab svg{width:20px;height:20px}
.foot{display:flex;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line-2);color:var(--ink-3);font-size:12.5px}
.row.leaving{opacity:0;transform:translateX(12px);transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.row.fresh{animation:fresh 900ms var(--ease)}
@keyframes fresh{from{background:var(--accent-soft)}}

/* popover */
.pop{position:fixed;z-index:10;width:252px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-menu);box-shadow:var(--shadow);padding:6px;opacity:0;transform:scale(.97) translateY(var(--dy,-4px));transform-origin:var(--ox,right) var(--oy,top);transition:opacity var(--t-out) var(--ease),transform var(--t-out) var(--ease);pointer-events:none}
.pop[data-side="top"]{--dy:4px;--oy:bottom}
.pop.on{opacity:1;transform:none;pointer-events:auto;transition-duration:var(--t-in)}
.pop[hidden]{display:none}
.ctx{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding:6px 10px 8px;border-bottom:1px solid var(--line-2);margin:0 -6px 6px;padding-left:16px}
[role="menu"]{outline:none}
[role="menuitem"]{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:var(--r-item);background:transparent;text-align:left;cursor:pointer;font-size:13.5px;outline:none}
[role="menuitem"] svg{width:16px;height:16px;flex:none;color:var(--ink-3)}
[role="menuitem"] kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em}
[role="menuitem"]:focus,[role="menuitem"]:hover{background:var(--sunk)}
[role="menuitem"]:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
[role="menuitem"][aria-disabled="true"]{color:var(--ink-3);cursor:default}
[role="menuitem"][aria-disabled="true"]:hover{background:transparent}
[role="menuitem"].danger{color:var(--danger)}
[role="menuitem"].danger svg{color:var(--danger)}
[role="menuitem"].danger:focus,[role="menuitem"].danger:hover{background:var(--danger-soft)}
[role="separator"]{height:1px;background:var(--line-2);margin:6px -6px}
.confirm{padding:10px 10px 8px}
.confirm h2{font-size:14px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.confirm p{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.confirm .acts{display:flex;gap:8px;justify-content:flex-end}
.confirm button{height:34px;padding:0 12px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer}
.confirm .ghost{border:1px solid var(--line);background:var(--surface)}
.confirm .del{border:0;background:var(--danger);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity 180ms var(--ease),transform 180ms var(--ease);display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{border:0;background:none;color:#8fd6cb;font-weight:600;cursor:pointer;padding:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.row{grid-template-columns:84px minmax(0,1fr) 110px 90px 44px}.row>.c-issued,.row>.c-due{display:none}}
@media (max-width:640px){.app{padding:20px 14px}.top nav{display:none}h1{font-size:26px}.head .new{padding:0 12px}
  .row{grid-template-columns:minmax(0,1fr) auto 40px;padding:8px 6px 8px 14px;gap:4px 10px}
  .row.th{display:none}.row>.num{grid-column:1;grid-row:2;font-size:11.5px}.row>.client{grid-column:1;grid-row:1}
  .row>.amt{grid-column:2;grid-row:1}.row>.pill{grid-column:2;grid-row:2;justify-self:end}.row>.kebab{grid-column:3;grid-row:1/3}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}.pop{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand"><i aria-hidden="true"></i>Tallyroom</span>
    <nav aria-label="Main"><a href="#" aria-current="page">Invoices</a><a href="#">Clients</a><a href="#">Payouts</a><a href="#">Reports</a></nav>
    <span class="who" aria-label="Signed in as Mira Dahl">MD</span>
  </header>
  <div class="head">
    <div><h1>Invoices</h1><p><span id="count">7</span> this quarter · €21,803.50 outstanding</p></div>
    <button class="new" type="button">New invoice</button>
  </div>
  <div class="card" role="table" aria-label="Invoices">
    <div class="row th" role="row"><span role="columnheader">Number</span><span role="columnheader">Client</span><span role="columnheader" class="c-issued">Issued</span><span role="columnheader" class="c-due">Due</span><span role="columnheader" style="text-align:right">Amount</span><span role="columnheader">Status</span><span role="columnheader"><span class="sr">Actions</span></span></div>
    <div id="rows" role="rowgroup"></div>
    <div class="foot"><span>Showing all invoices</span><span>Press <kbd>Shift</kbd>+<kbd>F10</kbd> on a row button for actions</span></div>
  </div>
</div>

<div class="pop" id="pop" hidden>
  <div class="ctx" id="ctx" aria-hidden="true"></div>
  <div role="menu" id="menu" aria-orientation="vertical">
    <button role="menuitem" tabindex="-1" data-act="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>Open<kbd aria-hidden="true">↵</kbd></button>
    <button role="menuitem" tabindex="-1" data-act="dup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Duplicate<kbd aria-hidden="true">⌘D</kbd></button>
    <button role="menuitem" tabindex="-1" data-act="pdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M5 20h14"/></svg>Download PDF<kbd aria-hidden="true">⇧⌘S</kbd></button>
    <button role="menuitem" tabindex="-1" data-act="remind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2ZM10 21h4"/></svg>Send reminder<kbd aria-hidden="true">⌘R</kbd></button>
    <button role="menuitem" tabindex="-1" data-act="paid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>Mark as paid<kbd aria-hidden="true">⌘P</kbd></button>
    <div role="separator"></div>
    <button role="menuitem" tabindex="-1" data-act="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></svg>Archive<kbd aria-hidden="true">E</kbd></button>
    <button role="menuitem" tabindex="-1" data-act="delete" class="danger" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Delete invoice…<kbd aria-hidden="true">⌫</kbd></button>
  </div>
  <div class="confirm" id="confirm" role="alertdialog" aria-modal="false" aria-labelledby="cf-h" aria-describedby="cf-p" hidden>
    <h2 id="cf-h"></h2>
    <p id="cf-p">The PDF and payment link stop working. This can't be undone.</p>
    <div class="acts"><button class="ghost" type="button" id="cf-no">Cancel</button><button class="del" type="button" id="cf-yes">Delete</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-t"></span></div>

<script>
const data=[
 {n:"INV-2047",c:"Halden & Moss Architects",e:"accounts@haldenmoss.eu",i:"Sep 28",d:"Oct 12",a:4820,s:"sent"},
 {n:"INV-2046",c:"Brightwater Ferments",e:"pay@brightwater.co",i:"Sep 14",d:"Sep 28",a:1260,s:"overdue"},
 {n:"INV-2045",c:"Okafor Studio",e:"ade@okafor.studio",i:"Oct 2",d:"Oct 18",a:9400,s:"draft"},
 {n:"INV-2044",c:"Lumen Dental Group",e:"finance@lumendental.eu",i:"Sep 16",d:"Sep 30",a:2150,s:"paid"},
 {n:"INV-2043",c:"North Quay Cycles",e:"hello@northquay.bike",i:"Oct 1",d:"Oct 15",a:735.5,s:"sent"},
 {n:"INV-2042",c:"Pellam Bakery Co.",e:"orders@pellam.bakery",i:"Sep 12",d:"Sep 26",a:388,s:"paid"},
 {n:"INV-2041",c:"Verity Hart",e:"verity@harthouse.me",i:"Oct 3",d:"Oct 21",a:3050,s:"sent"}
];
const label={sent:"Sent",draft:"Draft",overdue:"Overdue",paid:"Paid"};
const fmt=a=>"€"+a.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const rowsEl=document.getElementById("rows"),pop=document.getElementById("pop"),menu=document.getElementById("menu"),
  ctx=document.getElementById("ctx"),confirmEl=document.getElementById("confirm"),toast=document.getElementById("toast");
const items=()=>[...menu.querySelectorAll('[role="menuitem"]')];
let current=null,anchor=null,typed="",typedT=0,toastT=0,nextNum=2048;
const kebabSVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>';
function render(){
  rowsEl.innerHTML=data.map((r,k)=>`<div class="row" role="row" data-k="${k}">
    <span class="num" role="cell">${r.n}</span>
    <span class="client" role="cell"><b>${r.c}</b><span>${r.e}</span></span>
    <span class="date c-issued" role="cell">${r.i}</span><span class="date c-due" role="cell">${r.s==="paid"?"Paid":r.d}</span>
    <span class="amt" role="cell">${fmt(r.a)}</span>
    <span class="pill ${r.s}" role="cell">${label[r.s]}</span>
    <span role="cell"><button class="kebab" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Actions for ${r.n}, ${r.c}">${kebabSVG}</button></span>
  </div>`).join("");
  document.getElementById("count").textContent=data.length;
}
function place(lock){
  const r=anchor.getBoundingClientRect(),m=pop.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,gap=6,pad=8;
  let side="bottom",top=r.bottom+gap;
  if(lock?pop.dataset.side==="top":(top+m.height>vh-pad&&r.top-gap-m.height>=pad)){side="top";top=r.top-gap-m.height}
  top=Math.max(pad,Math.min(top,vh-pad-m.height));
  let left=r.right-m.width,ox="right";
  if(left<pad){left=r.left;ox="left"}
  left=Math.max(pad,Math.min(left,vw-pad-m.width));
  Object.assign(pop.style,{top:top+"px",left:left+"px"});pop.dataset.side=side;pop.style.setProperty("--ox",ox);
}
function openMenu(btn,focusIdx=0){
  if(anchor&&anchor!==btn)closeMenu(false);
  anchor=btn;current=data[+btn.closest(".row").dataset.k];
  btn.closest(".row").classList.add("is-open");
  ctx.textContent=current.n+" · "+current.c;
  menu.setAttribute("aria-label","Actions for "+current.n);
  const paid=current.s==="paid";
  menu.querySelector('[data-act="paid"]').setAttribute("aria-disabled",paid);
  menu.querySelector('[data-act="remind"]').setAttribute("aria-disabled",paid||current.s==="draft");
  menu.hidden=false;confirmEl.hidden=true;pop.hidden=false;
  btn.setAttribute("aria-expanded","true");
  place();requestAnimationFrame(()=>pop.classList.add("on"));
  const its=items();focusItem(focusIdx<0?its.length-1:focusIdx);
}
function closeMenu(returnFocus=true){
  if(!anchor)return;
  pop.classList.remove("on");pop.hidden=true;
  anchor.setAttribute("aria-expanded","false");anchor.closest(".row")?.classList.remove("is-open");
  const a=anchor;anchor=null;
  if(returnFocus&&a.isConnected)a.focus({preventScroll:true});
}
function focusItem(i){const its=items();its.forEach(x=>x.tabIndex=-1);const t=its[(i+its.length)%its.length];t.tabIndex=0;t.focus({preventScroll:true})}
function idx(){return items().indexOf(document.activeElement)}
function say(t,undo){
  clearTimeout(toastT);document.getElementById("toast-t").textContent=t;
  toast.querySelector("button")?.remove();
  if(undo){const b=document.createElement("button");b.type="button";b.textContent="Undo";b.onclick=()=>{undo();toast.classList.remove("on")};toast.append(b)}
  toast.classList.add("on");toastT=setTimeout(()=>toast.classList.remove("on"),4200);
}
function removeRow(r,msg){
  const k=data.indexOf(r),el=rowsEl.children[k];
  el.classList.add("leaving");
  setTimeout(()=>{data.splice(k,1);render();say(msg,()=>{data.splice(k,0,r);render();rowsEl.children[k].classList.add("fresh")})},matchMedia("(prefers-reduced-motion: reduce)").matches?0:200);
}
function act(it){
  if(it.getAttribute("aria-disabled")==="true")return;
  const a=it.dataset.act,r=current;
  if(a==="delete"){menu.hidden=true;confirmEl.hidden=false;document.getElementById("cf-h").textContent="Delete "+r.n+"?";place(true);document.getElementById("cf-no").focus({preventScroll:true});return}
  const btn=anchor;closeMenu();
  if(a==="dup"){const c={...r,n:"INV-"+nextNum++,s:"draft",i:"Oct 4",d:"Oct 18"};data.unshift(c);render();rowsEl.children[0].classList.add("fresh");rowsEl.querySelector(".kebab").focus({preventScroll:true});say("Duplicated as "+c.n+" (draft)")}
  else if(a==="paid"){r.s="paid";render();rowsEl.children[data.indexOf(r)].querySelector(".kebab").focus({preventScroll:true});say(r.n+" marked as paid")}
  else if(a==="archive")removeRow(r,r.n+" archived");
  else if(a==="remind")say("Reminder sent to "+r.e);
  else if(a==="pdf")say(r.n+".pdf downloaded");
  else say("Opening "+r.n+"…");
}
rowsEl.addEventListener("click",e=>{const b=e.target.closest(".kebab");if(!b)return;b.getAttribute("aria-expanded")==="true"?closeMenu():openMenu(b)});
rowsEl.addEventListener("keydown",e=>{const b=e.target.closest(".kebab");if(!b)return;
  if(e.key==="ArrowDown"||e.key==="Enter"||e.key===" "){e.preventDefault();openMenu(b,0)}
  else if(e.key==="ArrowUp"){e.preventDefault();openMenu(b,-1)}
  else if(e.key==="F10"&&e.shiftKey){e.preventDefault();openMenu(b,0)}});
menu.addEventListener("click",e=>{const it=e.target.closest('[role="menuitem"]');if(it)act(it)});
menu.addEventListener("mousemove",e=>{const it=e.target.closest('[role="menuitem"]');if(it&&it!==document.activeElement)focusItem(items().indexOf(it))});
menu.addEventListener("keydown",e=>{
  const i=idx(),n=items().length;
  if(e.key==="ArrowDown"){e.preventDefault();focusItem(i+1)}
  else if(e.key==="ArrowUp"){e.preventDefault();focusItem(i-1)}
  else if(e.key==="Home"||e.key==="PageUp"){e.preventDefault();focusItem(0)}
  else if(e.key==="End"||e.key==="PageDown"){e.preventDefault();focusItem(n-1)}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();act(document.activeElement)}
  else if(e.key==="Escape"){e.preventDefault();closeMenu()}
  else if(e.key==="Tab"){closeMenu(false)}
  else if(e.key.length===1&&/\S/.test(e.key)&&!e.metaKey&&!e.ctrlKey){
    clearTimeout(typedT);typed+=e.key.toLowerCase();typedT=setTimeout(()=>typed="",500);
    const its=items(),order=[...its.slice(i+1),...its.slice(0,i+1)];
    const q=typed.length>1&&its[i].textContent.trim().toLowerCase().startsWith(typed)?its[i]:order.find(x=>x.textContent.trim().toLowerCase().startsWith(typed));
    if(q)focusItem(its.indexOf(q));
  }
});
confirmEl.addEventListener("keydown",e=>{
  const no=document.getElementById("cf-no"),yes=document.getElementById("cf-yes");
  if(e.key==="Escape"){e.preventDefault();confirmEl.hidden=true;menu.hidden=false;place(true);focusItem(items().length-1)}
  else if(e.key==="Tab"){e.preventDefault();(document.activeElement===no?yes:no).focus()}
  else if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();(document.activeElement===no?yes:no).focus()}
});
document.getElementById("cf-no").onclick=()=>{confirmEl.hidden=true;menu.hidden=false;place(true);focusItem(items().length-1)};
document.getElementById("cf-yes").onclick=()=>{const r=current;const k=data.indexOf(r);closeMenu(false);
  const next=rowsEl.children[k+1]||rowsEl.children[k-1];next?.querySelector(".kebab").focus({preventScroll:true});removeRow(r,r.n+" deleted")};
document.addEventListener("pointerdown",e=>{if(anchor&&!pop.contains(e.target)&&!anchor.contains(e.target))closeMenu(false)});
addEventListener("resize",()=>anchor&&place());
addEventListener("scroll",()=>anchor&&place(true),true);
render();
openMenu(rowsEl.children[2].querySelector(".kebab"),1);
</script>
</body>
</html>
