 hb:()=>{const c=2*Math.PI*36,o=c*(1-habit/5);return '<button class="hb" style="position:absolute;inset:0;text-align:left;border-radius:inherit" data-habit aria-label="Read 20 minutes, '+habit+' of 5 this week. Log today"><span class="rg"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="#3A4C3F" stroke-width="9"/><circle cx="42" cy="42" r="36" fill="none" stroke="#B8E07A" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+o.toFixed(1)+'"/></svg><b>'+habit+'/5</b></span><p>Read 20 min<span>'+(habit>=5?'Week done':'This week')+'</span></p><span class="wk" aria-hidden="true">'+'MTWTFSS'.split('').map((d,i)=>'<span>'+d+'<i class="'+(i<habit?'y':'')+'"></i></span>').join('')+'</span><span class="lx hl" aria-hidden="true">'+[['Stretch 10 min',3,7],['Phone down by 23:00',5,7]].map(([n,a,b])=>'<span><b>'+n+'</b><em>'+a+'/'+b+'</em><s><i style="width:'+(a/b*100).toFixed(0)+'%"></i></s></span>').join('')+'</span></button>'},
 pl:()=>'<div class="pl2" style="position:absolute;inset:0"><div class="art" aria-hidden="true"></div><div class="tx"><small>NOW PLAYING</small><b>Low Tide Hymns</b><span class="by">Odile Varga</span><div class="bar"><i id="pbar"></i></div><div class="tm"><span id="ptime">1:42</span><span>4:08</span></div><div class="ctl">'+'<button aria-label="Previous track">'+sv('<path d="M7 5v14M18 6l-8 6 8 6z"/>')+'</button><button class="pp" data-play aria-label="Pause">'+sv('<path d="M9 6v12M15 6v12"/>',2.6)+'</button><button aria-label="Next track">'+sv('<path d="M17 5v14M6 6l8 6-8 6z"/>')+'</button></div></div></div>',
 sc:()=>'<div class="sc" style="position:absolute;inset:0">'+[['Focus 25 min','<circle cx="12" cy="13" r="7"/><path d="M12 9v4l2 2M10 3h4"/>'],['Scan to Notes','<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/>'],['Log water','<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'],['Lights off','<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/>'],['Start a run','<path d="M13 4a1.5 1.5 0 1 0 0 .1M8 21l3-6 3 2v4M7 12l3-4 4 1 2 3h3"/>',1],['Timer 10 min','<circle cx="12" cy="13" r="7"/><path d="M12 13V9M10 3h4"/>',1],['Share my ETA','<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',1],['Pay rent','<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/>',1]].map(([n,d,x])=>'<button'+(x?' class="lx"':'')+' aria-label="'+n+'">'+sv(d,1.9)+'<span>'+n+'</span></button>').join('')+'</div>'};
const CSSX='.w:not(.l) .lx,.w.s .mx{display:none}.w.l .lx{display:grid}.dl{position:absolute;left:16px;right:16px;top:186px;list-style:none;margin:0;padding:0;gap:0}.dl li{display:grid;grid-template-columns:44px 1fr 34px 90px 34px;align-items:center;height:30px;font-size:13px;font-weight:500;border-top:1px solid rgba(255,255,255,.16)}.dl li svg{width:18px;height:18px}.dl s{display:block;height:4px;border-radius:2px;background:linear-gradient(90deg,#9CC9EE,#FFD58A);text-decoration:none}.dl em{font-style:normal;color:#D5E3F0;text-align:right;padding-right:8px}';document.head.insertAdjacentHTML('beforeend','<style>'+CSSX+'.s .cal .ev li:first-child span{font-size:11px}.l .cal{display:block}.l .ev{margin-top:14px;gap:12px}.l .hr{position:absolute;top:110px;left:16px;right:16px;bottom:auto}.l .wx .c{bottom:auto;top:66px;left:auto;right:16px;text-align:right}.l .wk{top:auto;bottom:22px;left:16px;right:16px;grid-template-columns:repeat(7,1fr)}.l .art{width:140px;height:140px}.l .pl2{flex-direction:column}.l .sc{grid-template-columns:1fr 1fr;grid-auto-rows:1fr}.w.l .sc button.lx{display:flex}.hl{position:absolute;left:16px;right:16px;top:150px;display:grid;gap:14px}.hl>span{display:grid;grid-template-columns:1fr auto;row-gap:6px;font-size:13px}.hl em{font-style:normal;color:#C9D6CB}.hl s{grid-column:1/3;height:8px;border-radius:4px;background:#3A4C3F;text-decoration:none}.hl s i{display:block;height:100%;border-radius:4px;background:var(--lime)}.l .wk{bottom:18px}</style>');
let items=[{k:'w',t:'hb',z:'s'},{k:'w',t:'wx',z:'s'},{k:'stack',z:'m'},...APPS.map(a=>({k:'app',a}))],uid=0;items.forEach(i=>i.id=++uid);
const STACK=['cal','pl','sc'];let sp=0,playing=true,pt=102,edit=false;
function el(it){const d=document.createElement('div');d.dataset.id=it.id;const rm='<button class="rm" aria-label="Remove '+(it.k==='app'?it.a[0]:it.k==='stack'?'smart stack':TYPES[it.t][0]+' widget')+'"><i>'+sv('<path d="M6 12h12"/>',3)+'</i></button>';
 if(it.k==='app'){d.className='it app';d.innerHTML='<button class="ic" style="background:'+it.a[2]+';color:'+it.a[3]+'" aria-label="'+it.a[0]+'">'+sv(G[it.a[1]],1.9)+'</button><span aria-hidden="true">'+it.a[0]+'</span>'+rm}
 else if(it.k==='stack'){d.className='it w m stack';d.tabIndex=0;d.setAttribute('role','group');d.setAttribute('aria-roledescription','smart stack');d.innerHTML='<div class="face">'+STACK.map((t,i)=>'<div class="pg w m" data-p="'+i+'" style="position:absolute">'+W[t]()+'</div>').join('')+'</div><span class="dots" aria-hidden="true">'+STACK.map(()=>'<i></i>').join('')+'</span>'+rm}
 else{d.className='it w '+it.z;d.innerHTML='<div class="face">'+W[it.t]()+'</div>'+rm}
 return d}
function render(){const g=$('grid');g.innerHTML='';items.forEach(it=>g.appendChild(el(it)));place(0);tickPlay()}
function flip(mut){const g=$('grid'),first=new Map([...g.children].map(e=>[e.dataset.id,e.getBoundingClientRect()]));mut();if(reduce)return;
 for(const e of g.children){const f=first.get(e.dataset.id),l=e.getBoundingClientRect();if(!f){e.animate([{transform:'scale(.6)',opacity:0},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.16,1,.3,1)'});continue}
  const dx=f.left-l.left,dy=f.top-l.top;if(dx||dy)e.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:420,easing:'cubic-bezier(.32,.72,0,1)'})}}
function place(dy){const s=document.querySelector('.stack');if(!s)return;const n=STACK.length,h=152;
 s.querySelectorAll('.pg').forEach((p,i)=>{let r=((i-sp)%n+n)%n;if(r>n/2)r-=n;p.style.transform='translateY('+(r*h+dy)+'px)';p.classList.toggle('off',r!==0&&!dy);p.setAttribute('aria-hidden',r!==0)});
 s.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===sp));s.setAttribute('aria-label','Smart stack, '+TYPES[STACK[sp]][0]+', '+(sp+1)+' of '+n+'. Up and down arrows to rotate')}
function rot(d){const n=STACK.length,s=document.querySelector('.stack');s.querySelectorAll('.pg').forEach(p=>p.classList.remove('off'));sp=(sp+d+n)%n;requestAnimationFrame(()=>place(0));setTimeout(()=>place(0),440);say(TYPES[STACK[sp]][0])}
let ps=null,lp=0;
$('grid').addEventListener('pointerdown',e=>{if($('galw').className)return;const st=e.target.closest('.stack');ps={x:e.clientX,y:e.clientY,st,t:performance.now(),moved:false};
 clearTimeout(lp);if(!edit&&!e.target.closest('.rm'))lp=setTimeout(()=>{ps&&!ps.moved&&enter()},480)});
addEventListener('pointermove',e=>{if(!ps)return;const dy=e.clientY-ps.y;if(Math.abs(dy)>8||Math.abs(e.clientX-ps.x)>8){ps.moved=true;clearTimeout(lp)}
 if(ps.st&&!edit&&Math.abs(dy)>8){ps.st.classList.add('drag');ps.st.querySelectorAll('.pg').forEach(p=>p.classList.remove('off'));place(Math.max(-152,Math.min(152,dy)))}});
addEventListener('pointerup',e=>{clearTimeout(lp);if(!ps)return;const s=ps;ps=null;if(s.st&&s.moved&&!edit){s.st.classList.remove('drag');const dy=e.clientY-s.y,v=dy/Math.max(1,performance.now()-s.t);if(dy<-40||v<-.5)rot(1);else if(dy>40||v>.5)rot(-1);else place(0);s.st.dataset.swiped=1;setTimeout(()=>delete s.st.dataset.swiped,50)}});
$('grid').addEventListener('wheel',e=>{const s=e.target.closest('.stack');if(!s||edit||Math.abs(e.deltaY)<20||rot.t)return;e.preventDefault();rot(e.deltaY>0?1:-1);rot.t=setTimeout(()=>rot.t=0,500)},{passive:false});
$('grid').addEventListener('keydown',e=>{const s=e.target.classList.contains('stack');if(s&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();rot(e.key==='ArrowDown'?1:-1)}});
$('grid').addEventListener('contextmenu',e=>{e.preventDefault();if(!edit)enter()});
$('grid').addEventListener('click',e=>{const st=e.target.closest('.stack');if(st&&st.dataset.swiped)return;
 const r=e.target.closest('.rm');if(r){const node=r.closest('.it'),id=+node.dataset.id,name=r.getAttribute('aria-label').replace('Remove ','');node.classList.add('bye');setTimeout(()=>{flip(()=>{items=items.filter(i=>i.id!==id);$('grid').removeChild(node)});say(name+' removed');$('plus').focus()},reduce?0:220);return}
 if(edit)return;
 if(e.target.closest('[data-habit]')){habit=habit>=5?0:habit+1;const w=e.target.closest('.it');w.querySelector('.face').innerHTML=W.hb();w.querySelector('[data-habit]').focus();say('Read 20 minutes, '+habit+' of 5');return}
 if(e.target.closest('[data-play]')){playing=!playing;tickPlay();say(playing?'Playing':'Paused')}});
function enter(){edit=true;document.body.classList.add('edit');say('Editing home screen. Remove buttons shown. Done to finish.');setTimeout(()=>$('done').focus(),30)}
function leave(){edit=false;document.body.classList.remove('edit');say('Done editing')}
$('done').onclick=leave;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('galw').className)closeG();else if(edit)leave()}
 if(e.key==='Tab'&&$('galw').className){const f=[...$('sheet').querySelectorAll('button')],a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
function tickPlay(){const b=document.querySelector('[data-play]');if(!b)return;b.setAttribute('aria-label',playing?'Pause':'Play');b.innerHTML=playing?sv('<path d="M9 6v12M15 6v12"/>',2.6):sv('<path d="M8 5l11 7-11 7z"/>',2.2);drawP()}
function drawP(){const b=$('pbar'),t=$('ptime');if(!b)return;b.style.width=(pt/248*100).toFixed(1)+'%';t.textContent=Math.floor(pt/60)+':'+String(pt%60).padStart(2,'0')}
setInterval(()=>{if(playing){pt=pt>=248?0:pt+1;drawP()}},1000);
let gt='wx',gz='m';
$('types').innerHTML=Object.entries(TYPES).map(([k,v])=>'<button role="radio" data-t="'+k+'" aria-checked="'+(k===gt)+'">'+ico(k==='hb'?'hb':k==='pl'?'pl':k,v[2],v[3])+v[0]+'</button>').join('');
function gal(){document.querySelectorAll('#types button').forEach(b=>b.setAttribute('aria-checked',b.dataset.t===gt));document.querySelectorAll('#sz button').forEach(b=>b.setAttribute('aria-checked',b.dataset.z===gz));
 $('pv').innerHTML='<div class="w '+gz+'"><div class="face">'+W[gt]()+'</div></div>';$('pv').querySelectorAll('button,[tabindex]').forEach(b=>b.tabIndex=-1);
 $('nm').innerHTML='<b>'+TYPES[gt][0]+'</b>'+TYPES[gt][1];if(document.querySelector('#pv #pbar'))document.querySelector('#pv #pbar').removeAttribute('id')}
function openG(){gal();$('galw').className='gal';setTimeout(()=>document.querySelector('#types [aria-checked=true]').focus(),60)}
function closeG(){$('galw').className='';$('plus').focus()}
$('plus').onclick=openG;$('gx').onclick=closeG;$('scrim').onclick=closeG;
$('types').onclick=e=>{const b=e.target.closest('button');if(b){gt=b.dataset.t;gal()}};
$('sz').onclick=e=>{const b=e.target.closest('button');if(b){gz=b.dataset.z;gal()}};
[$('types'),$('sz')].forEach(g=>g.addEventListener('keydown',e=>{const d={ArrowRight:1,ArrowLeft:-1}[e.key];if(!d)return;e.preventDefault();const bs=[...g.children],i=bs.indexOf(document.activeElement),n=bs[(i+d+bs.length)%bs.length];n.click();n.focus()}));
$('addw').onclick=()=>{const it={k:'w',t:gt,z:gz,id:++uid};$('galw').className='';flip(()=>{items.unshift(it);$('grid').insertBefore(el(it),$('grid').firstChild)});$('home').scrollTo({top:0,behavior:reduce?'auto':'smooth'});say(TYPES[gt][0]+' widget added');$('plus').focus()};
$('dock').innerHTML=DOCK.map(d=>'<button class="ic" style="background:'+d[2]+';color:'+(d[3]||'#fff')+'" aria-label="'+d[0]+'">'+sv(G[d[1]],1.9)+'</button>').join('');
render();
})();
</script>
</body>
