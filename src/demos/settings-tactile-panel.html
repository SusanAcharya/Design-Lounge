<!-- Design Lounge piece: settings-tactile-panel · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warm — settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#e6e3df;--ink:#2a2622;--ink-2:#56514b;--ink-3:#625c56;--edge:#7d7770;
  --light:rgba(255,255,255,.85);--shade:rgba(74,66,58,.22);
  --raise:8px 8px 18px var(--shade),-8px -8px 18px var(--light);
  --raise-sm:4px 4px 10px var(--shade),-4px -4px 10px var(--light);
  --well:inset 6px 6px 12px var(--shade),inset -6px -6px 12px var(--light);
  --well-sm:inset 3px 3px 7px var(--shade),inset -3px -3px 7px var(--light);
  --sans:"Sora",system-ui,sans-serif;--r:20px;--r-card:24px;
  --t-micro:200ms;--t-knob:240ms;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--surface);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.top{padding:62px 20px 10px;display:flex;align-items:center;gap:14px}
.back{width:48px;height:48px;border-radius:50%;border:1px solid var(--edge);background:var(--surface);box-shadow:var(--raise-sm);display:grid;place-items:center;cursor:pointer;padding:0}
.back:active{box-shadow:var(--well-sm)}
.back svg{width:20px;height:20px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.scroll{height:calc(100% - 120px);overflow:auto;padding:14px 20px 40px;display:grid;gap:22px;align-content:start}
.group{display:grid;gap:10px}
.group h2{margin:0 0 2px 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.row{min-height:64px;padding:12px 16px;border-radius:var(--r);border:1px solid var(--edge);background:var(--surface);box-shadow:var(--raise);display:flex;align-items:center;gap:14px}
.row .t{flex:1;display:grid;gap:2px}
.row .t b{font-weight:600;font-size:16px}
.row .t span{font-size:13px;color:var(--ink-2)}
.ic{width:36px;height:36px;border-radius:12px;box-shadow:var(--well-sm);display:grid;place-items:center;flex:none}
.ic svg{width:18px;height:18px}
.sw{position:relative;width:60px;height:34px;border-radius:999px;border:1px solid var(--edge);background:var(--surface);box-shadow:var(--well-sm);cursor:pointer;padding:0;flex:none;transition:background var(--t-micro) var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--edge);box-shadow:var(--raise-sm);transition:transform var(--t-knob) var(--ease),background var(--t-micro) var(--ease)}
.sw[aria-checked="true"]::after{transform:translateX(26px);background:var(--ink);border-color:var(--ink)}
.sw .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);pointer-events:none}
.sw[aria-checked="true"] .lab{justify-content:flex-start;padding-left:9px;color:var(--ink)}
.row.tall{flex-wrap:wrap;padding-bottom:16px}
.row.tall .t{flex:1 1 60%}
.val{font-weight:800;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.slide{flex:1 1 100%;position:relative;height:40px;display:flex;align-items:center}
.slide input{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;background:var(--surface);box-shadow:var(--well-sm);border:1px solid var(--edge);margin:0;cursor:pointer}
.slide input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--edge);box-shadow:var(--raise-sm),inset 0 0 0 6px var(--surface),inset 0 0 0 9px var(--ink)}
.slide input::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--edge);box-shadow:var(--raise-sm)}
.seg{display:flex;padding:4px;border-radius:999px;box-shadow:var(--well-sm);border:1px solid var(--edge);flex:none}
.seg button{border:0;background:transparent;border-radius:999px;height:30px;padding:0 14px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;transition:box-shadow var(--t-micro) var(--ease),color var(--t-micro) var(--ease)}
.seg button[aria-pressed="true"]{box-shadow:var(--raise-sm);color:var(--ink);background:var(--surface)}
.row.link{cursor:pointer;text-align:left;width:100%}
.row.link:active{box-shadow:var(--well)}
.chev{width:20px;height:20px;color:var(--ink-3);flex:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<header class="top">
  <button class="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1>Settings</h1>
</header>
<main class="scroll">
  <section class="group" aria-labelledby="g1">
    <h2 id="g1">Heating</h2>
    <div class="row tall">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v10M8 14a4 4 0 1 0 8 0"/></svg></span>
      <div class="t"><b id="temp-l">Target while home</b><span>Holds from 06:30 to 22:00</span></div>
      <span class="val" id="temp-v" aria-live="polite">19.5°</span>
      <div class="slide"><input id="temp" type="range" min="15" max="24" step="0.5" value="19.5" aria-labelledby="temp-l" aria-valuetext="19.5 degrees"></div>
    </div>
    <div class="row">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span>
      <div class="t"><b id="sched">Follow the schedule</b><span>Weekdays and weekends differ</span></div>
      <button class="sw" role="switch" aria-checked="true" aria-labelledby="sched" type="button"><span class="lab">ON</span></button>
    </div>
    <div class="row">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20c0-8 6-14 14-16-1 8-6 14-14 16zM4 20l8-8"/></svg></span>
      <div class="t"><b id="eco">Eco mode</b><span>Drops 1.5° when nobody is in</span></div>
      <button class="sw" role="switch" aria-checked="false" aria-labelledby="eco" type="button"><span class="lab">OFF</span></button>
    </div>
  </section>
  <section class="group" aria-labelledby="g2">
    <h2 id="g2">Display</h2>
    <div class="row">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4h12M6 20h12M9 4v16M15 4v16"/></svg></span>
      <div class="t"><b>Units</b><span>Shown everywhere</span></div>
      <div class="seg" role="group" aria-label="Units"><button type="button" aria-pressed="true">°C</button><button type="button" aria-pressed="false">°F</button></div>
    </div>
    <div class="row">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 16V9a6 6 0 0 1 12 0v7l2 2H4zM10 21h4"/></svg></span>
      <div class="t"><b id="notif">Boiler alerts</b><span>Pressure, faults, filter due</span></div>
      <button class="sw" role="switch" aria-checked="true" aria-labelledby="notif" type="button"><span class="lab">ON</span></button>
    </div>
  </section>
  <section class="group" aria-labelledby="g3">
    <h2 id="g3">Home</h2>
    <button class="row link" type="button">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>
      <span class="t"><b>Rooms and radiators</b><span>5 rooms, 7 valves, all online</span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="row link" type="button">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
      <span class="t"><b>People</b><span>Mira, Tej and one guest key</span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </section>
</main>
<script>
  document.querySelectorAll('[role="switch"]').forEach(s=>s.addEventListener('click',()=>{const on=s.getAttribute('aria-checked')!=='true';s.setAttribute('aria-checked',String(on));s.querySelector('.lab').textContent=on?'ON':'OFF'}));
  const temp=document.getElementById('temp'),tv=document.getElementById('temp-v');
  let unit='C';
  const show=()=>{const c=Number(temp.value);const v=unit==='C'?c.toFixed(1)+'°':Math.round(c*9/5+32)+'°';tv.textContent=v;temp.setAttribute('aria-valuetext',v.replace('°',' degrees'))};
  temp.addEventListener('input',show);
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));unit=b.textContent.includes('F')?'F':'C';show()}));
</script>
</body>
</html>
