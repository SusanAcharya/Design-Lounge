<!-- Design Lounge piece: landing-agency-case-wall · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>North Yard — We show the work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--ink:#000000;--ink-2:#555555;--line:#000000;--orange:#ff4d00;
  --display:"Archivo Black",Impact,sans-serif;--sans:"Archivo",Helvetica,Arial,sans-serif;
  --nav:48px;--cta:56px;--gap:0px;
  --t:140ms;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:var(--cta)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}
nav{height:var(--nav);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;border-bottom:2px solid var(--ink);padding:0 20px;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
nav .mk{font-family:var(--display);font-size:16px;letter-spacing:.04em}
nav .loc{text-align:center;color:var(--ink-2)}
nav ul{list-style:none;margin:0;padding:0;display:flex;justify-content:flex-end;gap:20px}
nav a:hover{color:var(--orange)}
.hero{padding:22px 20px 18px;border-bottom:2px solid var(--ink);display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:end}
h1{margin:0;font:88px/.84 var(--display);text-transform:uppercase;letter-spacing:-.03em}
h1 span{color:transparent;-webkit-text-stroke:2px var(--ink)}
h1 b{color:var(--orange);-webkit-text-stroke:0;font-weight:inherit}
.aside{font-size:13px;line-height:1.4;max-width:28ch}
.aside p{margin:0 0 10px}
.aside .tag{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding-top:10px}
.wall{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--ink)}
.case{min-height:248px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:16px 18px;display:grid;grid-template-rows:auto 1fr auto;text-align:left;position:relative;overflow:hidden}
.case:nth-child(2n){border-right:0}
.case:nth-child(n+3){border-bottom:0}
.case .no{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.case h2{margin:8px 0 0;font:36px/.9 var(--display);text-transform:uppercase;letter-spacing:-.02em;max-width:10ch}
.case .cl{font-size:13px;color:var(--ink-2);align-self:end}
.art{position:absolute;right:16px;top:16px;width:110px;height:110px;pointer-events:none}
.case:nth-child(1) .art{background:conic-gradient(#000 0 25%,var(--orange) 0 50%,#000 0 75%,#fff 0)}
.case:nth-child(2) .art{background:repeating-linear-gradient(135deg,var(--ink) 0 10px,var(--orange) 10px 12px,#fff 12px 22px)}
.case:nth-child(3) .art{background:linear-gradient(var(--ink) 0 50%,var(--orange) 50% 54%,#fff 54%)}
.case:nth-child(4) .art{background:radial-gradient(circle at 50% 50%,var(--orange) 0 28%,transparent 29%),repeating-linear-gradient(#000 0 8px,#fff 8px 16px)}
.case:hover,.case[aria-current="true"]{background:var(--ink);color:var(--bg)}
.case:hover .cl,.case[aria-current="true"] .cl{color:#c8c8c8}
.case:hover .art,.case[aria-current="true"] .art{outline:2px solid var(--orange);outline-offset:3px}
.bar{position:fixed;left:0;right:0;bottom:0;height:var(--cta);background:var(--orange);color:#140600;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;z-index:4;border-top:2px solid var(--ink)}
.bar .who{font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.bar .mid{text-align:center;font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.bar .go{justify-self:end;height:36px;padding:0 16px;background:var(--ink);color:var(--bg);font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;display:grid;place-items:center;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.bar .go:hover{background:var(--bg);color:var(--ink)}
@media (max-width:900px){h1{font-size:64px}.hero{grid-template-columns:1fr}.wall{grid-template-columns:1fr}.case{border-right:0;border-bottom:2px solid var(--ink)}.bar{grid-template-columns:1fr auto}.bar .mid{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<nav aria-label="Primary">
  <a class="mk" href="#">North Yard</a>
  <span class="loc">Leeds · Est. 2016</span>
  <ul>
    <li><a href="#wall">Work</a></li>
    <li><a href="#wall">Studio</a></li>
    <li><a href="#go">Contact</a></li>
  </ul>
</nav>
<header class="hero">
  <h1>We show <span>the</span> <b>work.</b></h1>
  <div class="aside">
    <p>Identity, type and wayfinding for yards, halls and public bodies. Four people. We do not send decks.</p>
    <p class="tag"><span>Open Q1 2027</span><span>12 cases</span></p>
  </div>
</header>
<section class="wall" id="wall" aria-label="Case wall">
  <button class="case" aria-current="true">
    <span class="no">01 / Hall</span>
    <h2>Pier Ledger</h2>
    <span class="cl">Port of Goole · Identity 2026</span>
    <i class="art" aria-hidden="true"></i>
  </button>
  <button class="case">
    <span class="no">02 / Type</span>
    <h2>Civic Cut</h2>
    <span class="cl">Leeds Libraries · Typeface 2025</span>
    <i class="art" aria-hidden="true"></i>
  </button>
  <button class="case">
    <span class="no">03 / Sign</span>
    <h2>Volt Shed</h2>
    <span class="cl">Grid North · Wayfinding 2025</span>
    <i class="art" aria-hidden="true"></i>
  </button>
  <button class="case">
    <span class="no">04 / Mark</span>
    <h2>Harbour Index</h2>
    <span class="cl">Humber Trust · System 2024</span>
    <i class="art" aria-hidden="true"></i>
  </button>
</section>
<div class="bar" role="region" aria-label="Start a project">
  <span class="who">North Yard</span>
  <span class="mid">Available from January 2027</span>
  <a class="go" id="go" href="#">Start a project</a>
</div>
<script>
const cases=[...document.querySelectorAll('.case')];
function set(el){cases.forEach(c=>c.setAttribute('aria-current',c===el?'true':'false'));}
cases.forEach(c=>c.addEventListener('click',()=>set(c)));
</script>
</body>
</html>
