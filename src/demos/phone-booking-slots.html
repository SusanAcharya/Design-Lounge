<!-- Design Lounge piece: phone-booking-slots · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willowmere · Book a visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..600,100&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe4;--surface:#fbf8f1;--sage:#b7c4ab;--sage-soft:#e1e7d8;--green:#23402f;--green-2:#36573f;
  --ink:#1f2a22;--ink-2:#4b574e;--ink-3:#6c766f;--line:#e0d9c9;--on-green:#f4efe4;
  --serif:"Fraunces",Georgia,serif;--sans:"Source Sans 3",system-ui,sans-serif;
  --r:16px;--r-chip:14px;--std:cubic-bezier(.2,.7,.2,1);--ios:cubic-bezier(.32,.72,0,1);--micro:160ms;--layout:320ms;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding:max(54px,env(safe-area-inset-top)) 20px 0}
body::after{content:"";display:block;height:calc(156px + max(34px,env(safe-area-inset-bottom)))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.serif{font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:8px;margin:0 0 14px -10px}
.back{width:44px;height:44px;border-radius:22px;display:grid;place-items:center}
.top p{margin:0;font-size:14px;font-weight:600;color:var(--ink-2)}
h1{margin:0 0 16px;font-size:30px;line-height:1.1;font-weight:560;letter-spacing:-.01em}
.svc{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.leaf{width:48px;height:48px;border-radius:14px;background:var(--sage-soft);color:var(--green);display:grid;place-items:center;flex:none}
.svc div{flex:1;min-width:0}
.svc h2{margin:0;font-size:18px;font-weight:560;line-height:1.2}
.svc small{display:block;margin-top:3px;font-size:14px;color:var(--ink-3)}
.price{font-size:20px;font-weight:600;color:var(--green)}
h3{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h3 span{font-family:var(--serif);font-variation-settings:"SOFT" 100;text-transform:none;letter-spacing:0;font-size:16px;font-weight:560;color:var(--ink)}
.strip{position:relative;display:flex;gap:8px;margin:-6px -20px;padding:6px 20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 28px),transparent)}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;width:56px;height:72px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);scroll-snap-align:start;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background var(--micro) var(--std),color var(--micro) var(--std),transform var(--micro) var(--std)}
.day small{font-size:12px;font-weight:600;color:var(--ink-3)}
.day b{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:22px;font-weight:560;line-height:1.1}
.day:active:not(:disabled){transform:scale(.95)}
.day[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.day[aria-pressed="true"] small{color:var(--sage)}
.day:disabled{background:transparent;border-style:dashed;color:var(--ink-3);cursor:not-allowed}
.day:disabled b{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.7}
.grp{margin-top:18px}
.grp h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.grp h4 em{font-style:normal;font-weight:400;color:var(--ink-3)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{height:46px;border-radius:var(--r-chip);border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;
  transition:background var(--micro) var(--std),color var(--micro) var(--std),border-color var(--micro) var(--std),transform var(--micro) var(--std)}
.slot:hover:not(:disabled){border-color:var(--sage)}
.slot:active:not(:disabled){transform:scale(.95)}
.slot[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.slot:disabled{background:transparent;border-style:dashed;color:var(--ink-3);font-weight:400;text-decoration:line-through;cursor:not-allowed}
.empty{grid-column:1/-1;margin:0;padding:12px 14px;border-radius:var(--r-chip);background:var(--sage-soft);font-size:14px;color:var(--ink-2)}
.staff{display:flex;gap:4px;margin:0 -6px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;font-size:13px;color:var(--ink-2)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:18px;font-weight:560;color:var(--green);
  box-shadow:0 0 0 2px var(--bg),0 0 0 2px var(--bg);transition:box-shadow var(--micro) var(--std)}
.who[aria-checked="true"]{color:var(--ink);font-weight:700}
.who[aria-checked="true"] .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green)}
.a0{background:var(--surface);border:1.5px dashed var(--sage)}.a1{background:var(--sage-soft)}.a2{background:#ecdcc8}.a3{background:#dbe3e3}.a4{background:#e8e0cf}
.tz{display:flex;gap:10px;align-items:flex-start;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-3)}
.tz svg{flex:none;width:20px;height:20px;margin-top:1px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px max(34px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);
  transform:translateY(105%);transition:transform var(--layout) var(--ios)}
.bar.on{transform:none}
.bar p{display:flex;justify-content:space-between;margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.go{width:100%;height:56px;border-radius:var(--r);background:var(--green);color:var(--on-green);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;font-size:17px;font-weight:700;
  transition:background var(--micro) var(--std),transform var(--micro) var(--std)}
.go:active{transform:scale(.98)}
.go .num{font-family:var(--serif);font-variation-settings:"SOFT" 100;font-size:19px;font-weight:600}
.go.done{background:var(--green-2)}
.go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-right:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<div class="top">
  <button class="back" type="button" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <p>Willowmere Studio · Canal Street</p>
</div>
<h1 class="serif">Pick a time</h1>

<section class="svc" aria-label="Service">
  <span class="leaf" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14zM5 19l7-7"/></svg></span>
  <div><h2 class="serif">Deep tissue massage</h2><small id="svcSub">60 min · any therapist</small></div>
  <span class="price serif num" id="svcPrice">€78</span>
</section>

<h3 id="dl">Date <span>October 2026</span></h3>
<div class="strip" id="strip" role="group" aria-labelledby="dl"></div>

<h3>Time <span id="dayName">Thursday 8</span></h3>
<div id="groups"></div>

<h3 id="sl">Therapist</h3>
<div class="staff" id="staff" role="radiogroup" aria-labelledby="sl"></div>

<p class="tz"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Times are Berlin time, CEST (UTC+2). Free to move up to 24 hours before.</p>

<div class="bar" id="bar">
  <p><span id="barWho">Any therapist · 60 min</span><span>Pay at the studio</span></p>
  <button class="go" id="go" type="button"><span id="goLabel">Thu 8 Oct, 14:30 · Confirm</span><span class="num" id="goPrice">€78</span></button>
</div>
<p class="sr" id="live" aria-live="polite"></p>

<script>
const $=id=>document.getElementById(id);
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],WL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS=Array.from({length:14},(_,i)=>{const d=new Date(2026,9,3+i);return{d:d.getDate(),w:d.getDay(),full:[4,7,11,13].includes(d.getDate())}});
const GROUPS=[['Morning','09:00 to 12:00',['09:00','09:45','10:30','11:15']],['Afternoon','12:00 to 17:00',['12:00','12:45','13:30','14:30','15:15','16:00']],['Evening','17:00 to 20:00',['17:00','17:45','18:30','19:15']]];
const STAFF=[['Any','Any therapist',78],['MO','Maren',78],['JR','Jonah',78],['AL','Ada',88],['TK','Teo',78]];
let day=5,time='14:30',who=0,booked=false;

function free(di,t,s){if(di===5&&t==='14:30'&&s!==2)return true;let h=(di*131+t.replace(':','')*7+s*977)%23;return s===0?h>6:h>11}
function renderDays(){
  $('strip').innerHTML=DAYS.map((x,i)=>`<button type="button" class="day" data-i="${i}" aria-pressed="${i===day}" ${x.full?'disabled':''} aria-label="${WL[x.w]} ${x.d} October${x.full?', fully booked':''}${i===0?', today':''}"><small>${i===0?'Today':WD[x.w]}</small><b class="num">${x.d}</b></button>`).join('');
}
function renderSlots(){
  const x=DAYS[day];$('dayName').textContent=`${WL[x.w]} ${x.d}`;
  $('groups').innerHTML=GROUPS.map(([n,r,ts])=>{const open=ts.filter(t=>free(day,t,who)).length;
    return `<div class="grp" role="group" aria-label="${n}"><h4>${n} <em>${open?open+' open':'full'}</em></h4><div class="slots">${
      open?ts.map(t=>{const f=free(day,t,who);return `<button type="button" class="slot num" data-t="${t}" aria-pressed="${f&&t===time}" ${f?'':'disabled'} aria-label="${t}${f?'':', taken'}">${t}</button>`}).join('')
      :`<p class="empty">No ${n.toLowerCase()} times with ${STAFF[who][1].toLowerCase()} on this day.</p>`}</div></div>`}).join('');
}
function renderStaff(){
  $('staff').innerHTML=STAFF.map((s,i)=>`<button type="button" class="who" role="radio" data-s="${i}" aria-checked="${i===who}" tabindex="${i===who?0:-1}"><span class="av a${i}" aria-hidden="true">${i?s[0]:'<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="16" cy="10" r="2.5"/><path d="M3.5 19c.8-3 2.8-4.5 5.5-4.5s4.7 1.5 5.5 4.5M15 14.6c2.6 0 4.6 1.4 5.5 4.4"/></svg>'}</span>${s[0]==='Any'?'Any':s[1]}</button>`).join('');
}
function sync(){
  const x=DAYS[day],s=STAFF[who],ok=time&&free(day,time,who);
  if(!ok)time=null;
  $('svcSub').textContent=`60 min · ${who?'with '+s[1]:'any therapist'}`;
  $('svcPrice').textContent=$('goPrice').textContent='€'+s[2];
  $('barWho').textContent=`${s[1]} · 60 min`;
  booked=false;$('go').classList.remove('done');
  if(time)$('goLabel').textContent=`${WD[x.w]} ${x.d} Oct, ${time} · Confirm`;
  $('bar').classList.toggle('on',!!time);
  $('bar').inert=!time;
}
function all(){renderDays();renderSlots();renderStaff();sync()}

$('strip').addEventListener('click',e=>{const b=e.target.closest('.day');if(!b||b.disabled)return;day=+b.dataset.i;renderDays();sync();renderSlots();
  $('strip').querySelector(`[data-i="${day}"]`).focus();$('live').textContent=time?`${b.getAttribute('aria-label')}, ${time} kept`:`${b.getAttribute('aria-label')} selected. Choose a time.`});
$('groups').addEventListener('click',e=>{const b=e.target.closest('.slot');if(!b||b.disabled)return;time=b.dataset.t;renderSlots();sync();
  $('groups').querySelector(`[data-t="${time}"]`).focus();$('live').textContent=$('goLabel').textContent.replace(' · Confirm','')+' selected'});
function pick(i){who=(i+STAFF.length)%STAFF.length;renderStaff();sync();renderSlots();$('staff').querySelector(`[data-s="${who}"]`).focus()}
$('staff').addEventListener('click',e=>{const b=e.target.closest('.who');if(b)pick(+b.dataset.s)});
$('staff').addEventListener('keydown',e=>{const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(d){e.preventDefault();pick(who+d)}});
$('go').addEventListener('click',()=>{if(booked)return;booked=true;const g=$('go');g.classList.add('done');
  const x=DAYS[day];$('goLabel').innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Booked · ${WD[x.w]} ${x.d} Oct, ${time}`;
  $('live').textContent=`Booked for ${WL[x.w]} ${x.d} October at ${time}`});
all();
const sel=$('strip').querySelector('[aria-pressed="true"]');$('strip').scrollLeft=sel.offsetLeft-$('strip').clientWidth/2+sel.offsetWidth/2;
</script>
</body>
</html>
