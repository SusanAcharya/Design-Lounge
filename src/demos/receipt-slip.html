<!-- Design Lounge piece: receipt-slip · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Slip</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--ink:#161513;--ink-2:#5a554c;--primary:#1f4d3a;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px var(--sans);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.machine{width:320px;text-align:center}
.slot{height:28px;background:#1c1b19;border-radius:2px 2px 0 0}
.slip{background:#fffdf8;border:1px solid #e4dfd4;border-top:0;overflow:hidden;max-height:0;transition:max-height 700ms cubic-bezier(0.16,1,0.3,1)}
.slip[data-out="true"]{max-height:280px}
pre{margin:0;padding:16px 18px 20px;font:14px/1.7 var(--mono);text-align:left;white-space:pre-wrap}
button{margin-top:16px;height:44px;padding:0 16px;border:0;border-radius:2px;background:var(--primary);color:#fffdf8;font:500 14px var(--sans);cursor:pointer}
@media (prefers-reduced-motion:reduce){.slip{transition:none}}
</style>
</head>
<body>
<div class="machine">
  <div class="slot"></div>
  <div class="slip" id="slip"><pre>HOLLIS YARD
3 Oct 2026  18:40
Load 18   Gate 4
Held           6h
----------------
Not a tax bill</pre></div>
  <button type="button" id="go">Print slip</button>
</div>
<script>
const slip = document.getElementById('slip');
const go = document.getElementById('go');
go.addEventListener('click', () => {
  const on = slip.dataset.out !== 'true';
  slip.dataset.out = String(on);
  go.textContent = on ? 'Reprint' : 'Print slip';
});
</script>
</body>
</html>
