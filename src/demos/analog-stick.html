<!-- Design Lounge piece: analog-stick · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Stick</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--ink:#161513;--ink-2:#5a554c;--line:#cfc6b8;--primary:#1f4d3a;--mark:#d7b15e;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px var(--sans);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.well{width:280px;height:280px;border-radius:50%;background:#fff;border:1px solid var(--line);position:relative;touch-action:none}
.cap{position:absolute;left:90px;top:90px;width:100px;height:100px;border-radius:50%;background:#1c1b19;color:#f4f1ea;display:grid;place-items:center;font-weight:600;transition:transform 120ms cubic-bezier(0.16,1,0.3,1)}
.arrow{position:absolute;height:36px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:999px;font:500 13px var(--sans);color:var(--ink-2)}
.arrow.on{border-color:var(--mark);color:#6a4e16;background:#f8f1de}
.n{top:16px;left:50%;transform:translateX(-50%)}
.e{right:12px;top:50%;transform:translateY(-50%)}
.s{bottom:16px;left:50%;transform:translateX(-50%)}
.w{left:12px;top:50%;transform:translateY(-50%)}
@media (prefers-reduced-motion:reduce){.cap{transition:none}}
</style>
</head>
<body>
<div class="well" id="well" role="application" aria-label="Point the stick. Arrows lean it toward a room." tabindex="0">
  <span class="arrow n" id="n">Night</span>
  <span class="arrow e" id="e">Gate</span>
  <span class="arrow s" id="s">Month</span>
  <span class="arrow w" id="w">Yard</span>
  <div class="cap" id="cap">Hold</div>
</div>
<script>
const well = document.getElementById('well');
const cap = document.getElementById('cap');
const dirs = {n:'n', e:'e', s:'s', w:'w'};
function lean(dx, dy) {
  const ax = Math.abs(dx), ay = Math.abs(dy);
  let d = '';
  if (ax + ay > 12) d = ax > ay ? (dx > 0 ? 'e' : 'w') : (dy > 0 ? 's' : 'n');
  cap.style.transform = 'translate(' + (dx * 0.28) + 'px,' + (dy * 0.28) + 'px)';
  for (const k of Object.values(dirs)) document.getElementById(k).classList.toggle('on', k === d);
}
well.addEventListener('pointermove', (e) => {
  const r = well.getBoundingClientRect();
  lean(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
});
well.addEventListener('pointerleave', () => lean(0, 0));
const keys = {ArrowUp:[0,-80], ArrowDown:[0,80], ArrowLeft:[-80,0], ArrowRight:[80,0]};
well.addEventListener('keydown', (e) => {
  const k = keys[e.key];
  if (!k) return;
  e.preventDefault();
  lean(k[0], k[1]);
});
</script>
</body>
</html>
