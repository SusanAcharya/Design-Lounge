<!-- Design Lounge piece: table-orders-status · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hearthmade orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eadb;--surface:#fffbf4;--sunk:#f8f0e3;--ink:#2a1e16;--ink-2:#5e4b3c;--ink-3:#76614f;--line:#e6d8c3;--line-2:#d6c3a8;
  --accent:#b9472a;--accent-ink:#fffbf4;--accent-soft:#f6e1d6;
  --paid:#3f5a22;--paid-bg:#e5ebd2;--pend:#80520a;--pend-bg:#f7e5bf;--hold:#9b2f1d;--hold-bg:#f6dcd3;--ref:#5e4b3c;--ref-bg:#ece2d3;
  --display:"Fraunces",Georgia,serif;--sans:"Work Sans",system-ui,sans-serif;
  --r-card:18px;--r-pill:999px;--r-sm:8px;
  --ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans);display:grid;place-items:center;padding:32px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.card{width:100%;max-width:1120px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:0 1px 0 #fff inset,0 24px 48px -32px rgba(74,44,20,.35);position:relative;overflow:hidden}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:24px 28px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
h1{font:600 30px/1.1 var(--display);letter-spacing:-.02em;margin:0;font-variation-settings:"opsz" 96}
.meta{display:flex;gap:20px;color:var(--ink-2);font-size:13px}
.meta b{display:block;font:600 20px/1.1 var(--display);color:var(--ink)}
.wrap{position:relative}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 12px;height:44px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
th.num,td.num{text-align:right}
.sort{background:none;border:0;padding:6px 4px;margin:0 -4px;display:inline-flex;align-items:center;gap:6px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;border-radius:6px}
.sort:hover{color:var(--ink)}
.sort svg{width:12px;height:12px;opacity:.35;transition:transform .2s var(--ease),opacity .2s}
th[aria-sort="ascending"] .sort,th[aria-sort="descending"] .sort{color:var(--ink)}
th[aria-sort="ascending"] .sort svg{opacity:1;color:var(--accent);transform:rotate(180deg)}
th[aria-sort="descending"] .sort svg{opacity:1;color:var(--accent)}
td{padding:0 12px;height:60px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{transition:background .15s}
tr.row:hover{background:#fdf5ea}
tr.row.sel{background:var(--accent-soft)}
tr.row.open td{border-bottom-color:transparent}
.c-sel{width:52px;padding-left:24px}
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;background:var(--surface);display:grid;place-items:center;margin:0;cursor:pointer;transition:background .15s,border-color .15s}
.chk:checked,.chk:indeterminate{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.chk:indeterminate::after{content:"";width:8px;height:2px;background:var(--accent-ink);border-radius:2px}
.oid{font-weight:600;font-variant-numeric:tabular-nums}
.sub{display:block;font-size:12px;color:var(--ink-3)}
.cust{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--sans);flex:none;color:var(--ink)}
td.num{font-variant-numeric:tabular-nums;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.paid{color:var(--paid);background:var(--paid-bg)}
.pill.pending{color:var(--pend);background:var(--pend-bg)}
.pill.hold{color:var(--hold);background:var(--hold-bg)}
.pill.refunded{color:var(--ref);background:var(--ref-bg)}
.ful{display:grid;gap:6px;min-width:150px}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s var(--ease)}
.segs i.on{background:var(--accent)}
.ful.done .segs i.on{background:var(--paid)}
.ful span{font-size:12px;color:var(--ink-2)}
.c-exp{width:60px;padding-right:20px;text-align:right}
.exp{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center}
.exp:hover{border-color:var(--line-2);background:var(--sunk)}
.exp svg{width:16px;height:16px;transition:transform .28s var(--expo)}
.exp[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.exp[aria-expanded="true"] svg{transform:rotate(180deg)}
tr.detail td{height:auto;padding:0 20px 16px 64px;background:transparent}
tr.row.open+tr.detail{background:#fdf5ea}
tr.row.sel.open+tr.detail{background:var(--accent-soft)}
.items{list-style:none;margin:0;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.items.fresh{animation:drop .32s var(--expo)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.swatch{width:36px;height:36px;border-radius:9px;flex:none;position:relative;overflow:hidden}
.swatch::after{content:"";position:absolute;inset:auto 6px 6px 6px;height:10px;border-radius:5px 5px 2px 2px;background:rgba(255,255,255,.45)}
.item .nm{font-weight:500;line-height:1.25}
.item .nm small{display:block;color:var(--ink-3);font-size:12px;font-weight:400}
.pack{margin-left:auto;height:30px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:transparent;font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pack svg{width:13px;height:13px}
.pack[aria-pressed="true"]{background:var(--paid-bg);border-color:transparent;color:var(--paid)}
.bar{position:absolute;left:50%;bottom:18px;transform:translate(-50%,0);display:flex;align-items:center;gap:6px;padding:6px 6px 6px 18px;background:var(--ink);color:var(--surface);border-radius:var(--r-pill);box-shadow:0 18px 40px -16px rgba(42,30,22,.6);transition:transform .32s var(--expo),opacity .2s;white-space:nowrap;z-index:2}
.bar[hidden]{display:flex;opacity:0;transform:translate(-50%,24px);pointer-events:none;visibility:hidden}
.bar .count{font-weight:600;margin-right:10px;font-variant-numeric:tabular-nums}
.bar button{height:36px;padding:0 14px;border-radius:var(--r-pill);border:0;background:rgba(255,251,244,.1);color:var(--surface);font-weight:500;font-size:13px}
.bar button:hover{background:rgba(255,251,244,.2)}
.bar button.primary{background:var(--accent);color:var(--accent-ink)}
.bar button.primary:hover{background:#a63e23}
.bar :focus-visible{outline-color:#f2b49f}
.foot{height:72px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:820px){
  body{padding:12px;place-items:start center}
  .head{padding:18px 16px 14px}
  h1{font-size:24px}
  thead tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
  th{height:auto;padding:0;border:0;background:none}
  th.c-sel{width:auto;padding:0 6px 0 0}
  th.hide-m{display:none}
  .sort{padding:8px 6px}
  tbody,tr.row,tr.detail,td{display:block}
  tr.row{display:grid;grid-template-columns:34px 1fr auto;grid-template-areas:"sel order total" "sel cust status" "sel ful exp" ;column-gap:8px;row-gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  tr.row.open{border-bottom:0}
  td{height:auto;padding:0;border:0}
  td.c-sel{grid-area:sel;width:auto;padding:2px 0 0}
  td.c-order{grid-area:order}
  td.c-cust{grid-area:cust}
  td.c-date{display:none}
  td.c-total{grid-area:total}
  td.c-status{grid-area:status;justify-self:end}
  td.c-ful{grid-area:ful;align-self:center}
  td.c-exp{grid-area:exp;width:auto;padding:0}
  .ful{min-width:0}
  tr.detail td{padding:0 16px 14px 58px;border-bottom:1px solid var(--line)}
  tr.detail[hidden]{display:none}
  .items{grid-template-columns:1fr}
  .bar{position:fixed;left:12px;right:12px;bottom:12px;transform:none;justify-content:flex-end;padding-left:14px}
  .bar[hidden]{transform:translateY(24px)}
  .bar .count{margin-right:auto}
  .bar .opt{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;animation:none!important}}
</style>
</head>
<body>
<main class="card" aria-labelledby="t">
  <header class="head">
    <div>
      <p class="eyebrow">Hearthmade · Studio shop</p>
      <h1 id="t">Orders this week</h1>
    </div>
    <div class="meta" aria-label="Summary">
      <div><b id="m-open">0</b>to pack</div>
      <div><b>$1,010</b>gross</div>
    </div>
  </header>
  <div class="wrap">
    <table aria-labelledby="t" aria-describedby="hint">
      <caption class="sr" id="hint">Column headers sort the list. Each row expands to show its items.</caption>
      <thead>
        <tr>
          <th class="c-sel" scope="col"><input type="checkbox" class="chk" id="all" aria-label="Select all orders"></th>
          <th scope="col" data-k="id" aria-sort="descending"><button class="sort" type="button">Order<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 13l6 6 6-6"/></svg></button></th>
          <th scope="col" data-k="name" aria-sort="none"><button class="sort" type="button">Customer<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 13l6 6 6-6"/></svg></button></th>
          <th scope="col" data-k="date" aria-sort="none" class="hide-m"><button class="sort" type="button">Placed<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 13l6 6 6-6"/></svg></button></th>
          <th scope="col" data-k="total" aria-sort="none" class="num"><button class="sort" type="button">Total<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 13l6 6 6-6"/></svg></button></th>
          <th scope="col" data-k="status" aria-sort="none"><button class="sort" type="button">Payment<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 13l6 6 6-6"/></svg></button></th>
          <th scope="col" data-k="ful" aria-sort="none"><button class="sort" type="button">Fulfilment<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 13l6 6 6-6"/></svg></button></th>
          <th scope="col" class="c-exp hide-m"><span class="sr">Items</span></th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="foot" aria-hidden="true"></div>
    <div class="bar" id="bar" role="region" aria-label="Bulk actions" hidden>
      <span class="count" id="count">0 selected</span>
      <button type="button" class="opt" data-act="slips">Print slips</button>
      <button type="button" class="opt" data-act="hold">Put on hold</button>
      <button type="button" data-act="clear">Clear</button>
      <button type="button" class="primary" data-act="pack">Mark packed</button>
    </div>
  </div>
  <p class="sr" aria-live="polite" id="live"></p>
</main>
<script>
const P={paid:"Paid",pending:"Pending",hold:"On hold",refunded:"Refunded"};
const AV=["#f2c9a8","#d9e1c0","#f1d7a0","#e8c4bd","#cfd8d0","#e9d3b8","#d8cbe0"];
const orders=[
 {id:2047,name:"Maya Okafor",city:"Portland, OR",date:"2026-10-03",status:"paid",items:[["Hand-thrown mug","Oat glaze",38,1,1],["Linen tea towels","Set of 3",42,1,0],["Beeswax tapers","Pair, 10 in",24,1,0]]},
 {id:2046,name:"Theo Lindqvist",city:"Duluth, MN",date:"2026-10-03",status:"pending",items:[["Walnut serving board","Large",96,1,0],["Board butter","4 oz tin",14,2,0]]},
 {id:2045,name:"Priya Raman",city:"Austin, TX",date:"2026-10-02",status:"paid",items:[["Stoneware pour-over","Speckled",58,1,1],["Hand-thrown mug","Oat glaze",38,2,1]]},
 {id:2044,name:"Jonah Pierce",city:"Burlington, VT",date:"2026-10-02",status:"hold",items:[["Wool throw","Rust, 50 x 60",184,1,0]]},
 {id:2043,name:"Ines Duarte",city:"Oakland, CA",date:"2026-10-01",status:"paid",items:[["Ceramic salt cellar","With spoon",32,1,1],["Linen napkins","Set of 4",48,1,1],["Beeswax tapers","Pair, 10 in",24,2,1],["Olive wood spoon","12 in",18,1,1]]},
 {id:2042,name:"Sam Whitford",city:"Asheville, NC",date:"2026-09-30",status:"refunded",items:[["Stoneware pour-over","Speckled",58,1,0]]},
 {id:2041,name:"Lena Hoffmann",city:"Madison, WI",date:"2026-09-30",status:"paid",items:[["Wool throw","Oat, 50 x 60",184,1,1],["Hand-thrown mug","Ink glaze",38,2,0]]}
];
const SW=["#c97b4f","#a9b07a","#d8a25a","#8d6a4f","#b9472a","#c9b48f","#7f8f72"];
orders.forEach((o,i)=>{o.av=AV[i%AV.length];o.items.forEach((it,j)=>it.push(SW[(i+j*2)%SW.length]))});
const total=o=>o.items.reduce((s,it)=>s+it[2]*it[3],0);
const packed=o=>o.items.filter(it=>it[4]).length;
const ratio=o=>o.status==="refunded"?-1:packed(o)/o.items.length;
const money=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:2});
const dfmt=d=>new Date(d+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const sel=new Set([2046,2044]);const open=new Set([2047]);
let sortK="id",sortD=-1,fresh=null;
const tb=document.getElementById("tb"),all=document.getElementById("all"),bar=document.getElementById("bar"),live=document.getElementById("live");
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const tick='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
function fulCell(o){
  const p=packed(o),n=o.items.length,done=p===n&&o.status!=="refunded";
  const label=o.status==="refunded"?"Cancelled":p===0?"Unfulfilled":done?"Ready to ship":`Packing ${p} of ${n}`;
  return `<div class="ful${done?" done":""}" role="img" aria-label="${label}"><div class="segs">${o.items.map(it=>`<i class="${it[4]&&o.status!=="refunded"?"on":""}"></i>`).join("")}</div><span>${label}</span></div>`;
}
function render(){
  const f=document.activeElement&&document.activeElement.dataset.f;
  const list=[...orders].sort((a,b)=>{
    const v=k=>k==="total"?total:k==="ful"?ratio:x=>x[k];
    const A=v(sortK)(a),B=v(sortK)(b);
    return (A>B?1:A<B?-1:0)*sortD;
  });
  tb.innerHTML=list.map(o=>{
    const s=sel.has(o.id),e=open.has(o.id),n=o.items.reduce((a,it)=>a+it[3],0);
    return `<tr class="row${s?" sel":""}${e?" open":""}" data-id="${o.id}">
<td class="c-sel"><input type="checkbox" class="chk" data-f="c${o.id}" ${s?"checked":""} aria-label="Select order HM-${o.id}"></td>
<td class="c-order"><span class="oid">#HM-${o.id}</span><span class="sub">${n} item${n>1?"s":""}</span></td>
<td class="c-cust"><div class="cust"><span class="av" style="background:${o.av}" aria-hidden="true">${o.name.split(" ").map(w=>w[0]).join("")}</span><div>${o.name}<span class="sub">${o.city}</span></div></div></td>
<td class="c-date">${dfmt(o.date)}</td>
<td class="c-total num">${money(total(o))}</td>
<td class="c-status"><span class="pill ${o.status}">${P[o.status]}</span></td>
<td class="c-ful">${fulCell(o)}</td>
<td class="c-exp"><button class="exp" type="button" data-f="e${o.id}" aria-expanded="${e}" aria-controls="d${o.id}" aria-label="${e?"Hide":"Show"} items in HM-${o.id}">${icon}</button></td></tr>
<tr class="detail" id="d${o.id}" ${e?"":"hidden"}><td colspan="8"><ul class="items${fresh===o.id?" fresh":""}" aria-label="Items in HM-${o.id}">${o.items.map((it,j)=>`<li class="item"><span class="swatch" style="background:${it[5]}" aria-hidden="true"></span><span class="nm">${it[0]}${it[3]>1?" × "+it[3]:""}<small>${it[1]} · ${money(it[2])}</small></span><button type="button" class="pack" data-f="p${o.id}-${j}" data-o="${o.id}" data-j="${j}" aria-pressed="${!!it[4]}" ${o.status==="refunded"?"disabled":""}>${it[4]?tick+"Packed":"Pack"}</button></li>`).join("")}</ul></td></tr>`;
  }).join("");
  document.querySelectorAll("th[data-k]").forEach(th=>th.setAttribute("aria-sort",th.dataset.k===sortK?(sortD>0?"ascending":"descending"):"none"));
  sync();fresh=null;
  if(f){const el=tb.querySelector(`[data-f="${f}"]`);el&&el.focus()}
}
function sync(){
  const n=sel.size;
  all.checked=n===orders.length;all.indeterminate=n>0&&n<orders.length;
  bar.hidden=n===0;
  document.getElementById("count").textContent=`${n} selected`;
  document.getElementById("m-open").textContent=orders.filter(o=>o.status!=="refunded"&&packed(o)<o.items.length).length;
}
const say=t=>{live.textContent="";requestAnimationFrame(()=>live.textContent=t)};
document.querySelectorAll("th[data-k] .sort").forEach(b=>b.addEventListener("click",()=>{
  const k=b.closest("th").dataset.k;
  if(sortK===k)sortD*=-1;else{sortK=k;sortD=k==="name"||k==="status"?1:-1}
  render();say(`Sorted by ${b.textContent.trim()}, ${sortD>0?"ascending":"descending"}`);
}));
all.addEventListener("change",()=>{if(all.checked)orders.forEach(o=>sel.add(o.id));else sel.clear();render()});
tb.addEventListener("change",e=>{
  if(!e.target.matches(".chk"))return;
  const id=+e.target.closest("tr").dataset.id;
  e.target.checked?sel.add(id):sel.delete(id);render();
});
tb.addEventListener("click",e=>{
  const x=e.target.closest(".exp");
  if(x){const id=+x.closest("tr").dataset.id;if(open.has(id))open.delete(id);else{open.add(id);fresh=id}render();return}
  const p=e.target.closest(".pack");
  if(p){const o=orders.find(o=>o.id==p.dataset.o);const it=o.items[p.dataset.j];it[4]=it[4]?0:1;render();
    say(`${it[0]} ${it[4]?"packed":"unpacked"}. ${packed(o)} of ${o.items.length} packed.`)}
});
bar.addEventListener("click",e=>{
  const a=e.target.closest("button");if(!a)return;
  const ids=[...sel],n=ids.length;
  if(a.dataset.act==="clear"){sel.clear();render();all.focus();say("Selection cleared");return}
  if(a.dataset.act==="pack"){ids.forEach(id=>{const o=orders.find(o=>o.id===id);if(o.status!=="refunded")o.items.forEach(it=>it[4]=1)});say(`${n} order${n>1?"s":""} marked packed`)}
  if(a.dataset.act==="hold"){ids.forEach(id=>{const o=orders.find(o=>o.id===id);if(o.status!=="refunded")o.status="hold"});say(`${n} order${n>1?"s":""} put on hold`)}
  if(a.dataset.act==="slips")say(`Printing ${n} packing slip${n>1?"s":""}`);
  render();
});
render();
</script>
</body>
</html>
