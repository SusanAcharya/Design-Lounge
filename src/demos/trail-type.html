<!-- Design Lounge piece: trail-type · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Trail</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet">
<style>
:root{--bg:#141311;--ink:#f4f1ea}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:grid;place-items:center;font-family:Fraunces,Georgia,serif}
.stage{position:relative;width:720px;height:280px}
h1{margin:0;font-weight:560;font-size:120px;line-height:1;letter-spacing:-0.04em;color:transparent;-webkit-text-stroke:2px var(--ink);cursor:grab;user-select:none;position:absolute;left:40px;top:70px;touch-action:none}
.ghost{position:absolute;left:40px;top:70px;font:560 120px/1 Fraunces,Georgia,serif;letter-spacing:-0.04em;color:transparent;-webkit-text-stroke:2px #a39b90;pointer-events:none;opacity:.45}
@media (prefers-reduced-motion:reduce){h1{cursor:default}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <h1 id="word">HOLD</h1>
</div>
<script>
const stage = document.getElementById('stage');
const word = document.getElementById('word');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let drag = null, last = null, ghosts = [];
word.addEventListener('pointerdown', (e) => {
  if (reduce) return;
  drag = { x: e.clientX, y: e.clientY };
  last = { x: e.clientX, y: e.clientY };
  word.setPointerCapture(e.pointerId);
});
word.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  word.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  const dist = Math.hypot(e.clientX - last.x, e.clientY - last.y);
  if (dist < 28 || ghosts.length > 7) { return; }
  const g = document.createElement('div');
  g.className = 'ghost';
  g.setAttribute('aria-hidden', 'true');
  g.textContent = 'HOLD';
  g.style.transform = word.style.transform;
  stage.appendChild(g);
  ghosts.push(g);
  last = { x: e.clientX, y: e.clientY };
});
word.addEventListener('pointerup', () => {
  drag = null;
  word.style.transform = '';
  ghosts.forEach((g) => g.remove());
  ghosts = [];
});
</script>
</body>
</html>
