<!-- Design Lounge piece: input-phone-country · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Parcelry — Delivery contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--card:#fffdf8;--sunk:#f7f4ed;--line:#e2ddd1;--line-2:#cbc5b7;
  --ink:#1a1916;--ink-2:#55524a;--ink-3:#716d64;
  --accent:#2443d6;--accent-soft:#e8ecfc;--ok:#1f7a4d;--err:#c2412d;--focus:#2443d6;
  --sans:"Rethink Sans",system-ui,sans-serif;--mono:"Fragment Mono",ui-monospace,Menlo,monospace;
  --r:10px;--ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);display:grid;grid-template-columns:minmax(0,1fr) 520px;align-items:center;gap:80px;padding:48px 96px;min-height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.intro .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.intro .logo svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:1.75;stroke-linejoin:round}
.intro h1{margin:40px 0 0;font-size:60px;line-height:.98;font-weight:600;letter-spacing:-.04em;max-width:10ch}
.intro p{margin:20px 0 0;color:var(--ink-2);max-width:36ch;font-size:16px}
.steps{display:flex;gap:20px;margin:40px 0 0;padding:0;list-style:none;font:12px/1 var(--mono);color:var(--ink-3)}
.steps li[aria-current]{color:var(--ink)}
.steps li[aria-current]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;position:relative}
.card h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.card .lede{margin:6px 0 24px;color:var(--ink-2);font-size:14px}
.lab{display:block;font-size:13px;font-weight:600;margin:0 0 8px}
.field{display:flex;align-items:stretch;height:52px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.bad{border-color:var(--err);box-shadow:0 0 0 3px #f6e1dc}
.field.good{border-color:var(--ok)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;padding:0 14px;font:16px/1 var(--mono);letter-spacing:.02em}
.field input::placeholder{color:#a9a49a}
.static input{font-family:var(--sans);letter-spacing:0}
.cc{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-right:1px solid var(--line);border-radius:var(--r) 0 0 var(--r);transition:background .16s var(--ease)}
.cc:hover{background:var(--sunk)}
.cc:focus-visible{outline-offset:-2px}
.flag{font-size:20px;line-height:1;width:24px;text-align:center}
.cc .dial{font:15px/1 var(--mono);color:var(--ink-2)}
.cc svg{width:14px;height:14px;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;transition:transform .2s var(--ease)}
.cc[aria-expanded=true] svg{transform:rotate(180deg)}
.state{display:grid;place-items:center;width:44px;color:var(--ok)}
.state svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity .2s var(--ease),transform .3s var(--ease-out)}
.field.good .state svg{opacity:1;transform:none}
.hint{display:flex;justify-content:space-between;gap:12px;margin:8px 0 0;font-size:13px;color:var(--ink-3);min-height:20px}
.hint.err{color:var(--err)}
.hint.ok{color:var(--ok)}
.hint .count{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.e164{margin:16px 0 0;padding:12px 14px;border-radius:8px;background:var(--sunk);font:13px/1.4 var(--mono);color:var(--ink-2);display:flex;justify-content:space-between;gap:12px}
.e164 b{font-weight:400;color:var(--ink)}
.row{margin-top:20px}
.check{display:flex;align-items:center;gap:10px;margin:20px 0 0;font-size:14px;color:var(--ink-2);min-height:40px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.go{margin-top:16px;width:100%;height:48px;border-radius:var(--r);background:var(--ink);color:var(--card);font-weight:600;font-size:15px;transition:background .16s var(--ease),opacity .16s var(--ease)}
.go:hover:not(:disabled){background:var(--accent)}
.go:disabled{opacity:.35;cursor:not-allowed}

/* picker */
.wrap{position:relative}
.pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:var(--card);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 40px -18px rgba(26,25,22,.35),0 2px 6px rgba(26,25,22,.06);overflow:hidden;transform-origin:top;animation:pop .22s var(--ease-out)}
.pop[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-bottom:1px solid var(--line)}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:1.75;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:15px;height:100%}
.list{max-height:240px;overflow-y:auto;margin:0;padding:6px;list-style:none;overscroll-behavior:contain}
.grp{padding:10px 10px 4px;font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr) auto 18px;align-items:center;gap:10px;height:44px;padding:0 10px;border-radius:8px;cursor:pointer}
.opt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .nm mark{background:none;color:var(--accent);font-weight:600}
.opt .dc{font:13px/1 var(--mono);color:var(--ink-3)}
.opt svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.opt[aria-selected=true] svg{visibility:visible}
.opt.act{background:var(--accent-soft)}
.opt.act .dc{color:var(--ink-2)}
.empty{padding:20px 12px;color:var(--ink-3);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .pop{animation:none}
  .field,.cc,.cc svg,.state svg,.go{transition:none}
}
@media (max-width:1100px){body{padding:40px 48px;gap:48px;grid-template-columns:minmax(0,1fr) 460px}.intro h1{font-size:48px}}
@media (max-width:820px){body{grid-template-columns:minmax(0,1fr);padding:32px 24px;gap:32px;align-items:start}.intro h1{margin-top:24px;font-size:40px;max-width:none}.steps{margin-top:20px}}
@media (max-width:640px){
  body{padding:24px 16px}
  .intro h1{font-size:34px}
  .intro p{font-size:15px}
  .card{padding:20px}
  .cc{padding:0 8px 0 10px;gap:6px}
  .field input{padding:0 10px;font-size:15px}
  .state{width:36px}
  .e164{flex-direction:column;gap:2px}
}
</style>
</head>
<body>
<section class="intro">
  <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>Parcelry</div>
  <h1>Where should the courier call?</h1>
  <p>One number, any country. Pick a flag or paste a full international number and we will work it out.</p>
  <ol class="steps" aria-label="Checkout steps"><li>01 Address</li><li aria-current="step">02 Contact</li><li>03 Pay</li></ol>
</section>

<main class="card">
  <h2>Delivery contact</h2>
  <p class="lede">The courier texts you 30 minutes before arrival.</p>

  <label class="lab" for="name">Full name</label>
  <div class="field static"><input id="name" value="Tobias Ferreira-Okafor" autocomplete="name"></div>

  <div class="row wrap" id="wrap">
    <label class="lab" for="tel" id="telLab">Mobile number</label>
    <div class="field" id="field">
      <button class="cc" id="country" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="pop">
        <span class="flag" id="flag" aria-hidden="true"></span><span class="dial" id="dial"></span>
        <span class="sr" id="ccName"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <input id="tel" type="tel" inputmode="tel" autocomplete="tel-national" aria-describedby="hint" spellcheck="false">
      <span class="state" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    </div>
    <div class="pop" id="pop" hidden>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="text" placeholder="Search country or code" role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list" aria-label="Search countries" autocomplete="off">
      </div>
      <ul class="list" id="list" role="listbox" aria-label="Countries"></ul>
    </div>
    <p class="hint" id="hint"><span id="hintTxt"></span><span class="count" id="count"></span></p>
  </div>

  <p class="e164" aria-live="polite"><span>Saved as</span><b id="e164"></b></p>

  <label class="check"><input type="checkbox" checked> Text me delivery updates</label>
  <button class="go" id="go" type="button">Continue to payment</button>
</main>

<script>
const C = [
  ['AU','Australia','61','XXX XXX XXX','412345678',/^4/],
  ['BD','Bangladesh','880','XXXX-XXXXXX','1812345678',/^1/],
  ['BR','Brazil','55','(XX) XXXXX-XXXX','11961234567',/^\d\d9/],
  ['CA','Canada','1','(XXX) XXX-XXXX','4165550142',/^[2-9]/],
  ['CN','China','86','XXX XXXX XXXX','13812345678',/^1/],
  ['FR','France','33','X XX XX XX XX','612345678',/^[67]/],
  ['DE','Germany','49','XXXX XXXXXXX','15123456789',/^1[5-7]/],
  ['IN','India','91','XXXXX XXXXX','9812345678',/^[6-9]/],
  ['IE','Ireland','353','XX XXX XXXX','851234567',/^8/],
  ['IT','Italy','39','XXX XXX XXXX','3123456789',/^3/],
  ['JP','Japan','81','XX-XXXX-XXXX','9012345678',/^[789]0/],
  ['KE','Kenya','254','XXX XXXXXX','712345678',/^[17]/],
  ['MX','Mexico','52','XX XXXX XXXX','5512345678',/^\d/],
  ['NP','Nepal','977','XXX-XXXXXXX','9841234567',/^9[678]/],
  ['NL','Netherlands','31','X XXXXXXXX','612345678',/^6/],
  ['NZ','New Zealand','64','XX XXX XXXX','211234567',/^2/],
  ['NG','Nigeria','234','XXX XXX XXXX','8031234567',/^[789]/],
  ['PK','Pakistan','92','XXX XXXXXXX','3012345678',/^3/],
  ['PT','Portugal','351','XXX XXX XXX','912345678',/^9/],
  ['SG','Singapore','65','XXXX XXXX','81234567',/^[89]/],
  ['ZA','South Africa','27','XX XXX XXXX','821234567',/^[6-8]/],
  ['KR','South Korea','82','XX-XXXX-XXXX','1012345678',/^1/],
  ['ES','Spain','34','XXX XX XX XX','612345678',/^[67]/],
  ['SE','Sweden','46','XX-XXX XX XX','701234567',/^7/],
  ['AE','United Arab Emirates','971','XX XXX XXXX','501234567',/^5/],
  ['GB','United Kingdom','44','XXXX XXXXXX','7700900123',/^7/],
  ['US','United States','1','(XXX) XXX-XXXX','2015550123',/^[2-9]/]
].map(([iso, name, dial, pat, ex, start]) => ({ iso, name, dial, pat, ex, start, len: pat.split('X').length - 1 }));
const SUGGEST = ['GB', 'NP', 'US'];
const by = iso => C.find(c => c.iso === iso);
const flagOf = iso => String.fromCodePoint(...[...iso].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
const fmt = (d, pat) => { let out = '', i = 0; for (const p of pat) { if (i >= d.length) break; if (p === 'X') out += d[i++]; else out += p; } return out; };
const $ = id => document.getElementById(id);
const tel = $('tel'), field = $('field'), btn = $('country'), pop = $('pop'), q = $('q'), list = $('list');
let cur = by('GB'), digits = '7700900123', touched = false, opts = [], act = -1;

function setCountry(c, keepDigits) {
  cur = c;
  $('flag').textContent = flagOf(c.iso); $('dial').textContent = '+' + c.dial;
  $('ccName').textContent = c.name + ', country code +' + c.dial + '. Change country';
  tel.placeholder = fmt(c.ex, c.pat);
  if (!keepDigits) digits = digits.slice(0, c.len);
  render();
}

function render(caretDigits) {
  const shown = fmt(digits, cur.pat);
  tel.value = shown;
  if (caretDigits != null && document.activeElement === tel) {
    let pos = 0, seen = 0;
    while (pos < shown.length && seen < caretDigits) { if (/\d/.test(shown[pos])) seen++; pos++; }
    tel.setSelectionRange(pos, pos);
  }
  validate();
}

function validate() {
  const n = digits.length, full = n === cur.len, okStart = !n || cur.start.test(digits);
  const good = full && okStart;
  field.classList.toggle('good', good);
  const hint = $('hint'), txt = $('hintTxt');
  let bad = false, msg;
  if (!okStart) { bad = true; msg = `That doesn't look like a ${cur.name} mobile. Try ${fmt(cur.ex, cur.pat)}.`; }
  else if (good) msg = `Valid ${cur.name} mobile.`;
  else if (!n) msg = `${cur.name} · ${cur.len} digits after +${cur.dial}`;
  else if (touched) { bad = true; msg = `${cur.name} mobile numbers have ${cur.len} digits. You've entered ${n}.`; }
  else msg = `${cur.len - n} more ${cur.len - n === 1 ? 'digit' : 'digits'}`;
  hint.className = 'hint' + (bad ? ' err' : good ? ' ok' : '');
  field.classList.toggle('bad', bad);
  tel.setAttribute('aria-invalid', bad);
  txt.textContent = msg;
  $('count').textContent = `${n}/${cur.len}`;
  $('e164').textContent = good ? `+${cur.dial}${digits}` : n ? `+${cur.dial} ${fmt(digits, cur.pat)}…` : '—';
  $('go').disabled = !good;
}

function fromInternational(raw) {
  const d = raw.replace(/\D/g, '');
  const cands = C.filter(c => d.startsWith(c.dial)).sort((a, b) => b.dial.length - a.dial.length || (b.iso === 'US') - (a.iso === 'US'));
  if (!cands.length) return null;
  const best = cands.find(c => c.dial === cur.dial) && cands[0].dial === cur.dial ? cur : cands[0];
  return { c: best, rest: d.slice(best.dial.length) };
}

tel.addEventListener('beforeinput', e => {
  if (e.inputType === 'insertText' && e.data && /[^\d+\s()\-.]/.test(e.data)) e.preventDefault();
});
tel.addEventListener('input', () => {
  const raw = tel.value, caret = tel.selectionStart;
  if (/^\s*(\+|00)/.test(raw)) {
    const hit = fromInternational(raw.replace(/^\s*00/, '+'));
    if (hit) { digits = hit.rest.replace(/^0/, '').slice(0, hit.c.len); setCountry(hit.c, true); render(digits.length); return; }
  }
  const before = raw.slice(0, caret).replace(/\D/g, '').length;
  let d = raw.replace(/\D/g, ''), drop = 0;
  if (d.startsWith('0') && cur.dial !== '39') { d = d.slice(1); drop = 1; }
  digits = d.slice(0, cur.len);
  render(Math.max(0, before - drop));
});
tel.addEventListener('blur', () => { touched = digits.length > 0; validate(); });
tel.addEventListener('focus', () => { touched = false; });

/* picker */
function hl(name, term) {
  const i = term ? name.toLowerCase().indexOf(term) : -1;
  return i < 0 ? name : name.slice(0, i) + '<mark>' + name.slice(i, i + term.length) + '</mark>' + name.slice(i + term.length);
}
function build() {
  const raw = q.value.trim().toLowerCase(), term = raw.replace(/^\+/, '');
  const match = c => !term || c.name.toLowerCase().includes(term) || c.iso.toLowerCase() === term || c.dial.startsWith(term.replace(/\D/g, '') || '#');
  const all = C.filter(match);
  const sug = term ? [] : SUGGEST.map(by);
  opts = [];
  let h = '';
  const row = (c, k) => { opts.push(c); return `<li class="opt" role="option" id="o-${k}-${c.iso}" data-iso="${c.iso}" aria-selected="${c === cur}"><span class="flag" aria-hidden="true">${flagOf(c.iso)}</span><span class="nm">${hl(c.name, term)}</span><span class="dc">+${c.dial}</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></li>`; };
  if (sug.length) h += '<li class="grp" role="presentation">Suggested</li>' + sug.map(c => row(c, 's')).join('') + '<li class="grp" role="presentation">All countries</li>';
  h += all.map(c => row(c, 'a')).join('');
  list.innerHTML = all.length ? h : `<li class="empty" role="presentation">No country matches “${q.value.trim()}”.</li>`;
  setAct(all.length ? Math.max(0, term ? 0 : opts.indexOf(cur)) : -1);
}
function setAct(i) {
  const els = list.querySelectorAll('.opt');
  els.forEach(e => e.classList.remove('act'));
  act = i;
  if (i < 0 || !els[i]) { q.removeAttribute('aria-activedescendant'); return; }
  els[i].classList.add('act'); q.setAttribute('aria-activedescendant', els[i].id);
  els[i].scrollIntoView({ block: 'nearest' });
}
function open(focus = true) {
  pop.hidden = false; btn.setAttribute('aria-expanded', 'true'); q.value = ''; build();
  if (focus) q.focus();
}
function close(refocus) {
  if (pop.hidden) return;
  pop.hidden = true; btn.setAttribute('aria-expanded', 'false');
  if (refocus) btn.focus();
}
function choose(c) {
  const changed = c !== cur;
  setCountry(c); close(); tel.focus();
  if (changed) { touched = false; validate(); }
}
btn.addEventListener('click', () => pop.hidden ? open() : close(true));
btn.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); open(); } });
q.addEventListener('input', build);
q.addEventListener('keydown', e => {
  const n = opts.length;
  if (e.key === 'ArrowDown') { e.preventDefault(); if (n) setAct((act + 1) % n); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (n) setAct((act - 1 + n) % n); }
  else if (e.key === 'Home' && n) { e.preventDefault(); setAct(0); }
  else if (e.key === 'End' && n) { e.preventDefault(); setAct(n - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (act >= 0) choose(opts[act]); }
  else if (e.key === 'Escape') { e.preventDefault(); close(true); }
  else if (e.key === 'Tab') close();
});
list.addEventListener('mousemove', e => { const o = e.target.closest('.opt'); if (o) { const i = [...list.querySelectorAll('.opt')].indexOf(o); if (i !== act) setAct(i); } });
list.addEventListener('click', e => { const o = e.target.closest('.opt'); if (o) choose(by(o.dataset.iso)); });
document.addEventListener('pointerdown', e => { if (!pop.hidden && !$('wrap').contains(e.target)) close(); });
$('go').addEventListener('click', () => { $('hintTxt').textContent = `Saved. The courier will text +${cur.dial} ${fmt(digits, cur.pat)}.`; });

setCountry(cur, true);
open(false);
</script>
</body>
</html>
