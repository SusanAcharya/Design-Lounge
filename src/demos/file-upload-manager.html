<!-- Design Lounge piece: file-upload-manager · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Depot · Upload queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141518;--panel:#1b1d21;--raise:#23262b;--line:#2c2f35;--line-2:#3a3e45;
  --ink:#ebe9e3;--ink-2:#b4b1a9;--ink-3:#8c8981;
  --lime:#c8f53c;--lime-ink:#141518;--err:#ff7a66;--focus:#c8f53c;
  --sans:"Archivo",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:4px;--ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}

.app{position:fixed;inset:0;display:grid;grid-template-rows:52px minmax(0,1fr)}
.bar{display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);min-width:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:13px}
.logo i{width:14px;height:14px;background:var(--lime);display:block;border-radius:2px}
.path{font:12px var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.path b{color:var(--ink-2);font-weight:400}
.bar .user{margin-left:auto;font:12px var(--mono);color:var(--ink-3);white-space:nowrap}

.body{display:grid;grid-template-columns:420px minmax(0,1fr);min-height:0}
.left{padding:24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;min-height:0}
.zone{position:relative;flex:1;min-height:240px;border:1.5px dashed var(--line-2);border-radius:var(--r);display:flex;flex-direction:column;justify-content:flex-end;padding:28px;background:var(--panel);transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}
.zone .tag{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.zone .arrow{width:64px;height:64px;stroke-width:1.25;margin-bottom:auto;margin-top:36px;color:var(--ink-2)}
.zone h2{font-size:44px;line-height:.95;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
.zone p{margin:0 0 20px;color:var(--ink-2);max-width:30ch}
.browse{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r);background:var(--lime);color:var(--lime-ink);font-weight:600;align-self:flex-start}
.browse:hover{background:#d8ff5c}
.zone.over{background:var(--ink);color:var(--bg);border-color:var(--bg);border-style:solid}
.zone.over .tag,.zone.over p,.zone.over .arrow{color:#3a3c40}
.zone.over .browse{background:var(--bg);color:var(--ink)}
.picked{font:12px/1.5 var(--mono);color:var(--ink-3);min-height:18px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picked b{color:var(--ink);font-weight:500}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r)}
.rules div{padding:10px 12px;border-left:1px solid var(--line)}
.rules div:first-child{border-left:0}
.rules dt{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.rules dd{margin:2px 0 0;font:500 13px var(--mono)}

.right{display:flex;flex-direction:column;min-height:0;min-width:0}
.head{padding:24px 28px 18px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:flex-end;gap:20px}
.head h1{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.totals{font:13px var(--mono);color:var(--ink-2)}
.totals b{color:var(--ink);font-weight:500}
.pct{margin-left:auto;font:500 56px/0.85 var(--mono);letter-spacing:-.04em;color:var(--lime)}
.pct small{font-size:24px;color:var(--ink-3);margin-left:2px}
.total{height:6px;background:var(--raise);border-radius:2px;margin:16px 0 12px;overflow:hidden}
.total i{display:block;height:100%;background:var(--lime);width:0;transition:width .3s var(--ease)}
.hacts{display:flex;gap:8px;align-items:center}
.hacts .counts{flex:1;font:12px var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);font-size:13px;font-weight:500;white-space:nowrap}
.ghost:hover{border-color:var(--ink-2)}

.list{list-style:none;margin:0;padding:0 28px;overflow:auto;flex:1}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.badge{grid-row:1/3;height:40px;border-radius:var(--r);border:1px solid var(--line-2);display:grid;place-items:center;font:500 11px var(--mono);letter-spacing:.04em;color:var(--ink-2)}
.row.done .badge{background:var(--raise);border-color:var(--raise);color:var(--ink)}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{grid-column:2;font:12px var(--mono);color:var(--ink-3);display:flex;gap:14px;white-space:nowrap;overflow:hidden;min-width:0}
.meta .st{color:var(--ink-2)}
.row.up .meta .st{color:var(--lime)}
.row.fail .meta .st{color:var(--err)}
.ctl{grid-row:1/3;grid-column:3;display:flex;gap:4px;align-items:center}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink-2)}
.ib:hover{background:var(--raise);color:var(--ink)}
.retry{height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--err);color:var(--err);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.retry:hover{background:rgba(255,122,102,.12)}
.check{width:36px;height:36px;display:grid;place-items:center;color:var(--lime)}
.prog{grid-column:2;height:3px;background:var(--raise);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--lime);transition:width .25s linear}
.row.pause .prog i{background:repeating-linear-gradient(90deg,var(--ink-3) 0 6px,transparent 6px 9px)}
.row.fail .prog i{background:var(--err)}
.row.queue .prog i{background:var(--ink-3)}
.row.done .prog{display:none}
.row.up .prog i{background-image:linear-gradient(90deg,var(--lime) 60%,#efffb5 80%,var(--lime));background-size:200% 100%;animation:sheen 1.6s linear infinite}
@keyframes sheen{from{background-position:100% 0}to{background-position:-100% 0}}
.empty{padding:48px 0;color:var(--ink-3);font:13px var(--mono)}

@media (max-width:1100px){
  .body{grid-template-columns:340px minmax(0,1fr)}
  .zone h2{font-size:36px}
  .pct{font-size:44px}
}
@media (max-width:820px){
  body{overflow:auto}
  .app{position:static;min-height:100%;grid-template-rows:52px auto}
  .body{grid-template-columns:minmax(0,1fr)}
  .left{border-right:0;border-bottom:1px solid var(--line)}
  .zone{min-height:260px}
  .list{overflow:visible}
}
@media (max-width:640px){
  .bar{padding:0 16px}.bar .user{display:none}
  .left{padding:16px}
  .zone{padding:20px;min-height:230px}
  .zone .arrow{width:44px;height:44px;margin-top:28px}
  .zone h2{font-size:32px}
  .rules dd{font-size:12px}
  .head{padding:18px 16px 14px}
  .pct{font-size:40px}
  .list{padding:0 16px}
  .row{grid-template-columns:40px minmax(0,1fr) auto;gap:4px 10px}
  .badge{height:34px;font-size:10px}
  .meta .sp,.row.up .meta .by{display:none}
  .hacts{flex-wrap:wrap}
  .hacts .counts{flex-basis:100%;margin-bottom:4px}
  .retry span{display:none}
  .retry{padding:0 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo"><i aria-hidden="true"></i>Depot</div>
    <div class="path">northbank-post / <b>harbour-doc</b> / rushes / day-03</div>
    <div class="user">r.okafor · 2 TB plan</div>
  </header>
  <div class="body">
    <section class="left" aria-label="Add files">
      <div class="zone" id="zone">
        <div class="tag" aria-hidden="true"><span>Drop zone</span><span>Any type</span></div>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 14v6h16v-6"/></svg>
        <h2 id="zoneH">Drop files to upload</h2>
        <p id="zoneP">Rushes, audio, stills, documents. Up to 20 GB each. Folders keep their names.</p>
        <button class="browse" type="button" id="browse" aria-describedby="zoneP"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg>Browse files</button>
        <input type="file" id="file" multiple hidden>
      </div>
      <p class="picked" id="picked" aria-live="polite">No files picked yet.</p>
      <dl class="rules">
        <div><dt>Destination</dt><dd>day-03</dd></div>
        <div><dt>Parallel</dt><dd>2 files</dd></div>
        <div><dt>Free space</dt><dd>1.37 TB</dd></div>
      </dl>
    </section>
    <section class="right" aria-labelledby="qH">
      <div class="head">
        <div class="hrow">
          <div>
            <h1 id="qH">Upload queue</h1>
            <div class="totals" id="totals"></div>
          </div>
          <div class="pct" id="pct" aria-hidden="true"></div>
        </div>
        <div class="total" role="progressbar" aria-label="Total upload progress" aria-valuemin="0" aria-valuemax="100" id="totalBar"><i></i></div>
        <div class="hacts">
          <span class="counts" id="counts"></span>
          <button class="ghost" type="button" id="pauseAll">Pause all</button>
          <button class="ghost" type="button" id="clear">Clear finished</button>
        </div>
      </div>
      <ul class="list" id="list" aria-label="Files"></ul>
    </section>
  </div>
</div>
<p class="sr" id="live" aria-live="polite"></p>
<script>
const $ = s => document.querySelector(s);
const MB = 1048576, GB = 1073741824;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let files = [
  { n: 'A001_C014_0912.mov', size: 2.4 * GB, done: 0.46, st: 'up', sp: 41.6 },
  { n: 'boom_scene12_take3.wav', size: 186 * MB, done: 0.72, st: 'up', sp: 12.4 },
  { n: 'interview_lighting_plot.pdf', size: 4.8 * MB, done: 1, st: 'done' },
  { n: 'Bcam_harbour_v2.cube', size: 1.1 * MB, done: 1, st: 'done' },
  { n: 'drone_pass_04.mp4', size: 880 * MB, done: 0.61, st: 'fail' },
  { n: 'A001_C015_0912.mov', size: 1.9 * GB, done: 0.18, st: 'pause' },
  { n: 'stills_contact_sheet.zip', size: 340 * MB, done: 0, st: 'queue' }
];
let uid = 0; files.forEach(f => f.id = ++uid);
const MAX = 2;
const ext = n => (n.split('.').length > 1 ? n.split('.').pop() : 'file').slice(0, 4).toUpperCase();
const fmt = b => b >= GB ? (b / GB).toFixed(2) + ' GB' : b >= MB ? (b / MB).toFixed(b < 10 * MB ? 1 : 0) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const clock = s => { s = Math.max(1, Math.round(s)); const m = Math.floor(s / 60); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const I = {
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>',
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>',
  x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  retry: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
};
const list = $('#list'), live = $('#live');
function say(t){ live.textContent = t; }

function rowHTML(f){
  const pct = Math.floor(f.done * 100);
  const st = { up: pct + '%', pause: 'Paused ' + pct + '%', fail: 'Failed at ' + pct + '%', queue: 'Queued', done: 'Uploaded' }[f.st];
  const left = f.size * (1 - f.done);
  let meta = '<span class="st">' + st + '</span>';
  if (f.st === 'up') meta += '<span class="sp">' + f.sp.toFixed(1) + ' MB/s</span><span>' + clock(left / (f.sp * MB)) + ' left</span>';
  else if (f.st === 'fail') meta += '<span>Connection dropped</span>';
  meta += '<span class="by">' + (f.st === 'done' || !f.done ? fmt(f.size) : fmt(f.size * f.done) + ' / ' + fmt(f.size)) + '</span>';
  let ctl = '';
  const nm = esc(f.n);
  if (f.st === 'up' || f.st === 'queue') ctl += '<button class="ib" type="button" data-act="pause" aria-label="Pause ' + nm + '">' + I.pause + '</button>';
  if (f.st === 'pause') ctl += '<button class="ib" type="button" data-act="resume" aria-label="Resume ' + nm + '">' + I.play + '</button>';
  if (f.st === 'fail') ctl += '<button class="retry" type="button" data-act="retry" aria-label="Retry ' + nm + '">' + I.retry + '<span>Retry</span></button>';
  if (f.st === 'done') ctl += '<span class="check" aria-hidden="true">' + I.check + '</span>';
  ctl += '<button class="ib" type="button" data-act="cancel" aria-label="' + (f.st === 'done' ? 'Remove ' : 'Cancel ') + nm + '">' + I.x + '</button>';
  return '<span class="badge" aria-hidden="true">' + esc(ext(f.n)) + '</span><span class="name" title="' + nm + '">' + nm + '</span>' +
    '<div class="ctl">' + ctl + '</div><div class="meta">' + meta + '</div>' +
    '<div class="prog" role="progressbar" aria-label="' + nm + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + (f.done * 100).toFixed(2) + '%"></i></div>';
}
function draw(full){
  if (full){
    const keep = document.activeElement && document.activeElement.closest('.row') ? [document.activeElement.closest('.row').dataset.id, document.activeElement.dataset.act] : null;
    list.innerHTML = files.length ? files.map(f => '<li class="row ' + f.st + '" data-id="' + f.id + '">' + rowHTML(f) + '</li>').join('') : '<li class="empty">Queue is empty. Drop files on the left to start.</li>';
    if (keep){
      const row = list.querySelector('[data-id="' + keep[0] + '"]');
      const btn = row && (row.querySelector('[data-act="' + keep[1] + '"]') || row.querySelector('button'));
      (btn || $('#browse')).focus();
    }
  } else {
    files.forEach(f => {
      const row = list.querySelector('[data-id="' + f.id + '"]'); if (!row || f.st !== 'up') return;
      row.querySelector('.meta').innerHTML = rowHTML(f).match(/<div class="meta">(.*?)<\/div>/)[1];
      const p = row.querySelector('.prog'); p.setAttribute('aria-valuenow', Math.floor(f.done * 100));
      p.firstChild.style.width = (f.done * 100).toFixed(2) + '%';
    });
  }
  totals();
}
function totals(){
  const all = files.reduce((a, f) => a + f.size, 0), sent = files.reduce((a, f) => a + f.size * f.done, 0);
  const pct = all ? Math.floor(sent / all * 100) : 0;
  const c = k => files.filter(f => f.st === k).length;
  $('#totals').innerHTML = '<b>' + fmt(sent) + '</b> of ' + fmt(all);
  $('#pct').innerHTML = pct + '<small>%</small>';
  $('#totalBar').setAttribute('aria-valuenow', pct);
  $('#totalBar').firstChild.style.width = pct + '%';
  $('#counts').textContent = [c('done') + ' of ' + files.length + ' done', c('up') + ' uploading', c('pause') && c('pause') + ' paused', c('fail') && c('fail') + ' failed', c('queue') && c('queue') + ' queued'].filter(Boolean).join(' · ');
  const active = files.some(f => f.st === 'up' || f.st === 'queue');
  $('#pauseAll').textContent = active ? 'Pause all' : 'Resume all';
  $('#pauseAll').disabled = !files.some(f => f.st !== 'done' && f.st !== 'fail');
}
function schedule(){
  let n = files.filter(f => f.st === 'up').length;
  files.forEach(f => { if (f.st === 'queue' && n < MAX){ f.st = 'up'; f.sp = 18 + Math.random() * 30; n++; } });
}

/* simulation */
let last = performance.now();
setInterval(() => {
  const now = performance.now(), dt = Math.min(1, (now - last) / 1000); last = now;
  let changed = false;
  files.forEach(f => {
    if (f.st !== 'up') return;
    f.sp = Math.max(6, Math.min(64, f.sp + (Math.random() - 0.5) * 3));
    f.done = Math.min(1, f.done + f.sp * MB * dt / f.size);
    if (f.done >= 1){ f.st = 'done'; changed = true; say(f.n + ' uploaded'); }
  });
  if (changed){
    schedule(); draw(true);
    if (!files.some(f => f.st === 'up' || f.st === 'queue')) say(files.some(f => f.st === 'fail') ? 'Uploads stopped. One file needs a retry.' : 'All uploads complete');
  } else draw(false);
}, 250);

list.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = +b.closest('.row').dataset.id, f = files.find(x => x.id === id), act = b.dataset.act;
  if (act === 'pause'){ f.st = 'pause'; say(f.n + ' paused'); }
  if (act === 'resume'){ f.st = 'queue'; say(f.n + ' resumed'); }
  if (act === 'retry'){ f.st = 'queue'; say('Retrying ' + f.n); }
  if (act === 'cancel'){
    const i = files.indexOf(f); files.splice(i, 1);
    say(f.n + (f.st === 'done' ? ' removed from the list' : ' canceled'));
    schedule(); draw(true);
    const rows = list.querySelectorAll('.row');
    const next = rows[Math.min(i, rows.length - 1)];
    (next ? next.querySelector('button') : $('#browse')).focus();
    return;
  }
  schedule(); draw(true);
  const row = list.querySelector('[data-id="' + id + '"]');
  if (row) row.querySelector('button').focus();
});
$('#pauseAll').addEventListener('click', () => {
  const active = files.some(f => f.st === 'up' || f.st === 'queue');
  files.forEach(f => { if (active && (f.st === 'up' || f.st === 'queue')) f.st = 'pause'; else if (!active && f.st === 'pause') f.st = 'queue'; });
  schedule(); draw(true); say(active ? 'All uploads paused' : 'All uploads resumed');
});
$('#clear').addEventListener('click', () => {
  const n = files.filter(f => f.st === 'done').length;
  files = files.filter(f => f.st !== 'done'); draw(true);
  say(n ? n + ' finished ' + (n === 1 ? 'file' : 'files') + ' cleared' : 'Nothing to clear');
});

/* adding files */
function add(fl){
  const arr = [...fl]; if (!arr.length) return;
  arr.forEach(x => files.push({ id: ++uid, n: x.name, size: Math.max(x.size, 1024), done: 0, st: 'queue' }));
  const names = arr.slice(0, 3).map(x => esc(x.name)).join(', ') + (arr.length > 3 ? ' and ' + (arr.length - 3) + ' more' : '');
  $('#picked').innerHTML = '<b>' + arr.length + (arr.length === 1 ? ' file' : ' files') + ' added:</b> ' + names;
  schedule(); draw(true);
  list.lastElementChild.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
}
const zone = $('#zone'), input = $('#file'); let depth = 0;
$('#browse').addEventListener('click', () => input.click());
input.addEventListener('change', () => { add(input.files); input.value = ''; });
zone.addEventListener('dragenter', e => {
  e.preventDefault(); depth++;
  if (depth === 1){
    zone.classList.add('over');
    const n = e.dataTransfer && e.dataTransfer.items ? e.dataTransfer.items.length : 0;
    $('#zoneH').textContent = n ? 'Release to add ' + n + (n === 1 ? ' file' : ' files') : 'Release to add';
  }
});
zone.addEventListener('dragover', e => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; });
function leave(){ depth = 0; zone.classList.remove('over'); $('#zoneH').textContent = 'Drop files to upload'; }
zone.addEventListener('dragleave', () => { if (--depth <= 0) leave(); });
zone.addEventListener('drop', e => { e.preventDefault(); leave(); if (e.dataTransfer) add(e.dataTransfer.files); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

draw(true);
</script>
</body>
</html>
