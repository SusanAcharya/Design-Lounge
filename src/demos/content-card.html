<!-- Design Lounge piece: content-card · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5a554c;--ink-3:#5c564e;
  --line:#e4dfd4;--surface-2:#f0ebe3;--surface-3:#d7ebe1;--primary:#1f4d3a;--primary-soft:#e7f2ec;--focus:#1f4d3a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
.where{margin:0 0 16px;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
.card{width:360px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:inherit;font:inherit;text-align:left;cursor:pointer}
.card:hover{background:var(--surface-2)}
.card[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.card[aria-pressed="true"]:hover{background:var(--surface-3)}
.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kicker{font:500 12px/1 var(--sans);letter-spacing:.04em;color:var(--ink-2)}
.title{font:500 20px/1.2 var(--sans);color:var(--ink)}
.kg{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--ink-3)}
.status{margin:12px 0 0;font-size:12px;color:var(--ink)}
</style>
</head>
<body>
<p class="where">Loads</p>
<button class="card" id="card" type="button" aria-pressed="false">
  <span class="kicker">Gate 4</span>
  <span class="title">Rice</span>
  <span class="kg">2,400 kg</span>
  <span class="meta">Mira Shrestha · 17 October</span>
</button>
<p class="status" id="status" role="status" hidden>Load 1842 is open.</p>
<script>
const card = document.getElementById('card');
const status = document.getElementById('status');
card.addEventListener('click', () => {
  const on = card.getAttribute('aria-pressed') !== 'true';
  card.setAttribute('aria-pressed', on ? 'true' : 'false');
  status.hidden = !on;
});
</script>
</body>
</html>
