<!-- Design Lounge piece: field-label-morph · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Label that rises in the field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6;--card:#fffcf7;--line:#e4dcd0;--ink:#241c16;--muted:#7a6e62;--accent:#b24a28;--danger:#9c2f24;--danger-bg:#f8ebe8;
  --serif:"Newsreader",Georgia,serif;--sans:"Outfit",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --rise:200ms;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);display:grid;place-items:center;-webkit-font-smoothing:antialiased}
.card{width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 28px 24px;box-shadow:0 1px 0 rgba(36,28,22,.04),0 18px 40px -28px rgba(36,28,22,.45)}
h1{margin:0 0 4px;font:600 32px/1.05 var(--serif);letter-spacing:-.02em}
.lede{margin:0 0 22px;color:var(--muted);font-size:14px}
form{display:flex;flex-direction:column;gap:12px}
.field{position:relative;height:58px;border:1px solid var(--line);border-radius:12px;background:#fff}
.field.area{height:118px}
.field input,.field textarea{width:100%;height:100%;border:0;background:transparent;resize:none;padding:22px 14px 6px;font:15px/1.4 var(--sans);color:var(--ink);border-radius:12px}
.field textarea{padding-top:26px}
.field label{position:absolute;left:14px;top:18px;font-size:15px;color:var(--muted);pointer-events:none;transform-origin:left center;transition:transform var(--rise) var(--ease),color var(--rise) var(--ease)}
.field.filled label,.field:focus-within label{transform:translateY(-11px) scale(.73);color:var(--ink)}
.field:focus-within{border-color:var(--ink)}
.field.bad{border-color:var(--danger);background:var(--danger-bg)}
.field.bad label{color:var(--danger)}
.field input:focus,.field textarea:focus{outline:none}
.err{min-height:18px;margin:-4px 2px 0;font-size:13px;color:var(--danger)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:12px}
button{height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--ink);color:#f6f1ea;font:600 14px var(--sans);cursor:pointer}
button:hover{background:#3a2e24}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.status{font-size:13px;color:var(--muted);min-height:18px}
.status.ok{color:#2f6b45}
@media (prefers-reduced-motion:reduce){
  .field label{transition-duration:1ms}
}
</style>
</head>
<body>
<section class="card" aria-labelledby="t">
  <h1 id="t">A note for Fold</h1>
  <p class="lede">Thursday firing. Write before noon.</p>
  <form id="f" novalidate>
    <div class="field" id="name-wrap">
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" required>
    </div>
    <p class="err" id="name-err" role="alert"></p>
    <div class="field filled" id="mail-wrap">
      <label for="mail">Email</label>
      <input id="mail" name="mail" type="email" autocomplete="email" value="mira@fold.studio" required>
    </div>
    <p class="err" id="mail-err" role="alert"></p>
    <div class="field area" id="note-wrap">
      <label for="note">What you need</label>
      <textarea id="note" name="note" required></textarea>
    </div>
    <p class="err" id="note-err" role="alert"></p>
    <div class="row">
      <p class="status" id="status" role="status"></p>
      <button type="submit">Send the note</button>
    </div>
  </form>
</section>
<script>
const fields = [
  {input: document.getElementById('name'), wrap: document.getElementById('name-wrap'), err: document.getElementById('name-err'), empty: 'Add a name.'},
  {input: document.getElementById('mail'), wrap: document.getElementById('mail-wrap'), err: document.getElementById('mail-err'), empty: 'Add an email.', bad: 'That email needs an @.'},
  {input: document.getElementById('note'), wrap: document.getElementById('note-wrap'), err: document.getElementById('note-err'), empty: 'Add a short note.'}
];
function sync(f){
  const v = f.input.value.trim();
  f.wrap.classList.toggle('filled', v.length > 0);
}
function clearErr(f){
  f.wrap.classList.remove('bad');
  f.err.textContent = '';
}
fields.forEach(f => {
  sync(f);
  f.input.addEventListener('input', () => { sync(f); clearErr(f); });
});
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  let ok = true;
  fields.forEach(f => {
    const v = f.input.value.trim();
    clearErr(f);
    if (!v){ f.wrap.classList.add('bad'); f.err.textContent = f.empty; ok = false; return; }
    if (f.bad && !v.includes('@')){ f.wrap.classList.add('bad'); f.err.textContent = f.bad; ok = false; }
  });
  const status = document.getElementById('status');
  if (ok){
    status.className = 'status ok';
    status.textContent = 'Sent to the Thursday firing.';
  } else {
    status.className = 'status';
    status.textContent = '';
  }
});
</script>
</body>
</html>
