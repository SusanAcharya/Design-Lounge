<!-- Design Lounge piece: polaroid-fan · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Prints</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Public+Sans:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#1a1814;--ink-2:#5c564c;--primary:#1f4d3a;--serif:Fraunces,Georgia,serif;--sans:"Public Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.pile{width:520px;height:420px;position:relative;border:0;background:transparent;cursor:pointer}
.shot{position:absolute;left:150px;top:70px;width:200px;height:240px;background:#fffdf8;padding:12px 12px 36px;border-radius:2px;transition:transform 480ms cubic-bezier(0.16,1,0.3,1)}
.shot i{display:block;height:160px;background:var(--swatch)}
.shot b{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:560 16px var(--serif);color:var(--ink)}
.pile[data-open="true"] .s0{transform:translate(-150px,20px) rotate(-16deg)}
.pile[data-open="true"] .s1{transform:translate(-70px,-10px) rotate(-8deg)}
.pile[data-open="true"] .s2{transform:translate(10px,-24px) rotate(0)}
.pile[data-open="true"] .s3{transform:translate(90px,-8px) rotate(8deg)}
.pile[data-open="true"] .s4{transform:translate(160px,24px) rotate(16deg)}
@media (prefers-reduced-motion:reduce){.shot{transition:none}}
</style>
</head>
<body>
<button class="pile" id="pile" type="button" data-open="true" aria-expanded="true" aria-label="Yard prints, fan open">
  <span class="shot s0" style="--swatch:#1f4d3a"><i></i><b>Gate</b></span>
  <span class="shot s1" style="--swatch:#8c5a3c"><i></i><b>Night</b></span>
  <span class="shot s2" style="--swatch:#d7b15e"><i></i><b>Month</b></span>
  <span class="shot s3" style="--swatch:#5c564c"><i></i><b>Yard</b></span>
  <span class="shot s4" style="--swatch:#9b2c2c"><i></i><b>Hold</b></span>
</button>
<script>
const pile = document.getElementById('pile');
pile.addEventListener('click', () => {
  const on = pile.dataset.open !== 'true';
  pile.dataset.open = String(on);
  pile.setAttribute('aria-expanded', String(on));
  pile.setAttribute('aria-label', on ? 'Yard prints, fan open' : 'Yard prints, stacked');
});
</script>
</body>
</html>
