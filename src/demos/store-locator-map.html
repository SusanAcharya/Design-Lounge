<!doctype html>

<head>

<style>
:root{
  --bg:#fbfaf6;--panel:#ffffff;--line:#e4dfd3;--line2:#8a8577;
  --ink:#16233f;--ink2:#4a5267;--ink3:#5f6470;
  --navy:#1b2a4a;--on-navy:#ffffff;--tomato:#e5482d;--tomato-dk:#b8321b;--on-tomato:#ffffff;
  --open:#1e7a46;--soon:#8a5300;--shut:#5f6470;--you:#2563c9;
  --land:#efe8da;--water:#b9d3df;--park:#cadfbf;--road:#ffffff;--casing:#dcd2bf;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--data:"Space Grotesk",ui-monospace,sans-serif;
  --r:10px;--r-card:16px;--shadow:0 1px 2px rgba(22,35,63,.08),0 12px 32px -8px rgba(22,35,63,.28);
  --ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);--t:160ms;--t-l:320ms;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 var(--display);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tomato);outline-offset:2px}
.top{height:64px;flex:none;display:flex;align-items:center;gap:28px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}
.mark svg{width:30px;height:30px}
.mark small{font:500 11px var(--data);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.top nav{display:flex;gap:4px;margin-left:12px}
.top nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:500}
.top nav a:hover{color:var(--ink);background:#f1eee6}
.top nav a[aria-current]{color:var(--ink);box-shadow:inset 0 -2px var(--tomato);border-radius:0}
.book{margin-left:auto;height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--navy);color:var(--on-navy);font-weight:600}
.book:hover{background:#26396b}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:440px 1fr}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.head{padding:24px 24px 16px}
h1{margin:0 0 4px;font-size:40px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variation-settings:"opsz" 96}
h1 em{font-style:normal;color:var(--tomato-dk)}
.lede{margin:0 0 18px;color:var(--ink2);font-size:14px}
.search{display:flex;gap:8px}
.field{flex:1;min-width:0;position:relative}
.field svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--ink2);pointer-events:none}
.field input{width:100%;height:44px;border:1.5px solid var(--line2);border-radius:var(--r);padding:0 12px 0 40px;background:#fff;font-size:15px}
.field input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,74,.15)}
.loc{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border:1.5px solid var(--navy);border-radius:var(--r);background:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.loc svg{width:18px;height:18px}
.loc:hover{background:#eef1f8}
.loc[aria-busy=true] svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--open)}
.chip[aria-pressed=true] .dot{background:#7ee2a6}
.meta{display:flex;justify-content:space-between;padding:10px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:500 12px var(--data);color:var(--ink2);letter-spacing:.02em}
.list{list-style:none;margin:0;padding:6px 12px 16px;overflow:auto;flex:1;min-height:0}
.store{display:grid;grid-template-columns:32px 1fr auto;gap:2px 12px;width:100%;text-align:left;padding:14px 12px;border:0;border-radius:12px;background:none;position:relative}
.store:hover,.store.hot{background:#f6f3ec}
.store[aria-current=true]{background:#fdf0ec}
.store[aria-current=true]::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--tomato)}
.num{grid-row:span 3;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 13px var(--data)}
.store[aria-current=true] .num,.store.hot .num{background:var(--tomato-dk)}
.name{font-weight:700;font-size:16px;letter-spacing:-.01em}
.km{font:500 13px var(--data);color:var(--ink2);text-align:right}
.addr{grid-column:2/4;font-size:13px;color:var(--ink2)}
.st{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font:500 13px var(--data)}
.st b{font-weight:600}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px}
.open{color:var(--open)}.soon{color:var(--soon)}.shut{color:var(--shut)}
.svc{color:var(--ink2);font-weight:400}
.empty{padding:28px 16px;color:var(--ink2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--land)}
#map{width:100%;height:100%;display:block}
.lbl{font:600 11px var(--data);letter-spacing:.18em;fill:#5a5243}
.wl{font:italic 500 13px var(--display);fill:#2c5163;letter-spacing:.04em}
.pl{font:500 12px var(--display);fill:#35552f}
.pin{cursor:pointer}.pi{transform-origin:0 0;transition:transform var(--t) var(--ease)}
.pin path{fill:var(--navy);stroke:#fff;stroke-width:2.5}
.pin text{font:700 13px var(--data);fill:#fff;text-anchor:middle}
.pin.hot path,.pin.sel path{fill:var(--tomato-dk)}
.pin.sel .pi{transform:scale(1.22)}
.pin.dim{opacity:.28}
.pin:focus{outline:none}.pin:focus-visible path{stroke:var(--tomato);stroke-width:4}
.you{display:none}.you.on{display:block}
.you circle:first-child{fill:var(--you);opacity:.18;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.35}100%{transform:scale(1.6);opacity:0}}
#route{fill:none;stroke:var(--you);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 11}
#route.draw{animation:draw .7s var(--expo)}
@keyframes draw{from{stroke-dashoffset:300;opacity:0}to{stroke-dashoffset:0;opacity:1}}
.card{position:absolute;width:300px;background:var(--panel);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 18px 16px;transition:left var(--t-l) var(--expo),top var(--t-l) var(--expo),opacity var(--t) var(--ease)}
.card[hidden]{display:block;opacity:0;visibility:hidden}
.card h2{margin:0;font-size:22px;letter-spacing:-.03em;line-height:1.1}
.card .addr{margin:2px 0 10px}
.hours{width:100%;border-collapse:collapse;font:400 13px var(--data);margin:10px 0 14px}
.hours td{padding:3px 0;border-top:1px solid #f0ece3;color:var(--ink2)}
.hours td:last-child{text-align:right}
.hours tr.today td{color:var(--ink);font-weight:700}
.acts{display:flex;gap:8px}
.dir{flex:1;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:var(--tomato-dk);color:var(--on-tomato);text-decoration:none;font-weight:600}
.dir:hover{background:#9c2913}
.call{height:40px;padding:0 14px;display:flex;align-items:center;border-radius:999px;border:1.5px solid var(--navy);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.ride{margin:10px 0 0;font:500 13px var(--data);color:var(--you)}
.scale{position:absolute;left:20px;bottom:18px;font:500 11px var(--data);color:#4a4537;background:rgba(239,232,218,.9);padding:4px 8px;border-radius:6px}
.scale i{display:block;width:125px;height:6px;border:1.5px solid #4a4537;border-top:0;margin-top:2px}
.seg{display:none}
@media (max-width:860px){
  .top nav,.mark small{display:none}
  .top{gap:12px;padding:0 16px}
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{border-right:0;min-height:0}
  .head{padding:18px 16px 12px}
  h1{font-size:32px}
  .meta{padding:10px 16px}
  .list{padding:6px 4px 16px}
  .seg{display:flex;margin:12px 0 0;border:1.5px solid var(--navy);border-radius:999px;padding:3px}
  .seg button{flex:1;height:38px;border:0;border-radius:999px;background:none;font-weight:600}
  .seg button[aria-pressed=true]{background:var(--navy);color:#fff}
  .wrap.show-map .side{grid-row:1}
  .wrap.show-map .meta,.wrap.show-map .list,.wrap.show-map .chips,.wrap.show-map .lede{display:none}
  .wrap:not(.show-map) .mapwrap{display:none}
  .card{left:12px!important;right:12px;top:auto!important;bottom:12px;width:auto}
  .hours tr:not(.today),.scale{display:none}
}
@media (max-width:400px){.loc span{display:none}.loc{width:44px;padding:0;justify-content:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:1ms!important}}
</style>
