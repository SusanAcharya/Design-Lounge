<!-- Design Lounge piece: property-list · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Properties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5a554c;--line:#e4dfd4;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
.where{margin:0 0 16px;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
dl{width:420px;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:2px}
.row{min-height:48px;display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;padding:0 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
dt{margin:0;color:var(--ink-2);font-weight:500}
dd{margin:0;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<p class="where">Load 1842</p>
<dl>
  <div class="row"><dt>Gate</dt><dd>Gate 4</dd></div>
  <div class="row"><dt>Driver</dt><dd>Mira Shrestha</dd></div>
  <div class="row"><dt>Slot</dt><dd>17 October</dd></div>
  <div class="row"><dt>Weight</dt><dd>2,400 kg</dd></div>
</dl>
</body>
</html>
