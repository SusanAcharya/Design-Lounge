<!-- Design Lounge piece: phone-forgot-password · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Solander</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,500;0,600;1,500;1,600&family=Sofia+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4ddd0;--surface:#f8f4ec;--ink:#1c261f;--ink-2:#3e4c44;--ink-3:#4e5b53;
  --line:#d2c8b6;--accent:#1f5c3e;--on-accent:#f8f4ec;--error:#8c2a24;--focus:#1f5c3e;
  --serif:"Crimson Pro",Georgia,serif;--sans:"Sofia Sans",system-ui,sans-serif;
  --ease:cubic-bezier(0.2,0.7,0.2,1);--fast:160ms;--mid:240ms;--radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;min-height:100%;
  font:1rem/1.4 var(--sans);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(rgba(28,38,31,.045) .7px,transparent .75px);
  background-size:4px 4px;
  padding:0 16px max(34px,env(safe-area-inset-bottom));
  touch-action:pan-y;-webkit-font-smoothing:antialiased;
}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input{-webkit-appearance:none;appearance:none;border:0;background:transparent;border-radius:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:44px;margin:0 -16px;padding:max(54px,env(safe-area-inset-top)) 16px 0;
}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 4px 0 0;font-size:.9375rem;font-weight:600;color:var(--accent)}
.back svg{width:22px;height:22px}
.mark{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.25rem;letter-spacing:-.02em}
.mark svg{width:22px;height:22px;color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;padding-top:18px}
h1{margin:0;font-family:var(--serif);font-size:2.125rem;font-weight:600;line-height:1.1;letter-spacing:-.02em}
h1:focus-visible{outline:none;box-shadow:inset 0 -3px 0 var(--accent)}
.dek{margin:8px 0 0;max-width:34ch;color:var(--ink-2);font-size:1.0625rem;line-height:1.35}
.group{margin-top:22px;background:var(--surface);border-radius:var(--radius);padding:12px 14px 14px}
.group label{display:block;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.group input{display:block;width:100%;min-height:44px;margin-top:2px;font-size:1.0625rem;font-weight:500}
.group input::placeholder{color:#6f675c;font-weight:400}
.group input:focus-visible{outline:none;box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.pw{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);margin:8px -14px 0;padding:6px 4px 0 14px}
.pw input{flex:1;width:auto;min-width:0}
.eye{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink-2)}
.eye svg{width:22px;height:22px}
.err{margin:8px 0 0;font-size:.8125rem;font-weight:600;line-height:1.35;color:var(--error)}
.err:empty{display:none}
.group.bad{box-shadow:inset 0 0 0 1.5px var(--error)}
.cap{margin:0;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.addr{margin:4px 0 0;font-size:1.0625rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.note{margin:14px 0 0;color:var(--ink-2);font-size:.9375rem;line-height:1.4}
.btn{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:3.125rem;margin-top:16px;
  border-radius:var(--radius);padding:12px 16px;font-size:1.0625rem;font-weight:600;letter-spacing:.01em;
  transition:background-color var(--fast) var(--ease),transform var(--fast) var(--ease),color var(--fast) var(--ease);
}
.btn:active{transform:translateY(1px)}
.primary{background:var(--accent);color:var(--on-accent)}
@media(hover:hover){.primary:hover{background:#184a32}}
.resend{background:var(--surface);color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line)}
.resend[aria-disabled="false"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.textbtn{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;font-size:1rem;font-weight:600;color:var(--accent)}
.sheet{margin-top:22px;background:var(--surface);border-radius:var(--radius);padding:14px}
.sheet b{display:block;font-size:1.0625rem}
.sheet span{display:block;margin-top:2px;color:var(--ink-2);font-size:.875rem}
.foot{margin:24px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:.8125rem;color:var(--ink-3)}
svg{stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.rise{animation:rise var(--mid) var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
</style>
</head>
<body>
<header class="nav">
  <button class="back" type="button" id="back">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    Sign in
  </button>
  <span class="mark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c8-1 12-8 13-14-6 1-13 5-14 13z"/><path d="M9 16c2-2 4-4 7-6"/></svg>
    Solander
  </span>
</header>
<main>
  <h1 id="title" tabindex="-1">Reset password</h1>
  <p class="dek" id="dek">We will email a link to the address on your sheet.</p>

  <form id="form" novalidate>
    <div class="group" id="emailGroup">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="name@solander.club" aria-describedby="emailErr">
      <p class="err" id="emailErr" role="alert"></p>
    </div>
    <button class="btn primary" type="submit" id="send">Send link</button>
  </form>

  <section id="sent" hidden>
    <div class="group">
      <p class="cap">Link sent to</p>
      <p class="addr" id="addr"></p>
    </div>
    <p class="note">Open the message on this phone. The link works for one hour.</p>
    <button class="btn resend" type="button" id="resend" aria-disabled="true">Resend in 30s</button>
  </section>

  <form id="signin" hidden novalidate>
    <div class="group" id="signGroup">
      <label for="signEmail">Email</label>
      <input id="signEmail" type="email" inputmode="email" autocomplete="username" aria-describedby="signEmailErr">
      <p class="err" id="signEmailErr" role="alert"></p>
      <label for="signPw">Password</label>
      <div class="pw">
        <input id="signPw" type="password" autocomplete="current-password" placeholder="At least 8 characters" aria-describedby="signPwErr">
        <button class="eye" type="button" id="eye" aria-pressed="false" aria-label="Show password">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="err" id="signPwErr" role="alert"></p>
    </div>
    <button class="btn primary" type="submit">Sign in</button>
    <button class="textbtn" type="button" id="forgot">Forgot password</button>
  </form>

  <div class="sheet" id="signed" hidden>
    <b id="signedAddr"></b>
    <span>3 pressed sheets are waiting at the club.</span>
  </div>
</main>
<p class="foot">Pressed plants, filed under your name.</p>
<p class="sr" id="status" role="status"></p>
<script>
(function(){
  var email=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var form=document.getElementById('form');
  var sent=document.getElementById('sent');
  var signin=document.getElementById('signin');
  var signed=document.getElementById('signed');
  var title=document.getElementById('title');
  var dek=document.getElementById('dek');
  var back=document.getElementById('back');
  var emailInput=document.getElementById('email');
  // Autofocus only when the screen is the whole page; inside the Lounge's frame it would pull focus from the page around it.
  if(window.top===window.self) emailInput.focus();
  var emailGroup=document.getElementById('emailGroup');
  var emailErr=document.getElementById('emailErr');
  var addr=document.getElementById('addr');
  var resend=document.getElementById('resend');
  var status=document.getElementById('status');
  var signEmail=document.getElementById('signEmail');
  var signPw=document.getElementById('signPw');
  var signEmailErr=document.getElementById('signEmailErr');
  var signPwErr=document.getElementById('signPwErr');
  var left=0,timer=0;

  function setEmailErr(msg){
    emailErr.textContent=msg;
    emailInput.setAttribute('aria-invalid',msg?'true':'false');
    emailGroup.classList.toggle('bad',!!msg);
  }
  function validEmail(value,emptyMsg){
    if(!value) return emptyMsg;
    if(!email.test(value)) return 'Use an address like name@solander.club.';
    return '';
  }
  function paint(){
    if(left>0){
      resend.textContent='Resend in '+left+'s';
      resend.setAttribute('aria-disabled','true');
    }else{
      resend.textContent='Resend link';
      resend.setAttribute('aria-disabled','false');
      status.textContent='You can resend the link.';
    }
  }
  function startWait(){
    left=30; paint();
    clearInterval(timer);
    timer=setInterval(function(){
      left-=1; paint();
      if(left<=0) clearInterval(timer);
    },1000);
  }
  function show(view){
    form.hidden=view!=='form';
    sent.hidden=view!=='sent';
    signin.hidden=view!=='signin';
    signed.hidden=true;
    back.hidden=view==='signin';
    if(view==='form'){
      title.textContent='Reset password';
      dek.textContent='We will email a link to the address on your sheet.';
      emailInput.focus();
    }else if(view==='sent'){
      title.textContent='Check your email';
      dek.textContent='We sent a reset link to this address.';
      addr.textContent=emailInput.value.trim();
      sent.classList.add('rise');
      title.focus();
    }else{
      title.textContent='Sign in';
      dek.textContent='Use the password on your sheet.';
      signEmail.value=emailInput.value.trim();
      signEmail.focus();
    }
  }
  emailInput.addEventListener('blur',function(){
    if(!emailInput.value.trim()) return;
    setEmailErr(validEmail(emailInput.value.trim(),''));
  });
  emailInput.addEventListener('input',function(){
    if(emailErr.textContent) setEmailErr(validEmail(emailInput.value.trim(),''));
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var msg=validEmail(emailInput.value.trim(),'Enter the email on your sheet.');
    setEmailErr(msg);
    if(msg){ emailInput.focus(); return; }
    show('sent');
    startWait();
    status.textContent='Check your email. Link sent to '+emailInput.value.trim()+'.';
  });
  resend.addEventListener('click',function(){
    if(left>0){
      status.textContent='Wait '+left+' seconds to resend.';
      return;
    }
    startWait();
    status.textContent='Link sent again.';
  });
  back.addEventListener('click',function(){ show('signin'); });
  document.getElementById('forgot').addEventListener('click',function(){ show('form'); });
  document.getElementById('eye').addEventListener('click',function(){
    var on=signPw.type==='password';
    signPw.type=on?'text':'password';
    this.setAttribute('aria-pressed',on?'true':'false');
    this.setAttribute('aria-label',on?'Hide password':'Show password');
  });
  signin.addEventListener('submit',function(e){
    e.preventDefault();
    var v=signEmail.value.trim();
    var emailMsg=validEmail(v,'Enter the email on your sheet.');
    var pwMsg=signPw.value.length<8?'Use at least 8 characters.':'';
    signEmailErr.textContent=emailMsg;
    signPwErr.textContent=pwMsg;
    signEmail.setAttribute('aria-invalid',emailMsg?'true':'false');
    signPw.setAttribute('aria-invalid',pwMsg?'true':'false');
    if(emailMsg||pwMsg) return;
    title.textContent='Signed in';
    dek.textContent='Welcome back.';
    signin.hidden=true;
    signed.hidden=false;
    document.getElementById('signedAddr').textContent=v;
    status.textContent='Signed in as '+v+'.';
    title.focus();
  });
})();
</script>
</body>
</html>
