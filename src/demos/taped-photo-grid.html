<!-- Design Lounge piece: taped-photo-grid · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste — May, taped in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#c9a97c;--paper:#fbf6ec;--paper-2:#efe2c8;--ink:#2b2118;--ink-2:#4a3a2a;--ink-3:#4d3d2c;--line:#b08f62;
  --red:#d9442b;--red-ink:#b8322a;--blue:#1d4560;--yellow:#e0a300;--tape:rgba(255,250,230,.6);
  --hand:"Caveat",cursive;--sans:"Inter",system-ui,sans-serif;
  --r:4px;--shadow:0 8px 20px -10px rgba(43,33,24,.45);--t-micro:200ms;--t-tilt:320ms;--ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(43,33,24,.08) .8px,transparent 1px);background-size:5px 5px;opacity:.6}
a,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.wrap{position:relative;max-width:1200px;margin:0 auto;padding:34px 40px 0;height:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px}
.head h1{margin:0;font:700 48px/1 var(--hand);color:var(--ink)}
.head h1 small{display:block;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.head p{margin:0;max-width:34ch;color:var(--ink-2);font-size:14px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 28px;padding:10px 6px 0}
.photo{position:relative;background:var(--paper);padding:10px 10px 40px;box-shadow:var(--shadow);transform:rotate(calc(var(--rot) * var(--tilt,1)));transition:transform var(--t-tilt) var(--expo);text-decoration:none;color:inherit;display:block}
.photo:hover,.photo:focus-visible{transform:rotate(0deg) translateY(-6px);z-index:2}
.photo .img{display:block;aspect-ratio:4/3;overflow:hidden;background:var(--paper-2)}
.photo .img svg{width:100%;height:100%;display:block}
.photo figcaption{position:absolute;left:12px;right:12px;bottom:9px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 21px/1 var(--hand);color:var(--ink-2);white-space:nowrap;overflow:hidden}
.photo figcaption small{font:500 11px var(--sans);color:var(--ink-3);letter-spacing:.04em}
.tape{position:absolute;width:92px;height:24px;background:var(--tape);box-shadow:0 1px 2px rgba(43,33,24,.15);z-index:3;pointer-events:none}
.tape.a{left:-24px;top:-9px;transform:rotate(-36deg)}
.tape.b{right:-24px;top:-9px;transform:rotate(36deg)}
.tape.c{left:50%;top:-11px;transform:translateX(-50%) rotate(-2deg)}
.photo.pin .tape{display:none}
.pin::before{content:"";position:absolute;left:50%;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 2px 0 rgba(43,33,24,.35),inset -3px -3px 0 rgba(43,33,24,.2);z-index:3;transform:translateX(-50%)}
.stamp{position:absolute;right:-10px;top:14px;z-index:3;font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--red-ink);border:2px solid var(--red-ink);background:var(--paper);padding:5px 7px;transform:rotate(8deg);pointer-events:none}
.note{position:absolute;left:40px;bottom:44px;font:700 26px/1 var(--hand);color:var(--blue);transform:rotate(-3deg);display:flex;gap:10px;align-items:center}
.note svg{width:54px;height:30px}
@media (max-width:1279px){.grid{gap:26px 20px}.photo figcaption{font-size:19px}}
@media (max-width:1023px){html{overflow-x:clip}body{overflow:auto}.wrap{height:auto;padding:28px 28px 40px}.head{flex-direction:column;align-items:flex-start;gap:12px}.head p{text-align:left}.grid{grid-template-columns:repeat(3,1fr)}.note{position:static;margin-top:28px;transform:none}}
@media (max-width:639px){.wrap{padding:20px 20px 40px}.grid{grid-template-columns:1fr 1fr;gap:22px 14px}.photo{--tilt:.5;padding:8px 8px 46px}.photo figcaption{font-size:18px;left:10px;right:10px;bottom:7px;flex-direction:column;align-items:flex-start;gap:3px}.tape{width:72px;height:20px}.note{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}.photo:hover{transform:rotate(var(--rot))}}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1><small>Paste · book 3</small>May, taped in</h1>
    <p>Eight of the thirty-one pages from the bus, the roof and the garden. Hover a photo to straighten it; click to open the page.</p>
  </div>
  <div class="grid">
    <a class="photo" href="#" style="--rot:-3deg"><span class="tape a" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#2f6f8f"/><rect x="40" y="110" width="320" height="120" rx="12" fill="#fbf6ec"/><rect x="60" y="130" width="60" height="50" fill="#7fb7d4"/><rect x="140" y="130" width="60" height="50" fill="#7fb7d4"/><rect x="220" y="130" width="60" height="50" fill="#7fb7d4"/><circle cx="90" cy="240" r="18" fill="#2b2118"/><circle cx="310" cy="240" r="18" fill="#2b2118"/></svg></span><figcaption>Bus to Besisahar<small>2 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:2deg"><span class="tape c" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#4a3a2a"/><path d="M0 120L200 40l200 80v20H0z" fill="#b08f62"/><path d="M20 150h360M20 180h360M20 210h360" stroke="#fbf6ec" stroke-width="4" opacity=".5"/><circle cx="330" cy="60" r="14" fill="#e0a300"/></svg></span><figcaption>Rain on the tin roof<small>6 May</small></figcaption></figure></a>
    <a class="photo pin" href="#" style="--rot:-1deg"><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#e7dcc3"/><rect x="0" y="200" width="400" height="100" fill="#3f7a4a"/><circle cx="90" cy="180" r="30" fill="#d9442b"/><circle cx="200" cy="170" r="34" fill="#e0a300"/><circle cx="310" cy="185" r="28" fill="#d9442b"/><rect x="86" y="200" width="8" height="40" fill="#2b2118"/><rect x="196" y="200" width="8" height="40" fill="#2b2118"/><rect x="306" y="200" width="8" height="40" fill="#2b2118"/></svg></span><figcaption>Amma's garden<small>9 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:3deg"><span class="tape b" aria-hidden="true"></span><span class="stamp" aria-hidden="true">Reprint</span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#fbf6ec"/><rect x="30" y="60" width="340" height="200" rx="8" fill="#2b2118"/><rect x="50" y="80" width="300" height="130" fill="#7fb7d4"/><rect x="50" y="210" width="300" height="30" fill="#e0a300"/><text x="200" y="232" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="600" font-size="18" fill="#2b2118">7:10</text></svg></span><figcaption>The 7:10 to work<small>13 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:2deg"><span class="tape a" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#d9442b"/><circle cx="200" cy="160" r="110" fill="#fbf6ec"/><path d="M130 150c20-40 60-50 70-10 10-40 50-30 70 10-20 30-50 40-70 30-20 10-50 0-70-30z" fill="#e0a300"/><circle cx="200" cy="170" r="8" fill="#2b2118"/></svg></span><figcaption>Momos at the counter<small>16 May</small></figcaption></figure></a>
    <a class="photo pin" href="#" style="--rot:-2deg"><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#7fb7d4"/><circle cx="120" cy="210" r="48" fill="none" stroke="#2b2118" stroke-width="10"/><circle cx="290" cy="210" r="48" fill="none" stroke="#2b2118" stroke-width="10"/><path d="M120 210l60-90h90l20 90M180 120l-30 90" fill="none" stroke="#d9442b" stroke-width="10" stroke-linecap="round"/></svg></span><figcaption>Tej's new bike<small>20 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:1deg"><span class="tape c" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#2b2118"/><rect x="150" y="150" width="100" height="90" fill="#fbf6ec"/><path d="M200 150l-16-40 16-20 16 20z" fill="#e0a300"/><circle cx="200" cy="95" r="22" fill="#e0a300" opacity=".35"/></svg></span><figcaption>Power cut, candles<small>23 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:-3deg"><span class="tape b" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#3f7a4a"/><ellipse cx="200" cy="170" rx="110" ry="80" fill="#e0a300"/><path d="M200 90c20-30 60-30 70-10" fill="none" stroke="#2b2118" stroke-width="8" stroke-linecap="round"/><circle cx="240" cy="150" r="10" fill="#fbf6ec" opacity=".7"/></svg></span><figcaption>The last mango<small>29 May</small></figcaption></figure></a>
  </div>
  <span class="note" aria-hidden="true"><svg viewBox="0 0 54 30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 28C14 12 30 4 50 6M44 2l7 4-6 6"/></svg>order a reprint of any of these</span>
</main>
</body>
</html>
