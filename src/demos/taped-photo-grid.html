<!-- Design Lounge piece: taped-photo-grid · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Paste — May, taped in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#c9a97c;--paper:#fbf6ec;--paper-2:#efe2c8;--ink:#2b2118;--ink-2:#4a3a2a;--ink-3:#5e4d3a;--line:#b08f62;
  --red:#d9442b;--blue:#2f6f8f;--yellow:#e0a300;--tape:rgba(255,250,230,.6);
  --hand:"Caveat",cursive;--sans:"Inter",system-ui,sans-serif;
  --r:4px;--shadow:0 8px 20px -10px rgba(43,33,24,.45);--t-micro:200ms;--t-tilt:320ms;--ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(43,33,24,.08) .8px,transparent 1px);background-size:5px 5px;opacity:.6}
a,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.wrap{position:relative;max-width:1200px;margin:0 auto;padding:34px 40px 0;height:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px}
.head h1{margin:0;font:700 48px/1 var(--hand);color:var(--ink)}
.head h1 small{display:block;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.head p{margin:0;max-width:34ch;color:var(--ink-2);font-size:14px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 28px;padding:10px 6px 0}
.photo{position:relative;background:var(--paper);padding:10px 10px 40px;box-shadow:var(--shadow);transform:rotate(var(--rot));transition:transform var(--t-tilt) var(--expo);text-decoration:none;color:inherit;display:block}
.photo:hover,.photo:focus-visible{transform:rotate(0deg) translateY(-6px);z-index:2}
.photo .img{display:block;aspect-ratio:4/3;overflow:hidden;background:var(--paper-2)}
.photo .img svg{width:100%;height:100%;display:block}
.photo figcaption{position:absolute;left:12px;right:12px;bottom:9px;display:flex;justify-content:space-between;align-items:baseline;font:700 21px/1 var(--hand);color:var(--ink-2)}
.photo figcaption small{font:500 11px var(--sans);color:var(--ink-3);letter-spacing:.04em}
.tape{position:absolute;width:92px;height:24px;background:var(--tape);box-shadow:0 1px 2px rgba(43,33,24,.15);z-index:3;pointer-events:none}
.tape.a{left:-24px;top:-9px;transform:rotate(-36deg)}
.tape.b{right:-24px;top:-9px;transform:rotate(36deg)}
.tape.c{left:50%;top:-11px;transform:translateX(-50%) rotate(-2deg)}
.photo.pin .tape{display:none}
.pin::before{content:"";position:absolute;left:50%;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 2px 0 rgba(43,33,24,.35),inset -3px -3px 0 rgba(43,33,24,.2);z-index:3;transform:translateX(-50%)}
.stamp{position:absolute;right:-10px;top:14px;z-index:3;font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--red);border:2px solid var(--red);padding:5px 7px;transform:rotate(8deg);opacity:.85;pointer-events:none}
.note{position:absolute;left:40px;bottom:44px;font:700 26px/1 var(--hand);color:var(--blue);transform:rotate(-3deg);display:flex;gap:10px;align-items:center}
.note svg{width:54px;height:30px}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}.photo:hover{transform:rotate(var(--rot))}}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1><small>Paste · book 3</small>May, taped in</h1>
    <p>Eight of the thirty-one pages. Hover a photo to straighten it; click to open the page.</p>
  </div>
  <div class="grid">
    <a class="photo" href="#" style="--rot:-3deg"><span class="tape a" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#7fb7d4"/><circle cx="310" cy="70" r="34" fill="#fbf6ec"/><path d="M0 230Q100 160 200 220T400 200V300H0z" fill="#3f7a4a"/></svg></span><figcaption>The lake at seven<small>12 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:2deg"><span class="tape c" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#e0a300"/><rect x="70" y="90" width="260" height="150" rx="6" fill="#fbf6ec"/><rect x="92" y="112" width="110" height="70" fill="#d9442b"/><rect x="216" y="112" width="92" height="8" fill="#2b2118"/></svg></span><figcaption>Tej's first ticket<small>19 May</small></figcaption></figure></a>
    <a class="photo pin" href="#" style="--rot:-1deg"><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#2f6f8f"/><circle cx="200" cy="150" r="90" fill="#fbf6ec"/><circle cx="200" cy="150" r="50" fill="#d9442b"/></svg></span><figcaption>The good plate<small>26 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:3deg"><span class="tape b" aria-hidden="true"></span><span class="stamp" aria-hidden="true">Reprint</span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#efe2c8"/><path d="M40 260L140 90l80 110 60-70 80 130z" fill="#b08f62"/><circle cx="90" cy="70" r="22" fill="#e0a300"/></svg></span><figcaption>Walk to the stupa<small>3 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:2deg"><span class="tape a" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#d9442b"/><rect x="60" y="60" width="280" height="180" fill="#fbf6ec"/><path d="M60 240L200 110l140 130z" fill="#2b2118" opacity=".15"/><rect x="80" y="80" width="90" height="60" fill="#2f6f8f"/></svg></span><figcaption>Rain, from the bus<small>8 May</small></figcaption></figure></a>
    <a class="photo pin" href="#" style="--rot:-2deg"><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#3f7a4a"/><circle cx="130" cy="150" r="70" fill="#e0a300"/><circle cx="270" cy="150" r="70" fill="#fbf6ec"/><rect x="0" y="240" width="400" height="60" fill="#2b2118" opacity=".3"/></svg></span><figcaption>Two mangoes<small>15 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:1deg"><span class="tape c" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#2b2118"/><rect x="40" y="40" width="320" height="220" fill="#fbf6ec"/><path d="M40 260L120 120l100 140z" fill="#7fb7d4"/><path d="M160 260l110-170 90 170z" fill="#2f6f8f"/></svg></span><figcaption>The ridge, 05:40<small>22 May</small></figcaption></figure></a>
    <a class="photo" href="#" style="--rot:-3deg"><span class="tape b" aria-hidden="true"></span><figure style="margin:0"><span class="img" aria-hidden="true"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#fbf6ec"/><rect x="40" y="200" width="320" height="60" fill="#b08f62"/><rect x="120" y="90" width="160" height="110" fill="#e0a300"/><rect x="150" y="120" width="40" height="80" fill="#2b2118"/></svg></span><figcaption>Home, finally<small>31 May</small></figcaption></figure></a>
  </div>
  <span class="note" aria-hidden="true"><svg viewBox="0 0 54 30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 28C14 12 30 4 50 6M44 2l7 4-6 6"/></svg>order a reprint of any of these</span>
</main>
</body>
</html>
