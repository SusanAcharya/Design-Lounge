<!-- Design Lounge piece: split-sign-in · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Mira — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7;--ink:#1b1f1c;--ink-2:#5d645f;--ink-3:#8c938e;--line:#dcdfda;--line-focus:#1b1f1c;--field:#ffffff;
  --green:#0f2e26;--green-2:#173d33;--cream:#f1e9d6;--cream-2:#b9b19b;--accent:#1f6b52;--error:#a9401f;
  --serif:"DM Serif Display",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;
  --split:45%;--form-w:360px;--field-h:56px;--r:8px;--quote-size:40px;
  --t-micro:160ms;--t-label:180ms;--t-fade:600ms;--t-rotate:5000ms;--ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--bg);display:grid;grid-template-columns:var(--split) 1fr;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.form{display:flex;flex-direction:column;padding:32px 48px;min-width:0}
.logo{display:flex;align-items:center;gap:10px;font:24px var(--serif);letter-spacing:-.01em;text-decoration:none;width:max-content}
.logo i{width:26px;height:26px;border-radius:50%;background:var(--green);position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--cream)}
form{margin:auto 0;width:var(--form-w);max-width:100%}
h1{margin:0 0 6px;font:36px/1.1 var(--serif);letter-spacing:-.01em}
.lede{margin:0 0 32px;color:var(--ink-2)}
.field{position:relative;margin-bottom:14px}
.field input{width:100%;height:var(--field-h);padding:22px 48px 6px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--field);font:15px var(--sans);color:var(--ink);outline:none;transition:border-color var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease)}
.field input:hover{border-color:var(--ink-3)}
.field input:focus{border-color:var(--line-focus);box-shadow:0 0 0 3px rgba(31,107,82,.15)}
.field label{position:absolute;left:14px;top:18px;color:var(--ink-3);pointer-events:none;transform-origin:left top;transition:transform var(--t-label) var(--ease),color var(--t-label) var(--ease)}
.field input:focus+label,.field input:not(:placeholder-shown)+label{transform:translateY(-10px) scale(.78);color:var(--ink-2)}
.field .eye{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:transparent;border-radius:6px;color:var(--ink-3);display:grid;place-items:center;cursor:pointer;transition:color var(--t-micro) var(--ease),background var(--t-micro) var(--ease)}
.field .eye:hover{color:var(--ink);background:var(--bg)}
.field .eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.field .eye .off{display:none}
.field .eye[aria-pressed="true"] .on{display:none}.field .eye[aria-pressed="true"] .off{display:block}
.row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 22px;font-size:13px;color:var(--ink-2)}
.row label{display:flex;gap:8px;align-items:center;cursor:pointer}
.row input{width:16px;height:16px;margin:0;accent-color:var(--green)}
.row a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.row a:hover{text-decoration-color:var(--ink)}
.btn{width:100%;height:50px;border-radius:var(--r);border:1px solid var(--green);background:var(--green);color:var(--cream);font:500 15px var(--sans);cursor:pointer;transition:background var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease),color var(--t-micro) var(--ease)}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);display:flex;align-items:center;justify-content:center;gap:10px}
.btn.ghost:hover{border-color:var(--ink);background:var(--field)}
.btn.ghost svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost.sent{border-color:var(--accent);color:var(--accent);cursor:default}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--ink-3);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.foot{font-size:13px;color:var(--ink-2)}
.foot a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.panel{background:var(--green);color:var(--cream);position:relative;display:flex;flex-direction:column;padding:40px 56px;overflow:hidden}
.panel::before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(241,233,214,.14)}
.panel::after{content:"";position:absolute;right:-40px;top:-40px;width:420px;height:420px;border-radius:50%;border:1px solid rgba(241,233,214,.14)}
.panel .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-2)}
.quotes{position:relative;margin:auto 0;min-height:320px}
.q{position:absolute;inset:0;opacity:0;transition:opacity var(--t-fade) var(--ease);display:flex;flex-direction:column;justify-content:flex-end}
.q.on{opacity:1}
.q blockquote{margin:0;font:var(--quote-size)/1.2 var(--serif);letter-spacing:-.01em;max-width:18ch;text-indent:-.4em}
.q blockquote em{font-style:italic;color:var(--cream-2)}
.q figcaption{margin-top:24px;font-size:14px;color:var(--cream-2)}
.q figcaption b{display:block;color:var(--cream);font-weight:500}
.dots{display:flex;gap:8px;position:relative}
.dots button{width:40px;height:20px;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.dots button::before{content:"";width:100%;height:2px;background:rgba(241,233,214,.28);transition:background var(--t-micro) var(--ease)}
.dots button[aria-current="true"]::before{background:var(--cream)}
.dots button:hover::before{background:var(--cream-2)}
.panel .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--cream-2);margin-top:20px;position:relative}
@media (max-width:1100px){:root{--quote-size:32px}.form{padding:28px 36px}.panel{padding:32px 40px}}
@media (max-width:820px){body{grid-template-columns:1fr;overflow:auto}.panel{display:none}form{width:100%}}
@media (prefers-reduced-motion:reduce){.q{transition:none}*{transition-duration:1ms!important}}
</style>
</head>
<body>
<section class="form" aria-labelledby="h1">
  <a class="logo" href="#" aria-label="Mira home"><i></i>Mira</a>
  <form id="form" novalidate>
    <h1 id="h1">Welcome back</h1>
    <p class="lede">Sign in to your workspace to pick up where you left off.</p>
    <div class="field"><input id="email" type="email" name="email" placeholder=" " autocomplete="email" value="priya@loam.studio"><label for="email">Email address</label></div>
    <div class="field">
      <input id="pw" type="password" name="password" placeholder=" " autocomplete="current-password"><label for="pw">Password</label>
      <button class="eye" id="eye" type="button" aria-pressed="false" aria-label="Show password" aria-controls="pw">
        <svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.2A10.6 10.6 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4M6.6 6.6C3.6 8.6 2 12 2 12s3.5 7 10 7a9.7 9.7 0 004.4-1"/></svg>
      </button>
    </div>
    <div class="row"><label><input type="checkbox" name="remember" checked>Keep me signed in</label><a href="#">Forgot password?</a></div>
    <button class="btn" type="submit">Continue</button>
    <div class="or">or</div>
    <button class="btn ghost" id="magic" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>Email me a magic link</span></button>
    <p class="foot" style="margin-top:28px">New to Mira? <a href="#">Create a workspace</a> · Free for 30 days</p>
  </form>
</section>
<aside class="panel" aria-label="What customers say">
  <span class="tag">Teams on Mira</span>
  <div class="quotes" id="quotes" aria-live="polite">
    <figure class="q on"><blockquote>“We stopped writing status updates. <em>Mira became the update.</em>”</blockquote><figcaption><b>Ines Halvorsen</b>Head of Product, Fjord Bank</figcaption></figure>
    <figure class="q"><blockquote>“Forty people, one plan, <em>zero spreadsheets</em> since March.”</blockquote><figcaption><b>Teodor Marsh</b>Operations, Nord Post</figcaption></figure>
    <figure class="q"><blockquote>“The first tool our engineers <em>asked</em> to keep.”</blockquote><figcaption><b>Priya Wendt</b>CTO, Loam Studio</figcaption></figure>
  </div>
  <div class="dots" id="dots" role="group" aria-label="Choose testimonial">
    <button type="button" aria-current="true" aria-label="Testimonial 1"></button><button type="button" aria-label="Testimonial 2"></button><button type="button" aria-label="Testimonial 3"></button>
  </div>
  <div class="meta"><span>4.8 / 5 across 1,200 workspaces</span><span>SOC 2 · EU hosting</span></div>
</aside>
<script>
  const pw=document.getElementById('pw'),eye=document.getElementById('eye');
  eye.addEventListener('click',()=>{const show=pw.type==='password';pw.type=show?'text':'password';eye.setAttribute('aria-pressed',String(show));eye.setAttribute('aria-label',(show?'Hide':'Show')+' password');pw.focus();});
  const magic=document.getElementById('magic'),email=document.getElementById('email');
  magic.addEventListener('click',()=>{if(magic.classList.contains('sent'))return;magic.classList.add('sent');magic.querySelector('span').textContent='Link sent to '+(email.value||'your inbox')+' · check your email';});
  document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();});
  const qs=[...document.querySelectorAll('.q')],dots=[...document.querySelectorAll('#dots button')];
  let i=0,timer;
  function show(n){i=(n+qs.length)%qs.length;qs.forEach((q,k)=>q.classList.toggle('on',k===i));dots.forEach((d,k)=>{if(k===i)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current');});}
  function start(){clearInterval(timer);timer=setInterval(()=>show(i+1),5000);}
  dots.forEach((d,k)=>d.addEventListener('click',()=>{show(k);start();}));
  const panel=document.querySelector('.panel');
  panel.addEventListener('pointerenter',()=>clearInterval(timer));panel.addEventListener('pointerleave',start);
  start();
</script>
</body>
</html>
