<!-- Design Lounge piece: drag-to-confirm · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Void the hold</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5a554c;--line:#e4dfd4;--line-2:#cfc6b8;--primary:#1f4d3a;--primary-ink:#fffdf8;--danger:#9b2c2c;--soft:#e7f2ec;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);display:grid;place-items:center}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.card{width:440px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:28px}
h1{font:600 22px/1.2 var(--sans);margin:0 0 8px}
p{margin:0;color:var(--ink-2);font-size:14px}
.track{margin-top:28px;height:56px;border-radius:999px;background:var(--bg);border:1px solid var(--line-2);position:relative;touch-action:none}
.track[data-done="true"]{background:var(--soft);border-color:var(--primary)}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(155,44,44,.12);border-radius:999px}
.label{position:absolute;inset:0;display:grid;place-items:center;font:500 14px var(--sans);color:var(--ink-2);pointer-events:none}
.thumb{position:absolute;top:4px;left:4px;width:48px;height:48px;border-radius:999px;border:0;background:var(--danger);color:var(--primary-ink);cursor:grab;display:grid;place-items:center}
.thumb:active{cursor:grabbing}
.out{margin:16px 0 0;min-height:22px;font-size:14px;color:var(--ink-2)}
.reset{margin-top:12px;height:36px;padding:0 12px;border:1px solid var(--line-2);background:transparent;border-radius:2px;font:500 13px var(--sans);cursor:pointer}
@media (prefers-reduced-motion:reduce){.thumb,.fill{transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <h1>Void the hold</h1>
  <p>Gate 4, load 18. This cannot be sent again today.</p>
  <div class="track" id="track">
    <div class="fill" id="fill"></div>
    <div class="label" id="label">Slide to void</div>
    <button class="thumb" id="thumb" type="button" aria-label="Slide to void the hold" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" role="slider">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <p class="out" id="out" aria-live="polite"></p>
  <button class="reset" id="reset" type="button" hidden>Reset</button>
</div>
<script>
const track = document.getElementById('track');
const thumb = document.getElementById('thumb');
const fill = document.getElementById('fill');
const label = document.getElementById('label');
const out = document.getElementById('out');
const reset = document.getElementById('reset');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let drag = null, val = 0, done = false;
function max(){ return track.clientWidth - 56; }
function paint(v, anim){
  val = Math.max(0, Math.min(100, v));
  const x = (val / 100) * max();
  thumb.style.transition = anim && !reduce ? 'left 180ms cubic-bezier(0.2,0.7,0.2,1)' : 'none';
  fill.style.transition = thumb.style.transition;
  thumb.style.left = (4 + x) + 'px';
  fill.style.width = (52 + x) + 'px';
  thumb.setAttribute('aria-valuenow', String(Math.round(val)));
}
function finish(){
  done = true;
  track.dataset.done = 'true';
  label.textContent = 'Voided';
  thumb.disabled = true;
  out.textContent = 'Hold voided · load 18 · Gate 4';
  reset.hidden = false;
}
function commit(v){
  if (v >= 92) { paint(100, true); finish(); }
  else paint(0, true);
}
thumb.addEventListener('pointerdown', (e) => {
  if (done) return;
  drag = { x: e.clientX, start: val };
  thumb.setPointerCapture(e.pointerId);
});
thumb.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  paint(drag.start + (dx / max()) * 100, false);
});
function up(){ if (!drag) return; drag = null; commit(val); }
thumb.addEventListener('pointerup', up);
thumb.addEventListener('pointercancel', up);
thumb.addEventListener('keydown', (e) => {
  if (done) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); paint(val + 10, true); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); paint(val - 10, true); }
  if (e.key === 'Enter' && val >= 92) finish();
  if (e.key === 'Home') paint(0, true);
  if (e.key === 'End') { paint(100, true); finish(); }
});
reset.addEventListener('click', () => {
  done = false; track.dataset.done = 'false'; thumb.disabled = false;
  label.textContent = 'Slide to void'; out.textContent = ''; reset.hidden = true; paint(0, true);
});
</script>
</body>
</html>
