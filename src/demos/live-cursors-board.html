<!-- Design Lounge piece: live-cursors-board · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Live cursors on a board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4ddd0;--sheet:#f4efe6;--ink:#1c1914;--ink-2:#5c564c;--line:#c9c0b2;--line-strong:#1c1914;
  --mira:#9c3418;--jo:#1b5e45;--ellis:#243e68;--you-soft:#f3d2c6;
  --font:"Public Sans",system-ui,sans-serif;--serif:"Newsreader",Georgia,serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--font);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.head{height:64px;display:flex;align-items:center;gap:20px;padding:0 28px;border-bottom:1px solid var(--line-strong);flex:none}
.mark{font:600 22px/1 var(--serif);letter-spacing:-.02em}
.meta{font:500 12px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.who{margin-left:auto;display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 8px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;font:500 13px/1 var(--font)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip b{font-weight:600}
.chip span{color:var(--ink-2);font-weight:400}
.board{position:relative;flex:1;min-height:0;cursor:none}
.room{position:absolute;left:48px;right:48px;top:28px;bottom:28px;background:var(--sheet);border:1px solid var(--line-strong)}
.room::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);pointer-events:none}
.tick{position:absolute;width:14px;height:14px;border-color:var(--ink);border-style:solid}
.tick.tl{top:-1px;left:-1px;border-width:1px 0 0 1px}
.tick.tr{top:-1px;right:-1px;border-width:1px 1px 0 0}
.tick.bl{bottom:-1px;left:-1px;border-width:0 0 1px 1px}
.tick.br{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.block{position:absolute;background:var(--sheet);border:1px solid var(--ink);padding:12px 14px;text-align:left;color:inherit;font:inherit;cursor:none}
.block:hover{background:#efe8dc}
.block:focus-visible{outline:2px solid var(--mira);outline-offset:3px}
.block[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--mira);background:var(--you-soft)}
.block small{display:block;font:500 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.block strong{font:600 20px/1.1 var(--serif);font-weight:600}
.block em{display:block;margin-top:8px;font:italic 13px/1.3 var(--serif);color:var(--mira);font-style:italic}
.block[aria-pressed="false"] em{display:none}
.b1{left:36px;top:48px;width:240px;height:280px}
.b2{left:320px;top:210px;width:340px;height:160px}
.b3{left:760px;top:48px;width:280px;height:190px}
.b4{left:700px;top:400px;width:340px;height:150px}
.plate{position:absolute;right:28px;bottom:24px;width:200px;border-top:1px solid var(--ink);padding-top:8px;font:500 11px/1.45 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.plate b{display:block;color:var(--ink);font-weight:600;letter-spacing:.12em}
.cur{position:absolute;left:0;top:0;width:0;height:0;z-index:4;pointer-events:none}
.cur svg{position:absolute;left:0;top:0;width:22px;height:22px;overflow:visible;filter:drop-shadow(0 1px 0 #f4efe6)}
.cur span{position:absolute;left:16px;top:16px;height:22px;padding:0 8px;border-radius:4px;color:#f7f3ec;font:600 12px/22px var(--font);white-space:nowrap}
.you svg{fill:var(--mira)} .you span{background:var(--mira)}
.jo svg{fill:var(--jo)} .jo span{background:var(--jo)}
.ellis svg{fill:var(--ellis)} .ellis span{background:var(--ellis)}
.jo{animation:jo 16s var(--ease) infinite alternate}
.ellis{animation:ellis 18s var(--ease) infinite alternate}
@keyframes jo{
  0%{transform:translate(150px,150px)}
  50%{transform:translate(250px,250px)}
  100%{transform:translate(170px,310px)}
}
@keyframes ellis{
  0%{transform:translate(880px,110px)}
  50%{transform:translate(960px,180px)}
  100%{transform:translate(820px,160px)}
}
.hint{position:absolute;left:64px;bottom:40px;font:500 12px/1 var(--font);color:var(--ink-2);z-index:3}
@media (prefers-reduced-motion:reduce){
  .jo,.ellis{animation:none}
  .block{transition:none}
}
</style>
</head>
<body>
<header class="head">
  <div class="mark">House Lamp</div>
  <div class="meta">Floor 2 · Thursday call</div>
  <div class="who" aria-label="People on this board">
    <div class="chip"><i class="dot" style="background:var(--mira)"></i><b>Mira</b><span>you</span></div>
    <div class="chip"><i class="dot" style="background:var(--jo)"></i><b>Jo Hale</b></div>
    <div class="chip"><i class="dot" style="background:var(--ellis)"></i><b>Ellis Voss</b></div>
  </div>
</header>
<div class="board" id="board">
  <div class="room" id="room">
    <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
    <button class="block b1" type="button" aria-pressed="false"><small>01</small><strong>Riser A</strong><em>Mira</em></button>
    <button class="block b2" type="button" aria-pressed="true"><small>02</small><strong>Centre table</strong><em>Mira</em></button>
    <button class="block b3" type="button" aria-pressed="false"><small>03</small><strong>Window bay</strong><em>Mira</em></button>
    <button class="block b4" type="button" aria-pressed="false"><small>04</small><strong>Prompt desk</strong><em>Mira</em></button>
    <div class="plate"><b>House Lamp</b>Floor 2 · 1:50<br>Rehearsal layout</div>
    <div class="cur you" id="you" style="transform:translate(470px,270px)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5l13.5 8.2-6.2 1.2L10.2 20z"/></svg>
      <span>Mira</span>
    </div>
    <div class="cur jo" style="transform:translate(150px,150px)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5l13.5 8.2-6.2 1.2L10.2 20z"/></svg>
      <span>Jo Hale</span>
    </div>
    <div class="cur ellis" style="transform:translate(880px,110px)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5l13.5 8.2-6.2 1.2L10.2 20z"/></svg>
      <span>Ellis Voss</span>
    </div>
  </div>
  <p class="hint">Click a piece to claim it.</p>
</div>
<script>
(function(){
  var room = document.getElementById('room');
  var you = document.getElementById('you');
  var blocks = [].slice.call(document.querySelectorAll('.block'));
  room.addEventListener('pointermove', function(e){
    var r = room.getBoundingClientRect();
    var x = Math.max(8, Math.min(r.width - 28, e.clientX - r.left));
    var y = Math.max(8, Math.min(r.height - 28, e.clientY - r.top));
    you.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  });
  blocks.forEach(function(b){
    b.addEventListener('click', function(){
      blocks.forEach(function(n){ n.setAttribute('aria-pressed', n === b ? 'true' : 'false'); });
    });
  });
})();
</script>
</body>
</html>
