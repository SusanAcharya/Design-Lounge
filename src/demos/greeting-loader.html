<!-- Design Lounge piece: greeting-loader · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Hello</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Public+Sans:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#1a1814;--ink-2:#5c564c;--primary:#1f4d3a;--serif:Fraunces,Georgia,serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:grid;place-items:center;font-family:var(--serif)}
:focus-visible{outline:2px solid var(--primary);outline-offset:4px}
h1{font-weight:560;font-size:92px;margin:0;min-width:8ch;text-align:center}
button{position:absolute;bottom:36px;height:40px;padding:0 14px;border:1px solid #e3ddd2;background:#fffdf8;font:500 14px "Public Sans",system-ui,sans-serif;cursor:pointer;border-radius:2px}
</style>
</head>
<body>
<h1 id="w" aria-live="polite">Hello</h1>
<button type="button" id="go">Replay</button>
<script>
const words = ['Hello','Namaste','Salaam','Bonjour'];
const w = document.getElementById('w');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let timer = 0, i = 0;
function play(){
  clearInterval(timer);
  i = 0;
  w.textContent = words[0];
  if (reduce) return;
  timer = setInterval(() => {
    i += 1;
    if (i >= words.length) { clearInterval(timer); return; }
    w.textContent = words[i];
  }, 700);
}
document.getElementById('go').addEventListener('click', play);
play();
</script>
</body>
</html>
