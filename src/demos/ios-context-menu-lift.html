<!-- Design Lounge piece: ios-context-menu-lift · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS context menu lift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f9;--bar:rgba(247,247,249,.86);--line:rgba(60,60,67,.18);
  --ink:#111114;--ink-2:#6e6e78;--ink-3:#9a9aa3;
  --in:#e9e9ee;--out:#0a7aff;--out-ink:#ffffff;--danger:#e5352b;
  --menu:rgba(250,250,252,.92);--menu-line:rgba(60,60,67,.14);--scrim:rgba(232,232,238,.42);
  --font:"Schibsted Grotesk",-apple-system,system-ui,sans-serif;
  --r-bubble:18px;--r-menu:14px;--menu-w:250px;--row:44px;
  --shadow-lift:0 18px 40px rgba(17,17,20,.22),0 2px 6px rgba(17,17,20,.10);
  --shadow-menu:0 12px 32px rgba(17,17,20,.16);
  --hold:350ms;--t-micro:160ms;--t-menu:320ms;--stagger:40ms;
  --ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.34,1.45,.64,1);--sheet:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.35 var(--font);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;display:flex;flex-direction:column}
header{position:fixed;left:0;right:0;top:0;z-index:4;padding:54px 12px 8px;background:var(--bar);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:.5px solid var(--line);display:flex;align-items:center;gap:8px}
header .ic{width:40px;height:40px;border:0;background:none;color:var(--out);display:grid;place-items:center;border-radius:10px;padding:0}
header .who{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(160deg,#cdb8ff,#7a5cff);color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center}
.who b{font-size:12px;font-weight:500;letter-spacing:-.01em}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow:auto;padding:128px 16px 100px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;font-size:12px;font-weight:500;color:var(--ink-3);margin:8px 0 10px}
.msg{display:flex;flex-direction:column;max-width:76%}
.msg.in{align-self:flex-start;align-items:flex-start}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg+.msg.in,.msg+.msg.out{margin-top:2px}
.msg.in+.msg.out,.msg.out+.msg.in{margin-top:10px}
.bubble{font:inherit;text-align:left;border:0;padding:9px 13px 10px;border-radius:var(--r-bubble);line-height:1.32;letter-spacing:-.005em;cursor:default;color:var(--ink);background:var(--in);transition:transform var(--t-micro) var(--ease);touch-action:pan-y}
.in .bubble{border-bottom-left-radius:6px}
.out .bubble{background:var(--out);color:var(--out-ink);border-bottom-right-radius:6px}
.bubble:active{transform:scale(.985)}
.bubble:focus-visible{outline:2px solid var(--out);outline-offset:3px}
.bubble.src{visibility:hidden}
.meta{font-size:11px;color:var(--ink-3);margin:4px 6px 0}
footer{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:8px 12px 34px;background:var(--bar);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-top:.5px solid var(--line);display:flex;gap:8px;align-items:center}
footer .ic{width:40px;height:40px;border:0;background:none;color:var(--out);display:grid;place-items:center;border-radius:50%;padding:0}
.field{flex:1;height:38px;border:1px solid var(--line);border-radius:19px;background:#fff;display:flex;align-items:center;padding:0 14px;color:var(--ink-3);font-size:16px}
/* lift layer */
.scrim{position:fixed;inset:0;z-index:8;background:var(--scrim);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);opacity:0;pointer-events:none;transition:opacity 220ms var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.lift{position:fixed;z-index:9;margin:0;transform-origin:var(--ox) 50%;animation:lift var(--t-menu) var(--spring) forwards;box-shadow:var(--shadow-lift)}
.lift.away{animation:drop 180ms var(--ease) forwards}
@keyframes lift{from{transform:scale(1)}to{transform:scale(1.04)}}
@keyframes drop{from{transform:scale(1.04)}to{transform:scale(1);box-shadow:none}}
.menu{position:fixed;z-index:9;width:var(--menu-w);margin:0;padding:0;list-style:none;border-radius:var(--r-menu);background:var(--menu);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:var(--shadow-menu);overflow:hidden;transform-origin:var(--ox) var(--oy);animation:pop var(--t-menu) var(--spring) both}
.menu.away{animation:unpop 160ms var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes unpop{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.9)}}
.menu li+li{border-top:.5px solid var(--menu-line)}
.menu button{width:100%;height:var(--row);border:0;background:none;font:inherit;font-size:17px;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 16px;opacity:0;animation:item 240ms var(--spring) forwards;animation-delay:calc(var(--i) * var(--stagger) + 60ms)}
.menu button svg{width:20px;height:20px;color:var(--ink-2)}
.menu button:hover,.menu button:focus-visible{background:rgba(60,60,67,.08);outline:none}
.menu li.danger button,.menu li.danger svg{color:var(--danger)}
@keyframes item{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,8px);z-index:10;background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity var(--t-micro) var(--ease),transform var(--t-micro) var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{position:fixed;left:0;right:0;bottom:92px;text-align:center;font-size:12px;color:var(--ink-3);pointer-events:none;transition:opacity var(--t-micro)}
.hint.off{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="ic" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="who"><span class="avatar" aria-hidden="true">ML</span><b>Mira Lindqvist</b></div>
  <button class="ic" aria-label="Video call"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10l5-2v8l-5-2"/></svg></button>
</header>
<main id="thread" aria-label="Conversation with Mira Lindqvist">
  <div class="day">Today 09:41</div>
  <div class="msg in"><button class="bubble" aria-haspopup="menu">Morning. Did the Tessel invoice go out? Finance is asking before the 11:00.</button></div>
  <div class="msg out"><button class="bubble" aria-haspopup="menu">Sent at 08:52, PDF plus the CSV export. Number is TS-2041, 4 800 EUR net.</button></div>
  <div class="msg out"><button class="bubble" aria-haspopup="menu">Hold this one to see the menu.</button><span class="meta">Delivered</span></div>
  <div class="msg in"><button class="bubble" aria-haspopup="menu">Perfect. Can you forward it to Jonas too? He is covering for Priya this week.</button></div>
  <div class="msg in"><button class="bubble" aria-haspopup="menu">And the Q4 forecast deck is in the shared folder, v7 is the one.</button></div>
  <div class="msg out"><button class="bubble" aria-haspopup="menu">Forwarding now. I will add a note about the 2 percent early-payment discount so nobody is surprised.</button></div>
  <div class="msg in"><button class="bubble" aria-haspopup="menu">Great, thanks. See you at the standup.</button><span class="meta">Read 09:47</span></div>
</main>
<p class="hint" id="hint">Press and hold a bubble for 350ms</p>
<footer>
  <button class="ic" aria-label="Add attachment"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="field" role="textbox" aria-label="Message" aria-readonly="true">Message</div>
  <button class="ic" aria-label="Voice message"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
</footer>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const scrim = document.getElementById('scrim'), toast = document.getElementById('toast'), hint = document.getElementById('hint');
  const ITEMS = [['Reply','M9 14l-4-4 4-4M5 10h9a5 5 0 015 5v3'],['Copy','M9 9h10v10H9zM5 15V5h10'],['Forward','M15 6l4 4-4 4M19 10h-9a5 5 0 00-5 5v3'],['Delete','M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3']];
  let timer = null, open = null, tt = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function lift(src) {
    if (open) return;
    const r = src.getBoundingClientRect(), out = src.closest('.msg').classList.contains('out');
    const clone = src.cloneNode(true); clone.className = 'bubble lift'; clone.removeAttribute('aria-haspopup'); clone.tabIndex = -1;
    Object.assign(clone.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    const menuH = ITEMS.length * 44 + 2, below = r.bottom + 8 + menuH < 844 - 34 - 8;
    const menu = document.createElement('ul'); menu.className = 'menu'; menu.setAttribute('role', 'menu');
    menu.innerHTML = ITEMS.map(([l, d], i) => `<li role="none"${l === 'Delete' ? ' class="danger"' : ''}><button role="menuitem" style="--i:${i}">${l}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg></button></li>`).join('');
    const ox = out ? 'right' : 'left';
    menu.style.cssText = `--ox:${ox};--oy:${below ? 'top' : 'bottom'};top:${below ? r.bottom + 8 : r.top - 8 - menuH}px;${ox}:${out ? 390 - r.right : r.left}px`;
    clone.style.setProperty('--ox', ox);
    src.classList.add('src'); scrim.classList.add('on'); hint.classList.add('off');
    document.body.append(clone, menu);
    open = { src, clone, menu };
    menu.querySelector('button').focus();
    menu.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { say(b.textContent.trim() === 'Copy' ? 'Copied' : b.textContent.trim() + ' · ' + (out ? 'your message' : 'Mira')); dismiss(); } });
  }
  function dismiss() {
    if (!open) return;
    const { src, clone, menu } = open; open = null;
    scrim.classList.remove('on'); clone.classList.add('away'); menu.classList.add('away');
    setTimeout(() => { clone.remove(); menu.remove(); src.classList.remove('src'); src.focus({ preventScroll: true }); }, reduced ? 1 : 180);
  }
  function say(t) { toast.textContent = t; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 1400); }
  const cancel = () => { clearTimeout(timer); timer = null; };

  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('.bubble:not(.lift)');
    if (!b || open) return;
    timer = setTimeout(() => { timer = null; lift(b); }, 350);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, e => { if (timer && e.type !== 'pointerleave') cancel(); }));
  document.addEventListener('pointermove', e => { if (timer && (Math.abs(e.movementX) + Math.abs(e.movementY)) > 6) cancel(); });
  scrim.addEventListener('pointerup', dismiss);
  document.addEventListener('keydown', e => {
    const b = e.target.closest && e.target.closest('.bubble:not(.lift)');
    if (b && (e.key === 'Enter' || e.key === ' ') && !open) { e.preventDefault(); lift(b); return; }
    if (!open) return;
    const items = [...open.menu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); dismiss(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Tab') { e.preventDefault(); }
  });
})();
</script>
</body>
</html>
