<!-- Design Lounge piece: game-card-table · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Pairs · Linnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --walnut: #3E2A1E;
    --felt-0: #2A6A50;
    --felt: #1E4A38;
    --felt-2: #173E2F;
    --card: #F4EBDA;
    --fold: #E7D7BC;
    --ink: #1C1915;
    --muted: #5C4E3E;
    --line: #C4B49A;
    --brick: #8C3A2F;
    --ring: #F3E2A0;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    background: var(--walnut);
    color: var(--ink);
    font-family: "Source Sans 3", "Avenir Next", sans-serif;
    font-size: 16px;
    line-height: 1.3;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .shell {
    height: 100%;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .rail {
    height: 72px;
    flex: none;
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 22px;
  }
  .brand { margin: 0; min-width: 140px; }
  .brand b {
    display: block;
    font-family: "Libre Baskerville", Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: 26px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand span {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .moves {
    margin: 0;
    min-width: 92px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 18px;
  }
  .note {
    margin: 0;
    flex: 1;
    font-family: "Libre Baskerville", Georgia, serif;
    font-size: 18px;
    min-width: 0;
  }
  #restart {
    height: 44px;
    padding: 0 18px;
    border: 1px solid var(--ink);
    background: transparent;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #restart:hover { background: var(--ink); color: var(--card); }
  .felt {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 42%, var(--felt-0) 0%, var(--felt) 58%, var(--felt-2) 100%);
  }
  .grid { display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: repeat(4, 156px); gap: 14px; }
  .card {
    width: 156px;
    height: 156px;
    padding: 0;
    border: 0;
    background: transparent;
    perspective: 800px;
  }
  .inner {
    display: grid;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 280ms var(--ease);
  }
  .card.up .inner { transform: rotateY(180deg); }
  .back, .front {
    grid-area: 1 / 1;
    backface-visibility: hidden;
    display: grid;
    place-items: center;
    background: var(--card);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .back {
    background:
      linear-gradient(135deg, var(--fold) 0 12px, transparent 12px),
      var(--card);
    box-shadow: inset 0 0 0 1px var(--line), inset 0 0 0 8px var(--card), inset 0 0 0 9px var(--line);
  }
  .front { transform: rotateY(180deg); }
  .card.matched .front { box-shadow: inset 0 0 0 2px var(--brick); }
  .back svg { width: 36px; height: 36px; color: var(--brick); }
  .front svg { width: 72px; height: 72px; color: var(--ink); }
  .card.matched { cursor: default; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 1100px) {
    .row { grid-template-columns: repeat(4, 120px); }
    .card { width: 120px; height: 120px; }
    .front svg { width: 56px; height: 56px; }
  }
  @media (max-width: 760px) {
    body { overflow: auto; }
    .shell { height: auto; min-height: 100%; }
    .rail { height: auto; min-height: 72px; flex-wrap: wrap; padding: 12px 16px; gap: 12px; }
    .grid { width: 100%; padding: 16px; gap: 8px; }
    .row { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .card { width: 100%; height: auto; aspect-ratio: 1; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="rail">
    <h1 class="brand"><b>Linnet</b><span>Pairs</span></h1>
    <p class="moves" id="moves">0 moves</p>
    <p class="note" id="note">Find the pairs.</p>
    <button type="button" id="restart">Restart</button>
  </header>
  <div class="felt">
    <div class="grid" id="grid" role="grid" aria-label="Pair cards"></div>
  </div>
</div>
<p class="sr" id="live" aria-live="polite"></p>
<script>
(function () {
  var FACES = ['moon', 'leaf', 'ring', 'peak', 'wave', 'key', 'bell', 'seed'];
  var NAME = { moon: 'Moon', leaf: 'Leaf', ring: 'Ring', peak: 'Peak', wave: 'Wave', key: 'Key', bell: 'Bell', seed: 'Seed' };
  var PATH = {
    moon: '<path d="M15 4a7 7 0 1 0 4.8 12.2A6 6 0 0 1 15 4z"/>',
    leaf: '<path d="M5 19C6 11 12 5 20 4 19 13 13 19 5 19z"/><path d="M9 15c2-2 5-4 8-6"/>',
    ring: '<circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2"/>',
    peak: '<path d="M3 18l6.2-11 3.2 5.2L16 8l5 10z"/>',
    wave: '<path d="M3 15c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M3 9c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>',
    key: '<circle cx="8" cy="10" r="3.2"/><path d="M11 10.2H20l-1.6 2.2M17.2 10.2v2.6"/>',
    bell: '<path d="M6.5 16.5c.4-4.6 2.2-8 5.5-8s5.1 3.4 5.5 8z"/><path d="M10 16.6a2 2 0 0 0 4 0M5 16.5h14"/>',
    seed: '<ellipse cx="12" cy="12" rx="4.5" ry="7"/><path d="M12 5.2v13.6"/>'
  };
  var MARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15c3-.6 5-5 7-9 1.2 3.4 4 6.2 8 7.2-3.2.8-5.6 1.2-7.4 3.4C11 14.6 8.4 14 5 15z"/></svg>';
  var grid = document.getElementById('grid');
  var movesEl = document.getElementById('moves');
  var note = document.getElementById('note');
  var live = document.getElementById('live');
  var seed = 20261004;
  var open = [];
  var lock = false;
  var moves = 0;
  var matched = 0;
  var token = 0;
  var cursor = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function shuffle(s) {
    var deck = FACES.concat(FACES);
    var rand = mulberry32(s);
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
    }
    return deck;
  }

  function moveText(n) { return n + (n === 1 ? ' move' : ' moves'); }

  function paintMoves() { movesEl.textContent = moveText(moves); }

  function label(btn, up) {
    var name = NAME[btn.dataset.face];
    btn.setAttribute('aria-pressed', up ? 'true' : 'false');
    btn.setAttribute('aria-label', up ? name + ', face up' : 'Face down card');
  }

  function cards() { return Array.prototype.slice.call(grid.querySelectorAll('.card')); }

  function focusAt(n) {
    var all = cards();
    cursor = n;
    all.forEach(function (el, i) { el.tabIndex = i === n ? 0 : -1; });
    return all[n];
  }

  function deal(announce) {
    token++;
    clearTimeout(deal.timer);
    open = [];
    lock = false;
    moves = 0;
    matched = 0;
    var deck = shuffle(seed);
    grid.innerHTML = '';
    for (var r = 0; r < 4; r++) {
      var row = document.createElement('div');
      row.className = 'row';
      row.setAttribute('role', 'row');
      for (var c = 0; c < 4; c++) {
        var i = r * 4 + c;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card';
        btn.setAttribute('role', 'gridcell');
        btn.dataset.face = deck[i];
        btn.dataset.i = String(i);
        btn.setAttribute('aria-rowindex', String(r + 1));
        btn.setAttribute('aria-colindex', String(c + 1));
        btn.tabIndex = i === 0 ? 0 : -1;
        btn.innerHTML = '<span class="inner"><span class="back">' + MARK + '</span><span class="front"><svg viewBox="0 0 24 24" aria-hidden="true">' + PATH[deck[i]] + '</svg></span></span>';
        label(btn, false);
        row.appendChild(btn);
      }
      grid.appendChild(row);
    }
    cursor = 0;
    paintMoves();
    note.textContent = 'Find the pairs.';
    if (announce) live.textContent = 'New deal. Cards are face down.';
  }

  function flip(btn) {
    if (lock || btn.classList.contains('up')) return;
    btn.classList.add('up');
    label(btn, true);
    var all = cards();
    focusAt(all.indexOf(btn));
    open.push(btn);
    if (open.length < 2) {
      live.textContent = NAME[btn.dataset.face];
      return;
    }
    moves++;
    paintMoves();
    var a = open[0];
    var b = open[1];
    if (a.dataset.face === b.dataset.face) {
      a.classList.add('matched');
      b.classList.add('matched');
      open = [];
      matched++;
      if (matched === 8) {
        var won = 'All paired in ' + moveText(moves) + '.';
        note.textContent = won;
        live.textContent = won;
      } else {
        live.textContent = NAME[a.dataset.face] + ' paired.';
      }
    } else {
      lock = true;
      var mine = ++token;
      live.textContent = 'No match.';
      deal.timer = setTimeout(function () {
        if (mine !== token) return;
        a.classList.remove('up');
        b.classList.remove('up');
        label(a, false);
        label(b, false);
        open = [];
        lock = false;
      }, 700);
    }
  }

  grid.addEventListener('click', function (e) {
    var btn = e.target.closest('.card');
    if (btn) flip(btn);
  });

  grid.addEventListener('keydown', function (e) {
    var step = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
    if (!step) return;
    var all = cards();
    var i = all.indexOf(document.activeElement);
    if (i < 0) i = cursor;
    var r = Math.floor(i / 4) + step[0];
    var c = (i % 4) + step[1];
    if (r < 0 || r > 3 || c < 0 || c > 3) { e.preventDefault(); return; }
    e.preventDefault();
    focusAt(r * 4 + c).focus();
  });

  document.getElementById('restart').addEventListener('click', function () {
    seed += 1;
    deal(true);
    cards()[0].focus();
  });

  deal(false);
})();
</script>
</body>
</html>
