<!-- Design Lounge piece: password-field · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Password field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#161513;--ink-2:#5a554c;--ink-3:#5c564e;--line-strong:#cfc6b8;--focus:#1f4d3a;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--sans);background:var(--bg);color:var(--ink);padding:48px 64px}
.where{margin:0 0 16px;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
.field{width:320px;display:flex;flex-direction:column;gap:6px}
label{font:500 12px/1 var(--sans);color:var(--ink-2)}
.box{display:flex;align-items:center;gap:8px}
input{flex:1;height:40px;padding:0 12px;border-radius:2px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:400 14px/1.4 var(--sans)}
button{height:40px;padding:0 14px;border-radius:2px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font:500 13px/1 var(--sans);cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{margin:0;font-size:12px;color:var(--ink-3)}
</style>
</head>
<body>
<p class="where">Yard account</p>
<div class="field">
  <label for="pw">Password</label>
  <div class="box">
    <input id="pw" type="password" value="gate-1842" autocomplete="current-password">
    <button type="button" id="show" aria-pressed="false" aria-controls="pw">Show</button>
  </div>
  <p class="hint">The yard issued this. It is not the badge number.</p>
</div>
<script>
const pw = document.getElementById('pw');
const show = document.getElementById('show');
show.addEventListener('click', () => {
  const on = pw.type === 'password';
  pw.type = on ? 'text' : 'password';
  show.textContent = on ? 'Hide' : 'Show';
  show.setAttribute('aria-pressed', on ? 'true' : 'false');
});
</script>
</body>
</html>
