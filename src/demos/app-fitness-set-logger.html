<!-- Design Lounge piece: app-fitness-set-logger · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rackwell set logger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1EA;--card:#FFFDF9;--tone:#EAE4D9;--edge:#8A8276;--ink:#1D1B17;--ink-2:#4F4941;--ghost:#6F685E;
  --pri:#B3401E;--pri-c:#FFDBCD;--on-pri-c:#3A0B00;--done:#DDEBD9;--done-ink:#245A30;--tick:#2F6B3A;
  --inv:#24211C;--inv-ink:#F5F1EA;--inv-2:#C9C1B4;--ring:#FFB59A;--gold:#F2B33D;--gold-ink:#2B1D00;
  --font:"Anybody",system-ui,sans-serif;
  --r-card:24px;--r-row:16px;--r-pill:999px;--r-dock:28px;
  --ease:cubic-bezier(.2,.7,.2,1);--sheet:cubic-bezier(.32,.72,0,1);--expo:cubic-bezier(.16,1,.3,1);--emph:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.35 var(--font);font-stretch:100%;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.app{position:absolute;inset:0;overflow-y:auto;padding:54px 16px 170px;max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;height:56px}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tone)}
.icon svg{width:22px;height:22px}
.ttl{flex:1;line-height:1.15}
.ttl b{display:block;font-size:17px;font-weight:750;font-stretch:110%}
.ttl span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.finish{height:40px;padding:0 18px;border-radius:var(--r-pill);background:var(--pri-c);color:var(--on-pri-c);font-weight:700;font-size:14px}
.prog{display:flex;gap:4px;margin:8px 0 18px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--tone)}
.prog i.d{background:var(--ink)}.prog i.c{background:var(--pri)}
.kick{font-size:12px;font-weight:700;font-stretch:75%;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:4px 0 6px;font-size:38px;line-height:.95;font-weight:850;font-stretch:128%;letter-spacing:-.02em}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink-2)}
.sub b{color:var(--ink);font-weight:650}
.chip{height:40px;padding:0 14px 0 10px;border-radius:12px;background:var(--tone);display:flex;align-items:center;gap:6px;font-weight:650;font-size:14px;color:var(--ink);white-space:nowrap}
.chip svg{width:22px;height:22px}
.sets{margin-top:16px;background:var(--card);border-radius:var(--r-card);padding:8px;box-shadow:0 1px 0 rgba(29,27,23,.06)}
.hd,.row{display:grid;grid-template-columns:40px 1fr 76px 60px 48px;gap:8px;align-items:center}
.hd{padding:8px 8px 6px;font-size:11px;font-weight:700;font-stretch:75%;letter-spacing:.12em;color:var(--ink-2)}
.hd span:nth-child(n+3){text-align:center}
.row{height:60px;padding:0 8px;border-radius:var(--r-row);position:relative;transition:background 240ms var(--ease)}
.row+.row{margin-top:2px}
.row.cur{background:var(--bg)}
.row.done{background:var(--done)}
.no{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--tone)}
.row.done .no{background:#C3D9BE;color:var(--done-ink)}
.prev{font-size:14px;color:var(--ghost);font-variant-numeric:tabular-nums;white-space:nowrap}
.row input{width:100%;height:44px;border:1.5px solid var(--edge);border-radius:12px;background:#FFFFFF;text-align:center;font-size:18px;font-weight:750;font-stretch:112%;font-variant-numeric:tabular-nums;padding:0}
.row input::placeholder{color:var(--ghost);font-weight:450;opacity:1}
.row.done input{border-color:#5A7A56;background:#F1F7EF}
.row.done .prev{color:#4A5847}
.ck{width:44px;height:44px;border-radius:14px;border:2px solid var(--edge);display:grid;place-items:center;color:var(--edge);justify-self:end;transition:background 200ms var(--ease),border-color 200ms}
.ck svg{width:24px;height:24px}
.ck[aria-pressed=true]{background:var(--tick);border-color:var(--tick);color:#fff}
.ck.pop{animation:pop 420ms var(--expo)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.28,.86)}38%{transform:scale(1.28,.86)}60%{transform:scale(.92,1.08)}100%{transform:scale(1)}}
.pb{position:absolute;left:44px;top:4px;font-size:10px;font-weight:800;font-stretch:80%;letter-spacing:.08em;background:var(--gold);color:var(--gold-ink);padding:2px 6px;border-radius:6px}
.add{width:100%;height:48px;margin-top:8px;border-radius:var(--r-row);background:var(--tone);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.add svg{width:20px;height:20px}
.next{margin-top:14px;padding:14px 16px;border-radius:20px;border:1.5px solid #D6CEC1;display:flex;align-items:center;gap:12px}
.next .th{width:44px;height:44px;border-radius:12px;background:var(--tone);display:grid;place-items:center}
.next p{margin:0;flex:1;font-size:14px;color:var(--ink-2)}
.next p b{display:block;color:var(--ink);font-size:16px;font-weight:700}

.dock{position:fixed;left:12px;right:12px;bottom:34px;max-width:440px;margin:0 auto;background:var(--inv);color:var(--inv-ink);border-radius:var(--r-dock);padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 36px -14px rgba(29,27,23,.55)}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800;font-stretch:105%;font-variant-numeric:tabular-nums}
.dock.over .ring{animation:thump 600ms var(--expo) 2}
@keyframes thump{40%{transform:scale(1.12)}}
.dtx{flex:1;min-width:0;line-height:1.25}
.dtx b{display:block;font-size:15px;font-weight:750}
.dtx span{font-size:13px;color:var(--inv-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.db{display:flex;gap:6px}
.db button{width:42px;height:44px;border-radius:50%;background:#3A362F;font-size:13px;font-weight:750;font-stretch:85%}
.db button.skip{width:auto;padding:0 14px;border-radius:var(--r-pill);background:var(--inv-ink);color:var(--inv)}
.dock:not(.run) .db .adj{display:none}

.toast{position:fixed;left:24px;right:24px;max-width:400px;margin:0 auto;bottom:150px;background:var(--gold);color:var(--gold-ink);border-radius:24px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 40px -14px rgba(120,80,0,.55);visibility:hidden;opacity:0;transform:translateY(16px) scale(.96);transition:opacity 220ms var(--ease),transform 420ms var(--expo),visibility 0s 420ms}
.toast.show{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.medal{width:52px;height:52px;flex:none}
.toast.show .medal{animation:squash 640ms var(--expo) 120ms both}
@keyframes squash{0%{transform:scale(.3) rotate(-18deg)}45%{transform:scale(1.18,.84)}70%{transform:scale(.94,1.06)}100%{transform:none}}
.toast p{margin:0;font-size:14px;line-height:1.3}
.toast p small{display:block;font-size:11px;font-weight:800;font-stretch:75%;letter-spacing:.14em}
.toast p b{display:block;font-size:20px;font-weight:850;font-stretch:118%;margin:1px 0}
.bits{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5}
.bits i{position:absolute;width:7px;height:12px;border-radius:2px;animation:bit 900ms var(--expo) forwards}
@keyframes bit{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

.scrim{position:fixed;inset:0;background:rgba(29,27,23,.45);opacity:0;visibility:hidden;transition:opacity 280ms var(--ease),visibility 0s 280ms}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px 46px;transform:translateY(105%);visibility:hidden;transition:transform 420ms var(--sheet),visibility 0s 420ms}
.open .scrim{opacity:1;visibility:visible;transition-delay:0s}
.open .sheet{transform:none;visibility:visible;transition-delay:0s}
.grab{width:36px;height:4px;border-radius:2px;background:#C9C1B4;margin:0 auto 10px}
.sh{display:flex;align-items:center;justify-content:space-between}
.sh h2{margin:0;font-size:20px;font-weight:800;font-stretch:115%}
.step{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;margin:14px 0 10px}
.step button{width:56px;height:56px;border-radius:18px;background:var(--tone);display:grid;place-items:center}
.wt{text-align:center;font-size:56px;line-height:1;font-weight:900;font-stretch:135%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wt small{font-size:20px;font-weight:700;font-stretch:100%;margin-left:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--tone)}
.seg button{height:40px;border-radius:12px;font-weight:650;font-size:14px}
.seg button[aria-checked=true]{background:var(--card);box-shadow:0 1px 3px rgba(29,27,23,.18)}
.bar{display:block;width:100%;height:132px;margin:14px 0 6px}
.side{text-align:center;font-size:14px;color:var(--ink-2);margin:0 0 14px;min-height:38px}
.side b{color:var(--ink);font-weight:750}
.use{width:100%;height:56px;border-radius:var(--r-pill);background:var(--pri);color:#fff;font-weight:750;font-size:16px}
.x{font-style:normal;font-family:system-ui,sans-serif;font-weight:500;margin:0 .22em}
.sr{position:absolute;left:0;top:0;width:300px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.ck.pop,.toast.show .medal,.dock.over .ring{animation:none}.bits{display:none}.toast,.sheet{transition:opacity 200ms,visibility 0s 200ms;transform:none}.sheet{opacity:0}.open .sheet{opacity:1}}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="top">
    <button class="icon" aria-label="Back to workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><b>Push day A</b><span><span id="el">38:12</span> · Week 6</span></div>
    <button class="finish">Finish</button>
  </div>
  <div class="prog" aria-label="Exercise 2 of 5"><i class="d"></i><i class="c"></i><i></i><i></i><i></i></div>
  <div class="kick">Exercise 2 of 5 · Barbell</div>
  <h1>Bench press</h1>
  <div class="sub"><span>Best <b id="best">80<i class="x">×</i>4</b> · est. <span id="bestE">90.7</span> kg</span>
    <button class="chip" id="plates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12h20"/><rect x="5" y="6" width="3" height="12" rx="1"/><rect x="16" y="6" width="3" height="12" rx="1"/><rect x="8.5" y="8" width="2" height="8" rx=".8"/><rect x="13.5" y="8" width="2" height="8" rx=".8"/></svg>Plate math</button></div>
  <section class="sets" aria-label="Sets">
    <div class="hd" aria-hidden="true"><span>SET</span><span>LAST TUE</span><span>KG</span><span>REPS</span><span></span></div>
    <div id="rows"></div>
    <button class="add" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add set</button>
  </section>
  <div class="next"><span class="th"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 15l8-6 8 6"/><path d="M3 18h18"/></svg></span><p><b>Incline dumbbell press</b>Next · 3 sets × 10 · rest 1:30</p></div>
</main>

<div class="toast" id="toast" role="status"><svg class="medal" viewBox="0 0 52 52" aria-hidden="true"><path d="M17 2h8l-4 16h-8zM27 2h8l4 16h-8z" fill="#B3401E"/><circle cx="26" cy="32" r="17" fill="#FFF3D1" stroke="#2B1D00" stroke-width="2.5"/><path d="M26 22l3 6.4 7 .8-5.2 4.7 1.4 6.9L26 37.3l-6.2 3.5 1.4-6.9-5.2-4.7 7-.8z" fill="#2B1D00"/></svg><p><small>NEW BEST</small><b id="tB">80 kg<i class="x">×</i>5</b><span id="tS">Est. 1RM 93.3 kg, up 2.6 kg</span></p></div>
<div class="bits" id="bits" aria-hidden="true"></div>

<div class="dock run" id="dock" aria-label="Rest timer">
  <div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="#3E3A33" stroke-width="6"/><circle id="arc" cx="32" cy="32" r="27" fill="none" stroke="#FFB59A" stroke-width="6" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="0"/></svg><b id="rt">1:24</b></div>
  <div class="dtx"><b id="dT">Resting</b><span id="dS">Set 3 · 80 kg<i class="x">×</i>5</span></div>
  <div class="db"><button class="adj" id="m15" aria-label="Rest 15 seconds less">−15</button><button class="adj" id="p15" aria-label="Rest 15 seconds more">+15</button><button class="skip" id="skip">Skip</button></div>
</div>

<div id="pl">
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="grab"></div>
    <div class="sh"><h2 id="shT">Plate math</h2><button class="icon" id="close" aria-label="Close plate math"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="step"><button id="wm" aria-label="2.5 kilograms less"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button><div class="wt" id="wt" aria-live="polite">80<small>kg</small></div><button id="wp" aria-label="2.5 kilograms more"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <div class="seg" role="radiogroup" aria-label="Bar"><button role="radio" aria-checked="true" data-b="20">20 kg bar</button><button role="radio" aria-checked="false" data-b="15">15 kg bar</button></div>
    <svg class="bar" id="barS" viewBox="0 0 358 132" aria-hidden="true"></svg>
    <p class="side" id="side"></p>
    <button class="use" id="use">Use 80 kg on set 3</button>
  </section>
</div>
<div class="sr" aria-live="polite" id="live"></div>
<script>
(() => {
const $=id=>document.getElementById(id),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sets=[{t:'W',p:[40,10],kg:'40',r:'10',done:true},{t:'1',p:[60,8],kg:'60',r:'8',done:true},{t:'2',p:[72.5,5],kg:'75',r:'5',done:true},{t:'3',p:[77.5,5],kg:'80',r:'',done:false},{t:'4',p:[77.5,5],kg:'',r:'',done:false}];
let best=80*(1+4/30),bestTxt='80'+'<i class="x">×</i>4',rest=84,restMax=120,running=true,last=0,raf=0,el=38*60+12,bar=20,target=80;
const e1=(w,r)=>w*(1+r/30),f=n=>(+n).toFixed(1).replace(/\.0$/,''),mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const X='<i class="x">×</i>';
const say=t=>{$('live').textContent=t};
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const cur=()=>sets.findIndex(s=>!s.done);
function render(){
 const c=cur();$('rows').innerHTML=sets.map((s,i)=>'<div class="row'+(s.done?' done':'')+(i===c?' cur':'')+'" data-i="'+i+'">'+
  '<span class="no" aria-hidden="true">'+s.t+'</span>'+(s.pb?'<span class="pb">PB</span>':'')+
  '<span class="prev" aria-label="Last time '+f(s.p[0])+' kilograms for '+s.p[1]+'">'+f(s.p[0])+X+s.p[1]+'</span>'+
  '<input inputmode="decimal" aria-label="Set '+s.t+' weight, kilograms" placeholder="'+f(s.p[0])+'" value="'+s.kg+'" data-k="kg">'+
  '<input inputmode="numeric" aria-label="Set '+s.t+' reps" placeholder="'+s.p[1]+'" value="'+s.r+'" data-k="r">'+
  '<button class="ck" aria-pressed="'+s.done+'" aria-label="'+(s.done?'Undo':'Complete')+' set '+s.t+'">'+TICK+'</button></div>').join('');
 const n=sets[c];$('dS').innerHTML=n?'Set '+n.t+' · '+f(n.kg||n.p[0])+' kg'+X+(n.r||n.p[1]):'All sets logged';
}
$('rows').addEventListener('input',e=>{const r=e.target.closest('.row');if(!r)return;sets[r.dataset.i][e.target.dataset.k]=e.target.value.replace(/[^0-9.]/g,'')});
$('rows').addEventListener('change',()=>render());
$('rows').addEventListener('click',e=>{const b=e.target.closest('.ck');if(!b)return;const i=+b.closest('.row').dataset.i,s=sets[i];
 if(s.done){s.done=false;s.pb=false;render();focusCk(i);say('Set '+s.t+' reopened');return}
 s.kg=s.kg||String(s.p[0]);s.r=s.r||String(s.p[1]);s.done=true;const w=+s.kg,r=+s.r,est=e1(w,r),pb=est>best+.05;
 let up=0;if(pb){up=est-best;best=est;bestTxt=f(w)+X+r;s.pb=true}
 render();const nb=focusCk(i);nb.classList.add('pop');startRest(120);
 if(pb)celebrate(nb,w,r,est,up);else say('Set '+s.t+' done, '+f(w)+' kilograms for '+r+'. Rest 2 minutes.')});
function focusCk(i){const b=$('rows').children[i].querySelector('.ck');b.focus({preventScroll:true});return b}
function celebrate(b,w,r,est,up){
 $('best').innerHTML=bestTxt;$('bestE').textContent=f(est.toFixed(1));$('tB').innerHTML=f(w)+' kg'+X+r;$('tS').textContent='Est. 1RM '+est.toFixed(1)+' kg, up '+up.toFixed(1)+' kg';
 const t=$('toast');t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(celebrate.t);celebrate.t=setTimeout(()=>t.classList.remove('show'),3400);
 say('New best. '+f(w)+' kilograms for '+r+'. Estimated one rep max '+est.toFixed(1)+' kilograms. Rest 2 minutes.');
 if(reduce)return;const R=b.getBoundingClientRect(),g=$('bits');g.style.transform='translate('+(R.left+R.width/2)+'px,'+(R.top+R.height/2)+'px)';g.innerHTML='';
 const C=['#F2B33D','#B3401E','#2F6B3A','#1D1B17','#FFB59A'];for(let k=0;k<18;k++){const a=-Math.PI/2+(k/17-.5)*2.6,d=70+Math.random()*70,i=document.createElement('i');
  i.style.cssText='background:'+C[k%5]+';--x:'+(Math.cos(a)*d-40).toFixed(0)+'px;--y:'+(Math.sin(a)*d+30).toFixed(0)+'px;--r:'+(Math.random()*540-270).toFixed(0)+'deg;animation-delay:'+(60+k*8)+'ms';g.appendChild(i)}
 setTimeout(()=>{g.innerHTML=''},1400)}
function startRest(s){rest=s;restMax=s;running=true;$('dock').className='dock run';$('dT').textContent='Resting';last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);drawRing()}
function drawRing(){$('rt').textContent=mmss(Math.ceil(rest));$('arc').setAttribute('stroke-dashoffset',(169.6*(1-rest/restMax)).toFixed(1))}
function loop(ts){const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;rest=Math.max(0,rest-dt);drawRing();
 if(rest<=0){running=false;const d=$('dock');d.className='dock over';$('dT').textContent='Rest done';$('rt').textContent='Go';say('Rest done. Up next: '+$('dS').textContent);return}raf=requestAnimationFrame(loop)}
$('m15').onclick=()=>{rest=Math.max(1,rest-15);drawRing();say(mmss(rest)+' left')};
$('p15').onclick=()=>{rest+=15;restMax=Math.max(restMax,rest);drawRing();say(mmss(rest)+' left')};
$('skip').onclick=()=>{if(!running){startRest(120);return}rest=0.001};
$('add').onclick=()=>{const l=sets[sets.length-1];sets.push({t:String(sets.length),p:[+(l.kg||l.p[0]),+(l.r||l.p[1])],kg:'',r:'',done:false});render();say('Set '+(sets.length-1)+' added')};
setInterval(()=>{el++;$('el').textContent=mmss(el)},1000);
/* plate math */
const PL=[[25,'#C8372D',112,26],[20,'#2E5BA8',112,23],[15,'#E5B62E',100,20],[10,'#3C8C4C',84,17],[5,'#F2EEE6',62,13],[2.5,'#1D1B17',48,10],[1.25,'#9A9388',38,8]];
function plates(){let per=(target-bar)/2;const out=[];if(per<0)return null;for(const p of PL){while(per>=p[0]-1e-6){out.push(p);per-=p[0]}}return{out,left:per}}
function drawBar(){const r=plates();$('wt').firstChild.nodeValue=f(target);const i=cur(),n=i<0?null:sets[i];$('use').textContent=n?'Use '+f(target)+' kg on set '+n.t:'Add a set first';
 let s='<rect x="0" y="58" width="110" height="8" rx="2" fill="#9A9388"/><rect x="110" y="55" width="248" height="14" rx="3" fill="#B5AEA2"/><rect x="104" y="44" width="16" height="36" rx="4" fill="#4F4941"/>';
 if(!r){$('barS').innerHTML=s;$('side').innerHTML='Lighter than the bar';return}
 let x=124;for(const p of r.out){s+='<rect x="'+x+'" y="'+(62-p[2]/2)+'" width="'+p[3]+'" height="'+p[2]+'" rx="3" fill="'+p[1]+'" stroke="#1D1B17" stroke-opacity=".35"/>';x+=p[3]+2}
 s+='<rect x="'+(x+2)+'" y="50" width="12" height="24" rx="3" fill="#4F4941"/>';
 s+='<text x="0" y="126" font-family="Anybody" font-size="12" font-weight="700" fill="#4F4941">BAR '+bar+' KG</text><text x="358" y="126" text-anchor="end" font-family="Anybody" font-size="12" font-weight="700" fill="#4F4941">ONE SIDE</text>';
 $('barS').innerHTML=s;const per=(target-bar)/2;
 $('side').innerHTML=r.out.length?'Per side <b>'+r.out.map(p=>f(p[0])).join(' + ')+'</b><br>'+f(per)+' kg each side'+(r.left>0.01?' · '+f(r.left)+' kg short':''):'<b>Empty bar</b><br>No plates needed'}
let opener=null;
function openSheet(){opener=document.activeElement;const i=cur(),n=i<0?null:sets[i];target=n?+(n.kg||n.p[0]):80;drawBar();$('pl').className='open';setTimeout(()=>$('wp').focus(),60)}
function closeSheet(){$('pl').className='';opener&&opener.focus&&opener.focus()}
$('plates').onclick=openSheet;$('close').onclick=closeSheet;$('scrim').onclick=closeSheet;
$('wm').onclick=()=>{target=Math.max(bar,target-2.5);drawBar()};$('wp').onclick=()=>{target=Math.min(300,target+2.5);drawBar()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{bar=+b.dataset.b;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-checked',x===b));target=Math.max(target,bar);drawBar()});
$('use').onclick=()=>{const i=cur();if(i<0)return;sets[i].kg=String(target);render();closeSheet();say('Set '+sets[i].t+' set to '+f(target)+' kilograms')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('pl').className){closeSheet()}
 if(e.key==='Tab'&&$('pl').className){const f=[...$('sheet').querySelectorAll('button')],a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
render();drawRing();raf=requestAnimationFrame(loop);
})();
</script>
