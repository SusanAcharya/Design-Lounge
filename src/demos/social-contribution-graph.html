<!-- Design Lounge piece: social-contribution-graph · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>ottoline on Mossgrid · contributions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe3;--paper:#faf7ee;--ink:#22302a;--ink-2:#46544c;--ink-3:#6b7770;--line:#ddd6c3;
  --c0:#e6e1d0;--c1:#c5d9a6;--c2:#8fbf6a;--c3:#4f9a45;--c4:#24642f;
  --serif:"Spectral",Georgia,serif;--mono:"DM Mono",ui-monospace,monospace;
  --ease:cubic-bezier(0.2,0.7,0.2,1);--expo:cubic-bezier(0.16,1,0.3,1);
  --cell:13px;--gap:3px;
}
body[data-theme="clay"]{--c1:#efc9a8;--c2:#e09a6b;--c3:#c0603a;--c4:#7f3420}
body[data-theme="tide"]{--c1:#bcd6dc;--c2:#7fb2c0;--c3:#3f8399;--c4:#1d4f63}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px/1.5 var(--mono);color:var(--ink);background:var(--bg);
  display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 16px;
  background-image:radial-gradient(rgba(34,48,42,.05) .7px,transparent .7px);background-size:4px 4px;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--c4);outline-offset:2px}
.sheet{position:relative;width:min(968px,100%);background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:36px 40px 30px;box-shadow:0 1px 0 #fff inset,0 30px 50px -40px rgba(34,48,42,.45)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.who{margin:0;font-size:12px;letter-spacing:.06em;color:var(--ink-3)}
.who b{font-weight:500;color:var(--ink-2)}
h1{margin:6px 0 0;font:400 40px/1.05 var(--serif);letter-spacing:-.015em}
h1 em{font-style:italic;color:var(--c4);transition:color .3s var(--ease)}
h1 .n{font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.ctl{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.years{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg)}
.years button{height:34px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--ink-3);transition:background .2s var(--ease),color .2s var(--ease)}
.years button:hover{color:var(--ink)}
.years button[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.themes{display:flex;gap:6px}
.themes button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:border-color .2s var(--ease)}
.themes button span{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--a) 0 50%,var(--b) 0)}
.themes button[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.rule{height:1px;background:var(--line);margin:24px 0 20px}
.scroll{overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:thin}
.graph{display:grid;grid-template-columns:30px auto;width:max-content}
.months{grid-column:2;position:relative;height:18px;font-size:11px;color:var(--ink-3)}
.months span{position:absolute;top:0}
.days{display:grid;grid-template-rows:repeat(7,var(--cell));gap:var(--gap);font-size:10px;color:var(--ink-3);line-height:var(--cell)}
.cells{display:grid;grid-template-rows:repeat(7,var(--cell));grid-auto-flow:column;grid-auto-columns:var(--cell);gap:var(--gap);outline:none;border-radius:3px}
.cells:focus-visible{outline:2px solid var(--c4);outline-offset:4px}
.cells i{border-radius:2px;background:var(--c0);transition:background-color .3s var(--ease) var(--d,0ms),transform .15s var(--ease);animation:in .5s var(--expo) both;animation-delay:calc(var(--w) * 7ms)}
.cells i[data-l="1"]{background:var(--c1)}.cells i[data-l="2"]{background:var(--c2)}.cells i[data-l="3"]{background:var(--c3)}.cells i[data-l="4"]{background:var(--c4)}
.cells i:not(.fut):not(.pad):hover{box-shadow:0 0 0 1.5px var(--ink)}
.cells i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cells i.pad{visibility:hidden}
.cells i.act{transform:scale(1.35);box-shadow:0 0 0 1.5px var(--paper),0 0 0 3px var(--ink);position:relative;z-index:1}
@keyframes in{from{opacity:0;transform:translateY(4px) scale(.6)}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:14px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.legend{display:flex;align-items:center;gap:3px}
.legend i{width:11px;height:11px;border-radius:2px}
.legend span{margin:0 6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:22px 0 0;border-top:1px solid var(--line)}
.stats div{padding:16px 0 0}
.stats div+div{border-left:1px solid var(--line);padding-left:20px}
.stats dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stats dd{margin:6px 0 0;font:400 30px/1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.stats dd small{font:400 12px/1 var(--mono);color:var(--ink-3);margin-left:6px}
.stats dd.flame{color:var(--c4);transition:color .3s var(--ease)}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;line-height:1.3;padding:7px 10px;border-radius:4px;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 10px)) translateY(4px);transition:opacity .12s var(--ease),transform .15s var(--ease);z-index:3}
.tip b{font-weight:500}
.tip::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;margin-left:-4px;background:var(--ink);transform:rotate(45deg)}
.tip.on{opacity:1;transform:translate(-50%,calc(-100% - 10px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:720px){.sheet{padding:24px 20px}h1{font-size:30px}.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-left:0;padding-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-theme="meadow">
<section class="sheet" aria-labelledby="title">
  <div class="top">
    <div>
      <p class="who"><b>ottoline</b> · Mossgrid · Lisbon</p>
      <h1 id="title"><span class="n" id="total">0</span> contributions <em>in <span id="yr">2025</span></em></h1>
    </div>
    <div class="ctl">
      <div class="years" role="radiogroup" aria-label="Year" id="years"></div>
      <div class="themes" role="radiogroup" aria-label="Colour theme" id="themes">
        <button type="button" role="radio" aria-checked="true" data-t="meadow" aria-label="Meadow" style="--a:#8fbf6a;--b:#24642f"><span></span></button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-t="clay" aria-label="Clay" style="--a:#e09a6b;--b:#7f3420"><span></span></button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-t="tide" aria-label="Tide" style="--a:#7fb2c0;--b:#1d4f63"><span></span></button>
      </div>
    </div>
  </div>
  <div class="rule"></div>
  <div class="scroll" id="scroll">
    <div class="graph">
      <div class="months" id="months" aria-hidden="true"></div>
      <div class="days" aria-hidden="true"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
      <div class="cells" id="cells" tabindex="0" role="group" aria-roledescription="calendar heatmap" aria-label="Daily contributions. Use arrow keys to move between days." aria-describedby="hint"></div>
    </div>
  </div>
  <div class="foot">
    <span id="hint">Hover a day, or focus the grid and use the arrow keys.</span>
    <div class="legend" aria-hidden="true"><span>Less</span><i style="background:var(--c0)"></i><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i><i style="background:var(--c4)"></i><span>More</span></div>
  </div>
  <dl class="stats">
    <div><dt id="curl">Current streak</dt><dd class="flame" id="cur">0</dd></div>
    <div><dt>Longest streak</dt><dd id="long">0</dd></div>
    <div><dt>Busiest day</dt><dd id="best">0</dd></div>
    <div><dt>Active days</dt><dd id="act">0</dd></div>
  </dl>
  <div class="tip" id="tip" aria-hidden="true"></div>
  <p class="sr" aria-live="polite" id="live"></p>
</section>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const TODAY = new Date(2026, 9, 3);
const YEARS = [2024, 2025, 2026];
const DAY = 864e5;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function gen(y) {
  let s = y * 31 + 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const out = [], start = new Date(y, 0, 1), end = new Date(y, 11, 31);
  const breaks = [[r() * 300 | 0, 9], [r() * 300 | 0, 6], [200 + (r() * 20 | 0), 12]];
  for (let d = new Date(start), i = 0; d <= end; d = new Date(d.getTime() + DAY), i++) {
    const wd = d.getDay(); let v = 0;
    if (d > TODAY) v = -1;
    else if (!breaks.some(([b, l]) => i >= b && i < b + l)) {
      const base = (wd === 0 || wd === 6) ? .35 : .85, season = .6 + .4 * Math.sin((i + y) / 40);
      if (r() < base * (.55 + .45 * season)) v = Math.round(Math.pow(r(), 1.8) * 18 * season + 1);
      if (r() < .02) v += 14;
    }
    out.push({ d, v });
  }
  return out;
}
const lvl = v => v <= 0 ? 0 : v < 3 ? 1 : v < 6 ? 2 : v < 11 ? 3 : 4;
const fmtD = d => `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
let data = [], cellsEls = [], active = -1, year = 2025;
const cells = $('cells'), tip = $('tip'), sheet = document.querySelector('.sheet');
function streaks(arr) {
  let long = 0, run = 0;
  arr.forEach(x => { if (x.v > 0) { run++; long = Math.max(long, run); } else if (x.v === 0) run = 0; });
  let cur = 0;
  const past = arr.filter(x => x.v >= 0);
  for (let i = past.length - 1; i >= 0 && past[i].v > 0; i--) cur++;
  return { long, cur };
}
function count(el, to, suffix) {
  if (reduce) { el.innerHTML = to.toLocaleString('en-US') + suffix; return; }
  const t0 = performance.now(), from = parseInt(el.textContent.replace(/,/g, '')) || 0;
  const step = t => { const p = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = Math.round(from + (to - from) * e).toLocaleString('en-US') + suffix; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function render(y) {
  year = y; data = gen(y); active = -1; hideTip();
  const lead = data[0].d.getDay();
  cells.innerHTML = ''; cellsEls = [];
  const months = $('months'); months.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let p = 0; p < lead; p++) { const i = document.createElement('i'); i.className = 'pad'; i.style.setProperty('--w', 0); frag.append(i); }
  data.forEach((x, k) => {
    const i = document.createElement('i'), w = Math.floor((k + lead) / 7);
    i.style.setProperty('--w', w); i.style.setProperty('--d', (w * 4) + 'ms');
    if (x.v < 0) i.className = 'fut'; else i.dataset.l = lvl(x.v);
    i.dataset.k = k; frag.append(i); cellsEls.push(i);
    if (x.d.getDate() === 1) { const s = document.createElement('span'); s.textContent = MON[x.d.getMonth()]; s.style.left = (w * 16) + 'px'; months.append(s); }
  });
  cells.append(frag);
  const past = data.filter(x => x.v >= 0), total = past.reduce((a, x) => a + x.v, 0);
  const st = streaks(data), best = past.reduce((a, x) => x.v > a.v ? x : a, past[0]);
  $('yr').textContent = y;
  count($('total'), total, '');
  $('curl').textContent = y === TODAY.getFullYear() ? 'Current streak' : 'Streak at year end';
  count($('cur'), st.cur, ' <small>days</small>');
  count($('long'), st.long, ' <small>days</small>');
  $('best').innerHTML = `${best.v}<small>${best.d.getDate()} ${MON[best.d.getMonth()]}</small>`;
  count($('act'), past.filter(x => x.v > 0).length, ` <small>of ${past.length}</small>`);
  document.querySelectorAll('#years button').forEach(b => { b.setAttribute('aria-checked', +b.dataset.y === y); b.tabIndex = +b.dataset.y === y ? 0 : -1; });
  const sc = $('scroll'); sc.scrollLeft = y === TODAY.getFullYear() ? sc.scrollWidth : 0;
}
function showTip(k, announce) {
  const x = data[k], el = cellsEls[k];
  if (!x || x.v < 0) { hideTip(); return; }
  cellsEls.forEach(c => c.classList.remove('act'));
  if (announce) el.classList.add('act');
  const n = x.v === 0 ? 'No contributions' : `<b>${x.v} contribution${x.v > 1 ? 's' : ''}</b>`;
  tip.innerHTML = `${n} · ${fmtD(x.d)}`;
  const r = el.getBoundingClientRect(), s = sheet.getBoundingClientRect();
  let left = r.left + r.width / 2 - s.left;
  tip.classList.add('on');
  const half = tip.offsetWidth / 2;
  left = Math.max(half + 8, Math.min(s.width - half - 8, left));
  tip.style.left = left + 'px'; tip.style.top = (r.top - s.top) + 'px';
  if (announce) $('live').textContent = tip.textContent;
}
function hideTip() { tip.classList.remove('on'); cellsEls.forEach(c => c.classList.remove('act')); }
cells.addEventListener('pointerover', e => { const k = e.target.dataset && e.target.dataset.k; if (k !== undefined) showTip(+k, false); });
cells.addEventListener('pointerleave', () => { if (document.activeElement !== cells) hideTip(); else if (active >= 0) showTip(active, true); });
cells.addEventListener('focus', () => {
  if (active < 0) { const past = data.filter(x => x.v >= 0); active = past.length - 1; }
  showTip(active, true);
});
cells.addEventListener('blur', hideTip);
cells.addEventListener('keydown', e => {
  const m = { ArrowUp: -1, ArrowDown: 1, ArrowLeft: -7, ArrowRight: 7 }[e.key];
  if (m === undefined && e.key !== 'Home' && e.key !== 'End') return;
  e.preventDefault();
  const last = data.filter(x => x.v >= 0).length - 1;
  let n = e.key === 'Home' ? 0 : e.key === 'End' ? last : active + m;
  if (n < 0 || n > last) return;
  active = n; showTip(active, true);
  const el = cellsEls[active], sc = $('scroll'), r = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
  if (r.left < sr.left + 30) sc.scrollLeft -= sr.left + 40 - r.left; else if (r.right > sr.right) sc.scrollLeft += r.right - sr.right + 10;
  showTip(active, true);
});
YEARS.forEach(y => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('role', 'radio'); b.dataset.y = y; b.textContent = y;
  b.addEventListener('click', () => render(y));
  $('years').append(b);
});
function radioKeys(group, sel) {
  group.addEventListener('keydown', e => {
    const bs = [...group.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    if (i < 0) return;
    const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
    if (!d) return; e.preventDefault();
    const n = bs[(i + d + bs.length) % bs.length]; n.focus(); n.click();
  });
}
radioKeys($('years')); radioKeys($('themes'));
$('themes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.body.dataset.theme = b.dataset.t;
  $('themes').querySelectorAll('button').forEach(x => { x.setAttribute('aria-checked', x === b); x.tabIndex = x === b ? 0 : -1; });
});
render(2025);
</script>
</body>
</html>
