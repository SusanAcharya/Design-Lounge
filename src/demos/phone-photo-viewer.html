<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dunlin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12110f;--ink:#f4efe6;--muted:#d9d0c3;--amber:#e6a322;--amber-ink:#1a1408;
  --serif:"Libre Baskerville",Georgia,serif;--sans:"Figtree",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--move:280ms;--zoom:240ms;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:clip}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.stage{position:fixed;inset:0;overflow:clip;background:var(--bg);touch-action:none}
.track{display:flex;height:100%;width:100%}
.track.anim{transition:transform var(--move) var(--ease)}
.slide{position:relative;flex:0 0 100%;height:100%;overflow:hidden}
.art{position:absolute;inset:0;transform-origin:center center;transition:transform var(--zoom) var(--ease)}
.art.zoom{transform:scale(1.8)}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.a1{background:linear-gradient(#f0c5a0 0%,#e07a58 32%,#6e3d52 54%,#243044 70%,#152028 70%,#10181e 100%)}
.a2{background:linear-gradient(#c5c9cf 0 36%,#6d7c82 36% 56%,#c9bba6 56% 100%)}
.a3{background:#e4d2b8}
.a4{background:#12302c}
.art::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(20,16,12,.16) .55px,transparent .75px);
  background-size:4px 4px;opacity:.35;
}
.round{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:#12110f;color:var(--ink);border:1px solid rgba(244,239,230,.45);
}
.round svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.close{position:absolute;z-index:3;top:calc(max(54px,env(safe-area-inset-top)) + 8px);right:12px}
.prev,.next{position:absolute;z-index:3;top:34%}
.prev{left:10px}.next{right:10px}
.round:hover{background:#1c1a17}
.chrome{
  position:absolute;left:0;right:0;bottom:0;z-index:3;pointer-events:none;
  padding:108px 20px max(34px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(12,10,8,.9) 0%,rgba(12,10,8,.62) 42%,transparent 100%);
}
.topline{display:flex;justify-content:space-between;align-items:baseline}
.brand{margin:0;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
#count{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
h1{margin:8px 0 0;font-family:var(--serif);font-weight:400;font-style:italic;font-size:22px;line-height:1.3;letter-spacing:-.01em}
#sub{margin:4px 0 0;font-size:13px;font-weight:500;color:var(--muted)}
.tools{position:relative;min-height:44px;margin-top:12px;display:flex;align-items:center;pointer-events:auto}
#zoom{
  min-height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(244,239,230,.5);
  font-size:15px;font-weight:700;background:rgba(18,17,15,.35);
}
#zoom:hover{background:rgba(244,239,230,.12)}
#zoom[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.dots{position:absolute;left:50%;transform:translateX(-50%);display:flex}
.dot{width:44px;height:44px;display:grid;place-items:center}
.dot i{width:7px;height:7px;border-radius:99px;background:rgba(244,239,230,.45);display:block}
.dot[aria-current="true"] i{width:18px;background:var(--amber)}
.end{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(54px,env(safe-area-inset-top)) 28px max(34px,env(safe-area-inset-bottom));
  text-align:center;background:var(--bg);
}
.end[hidden],.stage[hidden]{display:none}
.end .brand{letter-spacing:.2em}
.end h2{margin:14px 0 8px;font-family:var(--serif);font-weight:400;font-style:italic;font-size:28px;line-height:1.25}
.end p{margin:0 0 22px;color:var(--muted);font-size:15px;max-width:260px}
#reopen{min-height:48px;padding:0 22px;border-radius:24px;background:var(--amber);color:var(--amber-ink);font-size:16px;font-weight:700}
#reopen:hover{filter:brightness(.95)}
@media (prefers-reduced-motion:reduce){
  .track.anim,.art{transition:none}
}
@media (max-width:360px){
  h1{font-size:20px}
  .tools{flex-wrap:wrap}
}
</style>
</head>
<body>

            <path fill="#f7f1e6" d="M200 168c38 70 62 180 28 340-8 48-18 90-28 130-10-40-20-82-28-130-34-160-10-270 28-340z"/>

    <p id="sub">Mile 4, just after six</p>
    <div class="tools">
      <button type="button" id="zoom" aria-pressed="false">Zoom</button>
      <div class="dots" role="group" aria-label="Frames">
        <button type="button" class="dot" aria-current="true" aria-label="Photo 1"><i></i></button>

<section class="end" id="end" hidden>
  <p class="brand">Dunlin</p>
  <h2>This roll is closed</h2>
  <p>Open it again on the same frame.</p>
  <button type="button" id="reopen">Open roll</button>
</section>
<p class="sr" id="live" aria-live="polite"></p>
<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frames = [
    ['Reed bed at first light', 'Mile 4, just after six'],
    ['The red hut past the sluice', 'Roll 12, second frame'],
    ['A feather on wet sand', 'Found on the tide line'],
    ['Stones under the footbridge', 'The bridge at mile 6']
  ];
  const stage = document.getElementById('stage');
  const track = document.getElementById('track');
  const arts = [...document.querySelectorAll('.art')];
  const dots = [...document.querySelectorAll('.dot')];
  const cap = document.getElementById('cap');
  const sub = document.getElementById('sub');
  const count = document.getElementById('count');
  const zoomBtn = document.getElementById('zoom');
  const live = document.getElementById('live');
  const end = document.getElementById('end');
  let index = 0, zoomed = false, dragging = false, x0 = 0, dx = 0;
  function apply(extra, animate){
    if (reduce) animate = false;
    track.classList.toggle('anim', !!animate);
    track.style.transform = 'translate3d(calc(' + (-index * 100) + '% + ' + (extra || 0) + 'px),0,0)';
  }
  function setZoom(on){
    zoomed = on;
    arts.forEach((a, i) => a.classList.toggle('zoom', on && i === index));
    zoomBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    zoomBtn.textContent = on ? 'Fit' : 'Zoom';
  }
  function paint(){
    cap.textContent = frames[index][0];
    sub.textContent = frames[index][1];
    count.textContent = (index + 1) + ' of 4';
    dots.forEach((d, i) => {
      if (i === index) d.setAttribute('aria-current', 'true');
      else d.removeAttribute('aria-current');
    });
    live.textContent = 'Photo ' + (index + 1) + ' of 4. ' + frames[index][0] + '.';
  }
  function go(n){
    setZoom(false);
    index = (n + 4) % 4;
    apply(0, true);
    paint();
  }
  document.getElementById('prev').addEventListener('click', () => go(index - 1));
  document.getElementById('next').addEventListener('click', () => go(index + 1));
  dots.forEach((d, i) => d.addEventListener('click', () => { if (i !== index) go(i); }));
  zoomBtn.addEventListener('click', () => setZoom(!zoomed));
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    dragging = true; x0 = e.clientX; dx = 0;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging || zoomed) return;
    dx = e.clientX - x0;
    apply(dx, false);
  });
  stage.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    if (!zoomed && dx <= -48) go(index + 1);
    else if (!zoomed && dx >= 48) go(index - 1);
    else apply(0, true);
    dx = 0;
  });
  stage.addEventListener('pointercancel', () => { dragging = false; apply(0, true); });
  document.getElementById('close').addEventListener('click', () => {
    setZoom(false);
    stage.hidden = true;
    end.hidden = false;
    document.getElementById('reopen').focus();
  });
  document.getElementById('reopen').addEventListener('click', () => {
    end.hidden = true;
    stage.hidden = false;
    document.getElementById('close').focus();
  });
  document.addEventListener('keydown', e => {
    if (stage.hidden) return;
    if (e.key === 'ArrowRight') go(index + 1);
    else if (e.key === 'ArrowLeft') go(index - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(3);
    else if (e.key === 'Escape') document.getElementById('close').click();
  });
})();
</script>
