<!-- Design Lounge piece: sunset-grid-hero · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Night Drive — Saturday 18 October</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120b2e;--surface:#1a1140;--ink:#f4ecff;--ink-2:#c3b6e6;--ink-3:#9a8cc4;--line:#2f2466;
  --magenta:#ff3fa4;--cyan:#2fe2f0;--sun:#ffb347;--sun-2:#ff5c8a;
  --display:"Monoton",cursive;--sans:"Josefin Sans",system-ui,sans-serif;
  --r:6px;--t-micro:200ms;--t-in:900ms;--ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
a,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.hero{position:relative;height:100%;isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.nav{position:relative;z-index:2;display:flex;align-items:center;gap:28px;padding:22px 40px}
.brand{font:400 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);text-decoration:none;text-shadow:0 0 12px rgba(47,226,240,.6)}
.links{margin-left:auto;display:flex;gap:26px;font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.links a{text-decoration:none;color:var(--ink-2)}
.links a:hover{color:var(--ink)}
.copy{position:relative;z-index:2;padding:40px 40px 0;max-width:760px}
.kicker{display:inline-block;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(47,226,240,.5);padding:8px 12px;border-radius:var(--r)}
h1{margin:20px 0 16px;font:400 clamp(52px,6.8vw,86px)/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--magenta);text-shadow:0 0 18px rgba(255,63,164,.55),0 0 48px rgba(255,63,164,.3)}
h1 span{display:block;color:var(--ink);text-shadow:0 0 18px rgba(244,236,255,.35)}
.lede{margin:0 0 26px;max-width:46ch;color:var(--ink-2);font-size:18px;font-weight:400}
.lede b{color:var(--ink);font-weight:600}
.ctas{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:var(--r);border:1px solid var(--magenta);background:var(--magenta);color:#1a0a20;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:14px;text-decoration:none;box-shadow:0 0 22px rgba(255,63,164,.45);transition:transform var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 34px rgba(255,63,164,.65)}
.btn.ghost{background:rgba(18,11,46,.55);color:var(--ink);border-color:rgba(244,236,255,.4);box-shadow:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.ghost:hover{border-color:var(--ink);box-shadow:none}
.motion{position:absolute;left:40px;bottom:28px;z-index:2;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(244,236,255,.35);background:rgba(18,11,46,.6);color:var(--ink-2);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.motion[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.in{animation:in var(--t-in) var(--expo) both;animation-delay:var(--d,0ms)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<main class="hero">
  <canvas id="c" aria-hidden="true"></canvas>
  <header class="nav">
    <a class="brand" href="#">Night Drive</a>
    <nav class="links" aria-label="Main"><a href="#">Line-up</a><a href="#">Tickets</a><a href="#">The room</a></nav>
  </header>
  <div class="copy">
    <span class="kicker in">Saturday 18 October · Doors 22:00</span>
    <h1 class="in" style="--d:80ms">Night Drive <span>Vol. 7</span></h1>
    <p class="lede in" style="--d:160ms">Six hours of synth on the Maitighar rooftop. <b>Lokta Beats, Himal FM and Ritu</b> play until the grid fades at four.</p>
    <div class="ctas in" style="--d:240ms"><a class="btn" href="#">Get a ticket, 1,200</a><a class="btn ghost" href="#">See the line-up</a></div>
  </div>
  <button class="motion" id="motion" type="button" aria-pressed="true">Grid: moving</button>
</main>
<script>
(() => {
  const c = document.getElementById('c'), g = c.getContext('2d', { alpha: false });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const btn = document.getElementById('motion');
  let W = 0, H = 0, dpr = 1, raf = 0, seen = true, want = !reduce.matches, t = 0, last = 0;
  const stars = Array.from({ length: 90 }, () => [Math.random(), Math.random() * .48, Math.random() * 1.2 + .4]);
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = c.clientWidth; H = c.clientHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(t);
  }
  function draw(time) {
    const hz = H * .64, vx = W * .6;
    const sky = g.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, '#120b2e'); sky.addColorStop(1, '#3a1458');
    g.fillStyle = sky; g.fillRect(0, 0, W, hz + 1);
    g.fillStyle = '#f4ecff';
    for (const [x, y, r] of stars) { g.globalAlpha = .35 + .4 * ((Math.sin(time * .0015 + x * 40) + 1) / 2); g.beginPath(); g.arc(x * W, y * H, r, 0, 6.283); g.fill(); }
    g.globalAlpha = 1;
    // sun with cut stripes
    const sr = Math.min(W, H) * .2, sx = vx, sy = hz - sr * .55;
    const sun = g.createLinearGradient(0, sy - sr, 0, sy + sr);
    sun.addColorStop(0, '#ffb347'); sun.addColorStop(.55, '#ff5c8a'); sun.addColorStop(1, '#ff3fa4');
    g.save(); g.beginPath(); g.arc(sx, sy, sr, 0, 6.283); g.clip();
    g.fillStyle = sun; g.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    g.fillStyle = '#2a0f45';
    for (let i = 0; i < 6; i++) { const yy = sy + sr * (.08 + i * .09), hh = 2 + i * 1.4; g.fillRect(sx - sr, yy, sr * 2, hh); }
    g.restore();
    // ground
    g.fillStyle = '#0d0724'; g.fillRect(0, hz, W, H - hz);
    g.strokeStyle = '#2fe2f0'; g.lineWidth = 1.2; g.globalAlpha = .9;
    g.shadowColor = 'rgba(47,226,240,.6)'; g.shadowBlur = 0;
    g.beginPath();
    for (let i = -12; i <= 12; i++) { const x0 = vx + i * W * .06; g.moveTo(vx + (x0 - vx) * .02, hz); g.lineTo(vx + (x0 - vx) * 4.2, H); }
    g.stroke();
    const ph = (time * .00035) % 1;
    g.beginPath();
    for (let i = 0; i < 14; i++) { const z = (i + ph) / 14; const y = hz + (H - hz) * (z * z); g.moveTo(0, y); g.lineTo(W, y); }
    g.stroke();
    g.globalAlpha = 1;
    // horizon glow
    const glow = g.createLinearGradient(0, hz - 60, 0, hz + 40);
    glow.addColorStop(0, 'rgba(255,63,164,0)'); glow.addColorStop(.5, 'rgba(255,63,164,.35)'); glow.addColorStop(1, 'rgba(255,63,164,0)');
    g.fillStyle = glow; g.fillRect(0, hz - 60, W, 100);
    g.strokeStyle = '#ff3fa4'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, hz); g.lineTo(W, hz); g.stroke();
  }
  function frame(now) {
    if (now - last < 1000 / 45) { raf = requestAnimationFrame(frame); return; }
    t += now - last; last = now;
    draw(t); raf = requestAnimationFrame(frame);
  }
  function update() {
    cancelAnimationFrame(raf); raf = 0;
    if (want && seen && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); }
  }
  btn.addEventListener('click', () => { want = !want; btn.setAttribute('aria-pressed', String(want)); btn.textContent = want ? 'Grid: moving' : 'Grid: still'; update(); });
  reduce.addEventListener('change', () => { want = !reduce.matches; btn.setAttribute('aria-pressed', String(want)); btn.textContent = want ? 'Grid: moving' : 'Grid: still'; update(); });
  new IntersectionObserver(([e]) => { seen = e.isIntersecting; update(); }).observe(c);
  document.addEventListener('visibilitychange', update);
  addEventListener('resize', size);
  if (!want) { btn.setAttribute('aria-pressed', 'false'); btn.textContent = 'Grid: still'; }
  size(); update();
})();
</script>
</body>
</html>
