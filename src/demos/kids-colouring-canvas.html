<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#2E5E4E;--felt-2:#244C3F;--paper:#FFFFFF;--line:#22302B;--plate:#F7F3EA;--ink:#22302B;--ink-2:#4A5751;
  --tray:#C98E55;--tray-d:#9E6B3B;--sel:#FFD23F;
  --slab:"Zilla Slab",Rockwell,serif;
  --r-paper:24px;--r-btn:20px;--r-pill:999px;--hit:64px;
  --paper-sh:0 14px 30px rgba(10,24,19,.35);--lip:0 4px 0 rgba(10,24,19,.25);
  --ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--sheet:cubic-bezier(.32,.72,0,1);
  --t-micro:160ms;--t-layout:320ms;--t-fill:420ms;--t-save:700ms;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--felt);color:var(--ink);font:700 16px/1.2 var(--slab);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--sel);outline-offset:3px}
.app{max-width:390px;height:100%;margin:0 auto;padding:54px 16px 34px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;height:64px}
.round{position:relative;width:var(--hit);height:var(--hit);flex:none;border-radius:50%;background:var(--plate);box-shadow:var(--lip);display:grid;place-items:center;transition:transform var(--t-micro) var(--spring)}
.round svg{width:28px;height:28px}
.round:active{transform:scale(.92)}
.round:disabled{background:#DCD6C8;color:#4F5A55;cursor:default}
.title{flex:1;min-width:0;height:52px;border-radius:var(--r-pill);background:var(--felt-2);color:#F7F3EA;display:flex;align-items:center;justify-content:center;font:700 22px/1 var(--slab);white-space:nowrap}
.badge{position:absolute;right:-4px;top:-4px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:#C0341C;color:#fff;font:700 14px/26px var(--slab);text-align:center}
.badge.pop{animation:pop 520ms var(--spring)}
.paper{position:relative;margin-top:14px;height:440px;border-radius:var(--r-paper);background:var(--paper);box-shadow:var(--paper-sh);overflow:hidden;touch-action:none}
.paper svg,.paper canvas{position:absolute;inset:0;width:100%;height:100%}
#lines,#stk{pointer-events:none}
#ink{pointer-events:none;filter:url(#wax)}
.brush #ink{pointer-events:auto}
.fills use{cursor:pointer}
.lines *{fill:none;stroke:var(--line);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.lines .pupil{fill:var(--line);stroke:none}
.lines mask *{stroke:none}.lines mask rect{fill:#fff}.lines mask use{fill:#000}
.stk g{transform-box:fill-box;transform-origin:center;animation:stamp 460ms var(--spring)}
.ghost{transition:opacity var(--t-layout)}
.ghost circle{transform-box:fill-box;transform-origin:center;animation:ring 1.4s var(--ease) infinite}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;height:68px}
.mode{border-radius:var(--r-btn);background:var(--felt-2);color:#F7F3EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 15px/1 var(--slab);box-shadow:inset 0 0 0 2px #5E8A7B;transition:background var(--t-micro),color var(--t-micro)}
.mode svg{width:26px;height:26px}
.mode[aria-pressed="true"]{background:var(--plate);color:var(--ink);box-shadow:inset 0 0 0 3px var(--sel)}
.mode.save{background:var(--sel);color:var(--ink);box-shadow:var(--lip)}
.tray{position:relative;margin:12px -16px 0;flex:1;min-height:0;display:flex;align-items:flex-end;gap:2px;padding:0 16px 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tray::before{content:"";position:fixed;left:0;right:0;bottom:0;height:86px;background:var(--tray);box-shadow:inset 0 6px 0 var(--tray-d);z-index:-1}
.tray::-webkit-scrollbar{display:none}
.cray{flex:none;width:64px;height:112px;display:flex;align-items:flex-end;justify-content:center;transform:translateY(10px);transition:transform var(--t-layout) var(--spring)}
.cray svg{width:40px;height:104px}
.cray[aria-pressed="true"]{transform:translateY(-12px)}
.cray[aria-pressed="true"] svg{filter:drop-shadow(0 6px 0 rgba(10,24,19,.3))}
.stamp{flex:none;width:76px;height:96px;display:grid;place-items:center;border-radius:22px;transition:transform var(--t-layout) var(--spring)}
.stamp svg{width:60px;height:60px}
.stamp[aria-pressed="true"]{background:var(--plate);transform:translateY(-8px);box-shadow:var(--lip)}
.tray[hidden]{display:none}
.toast{position:fixed;left:50%;top:132px;transform:translate(-50%,-12px);opacity:0;visibility:hidden;height:52px;padding:0 22px;border-radius:var(--r-pill);background:var(--plate);color:var(--ink);display:flex;align-items:center;gap:8px;font:700 18px/1 var(--slab);box-shadow:var(--lip);white-space:nowrap;transition:transform var(--t-layout) var(--spring),opacity var(--t-layout),visibility 0s var(--t-layout)}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform var(--t-layout) var(--spring),opacity var(--t-layout)}
.toast svg{width:22px;height:22px;color:#2E8B57}
.fly{position:fixed;z-index:5;border-radius:24px;overflow:hidden;background:#fff;pointer-events:none;transform-origin:0 0;transition:transform var(--t-save) var(--expo),border-radius var(--t-save),opacity 200ms var(--t-save)}
.fly>*{position:absolute;inset:0;width:100%;height:100%}
.scrim{position:fixed;inset:0;background:rgba(10,24,19,.5);opacity:0;visibility:hidden;transition:opacity var(--t-layout),visibility 0s var(--t-layout)}
.scrim.on{opacity:1;visibility:visible;transition:opacity var(--t-layout)}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:390px;height:430px;padding:22px 20px 34px;border-radius:28px 28px 0 0;background:var(--plate);transform:translate(-50%,104%);visibility:hidden;transition:transform 420ms var(--sheet),visibility 0s 420ms}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform 420ms var(--sheet)}
.sh-top{display:flex;align-items:center;justify-content:space-between}
.sheet h2{margin:0;font:700 30px/1 var(--slab)}
.thumbs{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:390px;overflow-y:auto}
.thumb{position:relative;aspect-ratio:358/440;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #DCD6C8}
.thumb>*{position:absolute;inset:0;width:100%;height:100%}
.thumb.new{animation:pop 520ms var(--spring)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:none}}
@keyframes stamp{0%{transform:scale(1.6) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .stk g,.badge.pop,.thumb.new,.ghost circle{animation:none}
  .cray,.stamp,.round{transition:none}
  .fly{display:none}
  .sheet,.sheet.on{transition:opacity 200ms,visibility 0s;transform:translate(-50%,0)}.sheet:not(.on){opacity:0}
}
</style>

(()=>{

let col=COLS[3][1],mode='fill',stamp='star',hist=[],strokes=[],cur=null,saved=2;

el('circle',{class:'pupil',cx:271,cy:189,r:3.5},sn);el('circle',{class:'pupil',cx:295,cy:189,r:3.5},sn);

document.querySelector('.modes').addEventListener('click',e=>{const b=e.target.closest('.mode[data-m]');if(!b)return;mode=b.dataset.m;document.querySelectorAll('.mode[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('app').classList.toggle('brush',mode==='brush');$('crayons').hidden=mode==='stamp';$('stamps').hidden=mode!=='stamp';say(b.textContent.trim())});
$('crayons').addEventListener('click',e=>{const b=e.target.closest('.cray');if(!b)return;col=b.dataset.c;$('crayons').querySelectorAll('.cray').forEach(x=>x.setAttribute('aria-pressed',x===b));say(b.getAttribute('aria-label'))});
$('stamps').addEventListener('click',e=>{const b=e.target.closest('.stamp');if(!b)return;stamp=b.dataset.s;$('stamps').querySelectorAll('.stamp').forEach(x=>x.setAttribute('aria-pressed',x===b));say(b.getAttribute('aria-label').replace(' sticker',''))});
function snapshot(){
  const w=document.createElement('div');[fills,lines,stk].forEach(s=>{const c=s.cloneNode(true);c.removeAttribute('id');c.querySelectorAll('.ghost').forEach(g=>g.remove());c.querySelectorAll('use[id]').forEach(n=>n.removeAttribute('id'));w.appendChild(c)});
  const c2=document.createElement('canvas');c2.width=cv.width;c2.height=cv.height;c2.getContext('2d').drawImage(cv,0,0);c2.style.filter='url(#wax)';w.insertBefore(c2,w.children[1]);return w;
}
function addThumb(node,isNew){const t=document.createElement('div');t.className='thumb'+(isNew?' new':'');t.setAttribute('role','img');t.setAttribute('aria-label','Picture '+($('thumbs').children.length+1));while(node.firstChild)t.appendChild(node.firstChild);$('thumbs').prepend(t)}
$('save').onclick=()=>{
  const snap=snapshot(),r=$('paper').getBoundingClientRect(),g=$('galBtn').getBoundingClientRect();
  const finish=()=>{addThumb(snap,true);saved++;const b=$('badge');b.textContent=saved;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');$('galBtn').setAttribute('aria-label','Gallery, '+saved+' pictures');$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1600);say('Saved');live('Saved to your gallery')};
  if(RM)return finish();
  const f=document.createElement('div');f.className='fly';f.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;const view=snap.cloneNode(true);while(view.firstChild)f.appendChild(view.firstChild);
  const c2=f.querySelector('canvas');c2.getContext('2d').drawImage(cv,0,0);document.body.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const s=44/r.width;f.style.transform=`translate(${g.left+10-r.left}px,${g.top+8-r.top}px) scale(${s})`;f.style.borderRadius='60px';f.style.opacity='0'}));
  setTimeout(()=>{f.remove();finish()},720);
};
function openG(o){$('sheet').classList.toggle('on',o);$('scrim').classList.toggle('on',o);$('app').inert=o;if(o)setTimeout(()=>$('closeG').focus({preventScroll:true}),60);else $('galBtn').focus({preventScroll:true})}
$('galBtn').onclick=()=>openG(true);$('closeG').onclick=()=>openG(false);$('scrim').onclick=()=>openG(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheet').classList.contains('on'))openG(false);if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();$('undo').click()}});
sizeCanvas();addEventListener('resize',sizeCanvas);
/* hero: a sticker, a brushed scribble and two earlier pictures */
el('use',{href:'#g-bug'},el('g',{},el('g',{transform:'translate(236 330)'},stk)));
strokes.push({c:'#3466D1',p:[[150,150],[164,140],[178,152],[192,140],[206,152]]});redraw();
[['#FFE2A8','#7CC36A','#3466D1'],['#F7D6E6','#B48CF2','#FFC531']].forEach(([a,b,c])=>{const s=snapshot();const f=s.children[0];f.querySelector('[data-r=sky]').setAttribute('fill',a);f.querySelector('[data-r=ground]').setAttribute('fill',b);f.querySelector('[data-r=shell]').setAttribute('fill',c);addThumb(s)});
undoState();
})();
</script>
</body>
