<!-- Design Lounge piece: widget-stopwatch-laps · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Kronik ST-40 · Lap timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --room:#2a2b2d;--body:#1b1c1e;--body-2:#232427;--screen:#0d0e0f;--steel:#8d9198;--steel-2:#5c6066;--line:#33353a;
  --amber:#ffb23f;--amber-dim:#3a2a12;--amber-mid:#a8742b;--best:#8ee07a;--worst:#ff6a55;
  --pixel:"VT323",ui-monospace,monospace;--mono:"Red Hat Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--mono);color:var(--steel);display:grid;place-items:center;overflow-x:hidden;
  background:var(--room) repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.08) 6px 7px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.unit{position:relative;width:min(960px,100vw - 32px);padding:28px 32px 30px;background:linear-gradient(180deg,var(--body-2),var(--body));border:1px solid #000;border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px -20px rgba(0,0,0,.7),0 2px 0 #111}
.screw{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6a6e74,#2c2e31);box-shadow:inset 0 0 0 1px #111}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:#151618;transform:rotate(35deg)}
.screw:nth-child(1){top:10px;left:10px}.screw:nth-child(2){top:10px;right:10px}.screw:nth-child(3){bottom:10px;left:10px}.screw:nth-child(4){bottom:10px;right:10px}
.plate{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.plate b{color:#d8dadd;font-weight:700;letter-spacing:.2em}
.hazard{width:56px;height:10px;background:repeating-linear-gradient(-45deg,var(--amber) 0 6px,#111 6px 12px);border-radius:2px;opacity:.85}

.bay{display:grid;grid-template-columns:1fr 300px;gap:16px}
.screen{position:relative;background:var(--screen);border:1px solid #000;border-radius:8px;box-shadow:inset 0 0 0 3px #16171a,inset 0 8px 30px rgba(0,0,0,.8);overflow:hidden}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,transparent 1px 4px)}
.main{padding:20px 24px 22px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between}
.status{display:flex;gap:18px;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-mid)}
.led{display:inline-flex;align-items:center;gap:7px}
.led i{width:8px;height:8px;border-radius:50%;background:var(--amber-dim)}
.unit.running .led.run i{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink 1s steps(2,jump-none) infinite}
.unit:not(.running) .led.hold i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
@keyframes blink{50%{opacity:.35}}
.read{position:relative;font-family:var(--pixel);line-height:.8;color:var(--amber);text-shadow:0 0 12px rgba(255,178,63,.45);white-space:nowrap;font-variant-numeric:tabular-nums}
.big{font-size:min(168px,22vw)}
.cs{font-size:min(96px,13vw)}
.split{display:flex;gap:28px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber-mid)}
.split b{display:block;margin-top:2px;font:400 34px/1 var(--pixel);letter-spacing:0;color:var(--amber);text-shadow:0 0 8px rgba(255,178,63,.35)}

.laps{display:flex;flex-direction:column}
.laps-head{display:grid;grid-template-columns:36px 1fr 100px;padding:12px 16px 8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-mid);border-bottom:1px solid #26221a}
.laps ol{list-style:none;margin:0;padding:0 0 6px;flex:1;max-height:272px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--amber-dim) transparent}
.lap{display:grid;grid-template-columns:36px 1fr 100px;align-items:center;padding:7px 16px;font:400 24px/1 var(--pixel);color:var(--amber);border-bottom:1px solid #1a1712}
.lap .n{font:500 11px var(--mono);color:var(--amber-mid)}
.lap .tot,.laps-head span:last-child{color:var(--amber-mid);text-align:right}
.lap .t{display:flex;align-items:center;gap:8px}
.tag{font:700 9px var(--mono);letter-spacing:.1em;padding:2px 4px;border:1px solid currentColor;border-radius:2px}
.lap.best .t{color:var(--best);text-shadow:0 0 8px rgba(142,224,122,.35)}
.lap.worst .t{color:var(--worst);text-shadow:0 0 8px rgba(255,106,85,.35)}
.lap.cur{color:var(--amber-mid)}
.lap.in{animation:in 260ms var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
.empty{padding:28px 16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-mid)}

.keys{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:14px;margin-top:20px}
.key{position:relative;min-height:64px;padding:10px 16px;border-radius:8px;text-align:left;
  background:linear-gradient(180deg,#3a3c40,#2b2d30);border:1px solid #0b0b0c;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 5px 0 #0b0b0c,0 7px 10px rgba(0,0,0,.4);
  display:flex;flex-direction:column;justify-content:space-between;color:#e3e4e6;transition:transform 90ms var(--ease),box-shadow 90ms var(--ease),opacity 160ms var(--ease)}
.key:hover{background:linear-gradient(180deg,#414348,#303236)}
.key:active,.key.down{transform:translateY(5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 #0b0b0c,0 2px 4px rgba(0,0,0,.4)}
.key[disabled]{opacity:.4;cursor:not-allowed}
.key .lbl{font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.key kbd{font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--steel)}
.key.go{background:linear-gradient(180deg,#ffbf5c,#e89a26);color:#1b1206}
.key.go kbd{color:#5a3a0c}
.key.go:hover{background:linear-gradient(180deg,#ffc76d,#f0a431)}
.unit.running .key.go{background:linear-gradient(180deg,#3a3c40,#2b2d30);color:var(--amber)}
.unit.running .key.go kbd{color:var(--steel)}

@media (max-width:820px){
  .unit{padding:24px 18px}
  .bay{grid-template-columns:1fr}
  .main{min-height:0;gap:18px}
  .laps ol{max-height:220px}
  .keys{grid-template-columns:1fr 1fr 1fr;gap:10px}
  .hazard,.plate>span:last-child{display:none}
  .big{font-size:25vw}.cs{font-size:15vw}
  .split{gap:18px}.split b{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="unit running" id="unit" aria-labelledby="model">
  <span class="screw" aria-hidden="true"></span><span class="screw" aria-hidden="true"></span><span class="screw" aria-hidden="true"></span><span class="screw" aria-hidden="true"></span>
  <div class="plate"><span><b id="model">Kronik ST-40</b> · Lap timer</span><span class="hazard" aria-hidden="true"></span><span>Track 2 · 400 m reps</span></div>
  <div class="bay">
    <div class="screen main">
      <div class="status" aria-hidden="true">
        <span class="led run"><i></i>Run</span><span class="led hold"><i></i>Hold</span><span id="lapNo">Lap 06</span>
      </div>
      <div class="read" aria-hidden="true">
        <span class="big" id="mmss">00:00</span><span class="cs" id="cs">.00</span>
      </div>
      <p class="sr" role="timer" id="srTime" aria-live="off">0 minutes 0 seconds</p>
      <div class="split">
        <span>Current lap<b id="curLap">00:00.00</b></span>
        <span>Best lap<b id="bestLap">--</b></span>
        <span>Avg lap<b id="avg">--</b></span>
      </div>
    </div>
    <div class="screen laps">
      <div class="laps-head" aria-hidden="true"><span>#</span><span>Lap</span><span>Total</span></div>
      <ol id="laps" aria-label="Laps, newest first"></ol>
    </div>
  </div>
  <div class="keys">
    <button class="key go" type="button" id="go" aria-keyshortcuts="Space"><span class="lbl" id="goLbl">Stop</span><kbd>Space</kbd></button>
    <button class="key" type="button" id="lap" aria-keyshortcuts="L"><span class="lbl">Lap</span><kbd>L</kbd></button>
    <button class="key" type="button" id="reset" aria-keyshortcuts="R" disabled><span class="lbl">Reset</span><kbd>R</kbd></button>
  </div>
  <p class="sr" id="announce" aria-live="polite"></p>
</section>
<script>
const $ = s => document.querySelector(s);
const unit = $('#unit'), list = $('#laps');
let laps = [4182, 4095, 4237, 3988, 4110];
let base = laps.reduce((a, b) => a + b, 0) * 10 + 27340;
let startAt = performance.now() - base, running = true, raf;

const fmt = ms => {
  const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000) % 100;
  return [String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'), '.' + String(cs).padStart(2, '0')];
};
const fmtCs = c => { const [a, b] = fmt(c * 10); return a + b; };
const fmtLap = c => c < 6000 ? (c / 100).toFixed(2) : fmtCs(c).replace(/^0/, '');
const now = () => running ? performance.now() - startAt : base;
const lapsTotal = () => laps.reduce((a, b) => a + b, 0);

function renderLaps(fresh) {
  list.innerHTML = '';
  if (!laps.length) { list.innerHTML = '<li class="empty">No laps yet · press L while running</li>'; return; }
  const min = Math.min(...laps), max = Math.max(...laps);
  let tot = 0;
  const rows = laps.map((l, i) => { tot += l; return { l, i, tot }; }).reverse();
  for (const { l, i, tot } of rows) {
    const li = document.createElement('li');
    const best = laps.length > 1 && l === min, worst = laps.length > 1 && l === max;
    li.className = 'lap' + (best ? ' best' : '') + (worst ? ' worst' : '') + (fresh && i === laps.length - 1 ? ' in' : '');
    li.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${fmtLap(l)}${best ? '<span class="tag">Best</span>' : ''}${worst ? '<span class="tag">Worst</span>' : ''}</span><span class="tot">${fmtCs(tot)}</span>`;
    list.append(li);
  }
  $('#avg').textContent = fmtLap(Math.round(lapsTotal() / laps.length));
  $('#bestLap').textContent = fmtLap(min);
}

let lastSec = -1;
function draw() {
  const t = now();
  const [mmss, cs] = fmt(t);
  $('#mmss').textContent = mmss; $('#cs').textContent = cs;
  const cur = Math.floor(t / 10) - lapsTotal();
  $('#curLap').textContent = fmtCs(Math.max(0, cur));
  $('#lapNo').textContent = 'Lap ' + String(laps.length + 1).padStart(2, '0');
  const sec = Math.floor(t / 1000);
  if (sec !== lastSec) { lastSec = sec; $('#srTime').textContent = `${Math.floor(sec / 60)} minutes ${sec % 60} seconds`; }
}
function loop() { draw(); raf = requestAnimationFrame(loop); }

function setRunning(r) {
  if (r === running) return;
  if (r) startAt = performance.now() - base; else base = performance.now() - startAt;
  running = r;
  unit.classList.toggle('running', r);
  $('#goLbl').textContent = r ? 'Stop' : base > 0 ? 'Resume' : 'Start';
  $('#lap').disabled = !r;
  $('#reset').disabled = r;
  cancelAnimationFrame(raf);
  if (r) loop(); else draw();
  $('#announce').textContent = r ? 'Running' : 'Stopped at ' + fmt(base).join('');
}
function addLap() {
  if (!running) return;
  const l = Math.floor(now() / 10) - lapsTotal();
  if (l <= 0) return;
  laps.push(l);
  renderLaps(true);
  const min = Math.min(...laps), max = Math.max(...laps);
  $('#announce').textContent = `Lap ${laps.length}, ${fmtCs(l)}` + (laps.length > 1 && l === min ? ', best lap' : laps.length > 1 && l === max ? ', worst lap' : '');
}
function reset() {
  if (running) return;
  base = 0; laps = []; renderLaps(); draw();
  $('#goLbl').textContent = 'Start'; $('#avg').textContent = '--'; $('#bestLap').textContent = '--';
  $('#announce').textContent = 'Reset';
}
const press = id => { const k = $(id); if (k.disabled) return; k.classList.add('down'); setTimeout(() => k.classList.remove('down'), 120); };
$('#go').addEventListener('click', () => setRunning(!running));
$('#lap').addEventListener('click', addLap);
$('#reset').addEventListener('click', reset);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') {
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault(); press('#go'); setRunning(!running);
  } else if (k === 'l') { press('#lap'); addLap(); }
  else if (k === 'r') { press('#reset'); reset(); }
});
renderLaps(); loop();
</script>
</body>
</html>
