<!-- Design Lounge piece: scroll-lens-card-ticker · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Fernly — What the membership covers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161514; --bone:#EDE6D8; --bone-2:#A8A194; --line:#2C2A27; --ink:#161514;
  --sage:#B9CBA4; --clay:#E79B72; --sky:#A9C8DE; --mustard:#E8C35A;
  --sans:"Bricolage Grotesque",system-ui,sans-serif; --serif:"Instrument Serif",Georgia,serif;
  --card-w:280px; --card-h:360px; --r-card:28px;
  --phrase:64px; --gap:220px;
  --ease:cubic-bezier(.2,.7,.2,1); --expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0}
html{height:100%}
body{background:var(--bg);color:var(--bone);font:16px/1.5 var(--sans);height:520vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--mustard);outline-offset:3px;border-radius:8px}

.stage{position:sticky;top:0;height:100vh;overflow:hidden}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:28px 48px;z-index:4}
.brand{display:flex;align-items:center;gap:10px;font:700 22px/1 var(--sans);letter-spacing:-.03em;color:var(--bone);text-decoration:none}
.brand svg{width:24px;height:24px}
.join{height:44px;padding:0 22px;border:1px solid var(--bone-2);border-radius:999px;font-weight:600;font-size:15px;transition:background 200ms var(--ease),color 200ms var(--ease),border-color 200ms var(--ease)}
.join:hover{background:var(--bone);color:var(--ink);border-color:var(--bone)}

.head{position:absolute;left:48px;top:120px;z-index:3;max-width:300px}
.head p{margin:0;font:400 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--bone-2)}
.head h2{margin:12px 0 0;font:italic 400 34px/1.1 var(--serif);letter-spacing:-.01em;color:var(--bone)}

.track{position:absolute;top:50%;left:0;display:flex;white-space:nowrap;will-change:transform;transform:translate3d(0,-50%,0)}
.track span{font:600 var(--phrase)/1 var(--sans);letter-spacing:-.035em;margin-right:var(--gap)}
.track.out{color:var(--bone)}
.track.in{color:var(--ink)}

.card{position:absolute;left:50%;top:50%;width:var(--card-w);height:var(--card-h);margin:calc(var(--card-h)/-2) 0 0 calc(var(--card-w)/-2);
  border-radius:var(--r-card);overflow:hidden;background:var(--sage);transition:background-color 500ms var(--ease);z-index:2;
  box-shadow:0 40px 80px -40px rgba(0,0,0,.6)}
.card .art{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.92) rotate(-4deg);transition:opacity 360ms var(--ease),transform 600ms var(--expo)}
.card .art.on{opacity:1;transform:none}
.card .art svg{width:200px;height:200px;fill:none;stroke:rgba(22,21,20,.32);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.card .num{position:absolute;left:20px;top:18px;font:italic 400 22px/1 var(--serif);color:var(--ink);z-index:2}
.card .tag{position:absolute;left:20px;bottom:18px;right:20px;display:flex;justify-content:space-between;font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:rgba(22,21,20,.7);z-index:2}

.rail{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:999px;z-index:4;background:rgba(22,21,20,.7)}
.rail button{height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--bone-2);transition:background 240ms var(--ease),color 240ms var(--ease)}
.rail button:hover{color:var(--bone)}
.rail button[aria-current="step"]{background:var(--bone);color:var(--ink)}
.cue{position:absolute;right:48px;bottom:52px;display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-2);z-index:3}
.cue i{display:block;width:1px;height:28px;background:var(--line);position:relative;overflow:hidden}
.cue i::after{content:"";position:absolute;left:0;top:-12px;width:1px;height:12px;background:var(--bone);animation:drip 1.8s var(--ease) infinite}
@keyframes drip{to{transform:translateY(40px)}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  :root{--phrase:44px;--gap:140px;--card-w:220px;--card-h:290px}
  .top{padding:20px}
  .head{left:20px;top:84px}
  .head h2{font-size:26px}
  .cue{display:none}
  .rail button{padding:0 10px;font-size:13px}
}
@media (max-width:480px){
  :root{--phrase:36px;--gap:110px;--card-w:190px;--card-h:250px}
  .rail{bottom:24px;gap:2px}
  .rail button{padding:0 9px;font-size:12px}
  .card .art svg{width:150px;height:150px}
  .card .tag{font-size:10px;left:16px;right:16px;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){
  .card,.card .art,.rail button{transition:none}
  .cue i::after{animation:none}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <header class="top">
    <a class="brand" href="#" aria-label="Fernly home">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#B9CBA4" stroke-width="2" stroke-linecap="round"><path d="M12 21V9"/><path d="M12 13c-4 0-6-3-6-7 4 0 6 3 6 7Z"/><path d="M12 10c3 0 5-2 5-5-3 0-5 2-5 5Z"/></svg>
      Fernly
    </a>
    <button class="join" type="button">Start a membership</button>
  </header>

  <div class="head">
    <p>The membership</p>
    <h2>Four things you will never have to think about.</h2>
  </div>

  <div class="track out" id="trackOut" aria-hidden="true"></div>

  <div class="card" id="card" aria-hidden="true">
    <span class="num" id="num">01 / 04</span>
    <div class="art on"><svg viewBox="0 0 64 64"><path d="M14 28h24v22H14z"/><path d="M38 34l14-10"/><path d="M50 21l5-2 1 5"/><path d="M18 28c0-9 16-9 16 0"/><path d="M56 30v4M51 34v4M56 40v3"/></svg></div>
    <div class="art"><svg viewBox="0 0 64 64"><path d="M18 36h28l-4 18H22z"/><path d="M32 36V20"/><path d="M32 26c-7 0-10-5-10-12 7 0 10 5 10 12Z"/><path d="M32 22c5 0 9-3 9-9-5 0-9 3-9 9Z"/><path d="M12 30l6 6M52 30l-6 6"/></svg></div>
    <div class="art"><svg viewBox="0 0 64 64"><path d="M12 24h34l-8-8"/><path d="M52 40H18l8 8"/><circle cx="12" cy="40" r="4"/><circle cx="52" cy="24" r="4"/></svg></div>
    <div class="art"><svg viewBox="0 0 64 64"><path d="M10 14h44v28H30l-10 9v-9H10z"/><path d="M32 36V24"/><path d="M32 28c-5 0-7-3-7-8 5 0 7 3 7 8Z"/><path d="M32 26c4 0 6-2 6-6-4 0-6 2-6 6Z"/></svg></div>
    <div class="track in" id="trackIn"></div>
    <div class="tag"><span id="tagL">Weekly</span><span id="tagR">Included</span></div>
  </div>

  <nav class="rail" aria-label="Membership benefits" id="rail"></nav>
  <div class="cue" aria-hidden="true"><i></i>Scroll</div>
  <p class="sr" aria-live="polite" id="live"></p>
</div>

<script>
(() => {
  const items = [
    { text: 'Watered on your schedule', short: 'Watering', color: '#B9CBA4', l: 'Weekly visit', r: 'Included' },
    { text: 'Repotted when it outgrows', short: 'Repotting', color: '#E79B72', l: 'Soil + pot', r: 'Included' },
    { text: 'Swap any plant, any month', short: 'Swaps', color: '#A9C8DE', l: '1 swap / month', r: 'Free' },
    { text: 'A botanist on call', short: 'Botanist', color: '#E8C35A', l: 'Reply in 2 h', r: '7 days' },
  ];
  const n = items.length;
  const stage = document.getElementById('stage');
  const out = document.getElementById('trackOut'), inn = document.getElementById('trackIn');
  const card = document.getElementById('card'), num = document.getElementById('num');
  const arts = [...card.querySelectorAll('.art')];
  const tagL = document.getElementById('tagL'), tagR = document.getElementById('tagR');
  const rail = document.getElementById('rail'), live = document.getElementById('live');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  items.forEach(it => {
    [out, inn].forEach(t => { const s = document.createElement('span'); s.textContent = it.text; t.appendChild(s); });
  });
  const btns = items.map((it, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = it.short;
    b.setAttribute('aria-label', it.text);
    b.addEventListener('click', () => goTo(i));
    rail.appendChild(b); return b;
  });

  let centers = [], cur = null, target = 0, active = -1, raf = 0;
  function measure() {
    centers = [...out.children].map(s => s.offsetLeft + s.offsetWidth / 2);
    inn.style.left = -card.offsetLeft + 'px';
    inn.style.top = stage.offsetHeight / 2 - card.offsetTop + 'px';
    update(true);
  }
  const smooth = t => t * t * (3 - 2 * t);
  function progress() {
    const max = document.documentElement.scrollHeight - innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  }
  function xFor(p) {
    const f = p * (n - 1), i = Math.min(n - 2, Math.floor(f));
    const k = smooth(Math.min(1, Math.max(0, f - i)));
    const c = centers[i] + (centers[i + 1] - centers[i]) * k;
    return innerWidth / 2 - c;
  }
  function paint(x) {
    const t = `translate3d(${x}px,-50%,0)`;
    out.style.transform = t;
    inn.style.transform = t;
  }
  function setActive(i) {
    if (i === active) return;
    active = i;
    card.style.backgroundColor = items[i].color;
    arts.forEach((a, j) => a.classList.toggle('on', j === i));
    num.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0');
    tagL.textContent = items[i].l; tagR.textContent = items[i].r;
    btns.forEach((b, j) => j === i ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
    live.textContent = items[i].text;
  }
  function tick() {
    cur += (target - cur) * 0.14;
    if (Math.abs(target - cur) < 0.3) cur = target;
    paint(cur);
    raf = cur === target ? 0 : requestAnimationFrame(tick);
  }
  function update(instant) {
    const p = progress();
    target = xFor(p);
    setActive(Math.round(p * (n - 1)));
    if (reduce || instant || cur === null) { cur = target; paint(cur); return; }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function goTo(i) {
    const max = document.documentElement.scrollHeight - innerHeight;
    scrollTo({ top: max * i / (n - 1), behavior: reduce ? 'auto' : 'smooth' });
  }
  addEventListener('scroll', () => update(false), { passive: true });
  addEventListener('resize', measure);
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('.rail')) {
      if (e.key === 'ArrowRight') { goTo(Math.min(n - 1, active + 1)); btns[Math.min(n - 1, active + 1)].focus(); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { goTo(Math.max(0, active - 1)); btns[Math.max(0, active - 1)].focus(); e.preventDefault(); }
    }
  });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(measure);
  measure();
})();
</script>
</body>
</html>
