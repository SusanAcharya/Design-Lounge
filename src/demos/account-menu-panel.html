<!-- Design Lounge piece: account-menu-panel · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Account menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4;--surface:#fff;--surface-2:#e6ebf0;--ink:#12171c;--ink-2:#4c5864;--ink-3:#7d8b98;
  --line:#d5dde4;--line-strong:#b7c3ce;--primary:#0f4c81;--primary-ink:#fff;--primary-soft:#e5f0f8;
  --focus:#0f4c81;--danger:#9b2c2c;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:600;letter-spacing:-.02em}
.who{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 4px;border-radius:999px}
.who[aria-expanded="true"]{background:var(--surface-2)}
.ava{width:32px;height:32px;border-radius:50%;background:#14324f;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.menu{position:absolute;top:72px;right:28px;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 16px 40px -20px rgba(18,23,28,.35);padding:6px;transform-origin:top right}
.menu[hidden]{display:none}
.ident{padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.ident b{display:block;font-weight:600}
.ident span{color:var(--ink-2);font-size:12px}
.menu button{width:100%;min-height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:6px;text-align:left;font-size:13px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger);margin-top:4px}
.stage{padding:48px 28px;max-width:640px}
h1{margin:0 0 8px;font-size:32px;letter-spacing:-.03em;font-weight:500}
p.lead{margin:0;color:var(--ink-2);max-width:46ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">North ledger</div>
  <button class="who" id="trigger" aria-haspopup="menu" aria-expanded="true" aria-controls="menu">
    <span class="ava" aria-hidden="true">SA</span>
    <span>S. Acharya</span>
  </button>
</header>
<div class="menu" id="menu" role="menu" aria-label="Account">
  <div class="ident"><b>Susan Rai</b><span>susan@northledger.test</span></div>
  <button role="menuitem" data-go="Account">Account</button>
  <button role="menuitem" data-go="Billing">Billing</button>
  <button role="menuitem" data-go="Keyboard">Keyboard shortcuts</button>
  <button role="menuitem" class="danger" data-go="Signed out">Sign out</button>
</div>
<main class="stage">
  <h1 id="title">Today</h1>
  <p class="lead" id="lead">The account menu is open. Choose a destination, or press Escape to close it.</p>
</main>
<script>
const trigger = document.getElementById('trigger');
const menu = document.getElementById('menu');
const items = [...menu.querySelectorAll('[role="menuitem"]')];
function setOpen(open){
  trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  menu.hidden = !open;
  if (open) items[0].focus();
}
trigger.addEventListener('click', () => setOpen(menu.hidden));
items.forEach((btn, i) => {
  btn.addEventListener('click', () => {
    document.getElementById('title').textContent = btn.dataset.go;
    document.getElementById('lead').textContent = btn.dataset.go === 'Signed out'
      ? 'Session ended on this desk. The menu closes and focus returns to the avatar.'
      : 'Same header, same type, same menu width. Only the page title changed.';
    setOpen(false);
    trigger.focus();
  });
  btn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); items[(i+1)%items.length].focus(); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); items[(i-1+items.length)%items.length].focus(); }
    if (e.key === 'Escape'){ setOpen(false); trigger.focus(); }
  });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden){ setOpen(false); trigger.focus(); }});
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target) && e.target !== trigger && !trigger.contains(e.target)) setOpen(false); });
</script>
</body>
</html>
