<!-- Design Lounge piece: notif-delivery-live · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock screen · Haulbird live update</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;800;900&family=Red+Hat+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#0f3b3a;--wall-2:#0a2a29;--sun:#f0a63a;--hill:#145250;--hill-2:#1b6a63;
  --card:#f5eddf;--card-2:#ebe0cc;--ink:#1a1714;--ink-2:#4f473d;--ink-3:#7a6f61;--line:#d8cbb4;
  --tomato:#ff5b2e;--tomato-ink:#c23a12;--road:#fbf6ec;--block:#e4d8c1;--river:#9cc6bd;
  --lock:#fff6e8;--focus:#ffcf7a;
  --display:"Darker Grotesque",system-ui,sans-serif;--mono:"Red Hat Mono",ui-monospace,monospace;
  --sheet:cubic-bezier(.32,.72,0,1);--expo:cubic-bezier(.16,1,.3,1);--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{position:relative;overflow:hidden;font:500 17px/1.3 var(--display);color:var(--ink);
  background:
    radial-gradient(circle at 74% 30%,var(--sun) 0 64px,transparent 65px),
    radial-gradient(160% 60% at 20% 108%,var(--hill-2) 0 48%,transparent 48.3%),
    radial-gradient(140% 52% at 90% 104%,var(--hill) 0 50%,transparent 50.3%),
    linear-gradient(180deg,var(--wall-2),var(--wall) 60%)}
body::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background-image:radial-gradient(rgba(255,246,232,.5) .5px,transparent .6px);background-size:3px 3px;mix-blend-mode:overlay}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.lock{position:absolute;top:70px;left:0;right:0;text-align:center;color:var(--lock)}
.lock p{margin:0;font-size:21px;font-weight:600;letter-spacing:.01em}
.lock time{display:block;margin-top:-6px;font-size:100px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;transform-origin:50% 0;transition:transform .44s var(--sheet)}
body.tall .lock time{transform:scale(.62)}

/* transient notice */
.stack{position:absolute;z-index:2;left:12px;right:12px;bottom:116px;display:flex;flex-direction:column}
.nwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--sheet)}
.nwrap.on{grid-template-rows:1fr}
.nwrap>div{min-height:0;overflow:hidden}
.notice{display:flex;align-items:center;gap:12px;margin:0 4px 8px;padding:10px 14px;border-radius:20px;
  background:rgba(245,237,223,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  transform:translateY(10px) scale(.96);opacity:0;transition:transform .42s var(--expo),opacity .25s var(--ease)}
.nwrap.on .notice{transform:none;opacity:1}
.notice>div{min-width:0}
.notice .ap{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--tomato);color:var(--ink)}
.notice b{display:block;font-size:17px;font-weight:700;line-height:1.1}
.notice span{display:block;font-size:15px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice time{margin-left:auto;align-self:flex-start;font:400 11px var(--mono);color:var(--ink-3)}

/* live activity */
.la{position:relative;border-radius:28px;background:var(--card);
  box-shadow:0 24px 50px -20px rgba(4,20,20,.7);overflow:hidden;
  transform:translateY(40px);opacity:0;transition:transform .6s var(--expo),opacity .3s var(--ease)}
.la.in{transform:none;opacity:1}
.tap{display:block;width:100%;text-align:left;padding:16px 18px 14px;border-radius:28px 28px 0 0}
.la:not(.open) .tap{border-radius:28px}
.row1{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.row1 .ap{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--tomato);color:var(--ink)}
.row1 .ap svg{width:13px;height:13px;stroke-width:2.4}
.row1 .chev{margin-left:auto;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--card-2);color:var(--ink-2);transition:transform .36s var(--sheet)}
.la.open .chev{transform:rotate(180deg)}
.row2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.eta{font-size:clamp(30px,9.6vw,38px);white-space:nowrap;font-weight:800;line-height:1;letter-spacing:-.02em}
.eta em{font-style:normal;color:var(--tomato-ink)}
.at{text-align:right;font:500 13px/1.3 var(--mono);color:var(--ink-2)}
.at b{display:block;font:800 24px/1 var(--display);color:var(--ink);letter-spacing:-.01em}
.stage{display:block;margin-top:2px;font-size:17px;font-weight:600;color:var(--ink-2)}
.prog{display:block;position:relative;height:30px;margin-top:10px}
.prog .rail{position:absolute;left:12.5%;right:12.5%;top:13px;height:4px;border-radius:2px;background:var(--line)}
.prog .fill{position:absolute;left:12.5%;top:13px;height:4px;border-radius:2px;background:var(--ink);width:0;transition:width .5s var(--ease)}
.prog i{position:absolute;top:10px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.prog i.done{box-shadow:inset 0 0 0 5px var(--ink)}
.prog .bike{position:absolute;top:0;margin-left:-15px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--tomato);color:var(--ink);transition:left .5s var(--ease);box-shadow:0 0 0 3px var(--card)}
.prog .bike svg{width:18px;height:18px}
.labels{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-top:4px;font:500 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.labels span.on{color:var(--ink)}

.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .44s var(--sheet)}
.la.open .more{grid-template-rows:1fr}
.more>div{min-height:0;overflow:hidden}
.inner{padding:0 18px 18px;opacity:0;transition:opacity .2s var(--ease)}
.la.open .inner{opacity:1;transition:opacity .3s var(--ease) .12s}
.map{position:relative;display:block;width:100%;height:136px;border-radius:18px;background:var(--block);overflow:hidden}
.map svg{width:100%;height:100%;stroke-width:initial}
.pin{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;display:grid;place-items:center;border-radius:50%;background:var(--tomato);color:var(--ink);box-shadow:0 0 0 3px var(--card),0 6px 14px -4px rgba(0,0,0,.4)}
.pin::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--tomato);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(2);opacity:0}}
.pin svg{width:17px;height:17px}
.home{position:absolute;right:26px;top:22px;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--card)}
.home svg{width:16px;height:16px}
.mapnote{position:absolute;left:10px;bottom:10px;padding:4px 8px;border-radius:8px;background:var(--card);font:500 11px var(--mono);color:var(--ink-2)}
.cour{display:flex;align-items:center;gap:12px;margin-top:14px}
.av{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--card);font-size:19px;font-weight:800}
.cour b{display:block;font-size:19px;font-weight:700;line-height:1.05}
.cour>div{min-width:0}
.cour div span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 12px var(--mono);color:var(--ink-3)}
.cour .btns{margin-left:auto;display:flex;gap:8px}
.cb{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--card-2);color:var(--ink);transition:background .15s var(--ease),transform .12s var(--ease)}
.cb:hover{background:var(--line)}.cb:active{transform:scale(.93)}
.door{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;min-height:48px;padding:0 6px 0 14px;border-radius:16px;background:var(--card-2);text-align:left;font-size:17px;font-weight:700}
.door small{display:block;font:400 11.5px var(--mono);color:var(--ink-3)}
.sw{position:relative;flex:none;width:52px;height:32px;border-radius:16px;background:var(--line);transition:background .2s var(--ease)}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .24s var(--sheet)}
.door[aria-checked="true"] .sw{background:var(--ink)}
.door[aria-checked="true"] .sw::after{transform:translateX(20px)}
.arrived{display:none;margin-top:10px;width:100%;min-height:48px;border-radius:16px;background:var(--ink);color:var(--card);font-size:18px;font-weight:700}
.la[data-stage="3"] .arrived{display:block}
.la[data-stage="3"] .door{display:none}
.la[data-stage="3"] .eta em{color:var(--ink)}
.la.done{transform:translateY(30px);opacity:0;pointer-events:none}

.dock{position:absolute;left:44px;right:44px;bottom:44px;display:flex;justify-content:space-between}
.dock button{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:rgba(10,42,41,.55);color:var(--lock);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.dock button[aria-pressed="true"]{background:var(--lock);color:var(--wall)}
.replay{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);min-height:40px;padding:0 18px;border-radius:20px;background:var(--lock);color:var(--wall);font-size:17px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.replay.on{opacity:1;pointer-events:auto}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:1ms!important;transition-delay:0s!important}}
@media (max-height:760px){.lock{top:58px}.lock time{font-size:80px}.stack{bottom:96px}.dock{bottom:34px}.map{height:104px}}
</style>
</head>
<body>
<div class="lock" aria-hidden="true">
  <p id="date">Thursday 8 October</p>
  <time id="clock">18:24</time>
</div>

<div class="stack">
<div class="nwrap" id="notice"><div>
<div class="notice" role="status" aria-live="polite">
  <span class="ap" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 15h4l3-7h5l3 7h3"/><circle cx="7" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg></span>
  <div><b id="nTitle">Haulbird</b><span id="nBody">Dawit picked up your order</span></div>
  <time>now</time>
</div>
</div></div>

<section class="la" id="la" data-stage="2" aria-labelledby="laTitle">
  <h2 class="sr" id="laTitle">Haulbird delivery, live</h2>
  <button class="tap" id="tap" type="button" aria-expanded="false" aria-controls="more">
    <span class="row1"><span class="ap" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 15h4l3-7h5l3 7h3"/><circle cx="7" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg></span>Haulbird · order 4471<span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></span></span>
    <span class="row2"><span class="eta" id="eta">Arriving in <em>12 min</em></span><span class="at">ETA<b id="etaAt">18:36</b></span></span>
    <span class="stage" id="stage">Dawit is on the way · 2.4 km</span>
    <span class="prog" aria-hidden="true">
      <span class="rail"></span><span class="fill" id="fill"></span>
      <i style="left:12.5%"></i><i style="left:37.5%"></i><i style="left:62.5%"></i><i style="left:87.5%"></i>
      <span class="bike" id="bike"><svg viewBox="0 0 24 24"><path d="M3 15h4l3-7h5l3 7h3"/><circle cx="7" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg></span>
    </span>
    <span class="labels" aria-hidden="true"><span>Ordered</span><span>Packed</span><span>On the way</span><span>Door</span></span>
  </button>
  <div class="more" id="more"><div><div class="inner">
    <div class="map" role="img" aria-label="Map: courier on Kiln Street heading to your door">
      <svg viewBox="0 0 326 150" preserveAspectRatio="none" aria-hidden="true">
        <path d="M-10 118 C60 96 120 132 190 110 S300 70 340 84" stroke="var(--river)" stroke-width="16" fill="none"/>
        <g stroke="var(--road)" stroke-width="9" fill="none" stroke-linecap="butt">
          <path d="M0 40H326M0 88H326M60 0V150M150 0V150M250 0V150"/>
        </g>
        <g stroke="var(--road)" stroke-width="4" fill="none"><path d="M0 64H326M104 0V150M200 0V150M290 0V150"/></g>
        <path id="route" d="M44 140 V88 H150 V64 H250 V40 H286" stroke="var(--tomato)" stroke-width="4" fill="none" stroke-dasharray="1 8" stroke-linecap="round"/>
        <path id="trail" d="M44 140 V88 H150 V64 H250 V40 H286" stroke="var(--ink)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="home" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z"/></svg></span>
      <span class="pin" id="pin" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 15h4l3-7h5l3 7h3"/><circle cx="7" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg></span>
      <span class="mapnote" id="mapnote">Kiln Street</span>
    </div>
    <div class="cour">
      <span class="av" aria-hidden="true">D</span>
      <div><b>Dawit Haile</b><span>Blue scooter · KL 22 HB</span></div>
      <div class="btns">
        <button class="cb" type="button" id="callC" aria-label="Call Dawit"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
        <button class="cb" type="button" id="msgC" aria-label="Message Dawit"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
      </div>
    </div>
    <button class="door" id="door" type="button" role="switch" aria-checked="false">
      <span>Leave at the door<small>Photo on drop-off, no knock</small></span><span class="sw" aria-hidden="true"></span>
    </button>
    <button class="arrived" id="gotit" type="button">Coming down</button>
  </div></div></div>
</section>
</div>

<div class="dock">
  <button type="button" aria-label="Torch" aria-pressed="false" id="torch"><svg viewBox="0 0 24 24"><path d="M8 3h8v4l-2 3v11h-4V10L8 7z"/><path d="M12 13v2"/></svg></button>
  <button type="button" aria-label="Camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
</div>
<button class="replay" id="replay" type="button" tabindex="-1">Order again</button>
<p class="sr" id="live" aria-live="polite" aria-atomic="true"></p>

<script>
const $=id=>document.getElementById(id);
const la=$('la'),route=$('route'),trail=$('trail'),pin=$('pin');
const LEN=route.getTotalLength();trail.style.strokeDasharray=LEN;
const TOTAL=12,START_PROG=.42,STREETS=[[.0,'Mill Lane'],[.3,'Ropewalk'],[.55,'Kiln Street'],[.86,'Your street']];
let mins=TOTAL,prog=START_PROG,clockMin=24,timer=0,noticeT=0,stage=2,door=false;
const say=t=>{$('live').textContent='';setTimeout(()=>$('live').textContent=t,30)};

function notify(title,body){
  $('nTitle').textContent=title;$('nBody').textContent=body;
  const n=$('notice');n.classList.remove('on');void n.offsetWidth;n.classList.add('on');
  clearTimeout(noticeT);noticeT=setTimeout(()=>n.classList.remove('on'),3600);
}
function placePin(){
  const map=pin.parentElement,p=route.getPointAtLength(LEN*prog);
  pin.style.left=(p.x/326*map.clientWidth)+'px';pin.style.top=(p.y/150*map.clientHeight)+'px';
  trail.style.strokeDashoffset=LEN*(1-prog);
  const st=STREETS.filter(s=>prog>=s[0]).pop();$('mapnote').textContent=st[1];
}
function render(){
  $('clock').textContent='18:'+String(clockMin).padStart(2,'0');
  const km=(prog<1?(1-prog)*4.1:0).toFixed(1);
  if(stage<3){
    $('eta').innerHTML=mins<=1?'Arriving <em>now</em>':'Arriving in <em>'+mins+' min</em>';
    $('stage').textContent=mins<=2?'Dawit is around the corner · '+km+' km':'Dawit is on the way · '+km+' km';
  }else{
    $('eta').innerHTML='<em>At your door</em>';
    $('stage').textContent=door?'Left at the door · photo sent':'Dawit is outside · gate 2';
  }
  const pct=stage<3?37.5+(prog-START_PROG)/(1-START_PROG)*50:87.5;
  $('fill').style.width=(pct-12.5)+'%';$('bike').style.left=pct+'%';
  la.querySelectorAll('.prog i').forEach((d,i)=>d.classList.toggle('done',i<stage||(i===3&&stage===3)));
  la.querySelectorAll('.labels span').forEach((s,i)=>s.classList.toggle('on',i===stage));
  la.dataset.stage=stage;placePin();
}
function step(){
  mins--;clockMin++;prog=Math.min(1,START_PROG+(TOTAL-mins)/TOTAL*(1-START_PROG));
  if(mins===2){notify('Haulbird','Dawit is 2 minutes away. Get ready.');say('Dawit is 2 minutes away.')}
  if(mins<=0){
    stage=3;clearInterval(timer);prog=1;
    notify('Dawit is outside','Order 4471 · '+(door?'leaving it at the door':'gate 2'));
    say('Dawit is at your door.');
    if(!la.classList.contains('open'))toggle(true);
  }
  render();
}
function toggle(force){
  const o=typeof force==='boolean'?force:!la.classList.contains('open');
  la.classList.toggle('open',o);document.body.classList.toggle('tall',o);$('tap').setAttribute('aria-expanded',o);
  la.querySelectorAll('.inner button').forEach(b=>b.tabIndex=o?0:-1);
  if(o)requestAnimationFrame(placePin);
}
function start(){
  mins=TOTAL;prog=START_PROG;clockMin=24;stage=2;door=false;
  $('door').setAttribute('aria-checked','false');
  la.classList.remove('done','in');la.inert=false;toggle(false);render();
  $('replay').classList.remove('on');$('replay').tabIndex=-1;
  requestAnimationFrame(()=>requestAnimationFrame(()=>la.classList.add('in')));
  setTimeout(()=>notify('Haulbird','Dawit picked up your order from Larkin Bakehouse.'),700);
  clearInterval(timer);timer=setInterval(step,2400);
}
$('tap').onclick=()=>toggle();
$('door').onclick=()=>{door=!door;$('door').setAttribute('aria-checked',door);say(door?'Dawit will leave it at the door.':'Dawit will hand it to you.');render()};
$('callC').onclick=()=>notify('Calling Dawit…','Masked number. Dawit never sees yours.');
$('msgC').onclick=()=>notify('Message sent','“Gate code is 4471, flat 3 on the left.”');
$('gotit').onclick=()=>{la.classList.add('done');document.body.classList.remove('tall');la.inert=true;notify('Haulbird','Enjoy. Rate Dawit later in the app.');say('Delivered.');
  setTimeout(()=>{$('replay').classList.add('on');$('replay').tabIndex=0;$('replay').focus()},500)};
$('replay').onclick=start;
$('torch').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&la.classList.contains('open')){toggle(false);$('tap').focus()}});
addEventListener('resize',placePin);
start();
setTimeout(()=>toggle(true),1300);
</script>
</body>
</html>
