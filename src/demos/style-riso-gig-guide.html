<!-- Design Lounge piece: style-riso-gig-guide · platform: mobile-app · 390x844 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handbill riso gig guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EEE3;--pink:#FF48B0;--teal:#00838A;--blue:#3D5588;--over:#1F2350;
  --tint-p:#FAD3E6;--tint-t:#CFE5E2;--paper-2:#EAE3D3;
  --font:"Archivo",system-ui,sans-serif;
  --reg-x:1.5px;--reg-y:-1px;
  --ease:cubic-bezier(.2,.7,.2,1);--expo:cubic-bezier(.16,1,.3,1);--sheet:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 14px/1.4 var(--font);color:var(--blue);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.5;mix-blend-mode:multiply}
.app{position:relative;z-index:1;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column}
header{padding:58px 18px 0;position:relative}
.kick{display:flex;justify-content:space-between;font:700 11px/1 var(--font);font-stretch:100%;letter-spacing:.14em;text-transform:uppercase}
.mast{margin:8px 0 0;line-height:0}
.mast svg{display:block;width:100%;max-width:340px;height:auto;overflow:visible}
.mast text{font:900 92px var(--font);font-stretch:62%}
.mast .ink-n{fill:var(--over)}
.mast .ink-p{fill:var(--pink);mix-blend-mode:multiply;transform:translate(calc(var(--reg-x) - 1.5px),calc(var(--reg-y) + 1px))} /* the pink plate overprints, misregistered; SVG keeps the pair one drawn title */
.city{display:flex;align-items:center;gap:8px}.regm{width:22px;height:22px;margin:-6px 0}
.sub{margin:8px 0 0;font-weight:600;font-size:14px;font-stretch:88%;display:flex;gap:10px;align-items:center}
.sub b{font-weight:800;background:var(--blue);color:var(--paper);padding:3px 7px 2px;letter-spacing:.06em;font-size:11px}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:14px 12px 0;padding:0 0 10px;border-bottom:2px solid var(--blue)}
.day{position:relative;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;isolation:isolate}
.day small{font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.day b{font-weight:800;font-size:22px;font-stretch:75%;line-height:1}
.day .pips{display:flex;gap:3px;height:5px}
.day .pips span{width:5px;height:5px;background:var(--teal);border-radius:50%}
.day::before{content:"";position:absolute;inset:3px 4px;border-radius:50%;background:var(--pink);mix-blend-mode:multiply;transform:scale(0) rotate(-8deg);transition:transform 320ms var(--expo);z-index:-1}
.day::after{content:"";position:absolute;inset:4px 3px 2px 5px;border-radius:50%;border:2px solid var(--blue);transform:scale(0);transition:transform 320ms var(--expo) 40ms;z-index:-1}
.day[aria-pressed=true]::before{transform:scale(1) rotate(-8deg)}
.day[aria-pressed=true]::after{transform:scale(1) translate(var(--reg-x),var(--reg-y))}
.day[aria-pressed=true]{color:var(--over)}
.day[aria-pressed=true] .pips span{background:var(--over)}
/* list */
.list{flex:1;overflow-y:auto;padding:14px 14px 140px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.dayhead span{font-weight:600;letter-spacing:.04em;font-stretch:88%}
.card{position:relative;display:grid;grid-template-columns:1fr 104px;gap:6px;padding:16px 14px 14px 16px;margin:0 0 14px;isolation:isolate;animation:drop 420ms var(--expo) both}
.card::before{content:"";position:absolute;inset:0;background:var(--tint-p);clip-path:var(--cut);z-index:-2}
.card.t::before{background:var(--tint-t)}
.card::after{content:"";position:absolute;inset:0;border:0;background:var(--blue);clip-path:var(--cut);z-index:-3;transform:translate(3px,4px);opacity:.9}
.card:nth-child(3n+1){--cut:polygon(1% 3%,34% 0,62% 2%,99% 0,100% 38%,98% 71%,100% 98%,66% 100%,31% 97%,0 100%,2% 64%,0 30%)}
.card:nth-child(3n+2){--cut:polygon(0 1%,47% 3%,100% 0,98% 30%,100% 62%,99% 100%,55% 97%,2% 100%,0 72%,1% 40%)}
.card:nth-child(3n){--cut:polygon(2% 0,100% 2%,99% 48%,100% 97%,70% 100%,38% 98%,0 99%,1% 52%)}
@keyframes drop{from{opacity:0;transform:translateY(14px) rotate(-1deg)}}
.meta{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;align-items:center;white-space:nowrap}
.meta .tm{background:var(--blue);color:var(--paper);padding:3px 6px 2px}
.act{margin:8px 0 6px;font:900 32px/.9 var(--font);font-stretch:68%;text-transform:uppercase;color:var(--over);letter-spacing:-.005em}
.info{font-weight:500;font-size:13px;font-stretch:92%;color:var(--blue)}
.info b{font-weight:800}
.row{display:flex;align-items:center;gap:10px;margin-top:12px}
.save{height:40px;min-width:96px;padding:0 14px 0 10px;display:inline-flex;align-items:center;gap:7px;border:2px solid var(--blue);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);transition:background 160ms var(--ease),color 160ms var(--ease)}
.save svg{width:18px;height:18px}
.save[aria-pressed=true]{background:var(--blue);color:var(--paper)}
.price{font-weight:800;font-size:15px;font-stretch:80%}
.art{position:relative;width:104px;height:104px;align-self:start;margin-top:-4px}
.art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.art .p{mix-blend-mode:multiply;transform:translate(var(--reg-x),var(--reg-y))}
.art .q{mix-blend-mode:multiply}
.reg .art .p{animation:reg 520ms var(--expo)}
@keyframes reg{from{transform:translate(5px,-3px)}}
.stamp{position:absolute;right:6px;bottom:4px;width:92px;height:92px;pointer-events:none;mix-blend-mode:multiply;opacity:0;transform:rotate(-12deg)}
.card.saved .stamp{opacity:.92}
.card.hit .stamp{animation:stamp 460ms var(--expo) both}
.card.hit{animation:thud 300ms var(--ease)}
@keyframes stamp{0%{opacity:0;transform:scale(1.9) rotate(4deg)}45%{opacity:1;transform:scale(.92) rotate(-13deg)}100%{opacity:.92;transform:scale(1) rotate(-12deg)}}
@keyframes thud{0%,100%{transform:none}30%{transform:translate(0,2px) scale(.992)}55%{transform:translate(-1px,0)}}
/* tray */
.tray{position:fixed;left:14px;right:14px;bottom:34px;max-width:402px;margin:0 auto;z-index:5;height:64px;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;background:var(--blue);color:var(--paper);text-align:left;width:auto}
.tray::after{content:"";position:absolute;inset:0;background:var(--pink);mix-blend-mode:multiply;transform:translate(4px,3px);z-index:-1}
.tray .lbl{flex:1;min-width:0}
.tray strong{display:block;font-weight:900;font-size:20px;font-stretch:70%;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.tray em{display:block;font-style:normal;font-weight:500;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#E9E4F2}
.count{width:44px;height:44px;border-radius:50%;background:var(--paper);color:var(--over);display:grid;place-items:center;font:900 22px/1 var(--font);font-stretch:70%}
.count.bump{animation:bump 380ms var(--expo)}
@keyframes bump{40%{transform:scale(1.3) rotate(-10deg)}}
.scrim{position:fixed;inset:0;z-index:6;background:rgba(46,53,102,.35);opacity:0;visibility:hidden;transition:opacity 240ms var(--ease),visibility 0s 240ms}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;z-index:7;background:var(--paper);padding:20px 18px 48px;border-top:3px solid var(--blue);transform:translateY(105%);visibility:hidden;transition:transform 380ms var(--sheet),visibility 0s 380ms}
.open .scrim{opacity:1;visibility:visible;transition-delay:0s}
.open .sheet{transform:none;visibility:visible;transition:transform 380ms var(--sheet)}
.sheet h2{margin:0;font:900 40px/.9 var(--font);font-stretch:64%;text-transform:uppercase;color:var(--over)}
.sheet .x{position:absolute;right:12px;top:12px;width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--blue)}
.sheet ol{list-style:none;margin:16px 0 0;padding:0;max-height:360px;overflow:auto}
.sheet li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:2px dashed var(--blue)}
.sheet li .d{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sheet li .n{font-weight:800;font-size:18px;font-stretch:72%;text-transform:uppercase;color:var(--over);line-height:1.05}
.sheet li .v{display:block;font-weight:500;font-size:12px;font-stretch:92%;color:var(--blue);text-transform:none}
.sheet .empty{margin:18px 0 0;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;transition-duration:1ms!important}.card.hit .stamp{animation:none}}
</style>
</head>
<body>
<svg class="grain" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .24  0 0 0 0 .2  0 0 0 0 .16  0 0 0 -1.6 .9"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
<div class="app" id="app">
  <header>
    <div class="kick"><span class="city"><svg class="regm" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="#00838A"/><circle cx="13" cy="10" r="7" fill="#FF48B0" style="mix-blend-mode:multiply"/><path d="M11 0v22M0 11h22" stroke="#1F2350" stroke-width="1.2"/></svg>Bristol</span><span>Week 45 · Free</span></div>
    <h1 class="mast"><svg viewBox="0 0 340 76" role="img" aria-label="Handbill"><text class="ink-p" x="3" y="68" textLength="332" lengthAdjust="spacingAndGlyphs">HANDBILL</text><text class="ink-n" x="0" y="70" textLength="332" lengthAdjust="spacingAndGlyphs">HANDBILL</text></svg></h1>
    <p class="sub"><b>GIGS</b>Mon 2 to Sun 8 November · 21 listings</p>
  </header>
  <nav class="week" aria-label="Days this week" id="week"></nav>
  <main class="list" id="list" aria-live="polite"></main>
  <button class="tray" id="tray" aria-haspopup="dialog" aria-controls="sheet">
    <span class="lbl"><strong>This week</strong><em id="trayNames">Nothing saved yet</em></span>
    <span class="count" id="count" aria-label="saved">0</span>
  </button>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">
    <h2 id="sh">This week</h2>
    <button class="x" id="close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <ol id="saved"></ol>
  </section>
  <p class="sr" id="say" aria-live="assertive"></p>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <path id="ring" d="M46 46m-33 0a33 33 0 1 1 66 0a33 33 0 1 1-66 0"/>
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
</defs></svg>
<script>
(() => {
  const DAYS = [['Mon',2],['Tue',3],['Wed',4],['Thu',5],['Fri',6],['Sat',7],['Sun',8]];
  const E = [
    [0,'19:30','The Coalhouse','Moth Parade','Post-punk','£12','sun'],[0,'20:00','Lantern Rooms','Wren & Ash','Folk duo','£9','hill'],[0,'21:00','Basement 9','Open Decks','Club','Free','bars'],
    [1,'19:00','St Kew\'s Hall','Glasshouse Choir','Choral','£15','arch'],[1,'20:30','Docklight','Static Garden','Shoegaze','£11','burst'],[1,'22:00','Basement 9','DJ Okra','Afro house','£6','sun'],
    [2,'19:30','Ferry Shed','Hollow Bell','Drone','£10','bars'],[2,'20:00','The Coalhouse','Soft Ruin','Indie','£13','hill'],[2,'21:30','Lantern Rooms','Late Jazz Jam','Jazz','£5','arch'],
    [3,'19:00','Docklight','Nadia Ferreira','Fado','£16','burst'],[3,'20:30','Ferry Shed','Pylon Kids','Garage rock','£10','sun'],[3,'22:30','Basement 9','Lowtide Disco','Disco','£8','bars'],
    [4,'19:30','The Coalhouse','Salt Lick','Post-punk','£14','burst'],[4,'20:00','St Kew\'s Hall','Kofi Mensah Quartet','Jazz','£18','arch'],[4,'23:00','Basement 9','Brass Futures','Brass + bass','£10','hill'],
    [5,'14:00','Ferry Shed','Zine & Tape Fair','Market','Free','bars'],[5,'20:00','Docklight','Ana Petrov','Synth pop','£15','sun'],[5,'22:00','Lantern Rooms','The Slow Fevers','Soul','£12','burst'],
    [6,'13:00','Lantern Rooms','Sunday Folk Club','Folk','£4','hill'],[6,'18:30','St Kew\'s Hall','Ivy Kanté Trio','Jazz','£14','arch'],[6,'20:00','The Coalhouse','Moon Static','Dub','£9','sun']
  ];
  const ART = {
    sun:'<circle class="q" cx="56" cy="48" r="38" fill="#00838A"/><g class="p"><circle cx="40" cy="64" r="30" fill="#FF48B0"/></g>',
    hill:'<path class="q" d="M2 98L48 14l50 84z" fill="#00838A"/><g class="p"><circle cx="70" cy="34" r="22" fill="#FF48B0"/><rect x="0" y="80" width="104" height="20" fill="#FF48B0"/></g>',
    bars:'<g class="q" fill="#00838A"><rect x="6" y="8" width="18" height="90"/><rect x="34" y="28" width="18" height="70"/><rect x="62" y="48" width="18" height="50"/></g><g class="p"><circle cx="70" cy="30" r="26" fill="#FF48B0"/></g>',
    arch:'<path class="q" d="M10 100V52a42 42 0 0 1 84 0v48z" fill="#00838A"/><g class="p"><path d="M30 100V60a22 22 0 0 1 44 0v40z" fill="#FF48B0"/></g>',
    burst:'<g class="p"><path d="M52 2l10 28 30-8-18 24 26 16-30 4 6 30-24-18-24 18 6-30-30-4 26-16L12 22l30 8z" fill="#FF48B0"/></g><circle class="q" cx="52" cy="54" r="20" fill="#00838A"/>'
  };
  const STAMP = '<svg class="stamp" viewBox="0 0 92 92" aria-hidden="true"><g filter="url(#ink)" fill="none" stroke="#FF48B0"><circle cx="46" cy="46" r="43" stroke-width="3"/><circle cx="46" cy="46" r="24" stroke-width="2"/></g><text font-family="Archivo" font-weight="800" font-size="10.5" letter-spacing="2.4" fill="#FF48B0" filter="url(#ink)"><textPath href="#ring">SAVED · THIS WEEK · WK 45 ·</textPath></text><text x="46" y="52" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="17" fill="#FF48B0" filter="url(#ink)" style="font-stretch:70%">GO</text></svg>';
  const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.6 2.5L16 9.5"/></svg>';
  const $ = (id) => document.getElementById(id);
  const week = $('week'), list = $('list'), app = $('app');
  const saved = new Set([12, 16]);
  let cur = 4;
  week.innerHTML = DAYS.map(([d, n], i) => `<button class="day" data-i="${i}" aria-pressed="${i === cur}" aria-label="${d} ${n} November, ${E.filter(e => e[0] === i).length} listings"><small>${d}</small><b>${n}</b><span class="pips">${'<span></span>'.repeat(E.filter(e => e[0] === i).length)}</span></button>`).join('');
  const full = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  function render(reg) {
    const rows = E.map((e, id) => [e, id]).filter(([e]) => e[0] === cur);
    list.classList.toggle('reg', !!reg);
    list.innerHTML = `<div class="dayhead">${full[cur]} ${DAYS[cur][1]} Nov${cur === 4 ? ' · Tonight' : ''}<span>${rows.length} listings</span></div>` + rows.map(([e, id], k) => `
      <article class="card${k % 2 ? ' t' : ''}${saved.has(id) ? ' saved' : ''}" data-id="${id}" style="animation-delay:${k * 70}ms">
        <div><div class="meta"><span class="tm">${e[1]}</span>${e[2]}</div>
        <h3 class="act">${e[3]}</h3><div class="info">${e[4]} · <b>Doors ${e[1]}</b></div>
        <div class="row"><button class="save" aria-pressed="${saved.has(id)}" aria-label="Save ${e[3]} to this week">${ICON}<span>${saved.has(id) ? 'Saved' : 'Save'}</span></button><span class="price">${e[5]}</span></div></div>
        <div class="art" aria-hidden="true"><svg viewBox="0 0 104 104">${ART[e[6]]}</svg></div>${STAMP}
      </article>`).join('');
    list.scrollTop = 0;
  }
  function tray(bump) {
    const ids = [...saved].sort((a, b) => a - b);
    $('count').textContent = ids.length;
    $('trayNames').textContent = ids.length ? ids.map(i => E[i][3]).join(', ') : 'Nothing saved yet';
    if (bump) { const c = $('count'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
    $('saved').innerHTML = ids.length ? ids.map(i => `<li><span class="d">${DAYS[E[i][0]][0]} ${DAYS[E[i][0]][1]}<br>${E[i][1]}</span><span class="n">${E[i][3]}<span class="v">${E[i][2]} · ${E[i][4]}</span></span><span class="price">${E[i][5]}</span></li>`).join('') : '<li class="empty">Tap Save on a listing and it lands here.</li>';
  }
  week.addEventListener('click', (ev) => {
    const b = ev.target.closest('.day'); if (!b || +b.dataset.i === cur) return;
    cur = +b.dataset.i;
    week.querySelectorAll('.day').forEach(d => d.setAttribute('aria-pressed', d === b));
    render(true);
  });
  week.addEventListener('keydown', (ev) => {
    if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    const n = (cur + (ev.key === 'ArrowRight' ? 1 : 6)) % 7; const b = week.children[n]; b.focus(); b.click();
  });
  list.addEventListener('click', (ev) => {
    const b = ev.target.closest('.save'); if (!b) return;
    const card = b.closest('.card'), id = +card.dataset.id, on = !saved.has(id);
    on ? saved.add(id) : saved.delete(id);
    b.setAttribute('aria-pressed', on); b.querySelector('span').textContent = on ? 'Saved' : 'Save';
    card.classList.toggle('saved', on); card.classList.remove('hit');
    if (on) { void card.offsetWidth; card.classList.add('hit'); }
    $('say').textContent = E[id][3] + (on ? ' saved to this week' : ' removed from this week');
    tray(true);
  });
  const open = (o) => { app.classList.toggle('open', o); $('tray').setAttribute('aria-expanded', o); if (o) setTimeout(() => $('close').focus(), 60); else $('tray').focus(); };
  $('tray').addEventListener('click', () => open(true));
  $('close').addEventListener('click', () => open(false));
  $('scrim').addEventListener('click', () => open(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && app.classList.contains('open')) open(false); });
  render(); tray();
})();
</script>
</body>
</html>
