<!-- Design Lounge piece: empty-state-line-illustration · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Empty state with line illustration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f0f2f5;--line:#e3e6eb;--line-2:#d3d7de;
  --ink:#1b1f26;--ink-2:#5b6472;--ink-3:#8a92a0;--accent:#0f766e;--accent-hover:#0c5f59;--accent-soft:#e6f4f1;--on-accent:#ffffff;
  --serif:"Fraunces",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif;
  --r:8px;--r-lg:12px;--w-side:220px;--h-top:56px;
  --t-micro:160ms;--t-layout:240ms;--t-draw:1200ms;--ease:cubic-bezier(.2,.7,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 var(--sans);color:var(--ink);background:var(--bg);display:grid;grid-template-rows:var(--h-top) 1fr;-webkit-font-smoothing:antialiased;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 12px var(--sans);font-style:normal}
.search{margin-left:8px;height:34px;width:360px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--ink-3)}
.search svg{width:16px;height:16px}
.sim{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.switch{width:40px;height:22px;border-radius:11px;background:var(--line-2);border:0;padding:0;position:relative;cursor:pointer;transition:background var(--t-micro) var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(27,31,38,.25);transition:transform var(--t-micro) var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:var(--w-side) 1fr;min-height:0}
nav{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px}
nav h6{margin:8px 8px 6px;font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:var(--r);color:var(--ink-2);text-decoration:none}
nav a svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:var(--surface-2);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
nav .n{margin-left:auto;font-size:12px;color:var(--ink-3)}
main{display:flex;flex-direction:column;min-height:0}
.bar{height:52px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line)}
.bar h1{margin:0;font:500 20px/1 var(--serif);letter-spacing:-.01em}
.bar .meta{color:var(--ink-3);font-size:13px}
.stage{position:relative;flex:1;min-height:0}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px 40px;transition:opacity var(--t-layout) var(--ease),transform var(--t-layout) var(--ease)}
.empty.out{opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none}
.empty[hidden]{display:none}
.art{width:220px;height:160px;cursor:pointer;color:var(--ink-2)}
.art path{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 560ms var(--ease-out) forwards}
.art .a{stroke:var(--accent)}
.art path:nth-child(1){animation-delay:0ms}.art path:nth-child(2){animation-delay:140ms}.art path:nth-child(3){animation-delay:300ms}.art path:nth-child(4){animation-delay:460ms}.art path:nth-child(5){animation-delay:640ms}
@keyframes draw{to{stroke-dashoffset:0}}
.empty h2{margin:20px 0 6px;font:500 28px/1.2 var(--serif);letter-spacing:-.015em}
.empty h2 em{font-style:italic;color:var(--accent)}
.empty p{margin:0 0 22px;max-width:380px;color:var(--ink-2);font-size:15px}
.actions{display:flex;gap:10px}
.btn{height:38px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 14px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease),transform var(--t-micro) var(--ease)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.hint{margin-top:26px;font-size:12px;color:var(--ink-3)}
.list{list-style:none;margin:0;padding:0}
.list[hidden]{display:none}
.row{display:grid;grid-template-columns:36px 200px 1fr 64px;align-items:center;gap:14px;height:56px;padding:0 28px;border-bottom:1px solid var(--line);opacity:0;transform:translateY(8px);animation:rise var(--t-layout) var(--ease-out) forwards;animation-delay:calc(var(--i) * 60ms);cursor:default}
.row:hover{background:var(--surface)}
@keyframes rise{to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 12px var(--sans)}
.row b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s span{color:var(--ink-3)}
.row time{text-align:right;font-size:12px;color:var(--ink-3)}
.row.unread b{color:var(--ink)}
.row.unread b::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){
  .art path{animation-duration:1ms;animation-delay:0ms!important}
  .row{animation-duration:1ms;animation-delay:0ms}
  *{transition-duration:1ms!important}
}
</style>
</head>
<body>
<header>
  <div class="brand"><i>N</i>Nord Post</div>
  <div class="search" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search mail, people, files</div>
  <div class="sim"><label for="sim">Simulate incoming mail</label><button class="switch" id="sim" role="switch" aria-checked="false" aria-label="Simulate incoming mail"></button></div>
</header>
<div class="shell">
  <nav aria-label="Folders">
    <h6>Mailboxes</h6>
    <a href="#" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 12l3-7h12l3 7v7H3z"/><path d="M3 12h5l2 3h4l2-3h5"/></svg>Inbox<span class="n" id="count">0</span></a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Sent<span class="n">142</span></a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>Drafts<span class="n">3</span></a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>Starred</a>
    <h6>Labels</h6>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 7h11l7 5-7 5H3z"/></svg>Finance</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 7h11l7 5-7 5H3z"/></svg>Product</a>
  </nav>
  <main>
    <div class="bar"><h1>Inbox</h1><span class="meta" id="meta">Nothing waiting · synced 09:14</span></div>
    <div class="stage">
      <section class="empty" id="empty" aria-labelledby="eh">
        <svg class="art" id="art" viewBox="0 0 220 160" role="img" aria-label="An empty mail tray with a paper plane flying away. Click to replay the drawing.">
          <path pathLength="1" d="M40 92h140l-14 46H54z"/>
          <path pathLength="1" d="M40 92l16-26h108l16 26"/>
          <path pathLength="1" d="M78 92l8 12h48l8-12"/>
          <path pathLength="1" class="a" d="M132 22l44 16-28 18-6-12z"/>
          <path pathLength="1" d="M48 44c18-18 44-24 72-16"/>
        </svg>
        <h2 id="eh">Your inbox is <em>clear</em></h2>
        <p>New messages from your team and connected mailboxes will land here as they arrive.</p>
        <div class="actions">
          <button class="btn primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Compose message</button>
          <button class="btn">Connect a mailbox</button>
        </div>
        <div class="hint">Click the illustration to replay the draw</div>
      </section>
      <ul class="list" id="list" hidden aria-live="polite"></ul>
    </div>
  </main>
</div>
<script>
  const sim=document.getElementById('sim'),empty=document.getElementById('empty'),list=document.getElementById('list'),art=document.getElementById('art'),count=document.getElementById('count'),meta=document.getElementById('meta');
  const mail=[
    ['IB','Ida Bergström','Q4 forecast review','Attaching the revised numbers before Thursday.','10:42',true],
    ['HS','Halden Support','Ticket #4821 resolved','We rolled the fix for the export timeout to all regions.','09:58',true],
    ['TR','Tomas Reyes','Design crit notes','Three things from this morning, all small.','09:31',false],
    ['PY','Payroll','September statement is ready','Your statement for September is available to download.','08:05',false]
  ];
  function render(){
    list.innerHTML='';
    mail.forEach((m,i)=>{
      const li=document.createElement('li');li.className='row'+(m[5]?' unread':'');li.style.setProperty('--i',i);
      li.innerHTML=`<span class="av">${m[0]}</span><b>${m[1]}</b><span class="s">${m[2]} <span>— ${m[3]}</span></span><time>${m[4]}</time>`;
      list.appendChild(li);
    });
  }
  function replay(){
    const c=art.cloneNode(true);art.replaceWith(c);c.id='art';c.addEventListener('click',replay);
  }
  art.addEventListener('click',replay);
  sim.addEventListener('click',()=>{
    const on=sim.getAttribute('aria-checked')!=='true';
    sim.setAttribute('aria-checked',String(on));
    if(on){
      empty.classList.add('out');
      setTimeout(()=>{empty.hidden=true;render();list.hidden=false;},240);
      count.textContent=mail.length;meta.textContent=`${mail.filter(m=>m[5]).length} unread · synced just now`;
    }else{
      list.hidden=true;empty.hidden=false;
      requestAnimationFrame(()=>{empty.classList.remove('out');});
      replay();count.textContent='0';meta.textContent='Nothing waiting · synced just now';
    }
  });
</script>
</body>
</html>
