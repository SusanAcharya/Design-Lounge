<!-- Design Lounge piece: overlap-slider · platform: web · 1280x800 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Hollis — Overlap</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#141311;--ink:#f4f1ea;--ink-2:#a39b90;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px var(--sans);display:grid;place-items:center}
:focus-visible{outline:2px solid #d7b15e;outline-offset:3px}
.row{display:flex;gap:12px;align-items:flex-end;height:420px}
.card{width:180px;height:320px;border:0;border-radius:2px;background:#1c1b19;color:var(--ink);text-align:left;padding:16px;font:inherit;cursor:pointer;transform-origin:center bottom;transition:transform 280ms cubic-bezier(0.16,1,0.3,1)}
.row[data-i="1"] .card[data-i="0"],
.row[data-i="2"] .card[data-i="0"],.row[data-i="2"] .card[data-i="1"],
.row[data-i="3"] .card[data-i="0"],.row[data-i="3"] .card[data-i="1"],.row[data-i="3"] .card[data-i="2"],
.row[data-i="4"] .card:not([data-i="4"]){transform:scale(.82) translateY(18px)}
.card strong{display:block;font-size:18px;margin-top:auto}
.card span{color:var(--ink-2)}
.card{display:flex;flex-direction:column;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="row" id="row" data-i="2">
  <button class="card" type="button" data-i="0" style="background:#24362e"><strong>Gate 1</strong><span>Clear</span></button>
  <button class="card" type="button" data-i="1" style="background:#2a2926"><strong>Gate 2</strong><span>Due</span></button>
  <button class="card" type="button" data-i="2" style="background:#3a342c"><strong>Gate 4</strong><span>Held</span></button>
  <button class="card" type="button" data-i="3" style="background:#1f4d3a"><strong>Night</strong><span>22:00</span></button>
  <button class="card" type="button" data-i="4" style="background:#4a3b22"><strong>Month</strong><span>Close</span></button>
</div>
<script>
const row = document.getElementById('row');
row.querySelectorAll('.card').forEach((c) => {
  const set = () => { row.dataset.i = c.dataset.i; };
  c.addEventListener('pointerenter', set);
  c.addEventListener('focus', set);
});
</script>
</body>
</html>
