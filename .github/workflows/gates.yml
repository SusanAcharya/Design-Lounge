# Runs the demo gates (scripts/gates/demos.mjs) on every push and pull request to main:
# phone layouts at 390px, text contrast, and form-control edges, held against the ratchet.
name: Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The ratchet is measured here, on x86 Linux in this image. A run on an ARM Mac renders some backgrounds
    # differently, so to match CI locally use the x86 image (slow under emulation; fine for a few ids):
    #   docker run --rm --platform linux/amd64 --ipc=host -v "$PWD":/work -w /work mcr.microsoft.com/playwright:v1.63.0-noble node scripts/gates/demos.mjs --ids a,b
    # The ratchet is written only by the manual Ratchet workflow (ratchet.yml). This job never writes it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # the ratchet guard compares with the commit before this push

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.16.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # git in the container would refuse the checkout as another user's, and the ratchet guard needs git.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Gate
        env:
          # The ratchet may not go up since this base without [raise-ceiling: <reason>] in a commit message.
          RATCHET_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm gate
