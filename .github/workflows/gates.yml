# Runs the demo gates (scripts/gates/demos.mjs) on every push and pull request to main:
# phone layouts at 390px, text contrast, and form-control edges, held against the ratchet.
name: Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The ratchet is measured here, on x86 Linux in this image. A run on an ARM Mac renders some backgrounds
    # differently, so to match CI locally use the x86 image (slow under emulation; fine for a few ids):
    #   docker run --rm --platform linux/amd64 --ipc=host -v "$PWD":/work -w /work mcr.microsoft.com/playwright:v1.63.0-noble node scripts/gates/demos.mjs --ids a,b
    # A push whose message contains [write-ratchet] measures the ratchet here and commits it back instead of gating.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.16.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Gate
        if: ${{ !contains(github.event.head_commit.message, '[write-ratchet]') }}
        run: pnpm gate

      - name: Write the ratchet on this platform
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[write-ratchet]') }}
        run: node scripts/gates/demos.mjs --write-ratchet

      - name: Commit the ratchet
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[write-ratchet]') }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add scripts/gates/ratchet.json
          if git diff --cached --quiet; then echo "Ratchet unchanged."; exit 0; fi
          git commit -m "Measure the gate ratchet on CI's own platform."
          git pull --rebase origin main
          git push origin HEAD:main
